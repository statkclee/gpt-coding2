<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 700 190">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 12px; font-weight: bold; }
      .tufte-small { font-size: 11px; fill: #666; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 10px; }
      .error-text { fill: #666; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="220" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="20" text-anchor="middle" class="tufte-text tufte-label">함수 디버깅: 흔한 오류 4가지</text>
  <line x1="50" y1="30" x2="650" y2="30" stroke="#ccc" stroke-width="1"/>

  <!-- Error 1: IndentationError -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="150" height="75" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="75" y="18" text-anchor="middle" class="tufte-text tufte-label">들여쓰기 오류</text>
    <line x1="10" y1="25" x2="140" y2="25" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="42" class="tufte-code">def greet():</text>
    <text x="10" y="55" class="tufte-code error-text">print("안녕")</text>
    <text x="75" y="70" text-anchor="middle" class="tufte-text tufte-small">IndentationError</text>
  </g>

  <!-- Error 2: NameError -->
  <g transform="translate(200, 45)">
    <rect x="0" y="0" width="150" height="75" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="75" y="18" text-anchor="middle" class="tufte-text tufte-label">정의 전 호출</text>
    <line x1="10" y1="25" x2="140" y2="25" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="42" class="tufte-code error-text">greet()</text>
    <text x="10" y="55" class="tufte-code">def greet(): ...</text>
    <text x="75" y="70" text-anchor="middle" class="tufte-text tufte-small">NameError</text>
  </g>

  <!-- Error 3: TypeError -->
  <g transform="translate(370, 45)">
    <rect x="0" y="0" width="150" height="75" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="75" y="18" text-anchor="middle" class="tufte-text tufte-label">인자 개수 불일치</text>
    <line x1="10" y1="25" x2="140" y2="25" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="42" class="tufte-code">def add(a, b): ...</text>
    <text x="10" y="55" class="tufte-code error-text">add(3)</text>
    <text x="75" y="70" text-anchor="middle" class="tufte-text tufte-small">TypeError</text>
  </g>

  <!-- Error 4: 반환값 무시 -->
  <g transform="translate(540, 45)">
    <rect x="0" y="0" width="150" height="75" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="75" y="18" text-anchor="middle" class="tufte-text tufte-label">반환값 무시</text>
    <line x1="10" y1="25" x2="140" y2="25" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="42" class="tufte-code error-text">math.sqrt(5)</text>
    <text x="10" y="55" class="tufte-code">  # 결과 사라짐</text>
    <text x="75" y="70" text-anchor="middle" class="tufte-text tufte-small">논리 오류</text>
  </g>

  <!-- 디버깅 전략 -->
  <rect x="30" y="135" width="640" height="75" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="350" y="155" text-anchor="middle" class="tufte-text tufte-label">디버깅 전략</text>
  <line x1="50" y1="162" x2="650" y2="162" stroke="#999" stroke-width="1"/>

  <!-- 3 strategies -->
  <g transform="translate(60, 180)">
    <circle cx="0" cy="0" r="12" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" class="tufte-text" font-size="10" font-weight="bold">1</text>
    <text x="20" y="4" class="tufte-text tufte-small">작은 단위로 테스트</text>
  </g>

  <g transform="translate(260, 180)">
    <circle cx="0" cy="0" r="12" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" class="tufte-text" font-size="10" font-weight="bold">2</text>
    <text x="20" y="4" class="tufte-text tufte-small">print문으로 값 추적</text>
  </g>

  <g transform="translate(460, 180)">
    <circle cx="0" cy="0" r="12" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" class="tufte-text" font-size="10" font-weight="bold">3</text>
    <text x="20" y="4" class="tufte-text tufte-small">반환값 저장 후 확인</text>
  </g>

  <text x="350" y="205" text-anchor="middle" class="tufte-text tufte-small" fill="#888">오류 메시지를 읽고, 문제 위치를 파악하고, 가설을 세워 테스트한다</text>

</svg>
