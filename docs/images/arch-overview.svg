<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #666;
      }
      .tufte-section {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 9px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 8px;
        fill: #999;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 9px;
        fill: #666;
      }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" class="tufte-title" text-anchor="middle">소프트웨어 아키텍처</text>
  <text x="400" y="48" class="tufte-subtitle" text-anchor="middle">전통적 패턴에서 데이터 과학까지</text>

  <!-- Left Section: Traditional Architecture -->
  <rect x="20" y="70" width="370" height="300" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="205" y="95" class="tufte-section" text-anchor="middle">전통적 아키텍처</text>
  <text x="205" y="110" class="tufte-desc" text-anchor="middle">웹/엔터프라이즈 시스템</text>

  <!-- MVC -->
  <rect x="35" y="125" width="160" height="70" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="115" y="145" class="tufte-label" text-anchor="middle">MVC</text>
  <line x1="50" y1="152" x2="180" y2="152" stroke="#eee" stroke-width="1"/>
  <text x="115" y="167" class="tufte-desc" text-anchor="middle">UI 분리 패턴</text>
  <text x="115" y="182" class="tufte-code" text-anchor="middle">Model → View → Controller</text>

  <!-- Repository -->
  <rect x="210" y="125" width="165" height="70" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="292" y="145" class="tufte-label" text-anchor="middle">Repository</text>
  <line x1="225" y1="152" x2="360" y2="152" stroke="#eee" stroke-width="1"/>
  <text x="292" y="167" class="tufte-desc" text-anchor="middle">데이터 접근 추상화</text>
  <text x="292" y="182" class="tufte-code" text-anchor="middle">Service → Repository → DB</text>

  <!-- Layered -->
  <rect x="35" y="210" width="340" height="75" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="205" y="230" class="tufte-label" text-anchor="middle">계층형 아키텍처</text>
  <line x1="50" y1="237" x2="360" y2="237" stroke="#eee" stroke-width="1"/>
  <!-- Layers -->
  <rect x="55" y="248" width="70" height="18" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="90" y="260" class="tufte-code" text-anchor="middle">Presentation</text>
  <rect x="135" y="248" width="70" height="18" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="170" y="260" class="tufte-code" text-anchor="middle">Application</text>
  <rect x="215" y="248" width="55" height="18" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="242" y="260" class="tufte-code" text-anchor="middle">Domain</text>
  <rect x="280" y="248" width="85" height="18" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="322" y="260" class="tufte-code" text-anchor="middle">Infrastructure</text>
  <text x="205" y="278" class="tufte-small" text-anchor="middle">의존성: 위 → 아래</text>

  <!-- Quality Attributes -->
  <rect x="35" y="300" width="340" height="55" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="205" y="320" class="tufte-label" text-anchor="middle">품질 속성</text>
  <text x="205" y="335" class="tufte-desc" text-anchor="middle">성능 · 가용성 · 보안 · 유지보수성 · 테스트 용이성</text>
  <text x="205" y="348" class="tufte-small" text-anchor="middle">ATAM: 트레이드오프 분석</text>

  <!-- Right Section: Data Science Architecture -->
  <rect x="410" y="70" width="370" height="300" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="595" y="95" class="tufte-section" text-anchor="middle">데이터 과학 아키텍처</text>
  <text x="595" y="110" class="tufte-desc" text-anchor="middle">ML 파이프라인 시스템</text>

  <!-- Pipeline Flow -->
  <rect x="425" y="125" width="340" height="60" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="595" y="145" class="tufte-label" text-anchor="middle">ML 파이프라인</text>
  <line x1="440" y1="152" x2="750" y2="152" stroke="#eee" stroke-width="1"/>
  <!-- Pipeline stages -->
  <rect x="438" y="160" width="45" height="16" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="460" y="171" class="tufte-code" text-anchor="middle">수집</text>
  <path d="M 485 168 L 495 168" stroke="#999" stroke-width="1" marker-end="url(#arrow-light)"/>
  <rect x="500" y="160" width="50" height="16" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="525" y="171" class="tufte-code" text-anchor="middle">전처리</text>
  <path d="M 552 168 L 562 168" stroke="#999" stroke-width="1" marker-end="url(#arrow-light)"/>
  <rect x="567" y="160" width="40" height="16" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="587" y="171" class="tufte-code" text-anchor="middle">피처</text>
  <path d="M 609 168 L 619 168" stroke="#999" stroke-width="1" marker-end="url(#arrow-light)"/>
  <rect x="624" y="160" width="40" height="16" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="644" y="171" class="tufte-code" text-anchor="middle">학습</text>
  <path d="M 666 168 L 676 168" stroke="#999" stroke-width="1" marker-end="url(#arrow-light)"/>
  <rect x="681" y="160" width="40" height="16" fill="#f5f5f5" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="701" y="171" class="tufte-code" text-anchor="middle">평가</text>
  <path d="M 723 168 L 733 168" stroke="#999" stroke-width="1" marker-end="url(#arrow-light)"/>
  <rect x="738" y="160" width="35" height="16" fill="#e8e8e8" stroke="#666" stroke-width="0.5" rx="2"/>
  <text x="755" y="171" class="tufte-code" text-anchor="middle">배포</text>

  <!-- Supporting Components -->
  <rect x="425" y="200" width="165" height="55" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="507" y="220" class="tufte-label" text-anchor="middle">Feature Store</text>
  <line x1="440" y1="227" x2="575" y2="227" stroke="#eee" stroke-width="1"/>
  <text x="507" y="242" class="tufte-desc" text-anchor="middle">피처 중앙 저장소</text>
  <text x="507" y="252" class="tufte-small" text-anchor="middle">= Repository 패턴</text>

  <rect x="600" y="200" width="165" height="55" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="682" y="220" class="tufte-label" text-anchor="middle">Model Registry</text>
  <line x1="615" y1="227" x2="750" y2="227" stroke="#eee" stroke-width="1"/>
  <text x="682" y="242" class="tufte-desc" text-anchor="middle">모델 버전 관리</text>
  <text x="682" y="252" class="tufte-small" text-anchor="middle">MLflow, W&amp;B</text>

  <!-- Inference -->
  <rect x="425" y="270" width="340" height="50" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="595" y="290" class="tufte-label" text-anchor="middle">추론 아키텍처</text>
  <line x1="440" y1="297" x2="750" y2="297" stroke="#eee" stroke-width="1"/>
  <text x="500" y="312" class="tufte-desc" text-anchor="middle">배치 추론</text>
  <text x="595" y="312" class="tufte-desc" text-anchor="middle">|</text>
  <text x="690" y="312" class="tufte-desc" text-anchor="middle">실시간 추론</text>

  <!-- DS Quality Attributes -->
  <rect x="425" y="335" width="340" height="35" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="595" y="352" class="tufte-desc" text-anchor="middle">재현성 · 모델 성능 · 데이터 품질 · 공정성 · 해석 가능성</text>

  <!-- Connection Arrow -->
  <path d="M 390 220 L 410 220" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom: Shared Principle -->
  <rect x="200" y="385" width="400" height="28" fill="#fff" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="400" y="403" class="tufte-label" text-anchor="middle">공통 원칙: 관심사 분리 · 의존성 관리 · 테스트 용이성</text>
</svg>
