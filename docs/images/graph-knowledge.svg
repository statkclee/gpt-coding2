<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <style>
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" class="tufte-label" font-weight="bold">지식 그래프 (Knowledge Graph)</text>

  <!-- Triple explanation -->
  <g transform="translate(30, 45)">
    <text x="100" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">트리플 구조</text>
    <rect x="0" y="10" width="200" height="80" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>

    <rect x="15" y="30" width="50" height="25" fill="#e8e8e8" stroke="#999" rx="2"/>
    <text x="40" y="47" text-anchor="middle" class="tufte-small">주어</text>

    <text x="80" y="47" class="tufte-code">→</text>

    <rect x="90" y="30" width="50" height="25" fill="#fff" stroke="#999" rx="2"/>
    <text x="115" y="47" text-anchor="middle" class="tufte-small">술어</text>

    <text x="155" y="47" class="tufte-code">→</text>

    <rect x="165" y="30" width="50" height="25" fill="#e8e8e8" stroke="#999" rx="2"/>
    <text x="190" y="47" text-anchor="middle" class="tufte-small">목적어</text>

    <text x="100" y="80" text-anchor="middle" class="tufte-code">(S, P, O) Triple</text>
  </g>

  <!-- Knowledge Graph Visual -->
  <g transform="translate(260, 35)">
    <text x="200" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">예시: 파이썬 지식 그래프</text>
    <rect x="0" y="10" width="430" height="130" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>

    <!-- Nodes -->
    <ellipse cx="100" cy="75" rx="45" ry="20" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="100" y="80" text-anchor="middle" class="tufte-small">파이썬</text>

    <ellipse cx="250" cy="35" rx="55" ry="18" fill="#f5f5f5" stroke="#999"/>
    <text x="250" y="40" text-anchor="middle" class="tufte-small">프로그래밍 언어</text>

    <ellipse cx="250" cy="75" rx="50" ry="18" fill="#f5f5f5" stroke="#999"/>
    <text x="250" y="80" text-anchor="middle" class="tufte-small">귀도 반 로섬</text>

    <ellipse cx="250" cy="115" rx="45" ry="18" fill="#f5f5f5" stroke="#999"/>
    <text x="250" y="120" text-anchor="middle" class="tufte-small">데이터 분석</text>

    <ellipse cx="380" cy="75" rx="40" ry="18" fill="#f5f5f5" stroke="#999"/>
    <text x="380" y="80" text-anchor="middle" class="tufte-small">네덜란드</text>

    <!-- Edges with labels -->
    <line x1="145" y1="65" x2="190" y2="42" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="160" y="48" class="tufte-code">is_a</text>

    <line x1="145" y1="75" x2="195" y2="75" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="165" y="70" class="tufte-code">created_by</text>

    <line x1="145" y1="85" x2="200" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="160" y="105" class="tufte-code">used_for</text>

    <line x1="300" y1="75" x2="335" y2="75" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="310" y="68" class="tufte-code">born_in</text>
  </g>

  <!-- AI Applications -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="660" height="105" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="330" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">AI에서의 활용</text>
    <line x1="20" y1="28" x2="640" y2="28" stroke="#ccc"/>

    <!-- Use cases -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="140" height="50" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="70" y="18" text-anchor="middle" class="tufte-label" font-weight="bold">RAG 강화</text>
      <text x="70" y="35" text-anchor="middle" class="tufte-small">LLM + 지식 그래프</text>
      <text x="70" y="48" text-anchor="middle" class="tufte-small">환각 감소</text>
    </g>

    <g transform="translate(180, 40)">
      <rect x="0" y="0" width="140" height="50" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="70" y="18" text-anchor="middle" class="tufte-label" font-weight="bold">추천 시스템</text>
      <text x="70" y="35" text-anchor="middle" class="tufte-small">사용자-상품 그래프</text>
      <text x="70" y="48" text-anchor="middle" class="tufte-small">연결 기반 추천</text>
    </g>

    <g transform="translate(340, 40)">
      <rect x="0" y="0" width="140" height="50" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="70" y="18" text-anchor="middle" class="tufte-label" font-weight="bold">질의응답</text>
      <text x="70" y="35" text-anchor="middle" class="tufte-small">관계 추론</text>
      <text x="70" y="48" text-anchor="middle" class="tufte-small">다단계 질의</text>
    </g>

    <g transform="translate(500, 40)">
      <rect x="0" y="0" width="140" height="50" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="70" y="18" text-anchor="middle" class="tufte-label" font-weight="bold">GNN</text>
      <text x="70" y="35" text-anchor="middle" class="tufte-small">그래프 신경망</text>
      <text x="70" y="48" text-anchor="middle" class="tufte-small">분자, 소셜 예측</text>
    </g>
  </g>

</svg>
