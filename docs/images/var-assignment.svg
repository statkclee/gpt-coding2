<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 550 180">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-title { font-size: 16px; font-weight: bold; }
      .tufte-label { font-size: 13px; }
      .tufte-small { font-size: 11px; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="550" height="220" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="275" y="28" text-anchor="middle" class="tufte-text tufte-title">변수 대입: 이름과 값의 연결</text> -->

  <!-- Code example -->
  <text x="275" y="58" text-anchor="middle" class="tufte-text tufte-code" fill="#333">message = "Hello"</text>

  <!-- Variable Name Box -->
  <rect x="60" y="85" width="100" height="60" fill="#ffffff" stroke="#333" stroke-width="2" rx="4"/>
  <text x="110" y="110" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">변수명</text>
  <text x="110" y="130" text-anchor="middle" class="tufte-text tufte-code">message</text>

  <!-- Arrow 1 -->
  <path d="M 165 115 L 210 115" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="187" y="105" text-anchor="middle" class="tufte-text tufte-small" fill="#666">참조</text>

  <!-- Memory Box -->
  <rect x="220" y="85" width="100" height="60" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/>
  <text x="270" y="110" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">메모리</text>
  <text x="270" y="130" text-anchor="middle" class="tufte-text tufte-small" fill="#666">(저장 공간)</text>

  <!-- Arrow 2 -->
  <path d="M 325 115 L 370 115" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="347" y="105" text-anchor="middle" class="tufte-text tufte-small" fill="#666">저장</text>

  <!-- Value Box -->
  <rect x="380" y="85" width="110" height="60" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/>
  <text x="435" y="110" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">값</text>
  <text x="435" y="130" text-anchor="middle" class="tufte-text tufte-code">"Hello"</text>

  <!-- Annotation -->
  <text x="110" y="170" text-anchor="middle" class="tufte-text tufte-small" fill="#666">이름표</text>
  <text x="270" y="170" text-anchor="middle" class="tufte-text tufte-small" fill="#666">상자</text>
  <text x="435" y="170" text-anchor="middle" class="tufte-text tufte-small" fill="#666">내용물</text>

  <!-- Bottom note -->
  <text x="275" y="190" text-anchor="middle" class="tufte-text tufte-small" fill="#666">= 연산자는 "같다"가 아니라 "대입한다"의 의미</text>
</svg>
