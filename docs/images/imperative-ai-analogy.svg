<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 800 240">
  <defs>
    <style>
      .label-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 15px; font-weight: bold; fill: #111; }
      .label-head { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; font-weight: bold; fill: #222; }
      .label-body { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #333; }
      .label-note { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 10px; fill: #555; font-style: italic; }
      .label-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 10px; fill: #444; }

      .box-outer { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 4; }
      .box-inner { fill: #fafafa; stroke: #999; stroke-width: 1; rx: 4; }
      .box-highlight { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; rx: 4; }

      .line-solid { stroke: #333; stroke-width: 1.5; fill: none; }
      .line-light { stroke: #ddd; stroke-width: 1; fill: none; }

      .arrow-head { fill: #333; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="315" fill="#fff" />

  <!-- Title -->
  <!-- <text x="400" y="22" text-anchor="middle" class="label-title">추상화의 진화: 컴파일러 vs. AI</text> -->

  <!-- LEFT: COMPILER -->
  <g transform="translate(50, 40)">
    <text x="150" y="0" text-anchor="middle" class="label-head">1. 컴파일러 시대 (규칙 기반)</text>
    <rect x="0" y="10" width="300" height="85" class="box-outer" stroke-dasharray="4 2"/>

    <g transform="translate(20, 25)">
      <g>
        <rect x="0" y="0" width="65" height="35" class="box-inner"/>
        <text x="32" y="15" text-anchor="middle" class="label-body" font-weight="bold">소스코드</text>
        <text x="32" y="28" text-anchor="middle" class="label-mono">엄격</text>
      </g>

      <line x1="65" y1="17" x2="95" y2="17" class="line-solid" marker-end="url(#arrow)"/>

      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="70" height="35" class="box-highlight"/>
        <text x="35" y="22" text-anchor="middle" class="label-body" font-weight="bold">컴파일러</text>
      </g>

      <line x1="165" y1="17" x2="195" y2="17" class="line-solid" marker-end="url(#arrow)"/>

      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="65" height="35" class="box-inner"/>
        <text x="32" y="15" text-anchor="middle" class="label-body" font-weight="bold">기계어</text>
        <text x="32" y="28" text-anchor="middle" class="label-mono">정확</text>
      </g>
    </g>

    <text x="150" y="75" text-anchor="middle" class="label-note">"엄격한 문법 → 기계어 변환"</text>
    <text x="150" y="88" text-anchor="middle" class="label-note">결정론적: 동일 입력 → 동일 출력</text>
  </g>

  <!-- RIGHT: AI -->
  <g transform="translate(450, 40)">
    <text x="150" y="0" text-anchor="middle" class="label-head">2. AI 시대 (의도 기반)</text>
    <rect x="0" y="10" width="300" height="85" class="box-outer"/>

    <g transform="translate(20, 25)">
      <g>
        <rect x="0" y="0" width="65" height="35" class="box-inner"/>
        <text x="32" y="15" text-anchor="middle" class="label-body" font-weight="bold">프롬프트</text>
        <text x="32" y="28" text-anchor="middle" class="label-mono">모호</text>
      </g>

      <line x1="65" y1="17" x2="95" y2="17" class="line-solid" marker-end="url(#arrow)"/>

      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="70" height="35" class="box-highlight"/>
        <text x="35" y="22" text-anchor="middle" class="label-body" font-weight="bold">LLM</text>
      </g>

      <line x1="165" y1="17" x2="195" y2="17" class="line-solid" marker-end="url(#arrow)"/>

      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="65" height="35" class="box-inner"/>
        <text x="32" y="15" text-anchor="middle" class="label-body" font-weight="bold">코드</text>
        <text x="32" y="28" text-anchor="middle" class="label-mono">유효</text>
      </g>
    </g>

    <text x="150" y="75" text-anchor="middle" class="label-note">"의도를 해석 → 로직 생성"</text>
    <text x="150" y="88" text-anchor="middle" class="label-note">확률적: 모호한 입력 → 구조화된 출력</text>
  </g>

  <!-- COMPARISON TABLE -->
  <g transform="translate(50, 140)">
    <line x1="0" y1="18" x2="700" y2="18" stroke="#333" stroke-width="1.5"/>

    <text x="80" y="10" class="label-head">비교 항목</text>
    <text x="300" y="10" text-anchor="middle" class="label-head">컴파일러 (전통)</text>
    <text x="550" y="10" text-anchor="middle" class="label-head">AI (현대)</text>

    <g transform="translate(0, 35)">
        <text x="80" y="0" class="label-body" font-weight="bold">입력 조건</text>
        <text x="300" y="0" text-anchor="middle" class="label-body">정확한 문법 (코드)</text>
        <text x="550" y="0" text-anchor="middle" class="label-body">자연어 (의도)</text>
        <line x1="0" y1="12" x2="700" y2="12" class="line-light"/>
    </g>

    <g transform="translate(0, 60)">
        <text x="80" y="0" class="label-body" font-weight="bold">처리 방식</text>
        <text x="300" y="0" text-anchor="middle" class="label-body">규칙 기반 변환</text>
        <text x="550" y="0" text-anchor="middle" class="label-body">패턴 매칭 &amp; 예측</text>
        <line x1="0" y1="12" x2="700" y2="12" class="line-light"/>
    </g>

    <g transform="translate(0, 85)">
        <text x="80" y="0" class="label-body" font-weight="bold">모호함 처리</text>
        <text x="300" y="0" text-anchor="middle" class="label-body">오류 반환 (문법 오류)</text>
        <text x="550" y="0" text-anchor="middle" class="label-body">추론 (최선의 추측)</text>
        <line x1="0" y1="12" x2="700" y2="12" class="line-light"/>
    </g>

    <g transform="translate(0, 110)">
        <text x="80" y="0" class="label-body" font-weight="bold">인간 역할</text>
        <text x="300" y="0" text-anchor="middle" class="label-body">"How를 작성"</text>
        <text x="550" y="0" text-anchor="middle" class="label-body">"What을 정의"</text>
    </g>
  </g>

</svg>
