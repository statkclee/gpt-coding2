<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 800 450">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 18px; fill: #333; font-weight: bold; }
      .tufte-subtitle { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 14px; fill: #666; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 13px; fill: #333; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; fill: #333; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #666; }
      .tufte-year { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 10px; fill: #999; }
      .tufte-box { fill: #f5f5f5; stroke: #999; stroke-width: 1; }
      .tufte-box-highlight { fill: #e8e8e8; stroke: #666; stroke-width: 1.5; }
      .tufte-line { stroke: #999; stroke-width: 1; }
    </style>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="400" y="35" text-anchor="middle" class="tufte-title">프로그래밍 패러다임 계보</text>
  <text x="400" y="55" text-anchor="middle" class="tufte-subtitle">문제 해결 방식에 따른 분류</text> -->

  <!-- Root: Programming Paradigms -->
  <rect x="300" y="75" width="200" height="40" class="tufte-box-highlight" rx="5"/>
  <text x="400" y="100" text-anchor="middle" class="tufte-label">프로그래밍 패러다임</text>

  <!-- Branch lines from root -->
  <line x1="400" y1="115" x2="400" y2="140" class="tufte-line"/>
  <line x1="200" y1="140" x2="600" y2="140" class="tufte-line"/>
  <line x1="200" y1="140" x2="200" y2="160" class="tufte-line"/>
  <line x1="600" y1="140" x2="600" y2="160" class="tufte-line"/>

  <!-- Left Branch: Imperative -->
  <rect x="100" y="160" width="200" height="35" class="tufte-box" rx="5"/>
  <text x="200" y="183" text-anchor="middle" class="tufte-label">명령형 계열</text>
  <text x="200" y="208" text-anchor="middle" class="tufte-small">"어떻게" 수행할지 기술</text>

  <!-- Right Branch: Declarative -->
  <rect x="500" y="160" width="200" height="35" class="tufte-box" rx="5"/>
  <text x="600" y="183" text-anchor="middle" class="tufte-label">선언형 계열</text>
  <text x="600" y="208" text-anchor="middle" class="tufte-small">"무엇을" 원하는지 기술</text>

  <!-- Imperative sub-branches -->
  <line x1="200" y1="195" x2="200" y2="230" class="tufte-line"/>
  <line x1="80" y1="230" x2="320" y2="230" class="tufte-line"/>
  <line x1="80" y1="230" x2="80" y2="250" class="tufte-line"/>
  <line x1="200" y1="230" x2="200" y2="250" class="tufte-line"/>
  <line x1="320" y1="230" x2="320" y2="250" class="tufte-line"/>

  <!-- Imperative: Pure Imperative -->
  <rect x="30" y="250" width="100" height="55" class="tufte-box" rx="4"/>
  <text x="80" y="272" text-anchor="middle" class="tufte-text" font-weight="bold">명령형</text>
  <text x="80" y="288" text-anchor="middle" class="tufte-small">상태 변경</text>
  <text x="80" y="302" text-anchor="middle" class="tufte-year">1950s~</text>

  <!-- Imperative: Procedural -->
  <rect x="150" y="250" width="100" height="55" class="tufte-box" rx="4"/>
  <text x="200" y="272" text-anchor="middle" class="tufte-text" font-weight="bold">절차적</text>
  <text x="200" y="288" text-anchor="middle" class="tufte-small">프로시저</text>
  <text x="200" y="302" text-anchor="middle" class="tufte-year">1960s~</text>

  <!-- Imperative: OOP -->
  <rect x="270" y="250" width="100" height="55" class="tufte-box-highlight" rx="4" fill="#b0e0e6"/>
  <text x="320" y="272" text-anchor="middle" class="tufte-text" font-weight="bold">객체지향</text>
  <text x="320" y="288" text-anchor="middle" class="tufte-small">클래스/객체</text>
  <text x="320" y="302" text-anchor="middle" class="tufte-year">1970s~</text>

  <!-- Declarative sub-branches -->
  <line x1="600" y1="195" x2="600" y2="230" class="tufte-line"/>
  <line x1="480" y1="230" x2="720" y2="230" class="tufte-line"/>
  <line x1="480" y1="230" x2="480" y2="250" class="tufte-line"/>
  <line x1="600" y1="230" x2="600" y2="250" class="tufte-line"/>
  <line x1="720" y1="230" x2="720" y2="250" class="tufte-line"/>

  <!-- Declarative: Functional -->
  <rect x="430" y="250" width="100" height="55" class="tufte-box-highlight" rx="4" fill="#b0e0e6"/>
  <text x="480" y="272" text-anchor="middle" class="tufte-text" font-weight="bold">함수형</text>
  <text x="480" y="288" text-anchor="middle" class="tufte-small">순수함수</text>
  <text x="480" y="302" text-anchor="middle" class="tufte-year">1950s~</text>

  <!-- Declarative: Logic -->
  <rect x="550" y="250" width="100" height="55" class="tufte-box" rx="4"/>
  <text x="600" y="272" text-anchor="middle" class="tufte-text" font-weight="bold">논리형</text>
  <text x="600" y="288" text-anchor="middle" class="tufte-small">규칙/추론</text>
  <text x="600" y="302" text-anchor="middle" class="tufte-year">1970s~</text>

  <!-- Declarative: Pure Declarative -->
  <rect x="670" y="250" width="100" height="55" class="tufte-box" rx="4"/>
  <text x="720" y="272" text-anchor="middle" class="tufte-text" font-weight="bold">선언형</text>
  <text x="720" y="288" text-anchor="middle" class="tufte-small">SQL/HTML</text>
  <text x="720" y="302" text-anchor="middle" class="tufte-year">1970s~</text>
  
  <line x1="720" y1="305" x2="720" y2="325" class="tufte-line"/>

  <!-- Declarative: Data Language -->
  <rect x="670" y="325" width="100" height="55" class="tufte-box" rx="4"/>
  <text x="720" y="347" text-anchor="middle" class="tufte-text" font-weight="bold">데이터</text>
  <text x="720" y="363" text-anchor="middle" class="tufte-small">SQL/R</text>
  <text x="720" y="377" text-anchor="middle" class="tufte-year">1970s~</text>

  <!-- Other paradigms section -->
  <line x1="400" y1="140" x2="400" y2="340" class="tufte-line" stroke-dasharray="4,2"/>

  <rect x="300" y="340" width="200" height="35" class="tufte-box" rx="5"/>
  <text x="400" y="363" text-anchor="middle" class="tufte-label">기타 패러다임</text>

  <line x1="400" y1="375" x2="400" y2="395" class="tufte-line"/>
  <line x1="260" y1="395" x2="540" y2="395" class="tufte-line"/>
  <line x1="260" y1="395" x2="260" y2="410" class="tufte-line"/>
  <line x1="400" y1="395" x2="400" y2="410" class="tufte-line"/>
  <line x1="540" y1="395" x2="540" y2="410" class="tufte-line"/>

  <!-- Other: Reactive -->
  <rect x="200" y="410" width="120" height="50" class="tufte-box" rx="4"/>
  <text x="260" y="432" text-anchor="middle" class="tufte-text" font-weight="bold">반응형</text>
  <text x="260" y="448" text-anchor="middle" class="tufte-small">이벤트/스트림</text>

  <!-- Other: Concurrent -->
  <rect x="340" y="410" width="120" height="50" class="tufte-box" rx="4"/>
  <text x="400" y="432" text-anchor="middle" class="tufte-text" font-weight="bold">동시성</text>
  <text x="400" y="448" text-anchor="middle" class="tufte-small">병렬 처리</text>

  <!-- Other: Metaprogramming -->
  <rect x="480" y="410" width="120" height="50" class="tufte-box" rx="4"/>
  <text x="540" y="432" text-anchor="middle" class="tufte-text" font-weight="bold">메타</text>
  <text x="540" y="448" text-anchor="middle" class="tufte-small">코드 생성</text>

  <!-- Legend -->
  <rect x="30" y="470" width="12" height="12" class="tufte-box-highlight" rx="2"/>
  <text x="50" y="480" class="tufte-text" font-weight="bold">파이썬에서 주로 활용</text>
  <rect x="180" y="470" width="12" height="12" class="tufte-box" rx="2"/>
  <text x="200" y="480" class="tufte-small">파이썬에서 제한적 지원</text>

</svg>