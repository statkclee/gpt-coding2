<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 12px; }
      .tufte-small { font-size: 11px; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 10px; }
      .header-cell { fill: #e8e8e8; }
      .data-cell { fill: #fafafa; }
      .alt-cell { fill: #f5f5f5; }
      .error-name { fill: #8b0000; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="175" fill="#ffffff"/>

  <!-- Header row -->
  <rect x="15" y="15" width="130" height="28" class="header-cell" stroke="#333" stroke-width="1"/>
  <rect x="145" y="15" width="150" height="28" class="header-cell" stroke="#333" stroke-width="1"/>
  <rect x="295" y="15" width="180" height="28" class="header-cell" stroke="#333" stroke-width="1"/>

  <text x="80" y="34" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">예외</text>
  <text x="220" y="34" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">발생 상황</text>
  <text x="385" y="34" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">예시</text>

  <!-- Row 1: ValueError -->
  <rect x="15" y="43" width="130" height="28" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="145" y="43" width="150" height="28" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="295" y="43" width="180" height="28" class="data-cell" stroke="#333" stroke-width="1"/>

  <text x="80" y="62" text-anchor="middle" class="tufte-text tufte-code error-name">ValueError</text>
  <text x="220" y="62" text-anchor="middle" class="tufte-text tufte-small">잘못된 값</text>
  <text x="385" y="62" text-anchor="middle" class="tufte-text tufte-code">int("abc")</text>

  <!-- Row 2: TypeError -->
  <rect x="15" y="71" width="130" height="28" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="145" y="71" width="150" height="28" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="295" y="71" width="180" height="28" class="alt-cell" stroke="#333" stroke-width="1"/>

  <text x="80" y="90" text-anchor="middle" class="tufte-text tufte-code error-name">TypeError</text>
  <text x="220" y="90" text-anchor="middle" class="tufte-text tufte-small">잘못된 자료형</text>
  <text x="385" y="90" text-anchor="middle" class="tufte-text tufte-code">"3" + 5</text>

  <!-- Row 3: ZeroDivisionError -->
  <rect x="15" y="99" width="130" height="28" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="145" y="99" width="150" height="28" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="295" y="99" width="180" height="28" class="data-cell" stroke="#333" stroke-width="1"/>

  <text x="80" y="118" text-anchor="middle" class="tufte-text tufte-code error-name">ZeroDivisionError</text>
  <text x="220" y="118" text-anchor="middle" class="tufte-text tufte-small">0으로 나눔</text>
  <text x="385" y="118" text-anchor="middle" class="tufte-text tufte-code">10 / 0</text>

  <!-- Row 4: FileNotFoundError -->
  <rect x="15" y="127" width="130" height="28" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="145" y="127" width="150" height="28" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="295" y="127" width="180" height="28" class="alt-cell" stroke="#333" stroke-width="1"/>

  <text x="80" y="146" text-anchor="middle" class="tufte-text tufte-code error-name">FileNotFoundError</text>
  <text x="220" y="146" text-anchor="middle" class="tufte-text tufte-small">파일 없음</text>
  <text x="385" y="146" text-anchor="middle" class="tufte-text tufte-code">open("없는파일.txt")</text>

</svg>
