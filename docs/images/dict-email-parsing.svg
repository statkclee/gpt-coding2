<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 720 290">
  <defs>
    <style>
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        fill: #333;
      }
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 11px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="360" y="25" text-anchor="middle" class="tufte-title">이메일 로그 라인 파싱과 딕셔너리 계수</text> -->

  <!-- Step 1: Original line -->
  <text x="30" y="55" class="tufte-label" font-weight="bold">1. 원본 라인</text>
  <rect x="30" y="62" width="660" height="24" fill="#f5f5f5" stroke="#999" rx="2"/>
  <text x="40" y="79" class="tufte-code">From stephen.marquard@uct.ac.za Sat Jan  5 09:14:16 2008</text>

  <!-- Arrow down -->
  <line x1="360" y1="90" x2="360" y2="110" stroke="#666" stroke-width="1.0" marker-end="url(#arrowhead)"/>
  <text x="380" y="105" class="tufte-small">split()</text>

  <!-- Step 2: Split result -->
  <text x="30" y="120" class="tufte-label" font-weight="bold">2. 리스트로 분리</text>

  <g transform="translate(30, 140)">
    <!-- Index labels -->
    <text x="30" y="-5" text-anchor="middle" class="tufte-small">[0]</text>
    <text x="95" y="-5" text-anchor="middle" class="tufte-small">[1]</text>
    <text x="170" y="-5" text-anchor="middle" class="tufte-small">[2]</text>
    <text x="210" y="-5" text-anchor="middle" class="tufte-small">[3]</text>
    <text x="250" y="-5" text-anchor="middle" class="tufte-small">[4]</text>

    <!-- List elements -->
    <rect x="0" y="0" width="60" height="28" fill="#e8e8e8" stroke="#666"/>
    <text x="30" y="19" text-anchor="middle" class="tufte-code">'From'</text>

    <rect x="60" y="0" width="70" height="28" fill="#ccc" stroke="#666" stroke-width="2"/>
    <text x="95" y="19" text-anchor="middle" class="tufte-code" font-size="9px">이메일주소</text>

    <rect x="130" y="0" width="80" height="28" fill="#ccc" stroke="#666" stroke-width="2"/>
    <text x="170" y="19" text-anchor="middle" class="tufte-code">'Sat'</text>

    <rect x="210" y="0" width="40" height="28" fill="#e8e8e8" stroke="#666"/>
    <text x="230" y="19" text-anchor="middle" class="tufte-code">'Jan'</text>

    <rect x="250" y="0" width="30" height="28" fill="#e8e8e8" stroke="#666"/>
    <text x="265" y="19" text-anchor="middle" class="tufte-code">'5'</text>

    <text x="295" y="19" class="tufte-code">...</text>
  </g>

  <!-- Highlight boxes with labels -->
  <rect x="90" y="138" width="70" height="32" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4,2" rx="2"/>
  <text x="125" y="185" text-anchor="middle" class="tufte-small">발신자</text>

  <rect x="160" y="138" width="80" height="32" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4,2" rx="2"/>
  <text x="200" y="185" text-anchor="middle" class="tufte-small">요일</text>

  <!-- Step 3: Three extraction paths -->
  <text x="30" y="210" class="tufte-label" font-weight="bold">3. 목적별 추출과 계수</text>

  <!-- Path A: Day of week -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="200" height="85" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="10" y="18" class="tufte-label">요일별 분류</text>
    <text x="10" y="38" class="tufte-code">day = words[2]</text>
    <text x="10" y="55" class="tufte-code">d[day] = d.get(day,0)+1</text>
    <text x="10" y="72" class="tufte-small" fill="#666">{'Sat': 1, 'Fri': 20, ...}</text>
  </g>

  <!-- Path B: Email address -->
  <g transform="translate(250, 220)">
    <rect x="0" y="0" width="200" height="85" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="10" y="18" class="tufte-label">발신자별 집계</text>
    <text x="10" y="38" class="tufte-code">email = words[1]</text>
    <text x="10" y="55" class="tufte-code">d[email] = d.get(email,0)+1</text>
    <text x="10" y="72" class="tufte-small" fill="#666">{'cwen@iupui.edu': 5, ...}</text>
  </g>

  <!-- Path C: Domain -->
  <g transform="translate(470, 220)">
    <rect x="0" y="0" width="220" height="85" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="10" y="18" class="tufte-label">도메인별 분류</text>
    <text x="10" y="38" class="tufte-code">domain = words[1].split('@')[1]</text>
    <text x="10" y="55" class="tufte-code">d[domain] = d.get(domain,0)+1</text>
    <text x="10" y="72" class="tufte-small" fill="#666">{'iupui.edu': 8, ...}</text>
  </g>
</svg>
