<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 245">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        fill: #333;
      }
      .skip-line {
        fill: #f5f5f5;
      }
      .match-line {
        fill: #ccc;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="260" fill="#ffffff"/>

  <!-- File representation -->
  <rect x="20" y="20" width="200" height="180" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="120" y="40" text-anchor="middle" class="tufte-subtitle">mbox.txt</text>
  <line x1="30" y1="48" x2="210" y2="48" stroke="#ccc" stroke-width="1"/>

  <!-- File lines -->
  <rect x="30" y="55" width="180" height="16" class="match-line" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="35" y="67" class="tufte-code" font-size="9">From: alice@example.com</text>

  <rect x="30" y="75" width="180" height="16" class="skip-line" stroke="#ccc" stroke-width="0.5" rx="2"/>
  <text x="35" y="87" class="tufte-code" font-size="9">Date: 2024-01-15</text>

  <rect x="30" y="95" width="180" height="16" class="skip-line" stroke="#ccc" stroke-width="0.5" rx="2"/>
  <text x="35" y="107" class="tufte-code" font-size="9">Subject: Meeting</text>

  <rect x="30" y="115" width="180" height="16" class="skip-line" stroke="#ccc" stroke-width="0.5" rx="2"/>
  <text x="35" y="127" class="tufte-code" font-size="9">Hello, ...</text>

  <rect x="30" y="135" width="180" height="16" class="match-line" stroke="#999" stroke-width="0.5" rx="2"/>
  <text x="35" y="147" class="tufte-code" font-size="9">From: bob@test.org</text>

  <rect x="30" y="155" width="180" height="16" class="skip-line" stroke="#ccc" stroke-width="0.5" rx="2"/>
  <text x="35" y="167" class="tufte-code" font-size="9">Date: 2024-01-16</text>

  <rect x="30" y="175" width="180" height="16" class="skip-line" stroke="#ccc" stroke-width="0.5" rx="2"/>
  <text x="35" y="187" class="tufte-code" font-size="9">...</text>

  <!-- Legend - 두 줄로 배치 -->
  <rect x="30" y="205" width="12" height="12" class="match-line" stroke="#999" stroke-width="0.5"/>
  <text x="47" y="215" class="tufte-small">조건 일치 → 처리</text>
  <rect x="30" y="222" width="12" height="12" class="skip-line" stroke="#ccc" stroke-width="0.5"/>
  <text x="47" y="232" class="tufte-small">불일치 → continue</text>

  <!-- Arrow -->
  <line x1="230" y1="110" x2="270" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Code pattern -->
  <rect x="280" y="20" width="350" height="180" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="455" y="40" text-anchor="middle" class="tufte-subtitle">검색 루프 패턴</text>
  <line x1="290" y1="48" x2="620" y2="48" stroke="#ccc" stroke-width="1"/>

  <text x="295" y="70" class="tufte-code">for line in fhand:</text>
  <text x="315" y="90" class="tufte-code">line = line.rstrip()</text>
  <text x="315" y="110" class="tufte-code"># 관심 없는 라인 건너뛰기</text>
  <text x="315" y="130" class="tufte-code">if not line.startswith('From:'):</text>
  <text x="335" y="150" class="tufte-code">continue</text>
  <text x="315" y="170" class="tufte-code"># 관심 있는 라인 처리</text>
  <text x="315" y="190" class="tufte-code">print(line)</text>

  <!-- Key point -->
  <text x="280" y="220" class="tufte-text">핵심: 조건에 맞지 않으면 continue로 건너뛰고, 맞으면 처리</text>

</svg>
