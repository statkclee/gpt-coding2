<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 160">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
      .tufte-label { font-size: 13px; }
      .tufte-small { font-size: 12px; fill: #555; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="550" height="160" fill="#ffffff"/>

  <!-- Start -->
  <circle cx="40" cy="70" r="15" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="75" text-anchor="middle" class="tufte-text tufte-label">시작</text>

  <!-- Arrow to condition -->
  <path d="M 55 70 L 150 70" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Condition diamond -->
  <polygon points="150,70 195,40 240,70 195,100" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="195" y="75" text-anchor="middle" class="tufte-code">x > 0</text>

  <!-- True branch (Down then Right) -->
  <path d="M 195 100 L 195 125 L 290 125" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="120" text-anchor="start" class="tufte-text tufte-small">True</text>

  <!-- Action box -->
  <rect x="300" y="105" width="110" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="355" y="130" text-anchor="middle" class="tufte-code">print("양수")</text>

  <!-- Return to main line -->
  <path d="M 410 125 L 440 125 L 440 70 L 470 70" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- False branch (Straight Right) -->
  <path d="M 240 70 L 470 70" fill="none" stroke="#666" stroke-width="1.5"/>
  <text x="250" y="65" text-anchor="start" class="tufte-text tufte-small">False</text>

  <!-- End -->
  <circle cx="490" cy="70" r="10" fill="#333" stroke="#333" stroke-width="1.5"/>
  
  <!-- Annotation -->
  <text x="355" y="30" text-anchor="middle" class="tufte-text tufte-small" fill="#888">조건이 거짓이면 몸통을 건너뜀</text>

</svg>