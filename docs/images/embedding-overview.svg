<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <defs>
    <style>
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" class="tufte-label" font-weight="bold" font-size="14">벡터와 임베딩 - AI 시대 의미 표현</text>

  <!-- Left: Input data types -->
  <g transform="translate(30, 50)">
    <text x="70" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">비정형 데이터</text>

    <rect x="0" y="15" width="140" height="35" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="38" text-anchor="middle" class="tufte-label">텍스트</text>

    <rect x="0" y="55" width="140" height="35" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="78" text-anchor="middle" class="tufte-label">이미지</text>

    <rect x="0" y="95" width="140" height="35" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="118" text-anchor="middle" class="tufte-label">음성</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(180, 100)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#666" stroke-width="2"/>
    <polygon points="60,0 52,-5 52,5" fill="#666"/>
    <text x="30" y="20" text-anchor="middle" class="tufte-small">임베딩</text>
  </g>

  <!-- Center: Vector space -->
  <g transform="translate(260, 50)">
    <text x="100" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">벡터 공간</text>

    <rect x="0" y="15" width="200" height="130" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>

    <!-- Coordinate system -->
    <line x1="100" y1="130" x2="100" y2="30" stroke="#999" stroke-width="1"/>
    <line x1="20" y1="80" x2="180" y2="80" stroke="#999" stroke-width="1"/>

    <!-- Points (embeddings) -->
    <circle cx="60" cy="50" r="6" fill="#333"/>
    <text x="60" y="42" text-anchor="middle" class="tufte-small">고양이</text>

    <circle cx="75" cy="60" r="6" fill="#333"/>
    <text x="85" y="55" text-anchor="start" class="tufte-small">강아지</text>

    <circle cx="150" cy="110" r="6" fill="#666"/>
    <text x="150" y="125" text-anchor="middle" class="tufte-small">사과</text>

    <circle cx="165" cy="100" r="6" fill="#666"/>
    <text x="175" y="95" text-anchor="start" class="tufte-small">바나나</text>

    <text x="100" y="155" text-anchor="middle" class="tufte-small">비슷한 의미 → 가까운 위치</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(470, 100)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#666" stroke-width="2"/>
    <polygon points="60,0 52,-5 52,5" fill="#666"/>
    <text x="30" y="20" text-anchor="middle" class="tufte-small">연산</text>
  </g>

  <!-- Right: Applications -->
  <g transform="translate(550, 50)">
    <text x="70" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">AI 응용</text>

    <rect x="0" y="15" width="140" height="30" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="35" text-anchor="middle" class="tufte-small">유사도 검색</text>

    <rect x="0" y="50" width="140" height="30" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="70" text-anchor="middle" class="tufte-small">추천 시스템</text>

    <rect x="0" y="85" width="140" height="30" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="105" text-anchor="middle" class="tufte-small">RAG</text>

    <rect x="0" y="120" width="140" height="30" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="140" text-anchor="middle" class="tufte-small">분류/클러스터링</text>
  </g>

  <!-- Bottom: Chapter structure -->
  <g transform="translate(30, 210)">
    <rect x="0" y="0" width="660" height="100" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="330" y="22" text-anchor="middle" class="tufte-label" font-weight="bold">학습 흐름</text>
    <line x1="20" y1="30" x2="640" y2="30" stroke="#ccc"/>

    <!-- Steps -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="90" height="40" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="45" y="18" text-anchor="middle" class="tufte-small">벡터 기초</text>
      <text x="45" y="32" text-anchor="middle" class="tufte-code">크기, 방향</text>
    </g>

    <text x="120" y="65" class="tufte-label">→</text>

    <g transform="translate(135, 45)">
      <rect x="0" y="0" width="90" height="40" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="45" y="18" text-anchor="middle" class="tufte-small">벡터 연산</text>
      <text x="45" y="32" text-anchor="middle" class="tufte-code">내적, 유사도</text>
    </g>

    <text x="235" y="65" class="tufte-label">→</text>

    <g transform="translate(250, 45)">
      <rect x="0" y="0" width="90" height="40" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="45" y="18" text-anchor="middle" class="tufte-small">텍스트 임베딩</text>
      <text x="45" y="32" text-anchor="middle" class="tufte-code">원핫, 밀집</text>
    </g>

    <text x="350" y="65" class="tufte-label">→</text>

    <g transform="translate(365, 45)">
      <rect x="0" y="0" width="90" height="40" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="45" y="18" text-anchor="middle" class="tufte-small">API 활용</text>
      <text x="45" y="32" text-anchor="middle" class="tufte-code">OpenAI</text>
    </g>

    <text x="465" y="65" class="tufte-label">→</text>

    <g transform="translate(480, 45)">
      <rect x="0" y="0" width="90" height="40" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="45" y="18" text-anchor="middle" class="tufte-small">유사도 검색</text>
      <text x="45" y="32" text-anchor="middle" class="tufte-code">VectorDB</text>
    </g>

    <text x="580" y="65" class="tufte-label">→</text>

    <g transform="translate(595, 45)">
      <rect x="0" y="0" width="50" height="40" fill="#333" stroke="#333" rx="2"/>
      <text x="25" y="25" text-anchor="middle" class="tufte-small" fill="#fff">AI</text>
    </g>
  </g>

</svg>
