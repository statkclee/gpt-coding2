<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 800 530">
  <defs>
    <style>
      .title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 24px; fill: #111; font-weight: bold; }
      .subtitle { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 14px; fill: #555; }
      .label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 13px; fill: #333; font-weight: bold; text-anchor: middle; }
      .desc { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #666; text-anchor: middle; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 13px; fill: #444; font-style: italic; text-anchor: middle; }
      .accent { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; fill: #555; font-style: italic; }

      .box { fill: #fcfcfc; stroke: #333; stroke-width: 1.5; rx: 4; }
      .block { fill: #f4f4f4; stroke: #999; stroke-width: 1; rx: 3; }
      .attn-line { fill: none; stroke-opacity: 0.6; }

      .arrow-line { stroke: #666; stroke-width: 1.2; fill: none; }
      .container-box { fill: #f9f9f9; stroke: #ddd; rx: 5; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <rect width="800" height="620" fill="white"/>

  <!-- Header -->
  <!-- <text x="40" y="40" class="title">Transformer (트랜스포머)</text>
  <text x="40" y="65" class="subtitle">"Attention Is All You Need" - 병렬 처리와 어텐션 메커니즘을 통한 혁신</text> -->

  <!-- 1. Self-Attention Mechanism (Top Left) -->
  <g transform="translate(40, 110)">
    <text x="100" y="-10" class="label" font-size="14" text-anchor="start">1. 셀프 어텐션: 문맥 이해의 핵심</text>
    <rect x="0" y="0" width="380" height="200" class="container-box"/>

    <g transform="translate(20, 45)">
        <!-- Sentence Nodes -->
        <g transform="translate(0, 0)">
            <text x="20" y="-10" class="desc">The</text>
            <rect x="0" y="0" width="40" height="25" class="block" fill="#eee"/>
        </g>
        <g transform="translate(60, 0)">
            <text x="20" y="-10" class="desc">animal</text>
            <rect x="0" y="0" width="40" height="25" class="block" fill="#eee"/>
        </g>
        <g transform="translate(120, 0)">
            <text x="20" y="-10" class="desc" font-weight="bold">didn't</text>
            <rect x="0" y="0" width="40" height="25" class="block" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/>
        </g>
        <g transform="translate(180, 0)">
            <text x="20" y="-10" class="desc">cross</text>
            <rect x="0" y="0" width="40" height="25" class="block" fill="#eee"/>
        </g>
        <g transform="translate(240, 0)">
            <text x="20" y="-10" class="desc">because</text>
            <rect x="0" y="0" width="40" height="25" class="block" fill="#eee"/>
        </g>
        <g transform="translate(300, 0)">
            <text x="20" y="-10" class="desc" font-weight="bold">it</text>
            <rect x="0" y="0" width="40" height="25" class="block" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
        </g>

        <!-- Attention Curves from "it" -->
        <path d="M320,25 Q170,110 20,25" class="attn-line" stroke="#bbb" stroke-width="0.5"/>
        <path d="M320,25 Q200,100 80,25" class="attn-line" stroke="#333" stroke-width="2.5"/> <!-- Strong connection to animal -->
        <path d="M320,25 Q230,90 140,25" class="attn-line" stroke="#999" stroke-width="1"/>
        <path d="M320,25 Q260,80 200,25" class="attn-line" stroke="#bbb" stroke-width="0.5"/>

        <text x="170" y="145" class="accent" text-anchor="middle">"it"이 가리키는 대상("animal")에 높은 가중치 부여</text>
    </g>

    <!-- Q, K, V formula visualization -->
    <g transform="translate(120, 160)">
        <text x="0" y="0" class="math" text-anchor="start" font-size="12">Attention(Q, K, V) = softmax(</text>
        <text x="95" y="-5" class="math" text-anchor="start" font-size="10">QKᵀ</text>
        <line x1="80" y1="0" x2="110" y2="0" stroke="#444"/>
        <text x="95" y="12" class="math" text-anchor="start" font-size="10">√dₖ</text>
        <text x="120" y="0" class="math" text-anchor="start" font-size="12">) V</text>
    </g>
  </g>

  <!-- 2. Parallel Processing (Top Right) -->
  <g transform="translate(440, 110)">
    <text x="40" y="-10" class="label" font-size="14" text-anchor="start">2. 병렬 처리</text>
    <rect x="0" y="0" width="320" height="200" class="container-box"/>

    <g transform="translate(20, 35)">
        <text x="50" y="0" class="label" text-anchor="start" fill="#888">RNN (순차 처리)</text>
        <rect x="0" y="10" width="30" height="30" fill="#ddd" stroke="#999"/>
        <path d="M35,25 L55,25" class="arrow-line" marker-end="url(#arrow)"/>
        <rect x="60" y="10" width="30" height="30" fill="#ddd" stroke="#999"/>
        <path d="M95,25 L115,25" class="arrow-line" marker-end="url(#arrow)"/>
        <rect x="120" y="10" width="30" height="30" fill="#ddd" stroke="#999"/>

        <text x="210" y="30" class="desc" text-anchor="start">느림, 이전 단계 의존</text>
    </g>

    <line x1="20" y1="85" x2="300" y2="85" stroke="#ccc" stroke-dasharray="3,3"/>

    <g transform="translate(20, 110)">
        <text x="65" y="0" class="label" text-anchor="start">트랜스포머 (병렬 처리)</text>

        <!-- Parallel Blocks -->
        <rect x="0" y="15" width="30" height="30" fill="#ccc" stroke="#333"/>
        <rect x="60" y="15" width="30" height="30" fill="#ccc" stroke="#333"/>
        <rect x="120" y="15" width="30" height="30" fill="#ccc" stroke="#333"/>
        <rect x="180" y="15" width="30" height="30" fill="#ccc" stroke="#333"/>

        <!-- Simultaneous connections -->
        <path d="M15,55 L15,70 L195,70 L195,55" fill="none" stroke="#333" stroke-width="1.5"/>
        <path d="M75,55 L75,70" fill="none" stroke="#333" stroke-width="1.5"/>
        <path d="M135,55 L135,70" fill="none" stroke="#333" stroke-width="1.5"/>

        <text x="160" y="85" class="accent" text-anchor="start">"한 번에 전체 문장 처리"</text>
    </g>
  </g>

  <!-- 3. Architecture Overview (Bottom) -->
  <g transform="translate(40, 350)">
    <text x="70" y="-10" class="label" font-size="14" text-anchor="start">3. 인코더-디코더 구조</text>
    <rect x="0" y="0" width="720" height="230" class="container-box"/>

    <!-- ENCODER -->
    <g transform="translate(100, 30)">
        <text x="60" y="-10" class="label">인코더</text>
        <rect x="0" y="0" width="120" height="190" class="box" fill="#fff"/>

        <!-- Multi-Head Attention -->
        <rect x="10" y="25" width="100" height="40" class="block" fill="#e8e8e8" stroke="#666"/>
        <text x="60" y="45" class="desc" font-weight="bold">멀티헤드</text>
        <text x="60" y="58" class="desc">어텐션</text>

        <!-- Add & Norm -->
        <rect x="10" y="75" width="100" height="15" class="block" fill="#f5f5f5"/>
        <text x="60" y="86" class="desc" font-size="9">덧셈 &amp; 정규화</text>

        <!-- Feed Forward -->
        <rect x="10" y="105" width="100" height="40" class="block" fill="#ddd" stroke="#666"/>
        <text x="60" y="129" class="desc" font-weight="bold">피드포워드</text>

        <!-- Add & Norm -->
        <rect x="10" y="155" width="100" height="15" class="block" fill="#f5f5f5"/>
        <text x="60" y="166" class="desc" font-size="9">덧셈 &amp; 정규화</text>

        <!-- Layer Count -->
        <text x="140" y="100" class="math" font-size="14">× N</text>
    </g>

    <!-- Connection Arrow -->
    <path d="M220,100 L380,100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="90" class="desc">맥락 벡터 (K, V)</text>

    <!-- DECODER -->
    <g transform="translate(380, 30)">
        <text x="60" y="-10" class="label">디코더</text>
        <rect x="0" y="0" width="120" height="190" class="box" fill="#fff"/>

        <!-- Masked Attention -->
        <rect x="10" y="15" width="100" height="30" class="block" fill="#e8e8e8" stroke="#666"/>
        <text x="60" y="35" class="desc">마스크드 어텐션</text>

        <!-- Cross Attention -->
        <rect x="10" y="55" width="100" height="30" class="block" fill="#e8e8e8" stroke="#666"/>
        <text x="60" y="75" class="desc" font-weight="bold">크로스 어텐션</text>

        <!-- Feed Forward -->
        <rect x="10" y="105" width="100" height="30" class="block" fill="#ddd" stroke="#666"/>
        <text x="60" y="125" class="desc">피드포워드</text>

        <!-- Layer Count -->
        <text x="140" y="100" class="math" font-size="14">× N</text>
    </g>

    <!-- Final Output -->
    <g transform="translate(535, 30)">
        <path d="M0,100 L40,100" class="arrow-line" marker-end="url(#arrow)"/>
        <rect x="40" y="70" width="80" height="60" class="block" fill="#fff"/>
        <text x="80" y="95" class="desc">선형층</text>
        <text x="80" y="115" class="desc">소프트맥스</text>
        <path d="M120,100 L140,100" class="arrow-line" marker-end="url(#arrow)"/>
        <text x="160" y="105" class="label">출력</text>
    </g>
  </g>

</svg>
