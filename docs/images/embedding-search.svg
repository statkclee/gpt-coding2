<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <style>
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" class="tufte-label" font-weight="bold">유사도 검색 (Semantic Search)</text>

  <!-- Query -->
  <g transform="translate(30, 45)">
    <text x="60" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">질문</text>
    <rect x="0" y="10" width="120" height="50" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>
    <text x="60" y="35" text-anchor="middle" class="tufte-code">"머신러닝</text>
    <text x="60" y="50" text-anchor="middle" class="tufte-code">이란?"</text>
  </g>

  <!-- Arrow to embedding -->
  <g transform="translate(160, 70)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#666" stroke-width="1.5"/>
    <polygon points="30,0 24,-4 24,4" fill="#666"/>
  </g>

  <!-- Query Embedding -->
  <g transform="translate(200, 45)">
    <text x="50" y="0" text-anchor="middle" class="tufte-label">임베딩</text>
    <rect x="0" y="10" width="100" height="50" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="50" y="35" text-anchor="middle" class="tufte-code">[0.2, 0.8,</text>
    <text x="50" y="50" text-anchor="middle" class="tufte-code">-0.1, ...]</text>
  </g>

  <!-- Vector Database -->
  <g transform="translate(350, 25)">
    <text x="160" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">벡터 데이터베이스</text>
    <rect x="0" y="10" width="320" height="120" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>

    <!-- Documents with embeddings -->
    <g transform="translate(15, 25)">
      <rect x="0" y="0" width="135" height="25" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="5" y="16" class="tufte-code">doc1: [0.1, 0.9, ...]</text>
    </g>
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="135" height="25" fill="#333" stroke="#333" rx="2"/>
      <text x="5" y="16" class="tufte-code" fill="#fff">doc2: [0.2, 0.7, ...]</text>
    </g>
    <g transform="translate(15, 85)">
      <rect x="0" y="0" width="135" height="25" fill="#e8e8e8" stroke="#999" rx="2"/>
      <text x="5" y="16" class="tufte-code">doc3: [-0.5, 0.1, ...]</text>
    </g>

    <!-- Similarity scores -->
    <g transform="translate(165, 25)">
      <text x="0" y="16" class="tufte-small">유사도: 0.82</text>
    </g>
    <g transform="translate(165, 55)">
      <text x="0" y="16" class="tufte-small" font-weight="bold">유사도: 0.95 ←</text>
    </g>
    <g transform="translate(165, 85)">
      <text x="0" y="16" class="tufte-small">유사도: 0.31</text>
    </g>
  </g>

  <!-- Arrow from query to DB -->
  <g transform="translate(310, 70)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#666" stroke-width="1.5"/>
    <polygon points="30,0 24,-4 24,4" fill="#666"/>
    <text x="15" y="-8" text-anchor="middle" class="tufte-small">비교</text>
  </g>

  <!-- RAG Flow -->
  <g transform="translate(30, 165)">
    <rect x="0" y="0" width="660" height="125" fill="#e8e8e8" stroke="#999" rx="3"/>
    <text x="330" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">RAG (검색 증강 생성) 파이프라인</text>
    <line x1="20" y1="28" x2="640" y2="28" stroke="#ccc"/>

    <!-- Steps -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="100" height="55" fill="#fff" stroke="#999" rx="2"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-small" font-weight="bold">1. 질문</text>
      <text x="50" y="38" text-anchor="middle" class="tufte-code">"머신러닝</text>
      <text x="50" y="50" text-anchor="middle" class="tufte-code">이란?"</text>
    </g>

    <text x="145" y="72" class="tufte-label">→</text>

    <g transform="translate(165, 45)">
      <rect x="0" y="0" width="100" height="55" fill="#fff" stroke="#999" rx="2"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-small" font-weight="bold">2. 검색</text>
      <text x="50" y="38" text-anchor="middle" class="tufte-small">유사 문서</text>
      <text x="50" y="50" text-anchor="middle" class="tufte-small">top-k 추출</text>
    </g>

    <text x="280" y="72" class="tufte-label">→</text>

    <g transform="translate(300, 45)">
      <rect x="0" y="0" width="100" height="55" fill="#fff" stroke="#999" rx="2"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-small" font-weight="bold">3. 컨텍스트</text>
      <text x="50" y="38" text-anchor="middle" class="tufte-small">질문 + 문서</text>
      <text x="50" y="50" text-anchor="middle" class="tufte-small">결합</text>
    </g>

    <text x="415" y="72" class="tufte-label">→</text>

    <g transform="translate(435, 45)">
      <rect x="0" y="0" width="100" height="55" fill="#fff" stroke="#999" rx="2"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-small" font-weight="bold">4. LLM</text>
      <text x="50" y="38" text-anchor="middle" class="tufte-small">GPT-4 등</text>
      <text x="50" y="50" text-anchor="middle" class="tufte-small">답변 생성</text>
    </g>

    <text x="550" y="72" class="tufte-label">→</text>

    <g transform="translate(570, 45)">
      <rect x="0" y="0" width="70" height="55" fill="#333" stroke="#333" rx="2"/>
      <text x="35" y="25" text-anchor="middle" class="tufte-small" fill="#fff" font-weight="bold">답변</text>
      <text x="35" y="45" text-anchor="middle" class="tufte-small" fill="#fff">근거 기반</text>
    </g>
  </g>

</svg>
