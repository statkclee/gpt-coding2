<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-title { font-size: 14px; font-weight: bold; }
      .tufte-label { font-size: 12px; }
      .tufte-small { font-size: 11px; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
      .header-cell { fill: #e8e8e8; }
      .data-cell { fill: #fafafa; }
      .alt-cell { fill: #f5f5f5; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="500" height="220" fill="#ffffff"/>

  <!-- Header row -->
  <rect x="20" y="15" width="60" height="28" class="header-cell" stroke="#333" stroke-width="1"/>
  <rect x="80" y="15" width="120" height="28" class="header-cell" stroke="#333" stroke-width="1"/>
  <rect x="200" y="15" width="120" height="28" class="header-cell" stroke="#333" stroke-width="1"/>
  <rect x="320" y="15" width="60" height="28" class="header-cell" stroke="#333" stroke-width="1"/>

  <text x="50" y="34" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">연산자</text>
  <text x="140" y="34" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">의미</text>
  <text x="260" y="34" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">예시</text>
  <text x="350" y="34" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">결과</text>

  <!-- Row 1: == -->
  <rect x="20" y="43" width="60" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="80" y="43" width="120" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="200" y="43" width="120" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="320" y="43" width="60" height="26" class="data-cell" stroke="#333" stroke-width="1"/>

  <text x="50" y="60" text-anchor="middle" class="tufte-text tufte-code">==</text>
  <text x="140" y="60" text-anchor="middle" class="tufte-text tufte-small">같다</text>
  <text x="260" y="60" text-anchor="middle" class="tufte-text tufte-code">5 == 5</text>
  <text x="350" y="60" text-anchor="middle" class="tufte-text tufte-code">True</text>

  <!-- Row 2: != -->
  <rect x="20" y="69" width="60" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="80" y="69" width="120" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="200" y="69" width="120" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="320" y="69" width="60" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>

  <text x="50" y="86" text-anchor="middle" class="tufte-text tufte-code">!=</text>
  <text x="140" y="86" text-anchor="middle" class="tufte-text tufte-small">같지 않다</text>
  <text x="260" y="86" text-anchor="middle" class="tufte-text tufte-code">5 != 3</text>
  <text x="350" y="86" text-anchor="middle" class="tufte-text tufte-code">True</text>

  <!-- Row 3: > -->
  <rect x="20" y="95" width="60" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="80" y="95" width="120" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="200" y="95" width="120" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="320" y="95" width="60" height="26" class="data-cell" stroke="#333" stroke-width="1"/>

  <text x="50" y="112" text-anchor="middle" class="tufte-text tufte-code">></text>
  <text x="140" y="112" text-anchor="middle" class="tufte-text tufte-small">크다</text>
  <text x="260" y="112" text-anchor="middle" class="tufte-text tufte-code">7 > 3</text>
  <text x="350" y="112" text-anchor="middle" class="tufte-text tufte-code">True</text>

  <!-- Row 4: < -->
  <rect x="20" y="121" width="60" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="80" y="121" width="120" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="200" y="121" width="120" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="320" y="121" width="60" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>

  <text x="50" y="138" text-anchor="middle" class="tufte-text tufte-code">&lt;</text>
  <text x="140" y="138" text-anchor="middle" class="tufte-text tufte-small">작다</text>
  <text x="260" y="138" text-anchor="middle" class="tufte-text tufte-code">3 &lt; 7</text>
  <text x="350" y="138" text-anchor="middle" class="tufte-text tufte-code">True</text>

  <!-- Row 5: >= -->
  <rect x="20" y="147" width="60" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="80" y="147" width="120" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="200" y="147" width="120" height="26" class="data-cell" stroke="#333" stroke-width="1"/>
  <rect x="320" y="147" width="60" height="26" class="data-cell" stroke="#333" stroke-width="1"/>

  <text x="50" y="164" text-anchor="middle" class="tufte-text tufte-code">>=</text>
  <text x="140" y="164" text-anchor="middle" class="tufte-text tufte-small">크거나 같다</text>
  <text x="260" y="164" text-anchor="middle" class="tufte-text tufte-code">5 >= 5</text>
  <text x="350" y="164" text-anchor="middle" class="tufte-text tufte-code">True</text>

  <!-- Row 6: <= -->
  <rect x="20" y="173" width="60" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="80" y="173" width="120" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="200" y="173" width="120" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>
  <rect x="320" y="173" width="60" height="26" class="alt-cell" stroke="#333" stroke-width="1"/>

  <text x="50" y="190" text-anchor="middle" class="tufte-text tufte-code">&lt;=</text>
  <text x="140" y="190" text-anchor="middle" class="tufte-text tufte-small">작거나 같다</text>
  <text x="260" y="190" text-anchor="middle" class="tufte-text tufte-code">3 &lt;= 5</text>
  <text x="350" y="190" text-anchor="middle" class="tufte-text tufte-code">True</text>

</svg>
