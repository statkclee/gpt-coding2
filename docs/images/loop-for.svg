<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 700 160">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 12px; font-weight: bold; }
      .tufte-small { font-size: 11px; fill: #666; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="180" fill="#ffffff"/>

  <!-- 컬렉션 박스 (왼쪽) -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="130" height="100" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="65" y="20" text-anchor="middle" class="tufte-text tufte-label">컬렉션</text>
    <line x1="10" y1="28" x2="120" y2="28" stroke="#ccc" stroke-width="1"/>

    <rect x="15" y="38" width="100" height="20" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="65" y="52" text-anchor="middle" class="tufte-code">"철수"</text>

    <rect x="15" y="62" width="100" height="20" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="65" y="76" text-anchor="middle" class="tufte-code">"영희"</text>
  </g>

  <!-- 화살표 1 -->
  <path d="M 170 90 L 220 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="80" text-anchor="middle" class="tufte-text tufte-small">순회</text>

  <!-- 반복 변수 박스 -->
  <g transform="translate(230, 55)">
    <rect x="0" y="0" width="120" height="70" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="60" y="20" text-anchor="middle" class="tufte-text tufte-label">반복 변수</text>
    <line x1="10" y1="28" x2="110" y2="28" stroke="#999" stroke-width="1"/>
    <text x="60" y="50" text-anchor="middle" class="tufte-code">name = "철수"</text>
  </g>

  <!-- 화살표 2 -->
  <path d="M 360 90 L 410 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 루프 몸통 박스 -->
  <g transform="translate(420, 40)">
    <rect x="0" y="0" width="150" height="100" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="75" y="20" text-anchor="middle" class="tufte-text tufte-label">루프 몸통</text>
    <line x1="10" y1="28" x2="140" y2="28" stroke="#ccc" stroke-width="1"/>
    <text x="75" y="55" text-anchor="middle" class="tufte-code">print(name)</text>
    <text x="75" y="85" text-anchor="middle" class="tufte-text tufte-small" fill="#888">각 요소마다 실행</text>
  </g>

  <!-- 루프백 화살표 -->
  <path d="M 495 140 L 495 165 L 100 165 L 100 140" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="300" y="160" text-anchor="middle" class="tufte-text tufte-small" fill="#888">다음 요소로</text>

  <!-- 출력 결과 (오른쪽) -->
  <g transform="translate(590, 55)">
    <rect x="0" y="0" width="80" height="70" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="40" y="20" text-anchor="middle" class="tufte-text tufte-label">출력</text>
    <line x1="10" y1="28" x2="70" y2="28" stroke="#ccc" stroke-width="1"/>
    <text x="40" y="45" text-anchor="middle" class="tufte-code">철수</text>
    <text x="40" y="60" text-anchor="middle" class="tufte-code">영희</text>
  </g>

  <!-- 화살표 3 -->
  <path d="M 570 90 L 590 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
