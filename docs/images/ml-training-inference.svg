<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 900 415">
  <defs>
    <style>
      .tufte-title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 20px; font-weight: bold; fill: #111; }
      .tufte-subtitle { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 16px; font-weight: bold; fill: #222; }
      .tufte-label { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 13px; font-weight: bold; fill: #333; }
      .tufte-text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 12px; fill: #444; }
      .tufte-small { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 10px; fill: #666; }
      
      /* Shapes */
      .model-box { fill: #fff; stroke: #333; stroke-width: 2; }
      .model-layer { fill: #eee; stroke: none; }
      .data-box { fill: #f0f0f0; stroke: #666; stroke-width: 1; stroke-dasharray: 2,2; }
      
      /* Arrows */
      .arrow-line { stroke: #333; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #333; }
      .loop-arrow { stroke: #333; stroke-width: 1.5; stroke-dasharray: 4,2; fill: none; }
      
      /* Backgrounds */
      .bg-training { fill: #f9f9f9; }
      .bg-inference { fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="40" class="tufte-title" text-anchor="middle">학습 vs 추론: 구조적 차이와 비용</text>
  <text x="450" y="65" class="tufte-text" text-anchor="middle" font-style="italic">학습은 두뇌를 만들고, 추론은 두뇌를 사용한다</text>

  <!-- Divider -->
  <line x1="450" y1="90" x2="450" y2="420" stroke="#e0e0e0" stroke-width="2"/>

  <!-- LEFT SIDE: Training (The Loop) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="350" height="320" class="bg-training" rx="10"/>
    <text x="175" y="30" class="tufte-subtitle" text-anchor="middle">학습 (Training)</text>
    
    <!-- Diagram: Loop -->
    <g transform="translate(75, 40)">
      <!-- Input Data -->
      <rect x="-40" y="25" width="40" height="30" class="data-box"/>
      <text x="-20" y="44" class="tufte-small" text-anchor="middle">데이터</text>
      <line x1="0" y1="40" x2="30" y2="40" class="arrow-line" marker-end="url(#arrow)"/>

      <!-- Model -->
      <rect x="30" y="10" width="80" height="60" class="model-box"/>
      <rect x="35" y="15" width="70" height="10" class="model-layer"/>
      <rect x="35" y="35" width="70" height="10" class="model-layer"/>
      <rect x="35" y="55" width="70" height="10" class="model-layer"/>
      <text x="70" y="44" class="tufte-small" text-anchor="middle">모델</text>

      <!-- Forward Output -->
      <line x1="110" y1="40" x2="140" y2="40" class="arrow-line" marker-end="url(#arrow)"/>
      <text x="160" y="44" class="tufte-small" text-anchor="middle">예측</text>
      
      <!-- Loss Calc -->
      <circle cx="160" cy="80" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <text x="160" y="84" class="tufte-small" text-anchor="middle">손실</text>
      <line x1="160" y1="50" x2="160" y2="65" class="arrow-line"/>

      <!-- Backprop Loop -->
      <path d="M145,85 L70,85" class="loop-arrow"/>
      <line x1="70" y1="85" x2="70" y2="70" class="loop-arrow" marker-end="url(#arrow)"/>
      <text x="107" y="100" class="tufte-small" text-anchor="middle">가중치 갱신</text>
    </g>

    <!-- Details List -->
    <g transform="translate(30, 170)">
      <text x="0" y="0" class="tufte-label">핵심: 최적화 루프</text>
      <text x="10" y="25" class="tufte-text">• <tspan font-weight="bold">순전파 + 역전파</tspan> (양방향 연산)</text>
      <text x="10" y="45" class="tufte-text">• 기울기 계산 및 가중치 갱신</text>
      <text x="10" y="65" class="tufte-text">• 대규모 데이터셋 반복 처리</text>

      <line x1="0" y1="80" x2="290" y2="80" stroke="#ccc" stroke-width="1"/>

      <text x="0" y="100" class="tufte-label">자원</text>
      <text x="10" y="125" class="tufte-text">• GPU 수천 개 (클러스터)</text>
      <text x="10" y="145" class="tufte-text">• 며칠~몇 달 소요</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Inference (The Stream) -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="350" height="300" class="bg-inference" rx="10"/>
    <text x="175" y="30" class="tufte-subtitle" text-anchor="middle">추론 (Inference)</text>

    <!-- Diagram: Linear Flow -->
    <g transform="translate(75, 50)">
      <!-- Input Query -->
      <rect x="-40" y="25" width="40" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
      <text x="-20" y="44" class="tufte-small" text-anchor="middle">입력</text>
      <line x1="0" y1="40" x2="30" y2="40" class="arrow-line" marker-end="url(#arrow)"/>

      <!-- Frozen Model -->
      <rect x="30" y="10" width="80" height="60" class="model-box" stroke-dasharray="0"/>
      <rect x="35" y="15" width="70" height="10" class="model-layer" fill="#ddd"/>
      <rect x="35" y="35" width="70" height="10" class="model-layer" fill="#ddd"/>
      <rect x="35" y="55" width="70" height="10" class="model-layer" fill="#ddd"/>
      <text x="70" y="44" class="tufte-small" text-anchor="middle" fill="#333">고정</text>

      <!-- Lock Icon (Symbolic) -->
      <circle cx="100" cy="60" r="4" fill="#666"/>

      <!-- Fast Output -->
      <line x1="110" y1="40" x2="160" y2="40" class="arrow-line" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="190" y="44" class="tufte-small" text-anchor="middle">결과</text>
    </g>

    <!-- Details List -->
    <g transform="translate(30, 170)">
      <text x="0" y="0" class="tufte-label">핵심: 순차 실행</text>
      <text x="10" y="25" class="tufte-text">• <tspan font-weight="bold">순전파만</tspan> (단방향 연산)</text>
      <text x="10" y="45" class="tufte-text">• 가중치 고정 (학습 없음)</text>
      <text x="10" y="65" class="tufte-text">• 실시간 저지연 응답</text>

      <line x1="0" y1="80" x2="290" y2="80" stroke="#ccc" stroke-width="1"/>

      <text x="0" y="100" class="tufte-label">자원</text>
      <text x="10" y="125" class="tufte-text">• GPU 1개 또는 CPU</text>
      <text x="10" y="145" class="tufte-text">• 밀리초 단위 처리</text>
    </g>
  </g>

  <!-- Bottom Comparison: GPT-3 Scale -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="700" height="50" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="20" y="30" class="tufte-label">GPT-3 사례:</text>

    <g transform="translate(150, 0)">
      <text x="0" y="20" class="tufte-small" fill="#666">학습 비용</text>
      <text x="0" y="38" class="tufte-text" font-weight="bold">$4,600,000 (1회)</text>
    </g>

    <line x1="300" y1="10" x2="300" y2="40" stroke="#ccc" stroke-width="1"/>

    <g transform="translate(350, 0)">
      <text x="0" y="20" class="tufte-small" fill="#666">추론 비용</text>
      <text x="0" y="38" class="tufte-text" font-weight="bold">$0.02 (1천 토큰)</text>
    </g>

    <line x1="530" y1="10" x2="530" y2="40" stroke="#ccc" stroke-width="1"/>

    <g transform="translate(560, 0)">
      <text x="0" y="30" class="tufte-text" font-style="italic">"자체개발 vs 임대"</text>
    </g>
  </g>

</svg>