<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <defs>
    <style>
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>

  <!-- 0D: Scalar -->
  <g transform="translate(30, 30)">
    <text x="70" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">0차원: 스칼라</text>
    <rect x="45" y="15" width="50" height="50" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>
    <text x="70" y="47" text-anchor="middle" class="tufte-code" font-size="14">42</text>
    <text x="70" y="85" text-anchor="middle" class="tufte-code">shape: ()</text>
    <text x="70" y="100" text-anchor="middle" class="tufte-small">단일 숫자</text>
  </g>

  <!-- 1D: Vector -->
  <g transform="translate(180, 30)">
    <text x="70" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">1차원: 벡터</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="35" height="35" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="17" y="23" text-anchor="middle" class="tufte-code">1</text>
      <rect x="35" y="0" width="35" height="35" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="52" y="23" text-anchor="middle" class="tufte-code">2</text>
      <rect x="70" y="0" width="35" height="35" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="87" y="23" text-anchor="middle" class="tufte-code">3</text>
      <rect x="105" y="0" width="35" height="35" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="122" y="23" text-anchor="middle" class="tufte-code">4</text>
    </g>
    <text x="70" y="70" text-anchor="middle" class="tufte-code">shape: (4,)</text>
    <text x="70" y="85" text-anchor="middle" class="tufte-small">숫자의 나열</text>
  </g>

  <!-- 2D: Matrix -->
  <g transform="translate(360, 30)">
    <text x="70" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">2차원: 행렬</text>
    <g transform="translate(10, 15)">
      <rect x="0" y="0" width="30" height="25" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="15" y="17" text-anchor="middle" class="tufte-code">1</text>
      <rect x="30" y="0" width="30" height="25" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="45" y="17" text-anchor="middle" class="tufte-code">2</text>
      <rect x="60" y="0" width="30" height="25" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="75" y="17" text-anchor="middle" class="tufte-code">3</text>
      <rect x="90" y="0" width="30" height="25" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <text x="105" y="17" text-anchor="middle" class="tufte-code">4</text>

      <rect x="0" y="25" width="30" height="25" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <text x="15" y="42" text-anchor="middle" class="tufte-code">5</text>
      <rect x="30" y="25" width="30" height="25" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <text x="45" y="42" text-anchor="middle" class="tufte-code">6</text>
      <rect x="60" y="25" width="30" height="25" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <text x="75" y="42" text-anchor="middle" class="tufte-code">7</text>
      <rect x="90" y="25" width="30" height="25" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <text x="105" y="42" text-anchor="middle" class="tufte-code">8</text>
    </g>
    <text x="70" y="85" text-anchor="middle" class="tufte-code">shape: (2, 4)</text>
    <text x="70" y="100" text-anchor="middle" class="tufte-small">행 × 열</text>
  </g>

  <!-- 3D: Tensor -->
  <g transform="translate(530, 30)">
    <text x="80" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">3차원: 텐서</text>
    <!-- Front layer -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="25" height="20" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <rect x="25" y="0" width="25" height="20" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <rect x="50" y="0" width="25" height="20" fill="#e8e8e8" stroke="#333" stroke-width="1"/>
      <rect x="0" y="20" width="25" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <rect x="25" y="20" width="25" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <rect x="50" y="20" width="25" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    </g>
    <!-- Back layer (offset) -->
    <g transform="translate(45, 15)">
      <rect x="0" y="0" width="25" height="20" fill="#ccc" stroke="#666" stroke-width="1"/>
      <rect x="25" y="0" width="25" height="20" fill="#ccc" stroke="#666" stroke-width="1"/>
      <rect x="50" y="0" width="25" height="20" fill="#ccc" stroke="#666" stroke-width="1"/>
      <rect x="0" y="20" width="25" height="20" fill="#ddd" stroke="#666" stroke-width="1"/>
      <rect x="25" y="20" width="25" height="20" fill="#ddd" stroke="#666" stroke-width="1"/>
      <rect x="50" y="20" width="25" height="20" fill="#ddd" stroke="#666" stroke-width="1"/>
    </g>
    <text x="80" y="90" text-anchor="middle" class="tufte-code">shape: (2, 2, 3)</text>
    <text x="80" y="105" text-anchor="middle" class="tufte-small">깊이 × 행 × 열</text>
  </g>

  <!-- Bottom: examples -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="660" height="130" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="330" y="22" text-anchor="middle" class="tufte-label" font-weight="bold">실제 데이터 예시</text>
    <line x1="20" y1="30" x2="640" y2="30" stroke="#ccc"/>

    <!-- Image example -->
    <text x="110" y="50" text-anchor="middle" class="tufte-label">컬러 이미지</text>
    <text x="110" y="68" text-anchor="middle" class="tufte-code">(224, 224, 3)</text>
    <text x="110" y="85" text-anchor="middle" class="tufte-small">높이 × 너비 × RGB</text>

    <!-- Batch of images -->
    <text x="330" y="50" text-anchor="middle" class="tufte-label">이미지 배치</text>
    <text x="330" y="68" text-anchor="middle" class="tufte-code">(32, 224, 224, 3)</text>
    <text x="330" y="85" text-anchor="middle" class="tufte-small">배치 × 높이 × 너비 × 채널</text>

    <!-- Text embeddings -->
    <text x="550" y="50" text-anchor="middle" class="tufte-label">문장 임베딩</text>
    <text x="550" y="68" text-anchor="middle" class="tufte-code">(16, 128, 768)</text>
    <text x="550" y="85" text-anchor="middle" class="tufte-small">배치 × 토큰 × 차원</text>

    <line x1="20" y1="100" x2="640" y2="100" stroke="#ccc"/>
    <text x="330" y="118" text-anchor="middle" class="tufte-small">ndim: 차원 수 | shape: 각 차원 크기 | size: 총 요소 수</text>
  </g>

</svg>
