<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140">
  <defs>
    <style>
      .tufte-char {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 24px;
        fill: #333;
      }
      .tufte-index {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #666;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        fill: #333;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="500" height="140" fill="#ffffff"/>

  <!-- Character boxes - 'Monty Python' -->
  <!-- M -->
  <rect x="20" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="38" y="52" text-anchor="middle" class="tufte-char">M</text>
  <text x="38" y="80" text-anchor="middle" class="tufte-index">0</text>

  <!-- o -->
  <rect x="56" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="74" y="52" text-anchor="middle" class="tufte-char">o</text>
  <text x="74" y="80" text-anchor="middle" class="tufte-index">1</text>

  <!-- n -->
  <rect x="92" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="110" y="52" text-anchor="middle" class="tufte-char">n</text>
  <text x="110" y="80" text-anchor="middle" class="tufte-index">2</text>

  <!-- t -->
  <rect x="128" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="146" y="52" text-anchor="middle" class="tufte-char">t</text>
  <text x="146" y="80" text-anchor="middle" class="tufte-index">3</text>

  <!-- y -->
  <rect x="164" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="182" y="52" text-anchor="middle" class="tufte-char">y</text>
  <text x="182" y="80" text-anchor="middle" class="tufte-index">4</text>

  <!-- space -->
  <rect x="200" y="25" width="36" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="218" y="52" text-anchor="middle" class="tufte-char"> </text>
  <text x="218" y="80" text-anchor="middle" class="tufte-index">5</text>

  <!-- P -->
  <rect x="236" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="254" y="52" text-anchor="middle" class="tufte-char">P</text>
  <text x="254" y="80" text-anchor="middle" class="tufte-index">6</text>

  <!-- y -->
  <rect x="272" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="290" y="52" text-anchor="middle" class="tufte-char">y</text>
  <text x="290" y="80" text-anchor="middle" class="tufte-index">7</text>

  <!-- t -->
  <rect x="308" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="326" y="52" text-anchor="middle" class="tufte-char">t</text>
  <text x="326" y="80" text-anchor="middle" class="tufte-index">8</text>

  <!-- h -->
  <rect x="344" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="362" y="52" text-anchor="middle" class="tufte-char">h</text>
  <text x="362" y="80" text-anchor="middle" class="tufte-index">9</text>

  <!-- o -->
  <rect x="380" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="398" y="52" text-anchor="middle" class="tufte-char">o</text>
  <text x="398" y="80" text-anchor="middle" class="tufte-index">10</text>

  <!-- n -->
  <rect x="416" y="25" width="36" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="434" y="52" text-anchor="middle" class="tufte-char">n</text>
  <text x="434" y="80" text-anchor="middle" class="tufte-index">11</text>

  <!-- Slice bracket for [0:5] = 'Monty' -->
  <line x1="20" y1="95" x2="20" y2="105" stroke="#333" stroke-width="2"/>
  <line x1="20" y1="100" x2="200" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="95" x2="200" y2="105" stroke="#333" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" class="tufte-code">s[0:5] → 'Monty'</text>

  <!-- Slice bracket for [6:12] = 'Python' -->
  <line x1="236" y1="95" x2="236" y2="105" stroke="#666" stroke-width="2"/>
  <line x1="236" y1="100" x2="452" y2="100" stroke="#666" stroke-width="2"/>
  <line x1="452" y1="95" x2="452" y2="105" stroke="#666" stroke-width="2"/>
  <text x="344" y="120" text-anchor="middle" class="tufte-code">s[6:12] → 'Python'</text>

</svg>
