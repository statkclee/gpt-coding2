<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" class="tufte-title" text-anchor="middle">Observer 패턴</text>

  <!-- Subject -->
  <rect x="40" y="70" width="200" height="150" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
  <text x="140" y="95" class="tufte-label" text-anchor="middle">Subject</text>
  <line x1="55" y1="105" x2="225" y2="105" stroke="#ccc" stroke-width="1"/>
  <text x="140" y="125" class="tufte-code" text-anchor="middle">_observers: List[Observer]</text>
  <text x="140" y="140" class="tufte-code" text-anchor="middle">_state</text>
  <line x1="55" y1="150" x2="225" y2="150" stroke="#ccc" stroke-width="1"/>
  <text x="140" y="170" class="tufte-code" text-anchor="middle">attach(observer)</text>
  <text x="140" y="185" class="tufte-code" text-anchor="middle">detach(observer)</text>
  <text x="140" y="200" class="tufte-code" text-anchor="middle">notify()</text>

  <!-- State change annotation -->
  <rect x="60" y="230" width="160" height="35" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="140" y="250" class="tufte-code" text-anchor="middle">state = 75</text>
  <text x="140" y="262" class="tufte-small" text-anchor="middle">→ notify() 자동 호출</text>

  <!-- Arrows to Observers -->
  <line x1="240" y1="100" x2="328" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="145" x2="328" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="190" x2="328" y2="210" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="284" y="140" class="tufte-small">update()</text>

  <!-- Observer Interface -->
  <rect x="340" y="115" width="130" height="60" fill="#fff" stroke="#666" stroke-width="1" stroke-dasharray="4" rx="3"/>
  <text x="405" y="135" class="tufte-small" text-anchor="middle">«interface»</text>
  <text x="405" y="150" class="tufte-label" text-anchor="middle">Observer</text>
  <text x="405" y="168" class="tufte-code" text-anchor="middle">update(subject)</text>

  <!-- Concrete Observers -->
  <rect x="520" y="50" width="150" height="55" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="595" y="72" class="tufte-label" text-anchor="middle">LoggingObserver</text>
  <text x="595" y="92" class="tufte-code" text-anchor="middle">[LOG] 상태: 75</text>

  <rect x="520" y="120" width="150" height="55" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="595" y="142" class="tufte-label" text-anchor="middle">EmailObserver</text>
  <text x="595" y="162" class="tufte-code" text-anchor="middle">[EMAIL] 알림 전송</text>

  <rect x="520" y="190" width="150" height="55" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="595" y="212" class="tufte-label" text-anchor="middle">AlertObserver</text>
  <text x="595" y="232" class="tufte-code" text-anchor="middle">[ALERT] 임계값 초과!</text>

  <!-- Implements arrows -->
  <line x1="470" y1="145" x2="520" y2="78" stroke="#999" stroke-width="1" stroke-dasharray="3"/>
  <line x1="470" y1="145" x2="520" y2="148" stroke="#999" stroke-width="1" stroke-dasharray="3"/>
  <line x1="470" y1="145" x2="520" y2="218" stroke="#999" stroke-width="1" stroke-dasharray="3"/>

  <!-- Note -->
  <text x="595" y="280" class="tufte-small" text-anchor="middle">새 Observer는 attach()로 등록</text>
  <text x="595" y="295" class="tufte-small" text-anchor="middle">Subject 코드 수정 없음</text>
</svg>
