<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <defs>
    <style>
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 11px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
    <marker id="arrow-both" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>

  <!-- JSON column header -->
  <g transform="translate(120, 20)">
    <rect x="0" y="0" width="180" height="35" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>
    <text x="90" y="23" text-anchor="middle" class="tufte-label" font-weight="bold">JSON</text>
  </g>

  <!-- Python column header -->
  <g transform="translate(420, 20)">
    <rect x="0" y="0" width="180" height="35" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>
    <text x="90" y="23" text-anchor="middle" class="tufte-label" font-weight="bold">Python</text>
  </g>

  <!-- Arrow between headers -->
  <text x="360" y="42" text-anchor="middle" class="tufte-label">↔</text>

  <!-- Mappings -->
  <!-- object ↔ dict -->
  <g transform="translate(120, 65)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">object {}</text>
  </g>
  <text x="360" y="83" text-anchor="middle" class="tufte-small">↔</text>
  <g transform="translate(420, 65)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">dict {}</text>
  </g>

  <!-- array ↔ list -->
  <g transform="translate(120, 98)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">array []</text>
  </g>
  <text x="360" y="116" text-anchor="middle" class="tufte-small">↔</text>
  <g transform="translate(420, 98)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">list []</text>
  </g>

  <!-- string ↔ str -->
  <g transform="translate(120, 131)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">"string"</text>
  </g>
  <text x="360" y="149" text-anchor="middle" class="tufte-small">↔</text>
  <g transform="translate(420, 131)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">str 'string'</text>
  </g>

  <!-- number ↔ int/float -->
  <g transform="translate(120, 164)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">number 42, 3.14</text>
  </g>
  <text x="360" y="182" text-anchor="middle" class="tufte-small">↔</text>
  <g transform="translate(420, 164)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">int, float</text>
  </g>

  <!-- true/false ↔ True/False -->
  <g transform="translate(120, 197)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">true / false</text>
  </g>
  <text x="360" y="215" text-anchor="middle" class="tufte-small">↔</text>
  <g transform="translate(420, 197)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">True / False</text>
  </g>

  <!-- null ↔ None -->
  <g transform="translate(120, 230)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">null</text>
  </g>
  <text x="360" y="248" text-anchor="middle" class="tufte-small">↔</text>
  <g transform="translate(420, 230)">
    <rect x="0" y="0" width="180" height="28" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="90" y="18" text-anchor="middle" class="tufte-code">None</text>
  </g>

  <!-- Note -->
  <text x="360" y="275" text-anchor="middle" class="tufte-small">tuple → list (변환 시 타입 정보 손실)</text>

</svg>
