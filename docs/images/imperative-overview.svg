<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 14px; fill: #333; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; fill: #333; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #333; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 10px; fill: #666; }
      .tufte-code { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #333; }
      .tufte-time { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #999; font-style: italic; }
      .box-state { fill: #f5f5f5; stroke: #666; stroke-width: 1.5; }
      .box-math { fill: #fff; stroke: #999; stroke-width: 1; stroke-dasharray: 4,2; }
      .timeline { stroke: #ccc; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="800" height="280" fill="#fff"/>

  <!-- LEFT SIDE: Mathematics (Timeless) -->
  <g transform="translate(40, 30)">
    <text x="100" y="0" text-anchor="middle" class="tufte-label">수학: 시간이 빠졌다</text>

    <rect x="0" y="15" width="200" height="90" class="box-math" rx="4"/>
    <text x="100" y="40" text-anchor="middle" class="tufte-code">x = 10</text>
    <text x="100" y="60" text-anchor="middle" class="tufte-small">x는 10이다 (영원히)</text>
    <text x="100" y="82" text-anchor="middle" class="tufte-code">x = x + 5  →  모순!</text>
    <text x="100" y="97" text-anchor="middle" class="tufte-small">10 = 10 + 5 ?</text>
  </g>

  <!-- DIVIDER -->
  <line x1="280" y1="20" x2="280" y2="135" stroke="#ddd" stroke-dasharray="4,3"/>
  <text x="290" y="80" class="tufte-small" style="fill:#999">vs</text>

  <!-- RIGHT SIDE: Imperative (Time-bound) -->
  <g transform="translate(320, 30)">
    <text x="220" y="0" text-anchor="middle" class="tufte-label">명령형: 시간이 흐른다</text>

    <!-- Timeline -->
    <line x1="30" y1="45" x2="430" y2="45" class="timeline"/>

    <!-- Time markers -->
    <g transform="translate(50, 45)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#999" stroke-width="1.5"/>
      <text x="0" y="20" text-anchor="middle" class="tufte-time">t₁</text>
      <rect x="-30" y="30" width="60" height="35" class="box-state" rx="3"/>
      <text x="0" y="52" text-anchor="middle" class="tufte-code">x = 10</text>
    </g>

    <g transform="translate(170, 45)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#999" stroke-width="1.5"/>
      <text x="0" y="20" text-anchor="middle" class="tufte-time">t₂</text>
      <rect x="-30" y="30" width="60" height="35" class="box-state" rx="3"/>
      <text x="0" y="52" text-anchor="middle" class="tufte-code">x = 15</text>
    </g>

    <g transform="translate(290, 45)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#999" stroke-width="1.5"/>
      <text x="0" y="20" text-anchor="middle" class="tufte-time">t₃</text>
      <rect x="-30" y="30" width="60" height="35" class="box-state" rx="3"/>
      <text x="0" y="52" text-anchor="middle" class="tufte-code">x = 30</text>
    </g>

    <g transform="translate(400, 45)">
      <text x="0" y="5" text-anchor="start" class="tufte-time">시간</text>
    </g>

    <!-- Transition labels -->
    <g transform="translate(0, 10)">
        <text x="110" y="95" text-anchor="middle" class="tufte-small">x = x + 5</text>
        <line x1="80" y1="80" x2="140" y2="80" stroke="#999" stroke-width="1" marker-end="url(#arrow-light)"/>
    </g>

    <g transform="translate(0, 10)">
      <text x="230" y="95" text-anchor="middle" class="tufte-small">x = x * 2</text>
      <line x1="200" y1="80" x2="260" y2="80" stroke="#999" stroke-width="1" marker-end="url(#arrow-light)"/>
    </g>
  </g>

  <!-- BOTTOM: Key Insight -->

</svg>
