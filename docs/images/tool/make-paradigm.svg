<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 325">
  <defs>
    <style>
      .tufte-title { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 16px; font-weight: bold; fill: #222; }
      .tufte-label { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: bold; fill: #333; }
      .tufte-text { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #444; }
      .tufte-small { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #666; }
      .tufte-code { font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 10px; fill: #333; }
      .box-main { fill: #f8f9fa; stroke: #333; stroke-width: 1.2; }
      .box-secondary { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .arrow { fill: none; stroke: #444; stroke-width: 1.2; marker-end: url(#arrowhead); }
      .arrow-dep { fill: none; stroke: #adb5bd; stroke-width: 1; stroke-dasharray: 3,2; marker-end: url(#arrowhead-small); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="arrowhead-small" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#adb5bd"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <rect x="20" y="20" width="320" height="290" rx="8" class="box-secondary"/>
  <text x="180" y="50" class="tufte-title" text-anchor="middle">절차적 (Procedural)</text>
  <text x="180" y="70" class="tufte-small" text-anchor="middle">"순서를 지시한다"</text>

  <g transform="translate(60, 95)">
    <rect width="240" height="35" rx="4" class="box-main"/>
    <text x="15" y="22" class="tufte-code">1. python preprocess.py</text>
    
    <path d="M120,35 L120,55" class="arrow"/>
    
    <rect y="55" width="240" height="35" rx="4" class="box-main"/>
    <text x="15" y="77" class="tufte-code">2. python analyze.py</text>
    
    <path d="M120,90 L120,110" class="arrow"/>
    
    <rect y="110" width="240" height="35" rx="4" class="box-main"/>
    <text x="15" y="132" class="tufte-code">3. python visualize.py</text>
    
    <path d="M120,145 L120,165" class="arrow"/>
    
    <rect y="165" width="240" height="35" rx="4" class="box-main"/>
    <text x="15" y="187" class="tufte-code">4. python report.py</text>
  </g>

  <text x="375" y="175" class="tufte-title" text-anchor="middle" style="fill:#999">VS</text>

  <rect x="410" y="20" width="320" height="290" rx="8" class="box-secondary"/>
  <text x="570" y="50" class="tufte-title" text-anchor="middle">선언적 (Declarative)</text>
  <text x="570" y="70" class="tufte-small" text-anchor="middle">"관계를 정의한다"</text>

  <g transform="translate(430, 95)">
    <text x="0" y="22" class="tufte-code">report.py</text>
    <path d="M65,18 L85,18" class="arrow-dep"/>
    <rect x="90" y="0" width="120" height="35" rx="4" class="box-main"/>
    <text x="150" y="22" class="tufte-label" text-anchor="middle">report.pdf</text>

    <text x="0" y="77" class="tufte-code">visualize.py</text>
    <path d="M65,73 L85,73" class="arrow-dep"/>
    <rect x="90" y="55" width="120" height="35" rx="4" class="box-main"/>
    <text x="150" y="77" class="tufte-label" text-anchor="middle">chart.png</text>

    <text x="0" y="132" class="tufte-code">analyze.py</text>
    <path d="M65,128 L85,128" class="arrow-dep"/>
    <rect x="90" y="110" width="120" height="35" rx="4" class="box-main"/>
    <text x="150" y="132" class="tufte-label" text-anchor="middle">results.json</text>

    <rect x="90" y="165" width="120" height="35" rx="4" class="box-main"/>
    <text x="150" y="187" class="tufte-label" text-anchor="middle">data.csv</text>

    <path d="M150,165 L150,150" class="arrow"/>
    <path d="M150,110 L150,95" class="arrow"/>
    <path d="M150,55 L150,40" class="arrow"/>
    
    <text x="215" y="157" class="tufte-small">의존</text>
    <text x="215" y="102" class="tufte-small">의존</text>
    <text x="215" y="47" class="tufte-small">의존</text>
  </g>
</svg>