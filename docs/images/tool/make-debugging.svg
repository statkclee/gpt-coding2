<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 80 700 410">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        fill: #666;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #444;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #333;
      }
      .box-main {
        fill: #f5f5f5;
        stroke: #333;
        stroke-width: 1.5;
      }
      .box-secondary {
        fill: #ffffff;
        stroke: #666;
        stroke-width: 1;
      }
      .box-warning {
        fill: #fff;
        stroke: #999;
        stroke-width: 1;
        stroke-dasharray: 4,2;
      }
      .arrow {
        fill: none;
        stroke: #666;
        stroke-width: 1.5;
        marker-end: url(#arrowhead);
      }
      .arrow-dashed {
        fill: none;
        stroke: #999;
        stroke-width: 1;
        stroke-dasharray: 4,2;
        marker-end: url(#arrowhead-light);
      }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrowhead-light" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="-10" y="0" width="700" height="480" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="350" y="30" class="tufte-title" text-anchor="middle">파일 자동화 디버깅: 세 가지 핵심 영역</text>
  <text x="350" y="50" class="tufte-subtitle" text-anchor="middle">경로, 인코딩, 동시성 — 스크립트 실패의 90%를 차지하는 원인</text> -->

  <!-- Central debugging concept -->
  <circle cx="350" cy="160" r="45" class="box-main"/>
  <text x="350" y="155" class="tufte-label" text-anchor="middle">디버깅</text>
  <text x="350" y="172" class="tufte-small" text-anchor="middle">핵심 영역</text>

  <!-- Three main problem areas -->

  <!-- 1. Path Problems (Left) -->
  <rect x="40" y="100" width="160" height="120" rx="5" class="box-main"/>
  <text x="120" y="125" class="tufte-label" text-anchor="middle">경로 문제</text>
  <line x1="60" y1="135" x2="180" y2="135" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="155" class="tufte-text">• 상대경로 vs 절대경로</text>
  <text x="50" y="172" class="tufte-text">• cwd 의존성</text>
  <text x="50" y="189" class="tufte-text">• 심볼릭 링크 해석</text>
  <text x="50" y="206" class="tufte-text">• 유니코드 정규화</text>

  <!-- Arrow from Path to center -->
  <path d="M200,160 L295,160" class="arrow"/>

  <!-- 2. Encoding Problems (Right) -->
  <rect x="500" y="100" width="160" height="120" rx="5" class="box-main"/>
  <text x="580" y="125" class="tufte-label" text-anchor="middle">인코딩 문제</text>
  <line x1="520" y1="135" x2="640" y2="135" stroke="#ccc" stroke-width="1"/>
  <text x="510" y="155" class="tufte-text">• UTF-8 vs EUC-KR</text>
  <text x="510" y="172" class="tufte-text">• 무음 실패 (깨진 문자)</text>
  <text x="510" y="189" class="tufte-text">• chardet 자동 탐지</text>
  <text x="510" y="206" class="tufte-text">• BOM 처리</text>

  <!-- Arrow from Encoding to center -->
  <path d="M500,160 L405,160" class="arrow"/>

  <!-- 3. Race Condition (Bottom) -->
  <rect x="270" y="250" width="160" height="100" rx="5" class="box-main"/>
  <text x="350" y="275" class="tufte-label" text-anchor="middle">경쟁 조건</text>
  <line x1="290" y1="285" x2="410" y2="285" stroke="#ccc" stroke-width="1"/>
  <text x="280" y="305" class="tufte-text">• TOCTOU 문제</text>
  <text x="280" y="322" class="tufte-text">• EAFP 원칙</text>
  <text x="280" y="339" class="tufte-text">• 예외 처리 우선</text>

  <!-- Arrow from Race to center -->
  <path d="M350,250 L350,215" class="arrow"/>

  <!-- Solution patterns below -->
  <g transform='translate(-30,0)'>
    <rect x="40" y="380" width="220" height="85" rx="5" class="box-secondary"/>
    <text x="140" y="403" class="tufte-label" text-anchor="middle">스크립트 기준 경로</text>
    <text x="50" y="423" class="tufte-code">SCRIPT_DIR = Path(__file__).parent</text>
    <text x="50" y="440" class="tufte-code">DATA_DIR = SCRIPT_DIR / "data"</text>
    <text x="50" y="455" class="tufte-small" style="fill:#666;">→ cwd 독립적 경로 참조</text>
  </g>

  <rect x="250" y="380" width="200" height="85" rx="5" class="box-secondary"/>
  <text x="350" y="403" class="tufte-label" text-anchor="middle">인코딩 탐지</text>
  <text x="260" y="423" class="tufte-code">detected = chardet.detect(raw)</text>
  <text x="260" y="440" class="tufte-code">encoding = detected["encoding"]</text>
  <text x="260" y="455" class="tufte-small" style="fill:#666;">→ 추측 대신 탐지</text>

  <rect x="460" y="380" width="200" height="85" rx="5" class="box-secondary"/>
  <text x="560" y="403" class="tufte-label" text-anchor="middle">EAFP 패턴</text>
  <text x="470" y="423" class="tufte-code">try:</text>
  <text x="490" y="440" class="tufte-code">    content = path.read_text()</text>
  <text x="470" y="455" class="tufte-code">except FileNotFoundError: ...</text>

  <!-- Connecting arrows from problems to solutions -->
  <path d="M120,220 L120,370" class="arrow-dashed"/>
  <path d="M350,350 L350,370" class="arrow-dashed"/>
  <path d="M580,220 L560,370" class="arrow-dashed"/>

  <!-- Key insight box -->
  <rect x="500" y="270" width="170" height="70" rx="5" class="box-warning"/>
  <text x="585" y="295" class="tufte-small" text-anchor="middle" style="font-style:italic;">핵심 원칙</text>
  <text x="510" y="315" class="tufte-text">"먼저 확인, 나중에 사용"</text>
  <text x="510" y="332" class="tufte-text">보다 "일단 시도, 예외 처리"</text>

</svg>