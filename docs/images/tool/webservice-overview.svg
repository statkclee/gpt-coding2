<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 300">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .human-box { fill: #fff; stroke: #333; stroke-width: 2; }
      .program-box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .server-box { fill: #e8e8e8; stroke: #333; stroke-width: 2; }
      .flow-line { fill: none; stroke: #555; stroke-width: 2; }
      .dim-line { fill: none; stroke: #999; stroke-width: 1.5; stroke-dasharray: 6,3; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#999" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>

  <!-- 상단: 핵심 질문 -->
  <!-- <text x="400" y="28" text-anchor="middle" class="tufte-title" font-size="15">같은 서버, 다른 응답: 누가 요청하느냐에 따라 형식이 달라진다</text> -->

  <!-- 왼쪽: 사람 (브라우저) -->
  <g transform="translate(40, 55)">
    <rect x="0" y="0" width="140" height="180" class="human-box" rx="6"/>
    <text x="70" y="25" text-anchor="middle" class="tufte-title" font-size="13">사람</text>
    <text x="70" y="42" text-anchor="middle" class="tufte-label" font-size="10">웹 브라우저</text>

    <!-- 눈 아이콘 (사람이 "본다") -->
    <ellipse cx="50" cy="75" rx="12" ry="8" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="50" cy="75" r="4" fill="#333"/>
    <ellipse cx="90" cy="75" rx="12" ry="8" fill="none" stroke="#333" stroke-width="1.5"/>
    <circle cx="90" cy="75" r="4" fill="#333"/>

    <text x="70" y="105" text-anchor="middle" class="tufte-text" font-size="11">읽고, 클릭하고,</text>
    <text x="70" y="120" text-anchor="middle" class="tufte-text" font-size="11">스크롤한다</text>

    <!-- HTML 미리보기 -->
    <rect x="15" y="135" width="110" height="35" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="25" y="152" class="tufte-mono" font-size="9">&lt;h1&gt;제목&lt;/h1&gt;</text>
    <text x="25" y="164" class="tufte-mono" font-size="9">&lt;p&gt;내용...&lt;/p&gt;</text>
  </g>

  <!-- 오른쪽: 프로그램 -->
  <g transform="translate(620, 55)">
    <rect x="0" y="0" width="140" height="180" class="program-box" rx="6"/>
    <text x="70" y="25" text-anchor="middle" class="tufte-title" font-size="13">프로그램</text>
    <text x="70" y="42" text-anchor="middle" class="tufte-label" font-size="10">Python 코드</text>

    <!-- 코드 아이콘 (프로그램이 "처리한다") -->
    <text x="50" y="80" text-anchor="middle" class="tufte-mono" font-size="18">{</text>
    <text x="90" y="80" text-anchor="middle" class="tufte-mono" font-size="18">}</text>

    <text x="70" y="105" text-anchor="middle" class="tufte-text" font-size="11">파싱하고, 저장하고,</text>
    <text x="70" y="120" text-anchor="middle" class="tufte-text" font-size="11">분석한다</text>

    <!-- JSON 미리보기 -->
    <rect x="15" y="135" width="110" height="35" fill="#fff" stroke="#999" stroke-width="1" rx="2"/>
    <text x="25" y="152" class="tufte-mono" font-size="9">{"name": "Kim",</text>
    <text x="25" y="164" class="tufte-mono" font-size="9"> "age": 28}</text>
  </g>

  <!-- 중앙: 서버 -->
  <g transform="translate(300, 70)">
    <rect x="0" y="0" width="200" height="150" class="server-box" rx="8"/>
    <text x="100" y="25" text-anchor="middle" class="tufte-title" font-size="14">서버</text>
    <text x="100" y="42" text-anchor="middle" class="tufte-mono" font-size="10">api.example.com</text>

    <!-- 데이터베이스 표현 (실린더) -->
    <path d="M 55,78 L 55,100 A 45,12 0 0,0 145,100 L 145,78" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="100" cy="78" rx="45" ry="12" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <text x="100" y="105" text-anchor="middle" class="tufte-small">데이터</text>

    <text x="100" y="138" text-anchor="middle" class="tufte-label" font-size="10">요청에 맞게 응답 형식 결정</text>
  </g>

  <!-- 왼쪽 화살표: 브라우저 → 서버 → 브라우저 -->
  <path d="M 185,120 L 295,120" class="dim-line" marker-end="url(#arrow-dim)"/>
  <text x="240" y="110" text-anchor="middle" class="tufte-small">GET /page</text>

  <path d="M 295,160 L 185,160" class="dim-line" marker-end="url(#arrow-dim)"/>
  <text x="240" y="180" text-anchor="middle" class="tufte-mono" font-size="10">HTML</text>
  <text x="240" y="193" text-anchor="middle" class="tufte-small">(보기 좋게 꾸민 문서)</text>

  <!-- 오른쪽 화살표: 프로그램 → 서버 → 프로그램 -->
  <path d="M 615,120 L 505,120" class="flow-line" marker-end="url(#arrow)"/>
  <text x="560" y="110" text-anchor="middle" class="tufte-small">GET /api/data</text>

  <path d="M 505,160 L 615,160" class="flow-line" marker-end="url(#arrow)"/>
  <text x="560" y="180" text-anchor="middle" class="tufte-mono" font-size="10">JSON</text>
  <text x="560" y="193" text-anchor="middle" class="tufte-small">(처리하기 쉬운 구조)</text>

  <!-- 하단: 핵심 인사이트 박스 -->
  <g transform="translate(40, 255)">
    <rect x="0" y="0" width="720" height="70" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="6"/>

    <text x="280" y="25" class="tufte-title" font-size="12">웹서비스 = 프로그램을 위한 웹</text>

    <line x1="20" y1="35" x2="700" y2="35" stroke="#ddd" stroke-width="1"/>

    <text x="20" y="55" class="tufte-text" font-size="11">웹 브라우저가 HTML을 요청하듯, 파이썬 프로그램은 <tspan font-weight="bold">JSON</tspan>을 요청한다.</text>
    <text x="500" y="55" class="tufte-label" font-size="11">형식만 다를 뿐, 같은 HTTP 프로토콜이다.</text>
  </g>
</svg>
