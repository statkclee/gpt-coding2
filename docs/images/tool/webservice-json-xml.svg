<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .code-box { fill: #fafafa; stroke: #999; stroke-width: 1; }
      .compare-box { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- JSON 섹션 (왼쪽) -->
  <g transform="translate(30, 20)">
    <text x="170" y="20" text-anchor="middle" class="tufte-title" font-size="14">JSON</text>
    <text x="170" y="38" text-anchor="middle" class="tufte-label" font-size="11">JavaScript Object Notation</text>

    <rect x="0" y="50" width="340" height="160" class="code-box" rx="4"/>
    <text x="15" y="72" class="tufte-mono" font-size="11">{</text>
    <text x="25" y="90" class="tufte-mono" font-size="11">"name": "김철수",</text>
    <text x="25" y="108" class="tufte-mono" font-size="11">"age": 28,</text>
    <text x="25" y="126" class="tufte-mono" font-size="11">"email": "kim@example.com",</text>
    <text x="25" y="144" class="tufte-mono" font-size="11">"skills": ["Python", "SQL"]</text>
    <text x="15" y="162" class="tufte-mono" font-size="11">}</text>

    <text x="170" y="190" text-anchor="middle" class="tufte-small">6줄, 직관적 구조</text>
  </g>

  <!-- XML 섹션 (오른쪽) -->
  <g transform="translate(430, 20)">
    <text x="170" y="20" text-anchor="middle" class="tufte-title" font-size="14">XML</text>
    <text x="170" y="38" text-anchor="middle" class="tufte-label" font-size="11">eXtensible Markup Language</text>

    <rect x="0" y="50" width="340" height="160" class="code-box" rx="4"/>
    <text x="15" y="72" class="tufte-mono" font-size="11">&lt;user&gt;</text>
    <text x="25" y="90" class="tufte-mono" font-size="11">&lt;name&gt;김철수&lt;/name&gt;</text>
    <text x="25" y="108" class="tufte-mono" font-size="11">&lt;age&gt;28&lt;/age&gt;</text>
    <text x="25" y="126" class="tufte-mono" font-size="11">&lt;email&gt;kim@example.com&lt;/email&gt;</text>
    <text x="25" y="144" class="tufte-mono" font-size="11">&lt;skills&gt;</text>
    <text x="35" y="162" class="tufte-mono" font-size="11">&lt;skill&gt;Python&lt;/skill&gt;...</text>
    <text x="15" y="180" class="tufte-mono" font-size="11">&lt;/user&gt;</text>

    <text x="170" y="198" text-anchor="middle" class="tufte-small">9줄+, 태그 반복</text>
  </g>

  <!-- 비교 테이블 -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="740" height="75" class="compare-box" rx="4"/>

    <!-- 헤더 -->
    <line x1="185" y1="0" x2="185" y2="75" stroke="#ddd" stroke-width="1"/>
    <line x1="370" y1="0" x2="370" y2="75" stroke="#ddd" stroke-width="1"/>
    <line x1="555" y1="0" x2="555" y2="75" stroke="#ddd" stroke-width="1"/>
    <line x1="0" y1="25" x2="740" y2="25" stroke="#ddd" stroke-width="1"/>

    <text x="92" y="17" text-anchor="middle" class="tufte-title" font-size="11">항목</text>
    <text x="277" y="17" text-anchor="middle" class="tufte-title" font-size="11">JSON</text>
    <text x="462" y="17" text-anchor="middle" class="tufte-title" font-size="11">XML</text>
    <text x="647" y="17" text-anchor="middle" class="tufte-title" font-size="11">선택 기준</text>

    <!-- 데이터 행 1 -->
    <text x="92" y="42" text-anchor="middle" class="tufte-text" font-size="10">가독성</text>
    <text x="277" y="42" text-anchor="middle" class="tufte-text" font-size="10">간결, 직관적</text>
    <text x="462" y="42" text-anchor="middle" class="tufte-text" font-size="10">장황, 태그 중복</text>
    <text x="647" y="42" text-anchor="middle" class="tufte-label" font-size="10">JSON 우세</text>

    <!-- 데이터 행 2 -->
    <text x="92" y="62" text-anchor="middle" class="tufte-text" font-size="10">파이썬 매핑</text>
    <text x="277" y="62" text-anchor="middle" class="tufte-text" font-size="10">dict/list 직접 변환</text>
    <text x="462" y="62" text-anchor="middle" class="tufte-text" font-size="10">파싱 코드 필요</text>
    <text x="647" y="62" text-anchor="middle" class="tufte-label" font-size="10">JSON 우세</text>
  </g>
</svg>
