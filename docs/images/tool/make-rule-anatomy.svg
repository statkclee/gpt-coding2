<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 650 230">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #444;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code-tab {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 24px;
        fill: #333;
      }      
      .tufte-code-large {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 14px;
        fill: #333;
      }
      .box-main {
        fill: #f5f5f5;
        stroke: #333;
        stroke-width: 1.5;
      }
      .box-highlight {
        fill: #e8e8e8;
        stroke: #333;
        stroke-width: 2;
      }
      .box-secondary {
        fill: #ffffff;
        stroke: #666;
        stroke-width: 1;
      }
      .bracket {
        fill: none;
        stroke: #666;
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="280" fill="#ffffff"/>

  <!-- Main code block -->
  <rect x="40" y="40" width="400" height="100" rx="5" class="box-main"/>

  <!-- Code lines -->
  <text x="55" y="75" class="tufte-code-large">results.json : data.csv analyze.py</text>
  <text x="97" y="110" class="tufte-code-large">    python analyze.py data.csv results.json</text>

  <!-- TAB indicator -->
  <rect x="60" y="95" width="30" height="18" rx="2" fill="#ddd" stroke="#999" stroke-width="1"/>
  <text x="75" y="107" class="tufte-small" text-anchor="middle">TAB</text>

  <!-- Annotations with brackets -->

  <!-- Target annotation -->
  <path d="M60,78 L60,85 L150,85 L150,78" class="bracket"/>
  <line x1="105" y1="85" x2="105" y2="160" stroke="#666" stroke-width="1"/>
  <rect x="40" y="165" width="130" height="55" rx="3" class="box-secondary"/>
  <text x="105" y="185" class="tufte-label" text-anchor="middle">타겟 (Target)</text>
  <text x="105" y="202" class="tufte-small" text-anchor="middle">생성할 파일</text>
  <text x="105" y="215" class="tufte-small" text-anchor="middle">출력물</text>

  <!-- Dependencies annotation -->
  <path d="M182,78 L182,85 L390,85 L390,78" class="bracket"/>
  <line x1="286" y1="85" x2="286" y2="160" stroke="#666" stroke-width="1"/>
  <rect x="206" y="165" width="160" height="55" rx="3" class="box-secondary"/>
  <text x="286" y="185" class="tufte-label" text-anchor="middle">의존성 (Dependencies)</text>
  <text x="286" y="202" class="tufte-small" text-anchor="middle">타겟을 만드는 데 필요한 파일</text>
  <text x="286" y="215" class="tufte-small" text-anchor="middle">입력 데이터, 스크립트</text>

  <!-- Action annotation -->
  <path d="M95,115 L95,122 L430,122 L430,115" class="bracket"/>
  <line x1="292" y1="122" x2="500" y2="160" stroke="#666" stroke-width="1"/>
  <rect x="420" y="165" width="180" height="55" rx="3" class="box-secondary"/>
  <text x="510" y="185" class="tufte-label" text-anchor="middle">액션 (Action)</text>
  <text x="510" y="202" class="tufte-small" text-anchor="middle">타겟을 생성하는 쉘 명령</text>
  <text x="510" y="215" class="tufte-small" text-anchor="middle">반드시 TAB으로 들여쓰기</text>

  <!-- Colon indicator -->
  <circle cx="170" cy="70" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="75" class="tufte-code-large" text-anchor="middle">:</text>
  <text x="170" y="30" class="tufte-small" text-anchor="middle">구분자</text>
  <line x1="170" y1="35" x2="170" y2="58" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Key insight box -->
  <rect x="460" y="40" width="170" height="80" rx="5" class="box-highlight"/>
  <text x="545" y="62" class="tufte-label" text-anchor="middle">핵심 구조</text>
  <text x="475" y="82" class="tufte-code">타겟 : 의존성</text>
  <text x="475" y="102" class="tufte-code-tab">⇥</text>
  <text x="495" y="100" class="tufte-code">액션</text>
  <text x="545" y="115" class="tufte-small" text-anchor="middle">(⇥ = TAB 필수)</text>

</svg>
