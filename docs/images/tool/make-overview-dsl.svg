<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .main-box { fill: #f8f8f8; stroke: #333; stroke-width: 2; }
      .sub-box { fill: #fff; stroke: #666; stroke-width: 1.5; }
      .highlight-box { fill: #f0f0f0; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="280" fill="#ffffff"/>

  <!-- 왼쪽: 문제 상황 -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="220" height="200" class="main-box" rx="6"/>
    <text x="110" y="25" text-anchor="middle" class="tufte-title" font-size="13">쉘 스크립트의 한계</text>
    <line x1="15" y1="38" x2="205" y2="38" stroke="#ccc" stroke-width="1"/>

    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="190" height="60" class="sub-box" rx="4"/>
      <text x="95" y="20" text-anchor="middle" class="tufte-mono" font-size="10">run_pipeline.sh</text>
      <text x="95" y="38" text-anchor="middle" class="tufte-small">매번 전체 재실행</text>
      <text x="95" y="52" text-anchor="middle" class="tufte-small">의존성 수동 관리</text>
    </g>

    <g transform="translate(15, 125)">
      <text x="95" y="15" text-anchor="middle" class="tufte-text" font-size="11">주석 처리 번거로움</text>
      <text x="95" y="35" text-anchor="middle" class="tufte-text" font-size="11">변경 추적 불가</text>
      <text x="95" y="55" text-anchor="middle" class="tufte-text" font-size="11">시간 낭비</text>
    </g>
  </g>

  <!-- 화살표 -->
  <g transform="translate(260, 125)">
    <path d="M 0,0 L 50,0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="25" y="-10" text-anchor="middle" class="tufte-small">Make</text>
  </g>

  <!-- 중앙: Makefile -->
  <g transform="translate(320, 25)">
    <rect x="0" y="0" width="200" height="200" class="highlight-box" rx="6"/>
    <text x="100" y="25" text-anchor="middle" class="tufte-title" font-size="13">Makefile</text>
    <line x1="15" y1="38" x2="185" y2="38" stroke="#ccc" stroke-width="1"/>

    <g transform="translate(15, 50)">
      <text x="0" y="15" class="tufte-mono" font-size="9">target : dependencies</text>
      <text x="10" y="32" class="tufte-mono" font-size="9">action</text>
    </g>

    <g transform="translate(15, 95)">
      <rect x="0" y="0" width="170" height="90" class="sub-box" rx="4"/>
      <text x="85" y="20" text-anchor="middle" class="tufte-text" font-size="10">핵심 개념</text>
      <text x="85" y="40" text-anchor="middle" class="tufte-small">타겟(Target)</text>
      <text x="85" y="55" text-anchor="middle" class="tufte-small">의존성(Dependency)</text>
      <text x="85" y="70" text-anchor="middle" class="tufte-small">액션(Action)</text>
      <text x="85" y="85" text-anchor="middle" class="tufte-small">증분 빌드</text>
    </g>
  </g>

  <!-- 화살표 -->
  <g transform="translate(530, 125)">
    <path d="M 0,0 L 50,0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="25" y="-10" text-anchor="middle" class="tufte-small">자동</text>
  </g>

  <!-- 오른쪽: 결과 -->
  <g transform="translate(590, 25)">
    <rect x="0" y="0" width="180" height="200" class="main-box" rx="6"/>
    <text x="90" y="25" text-anchor="middle" class="tufte-title" font-size="13">빌드 자동화</text>
    <line x1="15" y1="38" x2="165" y2="38" stroke="#ccc" stroke-width="1"/>

    <g transform="translate(15, 50)">
      <text x="75" y="15" text-anchor="middle" class="tufte-text" font-size="11">변경된 파일만</text>
      <text x="75" y="32" text-anchor="middle" class="tufte-text" font-size="11">재빌드</text>
    </g>

    <g transform="translate(15, 95)">
      <rect x="0" y="0" width="150" height="90" class="sub-box" rx="4"/>
      <text x="75" y="20" text-anchor="middle" class="tufte-text" font-size="10">장점</text>
      <text x="75" y="40" text-anchor="middle" class="tufte-small">시간 절약</text>
      <text x="75" y="55" text-anchor="middle" class="tufte-small">의존성 문서화</text>
      <text x="75" y="70" text-anchor="middle" class="tufte-small">재현가능성</text>
      <text x="75" y="85" text-anchor="middle" class="tufte-small">병렬 빌드</text>
    </g>
  </g>

  <!-- 하단 메시지 -->
  <text x="400" y="260" text-anchor="middle" class="tufte-label" font-size="12">"의존성을 선언하면, Make가 빌드 순서를 결정한다"</text>

</svg>
