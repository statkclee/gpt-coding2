<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .target-box { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
      .source-box { fill: #fff; stroke: #666; stroke-width: 1.5; }
      .dep-line { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- 최상위 타겟: results.txt -->
  <g transform="translate(320, 30)">
    <rect x="0" y="0" width="160" height="50" class="target-box" rx="6"/>
    <text x="80" y="25" text-anchor="middle" class="tufte-mono" font-size="12">results.txt</text>
    <text x="80" y="42" text-anchor="middle" class="tufte-small">최종 결과</text>
  </g>

  <!-- 중간 타겟들: .dat 파일 -->
  <g transform="translate(120, 130)">
    <rect x="0" y="0" width="130" height="50" class="target-box" rx="6"/>
    <text x="65" y="25" text-anchor="middle" class="tufte-mono" font-size="11">isles.dat</text>
    <text x="65" y="42" text-anchor="middle" class="tufte-small">단어 빈도</text>
  </g>

  <g transform="translate(335, 130)">
    <rect x="0" y="0" width="130" height="50" class="target-box" rx="6"/>
    <text x="65" y="25" text-anchor="middle" class="tufte-mono" font-size="11">abyss.dat</text>
    <text x="65" y="42" text-anchor="middle" class="tufte-small">단어 빈도</text>
  </g>

  <g transform="translate(550, 130)">
    <rect x="0" y="0" width="130" height="50" class="target-box" rx="6"/>
    <text x="65" y="25" text-anchor="middle" class="tufte-mono" font-size="11">last.dat</text>
    <text x="65" y="42" text-anchor="middle" class="tufte-small">단어 빈도</text>
  </g>

  <!-- 소스 파일들: .txt 파일 -->
  <g transform="translate(100, 230)">
    <rect x="0" y="0" width="170" height="50" class="source-box" rx="6"/>
    <text x="85" y="25" text-anchor="middle" class="tufte-mono" font-size="10">books/isles.txt</text>
    <text x="85" y="42" text-anchor="middle" class="tufte-small">원본 텍스트</text>
  </g>

  <g transform="translate(315, 230)">
    <rect x="0" y="0" width="170" height="50" class="source-box" rx="6"/>
    <text x="85" y="25" text-anchor="middle" class="tufte-mono" font-size="10">books/abyss.txt</text>
    <text x="85" y="42" text-anchor="middle" class="tufte-small">원본 텍스트</text>
  </g>

  <g transform="translate(530, 230)">
    <rect x="0" y="0" width="170" height="50" class="source-box" rx="6"/>
    <text x="85" y="25" text-anchor="middle" class="tufte-mono" font-size="10">books/last.txt</text>
    <text x="85" y="42" text-anchor="middle" class="tufte-small">원본 텍스트</text>
  </g>

  <!-- 의존성 화살표: results.txt → .dat 파일들 -->
  <path d="M 350,80 L 185,125" class="dep-line" marker-end="url(#arrow)"/>
  <path d="M 400,80 L 400,125" class="dep-line" marker-end="url(#arrow)"/>
  <path d="M 450,80 L 615,125" class="dep-line" marker-end="url(#arrow)"/>

  <!-- 의존성 화살표: .dat 파일들 → .txt 파일들 -->
  <path d="M 185,180 L 185,225" class="dep-line" marker-end="url(#arrow)"/>
  <path d="M 400,180 L 400,225" class="dep-line" marker-end="url(#arrow)"/>
  <path d="M 615,180 L 615,225" class="dep-line" marker-end="url(#arrow)"/>

  <!-- 레이블 -->
  <text x="30" y="55" class="tufte-label" font-size="11">타겟</text>
  <text x="30" y="155" class="tufte-label" font-size="11">중간 파일</text>
  <text x="30" y="255" class="tufte-label" font-size="11">소스</text>

  <!-- 화살표 방향 설명 -->
  <text x="750" y="120" text-anchor="end" class="tufte-small">화살표 방향:</text>
  <text x="750" y="135" text-anchor="end" class="tufte-small">"의존한다"</text>

  <!-- 하단 메시지 -->
  <text x="400" y="305" text-anchor="middle" class="tufte-label" font-size="12">"변경된 소스부터 의존 경로를 따라 필요한 타겟만 재빌드"</text>

</svg>
