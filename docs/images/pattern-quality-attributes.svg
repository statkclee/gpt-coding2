<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 9px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 9px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="28" class="tufte-title" text-anchor="middle">품질 속성(Quality Attributes)과 아키텍처</text>

  <!-- Central concept -->
  <rect x="300" y="50" width="200" height="50" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
  <text x="400" y="72" class="tufte-subtitle" text-anchor="middle">아키텍처 결정</text>
  <text x="400" y="88" class="tufte-desc" text-anchor="middle">Architecture Decisions</text>

  <!-- Arrows to quality attributes -->
  <line x1="300" y1="75" x2="150" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="100" x2="280" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="100" x2="520" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="75" x2="650" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Runtime Quality Attributes -->
  <text x="200" y="135" class="tufte-label" text-anchor="middle">런타임 품질 속성</text>

  <!-- Performance -->
  <rect x="50" y="155" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="115" y="175" class="tufte-label" text-anchor="middle">성능</text>
  <line x1="60" y1="183" x2="170" y2="183" stroke="#ccc" stroke-width="1"/>
  <text x="115" y="198" class="tufte-desc" text-anchor="middle">Performance</text>
  <text x="115" y="213" class="tufte-code" text-anchor="middle">응답시간, 처리량</text>

  <!-- Availability -->
  <rect x="200" y="155" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="265" y="175" class="tufte-label" text-anchor="middle">가용성</text>
  <line x1="210" y1="183" x2="320" y2="183" stroke="#ccc" stroke-width="1"/>
  <text x="265" y="198" class="tufte-desc" text-anchor="middle">Availability</text>
  <text x="265" y="213" class="tufte-code" text-anchor="middle">99.9% 업타임</text>

  <!-- Security -->
  <rect x="470" y="155" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="535" y="175" class="tufte-label" text-anchor="middle">보안</text>
  <line x1="480" y1="183" x2="590" y2="183" stroke="#ccc" stroke-width="1"/>
  <text x="535" y="198" class="tufte-desc" text-anchor="middle">Security</text>
  <text x="535" y="213" class="tufte-code" text-anchor="middle">인증, 암호화</text>

  <!-- Scalability -->
  <rect x="620" y="155" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="685" y="175" class="tufte-label" text-anchor="middle">확장성</text>
  <line x1="630" y1="183" x2="740" y2="183" stroke="#ccc" stroke-width="1"/>
  <text x="685" y="198" class="tufte-desc" text-anchor="middle">Scalability</text>
  <text x="685" y="213" class="tufte-code" text-anchor="middle">수평/수직 확장</text>

  <!-- Development Quality Attributes -->
  <text x="200" y="260" class="tufte-label" text-anchor="middle">개발 시간 품질 속성</text>

  <!-- Maintainability -->
  <rect x="50" y="275" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="115" y="295" class="tufte-label" text-anchor="middle">유지보수성</text>
  <line x1="60" y1="303" x2="170" y2="303" stroke="#ccc" stroke-width="1"/>
  <text x="115" y="318" class="tufte-desc" text-anchor="middle">Maintainability</text>
  <text x="115" y="333" class="tufte-code" text-anchor="middle">수정 용이성</text>

  <!-- Testability -->
  <rect x="200" y="275" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="265" y="295" class="tufte-label" text-anchor="middle">테스트 용이성</text>
  <line x1="210" y1="303" x2="320" y2="303" stroke="#ccc" stroke-width="1"/>
  <text x="265" y="318" class="tufte-desc" text-anchor="middle">Testability</text>
  <text x="265" y="333" class="tufte-code" text-anchor="middle">단위 테스트 가능</text>

  <!-- Modifiability -->
  <rect x="470" y="275" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="535" y="295" class="tufte-label" text-anchor="middle">변경 용이성</text>
  <line x1="480" y1="303" x2="590" y2="303" stroke="#ccc" stroke-width="1"/>
  <text x="535" y="318" class="tufte-desc" text-anchor="middle">Modifiability</text>
  <text x="535" y="333" class="tufte-code" text-anchor="middle">변경 영향 최소화</text>

  <!-- Reusability -->
  <rect x="620" y="275" width="130" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="685" y="295" class="tufte-label" text-anchor="middle">재사용성</text>
  <line x1="630" y1="303" x2="740" y2="303" stroke="#ccc" stroke-width="1"/>
  <text x="685" y="318" class="tufte-desc" text-anchor="middle">Reusability</text>
  <text x="685" y="333" class="tufte-code" text-anchor="middle">컴포넌트 재활용</text>

  <!-- Trade-off indicator -->
  <rect x="50" y="375" width="700" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="400" y="398" class="tufte-subtitle" text-anchor="middle">품질 속성 간 트레이드오프</text>
  <line x1="65" y1="408" x2="735" y2="408" stroke="#ccc" stroke-width="1"/>

  <!-- Trade-off examples -->
  <text x="200" y="428" class="tufte-desc" text-anchor="middle">성능 ↑ ↔ 보안 ↓</text>
  <text x="200" y="443" class="tufte-code" text-anchor="middle">암호화 없이 빠른 전송</text>

  <text x="400" y="428" class="tufte-desc" text-anchor="middle">확장성 ↑ ↔ 단순성 ↓</text>
  <text x="400" y="443" class="tufte-code" text-anchor="middle">분산 시스템 복잡도</text>

  <text x="600" y="428" class="tufte-desc" text-anchor="middle">가용성 ↑ ↔ 비용 ↑</text>
  <text x="600" y="443" class="tufte-code" text-anchor="middle">이중화, 복제</text>

  <!-- Bottom note -->
  <text x="400" y="475" class="tufte-small" text-anchor="middle">아키텍처는 "모든 품질을 최대화"할 수 없다 — 비즈니스 우선순위에 따른 트레이드오프 결정이 핵심</text>
</svg>
