<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 900 310">
  <defs>
    <style>
      .tufte-title {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 18px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 12px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 11px;
        fill: #444;
      }
      .tufte-small {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 9px;
        fill: #666;
      }
      .box-start {
        fill: #333;
        stroke: #000;
        stroke-width: 0;
      }
      .box-data {
        fill: #f9f9f9;
        stroke: #999;
        stroke-width: 1;
      }
      .box-decision {
        fill: #fff;
        stroke: #666;
        stroke-width: 1;
        stroke-dasharray: 4,2;
      }
      .box-model {
        fill: #ffffff;
        stroke: #333;
        stroke-width: 1.5;
      }
      .arrow {
        stroke: #666;
        stroke-width: 1.5;
        fill: none;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="550" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="450" y="40" class="tufte-title" text-anchor="middle">데이터 맞춤형 모델 선택 가이드</text>
  <text x="450" y="60" class="tufte-text" text-anchor="middle" font-style="italic">"무엇을 가지고 있는가?"에서 시작하는 최적 아키텍처 탐색</text> -->

  <!-- Start Node -->
  <g transform="translate(370, 80)">
    <rect x="0" y="0" width="160" height="40" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="20"/>
    <text x="80" y="27" class="tufte-label" text-anchor="middle">데이터 유형은?</text>
  </g>

  <!-- Connectors from Start --> 
  <path d="M450 120 L450 140 L90 140 L90 160" class="arrow" marker-end="url(#arrow)"/> <!-- Tabular -->
  <path d="M450 120 L450 140 L270 140 L270 160" class="arrow" marker-end="url(#arrow)"/> <!-- Image -->
  <path d="M450 120 L450 140 L450 140 L450 160" class="arrow" marker-end="url(#arrow)"/> <!-- Sequence -->
  <path d="M450 120 L450 140 L630 140 L630 160" class="arrow" marker-end="url(#arrow)"/> <!-- Text -->
  <path d="M450 120 L450 140 L810 140 L810 160" class="arrow" marker-end="url(#arrow)"/> <!-- Multimodal -->

  <!-- Branch 1: Tabular -->
  <g transform="translate(10, 160)">
    <rect x="0" y="0" width="160" height="40" class="box-data" rx="3"/>
    <text x="80" y="25" class="tufte-subtitle" text-anchor="middle">정형 데이터</text>

    <line x1="80" y1="40" x2="80" y2="70" class="arrow" marker-end="url(#arrow)"/>

    <rect x="10" y="70" width="140" height="60" class="box-model" rx="3"/>
    <text x="80" y="95" class="tufte-label" text-anchor="middle">트리 모델</text>
    <text x="80" y="115" class="tufte-small" text-anchor="middle">(XGBoost, LightGBM)</text>

    <text x="80" y="150" class="tufte-text" text-anchor="middle" fill="#666">"최강의 성능"</text>
  </g>

  <!-- Branch 2: Image -->
  <g transform="translate(190, 160)">
    <rect x="0" y="0" width="160" height="40" class="box-data" rx="3"/>
    <text x="80" y="25" class="tufte-subtitle" text-anchor="middle">이미지</text>

    <line x1="80" y1="40" x2="80" y2="70" class="arrow"/>

    <!-- Decision Split -->
    <g transform="translate(10, 70)">
        <polygon points="70,0 140,30 70,60 0,30" class="box-decision"/>
        <text x="70" y="25" class="tufte-small" text-anchor="middle">데이터</text>
        <text x="70" y="40" class="tufte-small" text-anchor="middle">규모?</text>
    </g>

    <!-- Path Small -->
    <path d="M35 100 L35 150" class="arrow" marker-end="url(#arrow)"/>
    <text x="25" y="125" class="tufte-small" text-anchor="end">작음</text>
    <rect x="0" y="150" width="70" height="40" class="box-model" rx="3"/>
    <text x="35" y="175" class="tufte-label" text-anchor="middle">CNN</text>

    <!-- Path Large -->
    <path d="M125 100 L125 150" class="arrow" marker-end="url(#arrow)"/>
    <text x="135" y="125" class="tufte-small" text-anchor="start">큼</text>
    <rect x="90" y="150" width="70" height="40" class="box-model" rx="3" stroke-dasharray="2,2"/>
    <text x="125" y="175" class="tufte-label" text-anchor="middle">ViT</text>
  </g>

  <!-- Branch 3: Sequence -->
  <g transform="translate(370, 160)">
    <rect x="0" y="0" width="160" height="40" class="box-data" rx="3"/>
    <text x="80" y="25" class="tufte-subtitle" text-anchor="middle">시계열/순차</text>

    <line x1="80" y1="40" x2="80" y2="70" class="arrow"/>

    <!-- Decision Split -->
    <g transform="translate(10, 70)">
        <polygon points="70,0 140,30 70,60 0,30" class="box-decision"/>
        <text x="70" y="25" class="tufte-small" text-anchor="middle">길이/</text>
        <text x="70" y="40" class="tufte-small" text-anchor="middle">자원?</text>
    </g>

    <!-- Path Short/Low Res -->
    <path d="M35 100 L35 150" class="arrow" marker-end="url(#arrow)"/>
    <text x="25" y="125" class="tufte-small" text-anchor="end">짧음</text>
    <rect x="0" y="150" width="70" height="40" class="box-model" rx="3"/>
    <text x="35" y="175" class="tufte-label" text-anchor="middle">LSTM</text>

    <!-- Path Long/High Perf -->
    <path d="M125 100 L125 150" class="arrow" marker-end="url(#arrow)"/>
    <text x="135" y="125" class="tufte-small" text-anchor="start">긺</text>
    <rect x="90" y="150" width="70" height="40" class="box-model" rx="3" stroke-dasharray="2,2"/>
    <text x="125" y="175" class="tufte-label" text-anchor="middle">Transformer</text>
  </g>

  <!-- Branch 4: Text -->
  <g transform="translate(550, 160)">
    <rect x="0" y="0" width="160" height="40" class="box-data" rx="3"/>
    <text x="80" y="25" class="tufte-subtitle" text-anchor="middle">텍스트/자연어</text>

    <line x1="80" y1="40" x2="80" y2="70" class="arrow" marker-end="url(#arrow)"/>

    <rect x="10" y="70" width="140" height="60" class="box-model" rx="3"/>
    <text x="80" y="95" class="tufte-label" text-anchor="middle">Transformer</text>
    <text x="80" y="115" class="tufte-small" text-anchor="middle">(BERT, GPT)</text>

    <text x="80" y="150" class="tufte-text" text-anchor="middle" fill="#666">"사실상 표준"</text>
  </g>

  <!-- Branch 5: Multimodal -->
  <g transform="translate(730, 160)">
    <rect x="0" y="0" width="160" height="40" class="box-data" rx="3"/>
    <text x="80" y="25" class="tufte-subtitle" text-anchor="middle">멀티모달</text>
    <text x="80" y="38" class="tufte-small" text-anchor="middle">(이미지+텍스트)</text>

    <line x1="80" y1="40" x2="80" y2="70" class="arrow" marker-end="url(#arrow)"/>

    <rect x="10" y="70" width="140" height="60" class="box-model" rx="3"/>
    <text x="80" y="90" class="tufte-label" text-anchor="middle">Transformer 융합</text>
    <text x="80" y="110" class="tufte-small" text-anchor="middle">(CLIP, Flamingo)</text>

    <text x="80" y="150" class="tufte-text" text-anchor="middle" fill="#666">"범용 표현 학습"</text>
  </g>

  <!-- Bottom Insight Box -->
  <!-- <g transform="translate(150, 420)">
    <rect x="0" y="0" width="600" height="80" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="5"/>
    <text x="300" y="25" class="tufte-subtitle" text-anchor="middle">핵심 결정 요인</text>
    <line x1="50" y1="35" x2="550" y2="35" stroke="#ddd" stroke-width="1"/>

    <text x="100" y="60" class="tufte-text" text-anchor="middle">1. 데이터 구조</text>
    <text x="300" y="60" class="tufte-text" text-anchor="middle">2. 데이터 규모</text>
    <text x="500" y="60" class="tufte-text" text-anchor="middle">3. 자원 제약</text>
  </g> -->

</svg>