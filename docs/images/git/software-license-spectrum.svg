<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #222; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #555; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-size: 11px; }
      .tufte-tiny { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrow-left" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 8 6, 0 3" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- 스펙트럼 축 -->
  <g transform="translate(50, 50)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#666" stroke-width="2" marker-start="url(#arrow-left)" marker-end="url(#arrow)"/>
    <text x="0" y="-15" text-anchor="start" class="tufte-label" font-size="11">허용적 (Permissive)</text>
    <text x="700" y="-15" text-anchor="end" class="tufte-label" font-size="11">카피레프트 (Copyleft)</text>

    <!-- 틱 마크와 라이선스 -->
    <g transform="translate(50, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-45" y="15" width="90" height="75" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">MIT</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">최소 제약</text>
      <text x="0" y="68" text-anchor="middle" class="tufte-tiny">저작자 표시만</text>
      <text x="0" y="82" text-anchor="middle" class="tufte-tiny">React, jQuery</text>
    </g>

    <g transform="translate(200, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-50" y="15" width="100" height="75" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">Apache 2.0</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">특허권 명시</text>
      <text x="0" y="68" text-anchor="middle" class="tufte-tiny">기업 친화적</text>
      <text x="0" y="82" text-anchor="middle" class="tufte-tiny">TensorFlow, K8s</text>
    </g>

    <g transform="translate(380, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-50" y="15" width="100" height="75" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">MPL 2.0</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">파일 단위 공개</text>
      <text x="0" y="68" text-anchor="middle" class="tufte-tiny">약한 카피레프트</text>
      <text x="0" y="82" text-anchor="middle" class="tufte-tiny">Firefox, Rust</text>
    </g>

    <g transform="translate(530, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-45" y="15" width="90" height="75" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">LGPL</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">라이브러리 공개</text>
      <text x="0" y="68" text-anchor="middle" class="tufte-tiny">링크는 허용</text>
      <text x="0" y="82" text-anchor="middle" class="tufte-tiny">Qt, FFmpeg</text>
    </g>

    <g transform="translate(650, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-45" y="15" width="90" height="75" fill="#e0e0e0" stroke="#999" stroke-width="1.5" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">GPL v3</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">전체 공개 의무</text>
      <text x="0" y="68" text-anchor="middle" class="tufte-tiny">강한 카피레프트</text>
      <text x="0" y="82" text-anchor="middle" class="tufte-tiny">Linux, Git</text>
    </g>
  </g>

  <!-- 하단 비교표 -->
  <g transform="translate(50, 165)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#ccc" stroke-width="1"/>

    <text x="0" y="25" class="tufte-text" font-size="12" font-weight="bold">핵심 차이점</text>

    <g transform="translate(0, 40)">
      <text x="-30" y="0" class="tufte-small">파생물 공개 의무</text>
      <text x="80" y="0" text-anchor="middle" class="tufte-tiny">—</text>
      <text x="200" y="0" text-anchor="middle" class="tufte-tiny">—</text>
      <text x="380" y="0" text-anchor="middle" class="tufte-tiny">△ 파일만</text>
      <text x="530" y="0" text-anchor="middle" class="tufte-tiny">△ 라이브러리</text>
      <text x="650" y="0" text-anchor="middle" class="tufte-tiny">● 전체</text>
    </g>

    <g transform="translate(0, 60)">
      <text x="-30" y="0" class="tufte-small">특허권 허여</text>
      <text x="80" y="0" text-anchor="middle" class="tufte-tiny">암묵적</text>
      <text x="200" y="0" text-anchor="middle" class="tufte-tiny">● 명시</text>
      <text x="380" y="0" text-anchor="middle" class="tufte-tiny">● 명시</text>
      <text x="530" y="0" text-anchor="middle" class="tufte-tiny">● 명시</text>
      <text x="650" y="0" text-anchor="middle" class="tufte-tiny">● 명시</text>
    </g>

    <g transform="translate(0, 80)">
      <text x="-30" y="0" class="tufte-small">상업적 사용</text>
      <text x="80" y="0" text-anchor="middle" class="tufte-tiny">● 자유</text>
      <text x="200" y="0" text-anchor="middle" class="tufte-tiny">● 자유</text>
      <text x="380" y="0" text-anchor="middle" class="tufte-tiny">● 자유</text>
      <text x="530" y="0" text-anchor="middle" class="tufte-tiny">● 자유</text>
      <text x="650" y="0" text-anchor="middle" class="tufte-tiny">● 조건부</text>
    </g>

    <g transform="translate(0, 100)">
      <text x="-30" y="0" class="tufte-small">적합 용도</text>
      <text x="80" y="0" text-anchor="middle" class="tufte-tiny">범용 라이브러리</text>
      <text x="200" y="0" text-anchor="middle" class="tufte-tiny">기업 프로젝트</text>
      <text x="380" y="0" text-anchor="middle" class="tufte-tiny">혼합 프로젝트</text>
      <text x="530" y="0" text-anchor="middle" class="tufte-tiny">공유 라이브러리</text>
      <text x="650" y="0" text-anchor="middle" class="tufte-tiny">커뮤니티 SW</text>
    </g>
  </g>

  <!-- 권장 박스 -->
  <g transform="translate(50, 285)">
    <rect x="0" y="0" width="700" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
    <text x="15" y="18" class="tufte-text" font-size="11">
      <tspan font-weight="bold">★ 과학 연구용 권장:</tspan>
      <tspan dx="10">재사용성 극대화가 목표라면</tspan>
      <tspan class="tufte-mono" dx="5">MIT</tspan>
      <tspan dx="5">또는</tspan>
      <tspan class="tufte-mono" dx="5">Apache 2.0</tspan>
      <tspan dx="5">선택</tspan>
    </text>
  </g>
</svg>
