<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 600 210">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-title { font-size: 20px; font-weight: bold; }
      .tufte-label { font-size: 14px; font-weight: bold; }
      .tufte-small { font-size: 12px; fill: #555; }
      .tufte-tiny { font-size: 11px; fill: #666; }
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; rx: 5; }
      .box-highlight { fill: #e8e8e8; stroke: #333; stroke-width: 2; rx: 5; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; }
      .connector { stroke: #999; stroke-width: 1; stroke-dasharray: 4,2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="280" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="300" y="30" text-anchor="middle" class="tufte-text tufte-title">프로그래밍의 세 기둥</text> -->

  <!-- Three Pillars -->
  <!-- Pillar 1: Code -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="140" height="80" class="box"/>
    <text x="70" y="35" text-anchor="middle" class="tufte-text tufte-label">코드</text>
    <text x="70" y="55" text-anchor="middle" class="tufte-small">프로그래밍 언어</text>
    <text x="70" y="70" text-anchor="middle" class="tufte-tiny">Python, R, JavaScript</text>
  </g>

  <!-- Pillar 2: Git (Center, highlighted) -->
  <g transform="translate(230, 50)">
    <rect x="0" y="0" width="140" height="90" class="box-highlight"/>
    <text x="70" y="35" text-anchor="middle" class="tufte-text tufte-label">Git</text>
    <text x="70" y="55" text-anchor="middle" class="tufte-small">버전 관리 &amp; 협업</text>
    <text x="70" y="72" text-anchor="middle" class="tufte-tiny">이력 추적, 분기, 병합</text>
    <text x="70" y="85" text-anchor="middle" class="tufte-tiny">코드 리뷰, 공유</text>
  </g>

  <!-- Pillar 3: AI -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="140" height="80" class="box"/>
    <text x="70" y="35" text-anchor="middle" class="tufte-text tufte-label">AI</text>
    <text x="70" y="55" text-anchor="middle" class="tufte-small">코드 생성 &amp; 지원</text>
    <text x="70" y="70" text-anchor="middle" class="tufte-tiny">ChatGPT, Copilot</text>
  </g>

  <!-- Connecting arrows showing relationships -->
  <!-- Code <-> Git -->
  <path d="M200,100 L230,100" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M230,90 L200,90" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Git <-> AI -->
  <path d="M370,100 L400,100" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M400,90 L370,90" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Central message box -->
  <g transform="translate(20, 155)">
    <rect x="0" y="0" width="560" height="75" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8"/>

    <!-- Why Git matters -->
    <text x="280" y="22" text-anchor="middle" class="tufte-text tufte-label">Git 존재 이유</text>

    <!-- Four reasons as 1x4 horizontal layout -->
    <g transform="translate(15, 38)">
      <!-- Reason 1: History -->
      <circle cx="12" cy="12" r="10" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" class="tufte-tiny" style="font-weight:bold;">1</text>
      <text x="30" y="10" class="tufte-tiny" style="font-weight:bold;">실수 되돌리기</text>
      <text x="30" y="24" class="tufte-tiny">변경 이력 보존</text>
    </g>

    <g transform="translate(150, 38)">
      <!-- Reason 2: AI Collaboration -->
      <circle cx="12" cy="12" r="10" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" class="tufte-tiny" style="font-weight:bold;">2</text>
      <text x="30" y="10" class="tufte-tiny" style="font-weight:bold;">AI 협업</text>
      <text x="30" y="24" class="tufte-tiny">코드 검증·실험</text>
    </g>

    <g transform="translate(285, 38)">
      <!-- Reason 3: Open Source -->
      <circle cx="12" cy="12" r="10" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" class="tufte-tiny" style="font-weight:bold;">3</text>
      <text x="30" y="10" class="tufte-tiny" style="font-weight:bold;">오픈소스</text>
      <text x="30" y="24" class="tufte-tiny">GitHub 생태계</text>
    </g>

    <g transform="translate(420, 38)">
      <!-- Reason 4: Reproducibility -->
      <circle cx="12" cy="12" r="10" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" class="tufte-tiny" style="font-weight:bold;">4</text>
      <text x="30" y="10" class="tufte-tiny" style="font-weight:bold;">재현가능 연구</text>
      <text x="30" y="24" class="tufte-tiny">과학적 신뢰성</text>
    </g>
  </g>

</svg>
