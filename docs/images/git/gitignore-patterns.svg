<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 650 290">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: Consolas, 'Courier New', monospace; fill: #333; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-size: 11px; }
    </style>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="650" height="320" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="325" y="28" text-anchor="middle" class="tufte-text" font-size="16" font-weight="bold">.gitignore 패턴 매칭</text> -->

  <!-- Pattern Section 1: Wildcards -->
  <rect x="30" y="50" width="190" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="125" y="70" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">와일드카드</text>
  
  <text x="45" y="95" class="tufte-mono" font-size="11">*.dat</text>
  <text x="130" y="95" class="tufte-label">→ 모든 .dat 파일</text>
  
  <text x="45" y="115" class="tufte-mono" font-size="11">*.pyc</text>
  <text x="130" y="115" class="tufte-label">→ 모든 .pyc 파일</text>
  
  <text x="45" y="140" class="tufte-mono" font-size="11">**/*.csv</text>
  <text x="130" y="140" class="tufte-label">→ 모든 하위</text>
  <text x="145" y="155" class="tufte-label">디렉터리 .csv</text>

  <!-- Pattern Section 2: Directories -->
  <rect x="230" y="50" width="190" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="325" y="70" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">디렉터리</text>
  
  <text x="245" y="95" class="tufte-mono" font-size="11">results/</text>
  <text x="320" y="95" class="tufte-label">→ results 전체</text>
  
  <text x="245" y="120" class="tufte-mono" font-size="11">data/temp/</text>
  <text x="330" y="120" class="tufte-label">→ 특정 경로</text>
  
  <text x="245" y="145" class="tufte-mono" font-size="11">**/cache/</text>
  <text x="330" y="145" class="tufte-label">→ 모든 cache</text>
  <text x="345" y="160" class="tufte-label">디렉터리</text>

  <!-- Pattern Section 3: Negation -->
  <rect x="430" y="50" width="190" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="525" y="70" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">부정 패턴 (!)</text>
  
  <text x="445" y="95" class="tufte-mono" font-size="11">*.data</text>
  <text x="445" y="115" class="tufte-mono" font-size="11">!final.data</text>
  <text x="445" y="140" class="tufte-label" fill="#333">↑ final.data만</text>
  <text x="455" y="155" class="tufte-label" fill="#333">추적 (예외)</text>

  <!-- Example Section -->
  <rect x="30" y="185" width="285" height="120" fill="#f8f8f8" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="172" y="205" text-anchor="middle" class="tufte-text" font-size="12" font-weight="bold">.gitignore 예시</text>
  
  <text x="45" y="228" class="tufte-mono" font-size="10"># 컴파일 결과물</text>
  <text x="45" y="243" class="tufte-mono" font-size="10">*.pyc</text>
  <text x="45" y="258" class="tufte-mono" font-size="10">__pycache__/</text>
  <text x="45" y="278" class="tufte-mono" font-size="10"># 데이터 파일</text>
  <text x="45" y="293" class="tufte-mono" font-size="10">*.dat</text>
  
  <text x="170" y="228" class="tufte-mono" font-size="10"># 결과 폴더</text>
  <text x="170" y="243" class="tufte-mono" font-size="10">results/</text>
  <text x="170" y="258" class="tufte-mono" font-size="10">!results/README.md</text>
  <text x="170" y="278" class="tufte-mono" font-size="10"># 환경 설정</text>
  <text x="170" y="293" class="tufte-mono" font-size="10">.env</text>

  <!-- Result Section -->
  <rect x="335" y="185" width="285" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
  <text x="477" y="205" text-anchor="middle" class="tufte-text" font-size="12" font-weight="bold">매칭 결과</text>
  
  <text x="350" y="228" class="tufte-label">무시됨:</text>
  <text x="400" y="228" class="tufte-mono" font-size="10" fill="#888">data.pyc</text>
  <text x="400" y="243" class="tufte-mono" font-size="10" fill="#888">analysis.dat</text>
  <text x="400" y="258" class="tufte-mono" font-size="10" fill="#888">results/output.csv</text>
  
  <text x="350" y="283" class="tufte-label">추적됨:</text>
  <text x="400" y="283" class="tufte-mono" font-size="10" fill="#333">main.py</text>
  <text x="520" y="228" class="tufte-mono" font-size="10" fill="#888">__pycache__/</text>
  <text x="520" y="243" class="tufte-mono" font-size="10" fill="#888">.env</text>
  <text x="500" y="283" class="tufte-mono" font-size="10" fill="#333">results/README.md</text>
</svg>
