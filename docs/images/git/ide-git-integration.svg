<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 700 280">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="350" y="28" text-anchor="middle" class="tufte-text" font-size="15" font-weight="bold">Git 작업 방식: CLI vs IDE 통합</text> -->

  <!-- ========== 왼쪽: CLI 방식 ========== -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="300" height="250" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="5"/>
    <text x="150" y="25" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">명령줄 인터페이스 (CLI)</text>
    <line x1="20" y1="35" x2="280" y2="35" stroke="#ccc" stroke-width="1"/>

    <!-- 터미널 시뮬레이션 -->
    <rect x="15" y="45" width="270" height="120" fill="#2d2d2d" stroke="#555" stroke-width="1" rx="3"/>
    <text x="25" y="65" class="tufte-mono" font-size="10" fill="#0f0">$ git status</text>
    <text x="25" y="82" class="tufte-mono" font-size="9" fill="#ccc">modified: mars.txt</text>
    <text x="25" y="99" class="tufte-mono" font-size="10" fill="#0f0">$ git add mars.txt</text>
    <text x="25" y="116" class="tufte-mono" font-size="10" fill="#0f0">$ git commit -m "Update"</text>
    <text x="25" y="133" class="tufte-mono" font-size="10" fill="#0f0">$ git push origin main</text>
    <text x="25" y="155" class="tufte-mono" font-size="9" fill="#888">_</text>

    <text x="20" y="185" class="tufte-label" font-size="11" font-weight="bold">특징</text>
    <text x="20" y="202" class="tufte-label" font-size="10">• 모든 Git 기능 사용 가능</text>
    <text x="20" y="217" class="tufte-label" font-size="10">• 스크립트/자동화 용이</text>
    <text x="20" y="232" class="tufte-label" font-size="10">• 학습 곡선 있음</text>
    <text x="20" y="247" class="tufte-label" font-size="10">• 서버 환경에서 필수</text>
  </g>

  <!-- 중앙 화살표 -->
  <g transform="translate(340, 170)">
    <line x1="-10" y1="0" x2="20" y2="0" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="20" y1="0" x2="0" y2="0" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)" transform="translate(20,0) scale(-1,1)"/>
    <text x="10" y="-10" text-anchor="middle" class="tufte-label" font-size="10">상호</text>
    <text x="10" y="20" text-anchor="middle" class="tufte-label" font-size="10">보완</text>
  </g>

  <!-- ========== 오른쪽: IDE 통합 ========== -->
  <g transform="translate(370, 50)">
    <rect x="0" y="0" width="300" height="250" fill="#f0f0f0" stroke="#666" stroke-width="1.5" rx="5"/>
    <text x="150" y="25" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">IDE Git 통합 (시각적 방식)</text>
    <line x1="20" y1="35" x2="280" y2="35" stroke="#ccc" stroke-width="1"/>

    <!-- IDE Git 패널 시뮬레이션 -->
    <rect x="15" y="45" width="270" height="120" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>

    <!-- Git 패널 헤더 -->
    <rect x="15" y="45" width="270" height="20" fill="#e0e0e0" stroke="none" rx="3"/>
    <text x="25" y="59" class="tufte-mono" font-size="9" fill="#333">Git</text>
    <rect x="245" y="49" width="12" height="12" fill="#888" rx="2"/>
    <rect x="260" y="49" width="12" height="12" fill="#888" rx="2"/>

    <!-- 파일 목록 -->
    <rect x="20" y="70" width="12" height="12" fill="none" stroke="#666" stroke-width="1"/>
    <text x="38" y="80" class="tufte-mono" font-size="9" fill="#333">M  mars.txt</text>
    <text x="220" y="80" class="tufte-label" font-size="8" fill="#888">Staged</text>

    <!-- Diff 표시 -->
    <rect x="20" y="90" width="255" height="40" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
    <text x="25" y="103" class="tufte-mono" font-size="8" fill="#888">- old line</text>
    <text x="25" y="115" class="tufte-mono" font-size="8" fill="#555">+ new line added</text>
    <text x="25" y="127" class="tufte-mono" font-size="8" fill="#555">+ another change</text>

    <!-- 커밋 메시지 입력 -->
    <rect x="20" y="135" width="255" height="25" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <text x="25" y="152" class="tufte-mono" font-size="9" fill="#999">커밋 메시지 입력...</text>

    <text x="20" y="185" class="tufte-label" font-size="11" font-weight="bold">특징</text>
    <text x="20" y="202" class="tufte-label" font-size="10">• 시각적 diff 비교</text>
    <text x="20" y="217" class="tufte-label" font-size="10">• 클릭으로 stage/unstage</text>
    <text x="20" y="232" class="tufte-label" font-size="10">• 커밋 이력 그래프</text>
    <text x="20" y="247" class="tufte-label" font-size="10">• RStudio, VS Code, Positron</text>
  </g>

</svg>
