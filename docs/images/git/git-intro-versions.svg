<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 480 360">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 16px; font-weight: bold; }
      .tufte-small { font-size: 14px; fill: #666; }
      .tufte-caption { font-size: 14px; fill: #888; }
      .doc-line { stroke: #333; stroke-width: 1.5; }
      .add-line { stroke: #555; stroke-width: 1.5; stroke-dasharray: 6,2; }
      .del-line { stroke: #999; stroke-width: 1.5; stroke-dasharray: 2,2; }
      .arrow-line { stroke: #666; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="-5" width="480" height="380" fill="#ffffff"/>

  <!-- 원본 문서 (왼쪽 중앙) -->
  <g transform="translate(30, 125)">
    <rect x="0" y="0" width="110" height="130" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="55" y="-12" text-anchor="middle" class="tufte-text tufte-label">원본</text>
    <line x1="18" y1="28" x2="92" y2="28" class="doc-line"/>
    <line x1="18" y1="40" x2="92" y2="40" class="doc-line"/>
    <line x1="18" y1="52" x2="92" y2="52" class="doc-line"/>
    <line x1="18" y1="68" x2="92" y2="68" class="doc-line"/>
  </g>

  <!-- 버전 1 (오른쪽 상단) -->
  <g transform="translate(310, 30)">
    <rect x="0" y="0" width="110" height="130" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="55" y="-12" text-anchor="middle" class="tufte-text tufte-label">버전 1</text>
    <line x1="18" y1="28" x2="92" y2="28" class="doc-line"/>
    <line x1="18" y1="40" x2="92" y2="40" class="doc-line"/>
    <line x1="18" y1="52" x2="92" y2="52" class="doc-line"/>
    <line x1="18" y1="68" x2="92" y2="68" class="add-line"/>
    <text x="55" y="92" text-anchor="middle" class="tufte-text tufte-small">+ 추가</text>
  </g>

  <!-- 버전 2 (오른쪽 하단) -->
  <g transform="translate(310, 210)">
    <rect x="0" y="0" width="110" height="130" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="55" y="-12" text-anchor="middle" class="tufte-text tufte-label">버전 2</text>
    <line x1="18" y1="28" x2="92" y2="28" class="doc-line"/>
    <line x1="18" y1="40" x2="92" y2="40" class="doc-line"/>
    <line x1="18" y1="52" x2="92" y2="52" class="doc-line"/>
    <line x1="18" y1="68" x2="92" y2="68" class="del-line"/>
    <line x1="18" y1="80" x2="92" y2="80" class="del-line"/>
    <text x="55" y="104" text-anchor="middle" class="tufte-text tufte-small">− 삭제</text>
  </g>

  <!-- 화살표: 원본 → 버전 1 -->
  <g>
    <path d="M150,175 Q210,110 300,90" fill="none" class="arrow-line" marker-end="url(#arrow)"/>
    <rect x="185" y="105" width="65" height="28" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="217" y="124" text-anchor="middle" class="tufte-text" style="font-size:13px;">변경 1</text>
  </g>

  <!-- 화살표: 원본 → 버전 2 -->
  <g>
    <path d="M150,210 Q210,270 300,275" fill="none" class="arrow-line" marker-end="url(#arrow)"/>
    <rect x="185" y="248" width="65" height="28" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="217" y="267" text-anchor="middle" class="tufte-text" style="font-size:13px;">변경 2</text>
  </g>

  <!-- 하단 설명 -->
  <!-- <text x="240" y="365" text-anchor="middle" class="tufte-text tufte-caption">하나의 원본에서 여러 버전이 갈라질 수 있다</text> -->

</svg>
