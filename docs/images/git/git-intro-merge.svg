<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 16px; font-weight: bold; }
      .tufte-small { font-size: 14px; fill: #666; }
      .tufte-caption { font-size: 14px; fill: #888; }
      .doc-line { stroke: #333; stroke-width: 1.5; }
      .add-line { stroke: #555; stroke-width: 1.5; stroke-dasharray: 6,2; }
      .del-line { stroke: #999; stroke-width: 1.5; stroke-dasharray: 2,2; }
      .arrow-line { stroke: #666; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="480" height="400" fill="#ffffff"/>

  <!-- 버전 A (왼쪽 상단) -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="110" height="125" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="55" y="-12" text-anchor="middle" class="tufte-text tufte-label">버전 A</text>
    <line x1="18" y1="28" x2="92" y2="28" class="doc-line"/>
    <line x1="18" y1="40" x2="92" y2="40" class="doc-line"/>
    <line x1="18" y1="52" x2="92" y2="52" class="doc-line"/>
    <line x1="18" y1="68" x2="92" y2="68" class="add-line"/>
    <text x="55" y="95" text-anchor="middle" class="tufte-text tufte-small">+ 기능 A</text>
  </g>

  <!-- 버전 B (왼쪽 하단) -->
  <g transform="translate(30, 235)">
    <rect x="0" y="0" width="110" height="125" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="55" y="-12" text-anchor="middle" class="tufte-text tufte-label">버전 B</text>
    <line x1="18" y1="28" x2="92" y2="28" class="doc-line"/>
    <line x1="18" y1="40" x2="92" y2="40" class="doc-line"/>
    <line x1="18" y1="52" x2="92" y2="52" class="doc-line"/>
    <line x1="18" y1="68" x2="92" y2="68" class="del-line"/>
    <line x1="18" y1="80" x2="92" y2="80" class="del-line"/>
    <text x="55" y="105" text-anchor="middle" class="tufte-text tufte-small">+ 기능 B</text>
  </g>

  <!-- 병합 결과 (오른쪽 중앙) -->
  <g transform="translate(325, 130)">
    <rect x="0" y="0" width="125" height="145" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="2"/>
    <text x="62" y="-12" text-anchor="middle" class="tufte-text tufte-label">병합 결과</text>
    <line x1="18" y1="28" x2="107" y2="28" class="doc-line"/>
    <line x1="18" y1="40" x2="107" y2="40" class="doc-line"/>
    <line x1="18" y1="52" x2="107" y2="52" class="doc-line"/>
    <line x1="18" y1="68" x2="107" y2="68" class="add-line"/>
    <line x1="18" y1="84" x2="107" y2="84" class="del-line"/>
    <line x1="18" y1="96" x2="107" y2="96" class="del-line"/>
    <text x="62" y="122" text-anchor="middle" class="tufte-text tufte-small">A + B 통합</text>
  </g>

  <!-- 화살표: 버전 A → 병합 결과 -->
  <g>
    <path d="M150,100 Q230,120 315,185" fill="none" class="arrow-line" marker-end="url(#arrow)"/>
    <rect x="195" y="105" width="55" height="28" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="222" y="124" text-anchor="middle" class="tufte-text" style="font-size:13px;">병합</text>
  </g>

  <!-- 화살표: 버전 B → 병합 결과 -->
  <g>
    <path d="M150,295 Q230,280 315,220" fill="none" class="arrow-line" marker-end="url(#arrow)"/>
    <rect x="195" y="262" width="55" height="28" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="222" y="281" text-anchor="middle" class="tufte-text" style="font-size:13px;">병합</text>
  </g>

  <!-- 하단 설명 -->
  <!-- <text x="240" y="385" text-anchor="middle" class="tufte-text tufte-caption">두 버전의 변경 사항을 하나로 합친다</text> -->

</svg>
