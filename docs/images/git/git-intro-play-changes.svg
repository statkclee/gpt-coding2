<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 16px; font-weight: bold; }
      .tufte-small { font-size: 14px; fill: #666; }
      .tufte-caption { font-size: 14px; fill: #888; }
      .doc-line { stroke: #333; stroke-width: 1.5; }
      .change-line { stroke: #666; stroke-width: 1.5; stroke-dasharray: 4,2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="200" fill="#ffffff"/>

  <!-- 첫 번째 문서: 원본 -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="100" height="120" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="50" y="-12" text-anchor="middle" class="tufte-text tufte-label">원본</text>
    <line x1="15" y1="25" x2="85" y2="25" class="doc-line"/>
    <line x1="15" y1="37" x2="85" y2="37" class="doc-line"/>
    <line x1="15" y1="49" x2="85" y2="49" class="doc-line"/>
    <line x1="15" y1="66" x2="85" y2="66" class="doc-line"/>
  </g>

  <!-- 화살표 1 -->
  <g transform="translate(145, 80)">
    <rect x="0" y="0" width="60" height="32" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="30" y="21" text-anchor="middle" class="tufte-text" style="font-size:13px;">변경 1</text>
    <line x1="66" y1="16" x2="95" y2="16" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 두 번째 문서: 버전 1 -->
  <g transform="translate(255, 35)">
    <rect x="0" y="0" width="100" height="120" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="50" y="-12" text-anchor="middle" class="tufte-text tufte-label">버전 1</text>
    <line x1="15" y1="25" x2="85" y2="25" class="doc-line"/>
    <line x1="15" y1="37" x2="85" y2="37" class="doc-line"/>
    <line x1="15" y1="49" x2="85" y2="49" class="doc-line"/>
    <line x1="15" y1="66" x2="85" y2="66" class="change-line"/>
  </g>

  <!-- 화살표 2 -->
  <g transform="translate(370, 80)">
    <rect x="0" y="0" width="60" height="32" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="30" y="21" text-anchor="middle" class="tufte-text" style="font-size:13px;">변경 2</text>
    <line x1="66" y1="16" x2="95" y2="16" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 세 번째 문서: 버전 2 -->
  <g transform="translate(480, 35)">
    <rect x="0" y="0" width="100" height="120" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="50" y="-12" text-anchor="middle" class="tufte-text tufte-label">버전 2</text>
    <line x1="15" y1="25" x2="85" y2="25" class="doc-line"/>
    <line x1="15" y1="37" x2="85" y2="37" class="doc-line"/>
    <line x1="15" y1="49" x2="85" y2="49" class="doc-line"/>
    <line x1="15" y1="66" x2="85" y2="66" class="change-line"/>
    <line x1="15" y1="78" x2="85" y2="78" class="change-line"/>
    <line x1="15" y1="90" x2="85" y2="90" class="change-line"/>
  </g>

  <!-- 하단 설명 -->
  <!-- <text x="325" y="185" text-anchor="middle" class="tufte-text tufte-caption">변경 사항이 순차적으로 저장된다</text> -->

</svg>
