<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 30 750 370">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: Consolas, 'Courier New', monospace; fill: #333; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-size: 11px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="-15" y="0" width="770" height="420" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="375" y="28" text-anchor="middle" class="tufte-text" font-size="16" font-weight="bold">Git 되돌리기 명령어 비교</text> -->

  <!-- Divider lines -->
  <line x1="250" y1="45" x2="250" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="500" y1="45" x2="500" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === Column 1: git restore === -->
  <text x="125" y="58" text-anchor="middle" class="tufte-mono" font-size="14" font-weight="bold">git restore</text>
  <text x="125" y="78" text-anchor="middle" class="tufte-text" font-size="12" fill="#666">"청소하기"</text>

  <!-- Diagram -->
  <rect x="35" y="95" width="180" height="120" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="4"/>

  <!-- File icon -->
  <g transform="translate(50, 10)">
    <path d="M80,115 L130,115 L145,130 L145,185 L80,185 Z" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <line x1="130" y1="115" x2="130" y2="130" stroke="#666" stroke-width="1"/>
    <line x1="130" y1="130" x2="145" y2="130" stroke="#666" stroke-width="1"/>
    <text x="112" y="155" text-anchor="middle" class="tufte-label" font-size="10">수정됨</text>

    <!-- Arrow back -->
    <path d="M75,150 Q50,150 50,125 Q50,105 80,105" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="40" y="125" text-anchor="end" class="tufte-label" font-size="9">원상복구</text>
  </g>

  <!-- Quote -->
  <rect x="35" y="225" width="180" height="35" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="125" y="247" text-anchor="middle" class="tufte-text" font-size="11" font-style="italic">"아직 커밋 안 했어!"</text>

  <!-- Description -->
  <text x="40" y="280" class="tufte-text" font-size="10">방금 작성하던 파일이</text>
  <text x="40" y="295" class="tufte-text" font-size="10">맘에 안 들어서, 저장하기</text>
  <text x="40" y="310" class="tufte-text" font-size="10">전 상태로 덮어씌울 때</text>

  <!-- History impact -->
  <rect x="35" y="330" width="180" height="55" fill="#f8f8f8" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="125" y="350" text-anchor="middle" class="tufte-label" font-size="10" font-weight="bold">이력 영향</text>
  <text x="125" y="370" text-anchor="middle" class="tufte-text" font-size="11">없음</text>

  <!-- === Column 2: git reset === -->
  <text x="375" y="58" text-anchor="middle" class="tufte-mono" font-size="14" font-weight="bold">git reset</text>
  <text x="375" y="78" text-anchor="middle" class="tufte-text" font-size="12" fill="#666">"타임머신"</text>

  <!-- Diagram -->
  <rect x="285" y="95" width="180" height="120" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="4"/>

  <!-- Commit chain -->
  <circle cx="315" cy="155" r="12" fill="#e0e0e0" stroke="#666" stroke-width="1.5"/>
  <text x="315" y="159" text-anchor="middle" class="tufte-mono" font-size="8">v1</text>

  <line x1="327" y1="155" x2="353" y2="155" stroke="#666" stroke-width="1.5"/>

  <circle cx="365" cy="155" r="12" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="365" y="159" text-anchor="middle" class="tufte-mono" font-size="8" fill="#999">v2</text>

  <line x1="377" y1="155" x2="403" y2="155" stroke="#ccc" stroke-width="1"/>

  <circle cx="415" cy="155" r="12" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="415" y="159" text-anchor="middle" class="tufte-mono" font-size="8" fill="#999">v3</text>

  <!-- Cut line -->
  <line x1="345" y1="130" x2="345" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="345" y="125" text-anchor="middle" class="tufte-label" font-size="9">싹둑</text>
  <text x="390" y="195" text-anchor="middle" class="tufte-label" font-size="9" fill="#666">이후 기록 삭제</text>

  <!-- Quote -->
  <rect x="285" y="225" width="180" height="35" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="375" y="247" text-anchor="middle" class="tufte-text" font-size="11" font-style="italic">"나 혼자만 볼 거야!"</text>

  <!-- Description -->
  <text x="290" y="280" class="tufte-text" font-size="10">시간을 되돌려서 그 이후의</text>
  <text x="290" y="295" class="tufte-text" font-size="10">미래를 잘라버림. 이미 공유</text>
  <text x="290" y="310" class="tufte-text" font-size="10">(Push)했으면 충돌 발생!</text>

  <!-- History impact -->
  <rect x="285" y="330" width="180" height="55" fill="#f8f8f8" stroke="#999" stroke-width="1.5" rx="3"/>
  <text x="375" y="350" text-anchor="middle" class="tufte-label" font-size="10" font-weight="bold">이력 영향</text>
  <text x="375" y="370" text-anchor="middle" class="tufte-text" font-size="11">기록 삭제 (주의)</text>

  <!-- === Column 3: git revert === -->
  <text x="625" y="58" text-anchor="middle" class="tufte-mono" font-size="14" font-weight="bold">git revert</text>
  <text x="625" y="78" text-anchor="middle" class="tufte-text" font-size="12" fill="#666">"반성문 쓰기"</text>

  <!-- Diagram -->
  <rect x="535" y="95" width="180" height="120" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="4"/>

  <!-- Commit chain -->
  <circle cx="565" cy="155" r="12" fill="#e0e0e0" stroke="#666" stroke-width="1.5"/>
  <text x="565" y="159" text-anchor="middle" class="tufte-mono" font-size="8">v1</text>

  <line x1="577" y1="155" x2="603" y2="155" stroke="#666" stroke-width="1.5"/>

  <circle cx="615" cy="155" r="12" fill="#e0e0e0" stroke="#666" stroke-width="1.5"/>
  <text x="615" y="159" text-anchor="middle" class="tufte-mono" font-size="8">Bad</text>

  <line x1="627" y1="155" x2="653" y2="155" stroke="#666" stroke-width="1.5"/>

  <circle cx="665" cy="155" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="665" y="159" text-anchor="middle" class="tufte-mono" font-size="8">Fix</text>

  <!-- Revert arrow -->
  <path d="M665,140 Q640,115 615,140" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="640" y="110" text-anchor="middle" class="tufte-label" font-size="9">상쇄</text>

  <!-- Quote -->
  <rect x="535" y="225" width="180" height="35" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="625" y="247" text-anchor="middle" class="tufte-text" font-size="11" font-style="italic">"이미 다 봐버렸네..."</text>

  <!-- Description -->
  <text x="540" y="280" class="tufte-text" font-size="10">실수를 지우는 게 아니라,</text>
  <text x="540" y="295" class="tufte-text" font-size="10">"취소합니다"라는 새 커밋</text>
  <text x="540" y="310" class="tufte-text" font-size="10">추가. 서버 공유 후 안전</text>

  <!-- History impact -->
  <rect x="535" y="330" width="180" height="55" fill="#f8f8f8" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="625" y="350" text-anchor="middle" class="tufte-label" font-size="10" font-weight="bold">이력 영향</text>
  <text x="625" y="370" text-anchor="middle" class="tufte-text" font-size="11">기록 추가 (안전)</text>
</svg>