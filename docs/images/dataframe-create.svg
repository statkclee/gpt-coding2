<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 720 280">
  <defs>
    <style>
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>

  <!-- Left side: Data Sources -->
  <g transform="translate(30, 50)">
    <text x="100" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">데이터 소스</text>

    <!-- Dictionary -->
    <rect x="0" y="15" width="200" height="55" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="100" y="35" text-anchor="middle" class="tufte-label">딕셔너리</text>
    <text x="100" y="52" text-anchor="middle" class="tufte-code">{'name': [...], 'age': [...]}</text>
    <text x="100" y="65" text-anchor="middle" class="tufte-small">열 단위 데이터</text>

    <!-- List of lists -->
    <rect x="0" y="80" width="200" height="55" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="100" y="100" text-anchor="middle" class="tufte-label">리스트의 리스트</text>
    <text x="100" y="117" text-anchor="middle" class="tufte-code">[['Alice', 25], ['Bob', 30]]</text>
    <text x="100" y="130" text-anchor="middle" class="tufte-small">행 단위 데이터</text>

    <!-- CSV -->
    <rect x="0" y="145" width="200" height="55" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="100" y="165" text-anchor="middle" class="tufte-label">CSV 파일</text>
    <text x="100" y="182" text-anchor="middle" class="tufte-code">pd.read_csv('file.csv')</text>
    <text x="100" y="195" text-anchor="middle" class="tufte-small">가장 흔한 방법</text>

    <!-- Other sources -->
    <rect x="0" y="210" width="200" height="45" fill="#e8e8e8" stroke="#999" rx="3"/>
    <text x="100" y="228" text-anchor="middle" class="tufte-small">Excel, JSON, SQL, ...</text>
    <text x="100" y="243" text-anchor="middle" class="tufte-code">read_excel, read_json, ...</text>
  </g>

  <!-- Arrows -->
  <line x1="245" y1="90" x2="300" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="245" y1="155" x2="300" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="245" y1="220" x2="300" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="245" y1="280" x2="300" y2="165" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>

  <!-- Center: DataFrame -->
  <g transform="translate(315, 85)">
    <rect x="0" y="0" width="180" height="140" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="5"/>
    <text x="90" y="25" text-anchor="middle" class="tufte-label" font-weight="bold">pandas DataFrame</text>
    <line x1="10" y1="35" x2="170" y2="35" stroke="#ccc"/>

    <!-- Mini table -->
    <text x="30" y="55" class="tufte-code">name</text>
    <text x="85" y="55" class="tufte-code">age</text>
    <text x="135" y="55" class="tufte-code">city</text>

    <line x1="20" y1="62" x2="160" y2="62" stroke="#ccc"/>

    <text x="30" y="77" class="tufte-code">Alice</text>
    <text x="90" y="77" class="tufte-code">25</text>
    <text x="130" y="77" class="tufte-code">Seoul</text>

    <text x="30" y="92" class="tufte-code">Bob</text>
    <text x="90" y="92" class="tufte-code">30</text>
    <text x="130" y="92" class="tufte-code">Busan</text>

    <text x="30" y="107" class="tufte-code">Charlie</text>
    <text x="90" y="107" class="tufte-code">35</text>
    <text x="130" y="107" class="tufte-code">Daegu</text>

    <text x="90" y="130" text-anchor="middle" class="tufte-small">행과 열로 구성된 2차원 표</text>
  </g>

  <!-- Right side: Attributes -->
  <line x1="510" y1="155" x2="545" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g transform="translate(560, 50)">
    <text x="70" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">기본 속성 확인</text>

    <rect x="0" y="15" width="140" height="40" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="32" text-anchor="middle" class="tufte-code">df.shape</text>
    <text x="70" y="48" text-anchor="middle" class="tufte-small">(행 수, 열 수)</text>

    <rect x="0" y="65" width="140" height="40" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="82" text-anchor="middle" class="tufte-code">df.dtypes</text>
    <text x="70" y="98" text-anchor="middle" class="tufte-small">열별 자료형</text>

    <rect x="0" y="115" width="140" height="40" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="132" text-anchor="middle" class="tufte-code">df.columns</text>
    <text x="70" y="148" text-anchor="middle" class="tufte-small">열 이름 목록</text>

    <rect x="0" y="165" width="140" height="40" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="70" y="182" text-anchor="middle" class="tufte-code">df.info()</text>
    <text x="70" y="198" text-anchor="middle" class="tufte-small">전체 요약 정보</text>
  </g>

</svg>
