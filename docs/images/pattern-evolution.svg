<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 800 270">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 9px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 8px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 8px;
        fill: #999;
      }
      .tufte-era {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 8px;
        fill: #999;
        font-style: italic;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <linearGradient id="timeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ccc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <!-- Timeline bar -->
  <rect x="40" y="50" width="720" height="6" fill="url(#timeGradient)" rx="3"/>
  <text x="40" y="42" class="tufte-era">1950s</text>
  <text x="760" y="42" class="tufte-era" text-anchor="end">2020s</text>

  <!-- Stage 1: Assembly → High-level Language -->
  <line x1="80" y1="56" x2="80" y2="75" stroke="#666" stroke-width="1.5"/>
  <rect x="20" y="80" width="120" height="70" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="80" y="100" class="tufte-label" text-anchor="middle">고급 언어</text>
  <line x1="32" y1="108" x2="128" y2="108" stroke="#ddd" stroke-width="1"/>
  <text x="80" y="122" class="tufte-desc" text-anchor="middle">하드웨어 추상화</text>
  <text x="80" y="138" class="tufte-code" text-anchor="middle">C, Pascal, BASIC</text>

  <!-- Arrow -->
  <line x1="140" y1="115" x2="158" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Paradigm -->
  <line x1="230" y1="56" x2="230" y2="75" stroke="#666" stroke-width="1.5"/>
  <rect x="170" y="80" width="120" height="70" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="230" y="100" class="tufte-label" text-anchor="middle">패러다임</text>
  <line x1="182" y1="108" x2="278" y2="108" stroke="#ddd" stroke-width="1"/>
  <text x="230" y="122" class="tufte-desc" text-anchor="middle">사고방식 추상화</text>
  <text x="230" y="138" class="tufte-code" text-anchor="middle">OOP, FP, 반응형</text>

  <!-- Arrow -->
  <line x1="290" y1="115" x2="308" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Pattern/Architecture - emphasized -->
  <line x1="380" y1="56" x2="380" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="315" y="75" width="130" height="80" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="380" y="98" class="tufte-label" text-anchor="middle">패턴/아키텍처</text>
  <line x1="327" y1="108" x2="433" y2="108" stroke="#ccc" stroke-width="1"/>
  <text x="380" y="122" class="tufte-desc" text-anchor="middle">설계 문제 추상화</text>
  <text x="380" y="138" class="tufte-code" text-anchor="middle">GoF, MVC, 계층형</text>

  <!-- Arrow -->
  <line x1="445" y1="115" x2="463" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Framework -->
  <line x1="530" y1="56" x2="530" y2="75" stroke="#666" stroke-width="1.5"/>
  <rect x="470" y="80" width="120" height="70" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="530" y="100" class="tufte-label" text-anchor="middle">프레임워크</text>
  <line x1="482" y1="108" x2="578" y2="108" stroke="#ddd" stroke-width="1"/>
  <text x="530" y="122" class="tufte-desc" text-anchor="middle">구현 추상화</text>
  <text x="530" y="138" class="tufte-code" text-anchor="middle">Django, React</text>

  <!-- Arrow -->
  <line x1="590" y1="115" x2="608" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: AI Collaboration - emphasized -->
  <line x1="690" y1="56" x2="690" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="620" y="75" width="140" height="80" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="690" y="98" class="tufte-label" text-anchor="middle">AI 협업</text>
  <line x1="632" y1="108" x2="748" y2="108" stroke="#ccc" stroke-width="1"/>
  <text x="690" y="122" class="tufte-desc" text-anchor="middle">구현 자체 추상화</text>
  <text x="690" y="138" class="tufte-code" text-anchor="middle">Claude, Copilot</text>

  <!-- Human role evolution section -->
  <g transform="translate(0, -15)">
    <rect x="40" y="185" width="720" height="100" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="400" y="205" class="tufte-title" text-anchor="middle">인간 역할 변화</text>
    <text x="400" y="220" class="tufte-desc" text-anchor="middle" font-style="italic">추상화 수준이 높아질수록 인간은 "무엇을(What)"에 집중하고, "어떻게(How)"는 도구가 담당한다</text>
    <line x1="55" y1="228" x2="745" y2="228" stroke="#ddd" stroke-width="1"/>

    <!-- Role boxes -->
    <rect x="55" y="235" width="100" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2"/>
    <text x="105" y="254" class="tufte-desc" text-anchor="middle">알고리즘 작성</text>

    <line x1="155" y1="249" x2="175" y2="249" stroke="#ccc" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="185" y="235" width="100" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2"/>
    <text x="235" y="254" class="tufte-desc" text-anchor="middle">패러다임 선택</text>

    <line x1="285" y1="249" x2="305" y2="249" stroke="#ccc" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="315" y="232" width="100" height="34" fill="#fff" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="365" y="254" class="tufte-desc" text-anchor="middle">패턴 적용</text>

    <line x1="415" y1="249" x2="435" y2="249" stroke="#ccc" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="445" y="235" width="110" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="2"/>
    <text x="500" y="254" class="tufte-desc" text-anchor="middle">프레임워크 활용</text>

    <line x1="555" y1="249" x2="575" y2="249" stroke="#ccc" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="585" y="232" width="130" height="34" fill="#fff" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="650" y="254" class="tufte-desc" text-anchor="middle">의도 명세 + 검증</text>
  </g>

</svg>
