<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 800 270">
  <defs>
    <style>
      /* Tufte Grayscale Style */
      .title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 15px; font-weight: bold; fill: #222; }
      .section-head { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 13px; font-weight: bold; fill: #333; }
      .label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #333; }
      .note { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 10px; fill: #666; font-style: italic; }
      .mono { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 10px; fill: #444; }
      .branch { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 9px; font-weight: bold; }

      .box-process { fill: #fff; stroke: #444; stroke-width: 1.2; }
      .box-decision { fill: #fff; stroke: #444; stroke-width: 1.2; }
      .box-section { fill: none; stroke: #bbb; stroke-width: 1; stroke-dasharray: 5 3; }

      .flow { stroke: #444; stroke-width: 1.3; fill: none; }
      .flow-false { stroke: #888; stroke-width: 1.3; stroke-dasharray: 4 2; fill: none; }

      .arrow { fill: #444; }
      .arrow-light { fill: #888; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" class="arrow" />
    </marker>
    <marker id="arr-light" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" class="arrow-light" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" fill="#fff" />

  <!-- Title -->
  <!-- <text x="400" y="26" text-anchor="middle" class="title">뵘-야코피니 정리(Böhm-Jacopini, 1966): 제어 흐름의 세 가지 기본 구조</text> -->

  <!-- ========================================== -->
  <!-- 1. SEQUENCE (순차) -->
  <!-- ========================================== -->
  <g transform="translate(45, 50)">
    <text x="105" y="0" text-anchor="middle" class="section-head">순차 (Sequence)</text>
    <rect x="0" y="12" width="210" height="195" class="box-section" rx="4"/>

    <g transform="translate(55, 35)">
      <!-- Entry -->
      <circle cx="50" cy="0" r="4" fill="#444"/>
      <line x1="50" y1="4" x2="50" y2="18" class="flow" marker-end="url(#arr)"/>

      <!-- A -->
      <rect x="0" y="22" width="100" height="32" class="box-process" rx="2"/>
      <text x="50" y="43" text-anchor="middle" class="mono">명령 A</text>

      <line x1="50" y1="54" x2="50" y2="72" class="flow" marker-end="url(#arr)"/>

      <!-- B -->
      <rect x="0" y="76" width="100" height="32" class="box-process" rx="2"/>
      <text x="50" y="97" text-anchor="middle" class="mono">명령 B</text>

      <line x1="50" y1="108" x2="50" y2="126" class="flow" marker-end="url(#arr)"/>

      <!-- C -->
      <rect x="0" y="130" width="100" height="32" class="box-process" rx="2"/>
      <text x="50" y="151" text-anchor="middle" class="mono">명령 C</text>
    </g>

    <text x="105" y="225" text-anchor="middle" class="note">"위에서 아래로, 한 줄씩"</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. SELECTION (선택/분기) -->
  <!-- ========================================== -->
  <g transform="translate(295, 50)">
    <text x="105" y="0" text-anchor="middle" class="section-head">선택 (Selection)</text>
    <rect x="0" y="12" width="210" height="195" class="box-section" rx="4"/>

    <g transform="translate(30, 35)">
      <!-- Entry -->
      <circle cx="75" cy="0" r="4" fill="#444"/>
      <line x1="75" y1="4" x2="75" y2="18" class="flow" marker-end="url(#arr)"/>

      <!-- Decision Diamond -->
      <polygon points="75,22 130,52 75,82 20,52" class="box-decision"/>
      <text x="75" y="57" text-anchor="middle" class="mono">조건?</text>

      <!-- True Path (Left) -->
      <line x1="47" y1="67" x2="47" y2="95" class="flow" marker-end="url(#arr)"/>
      <text x="32" y="85" class="branch" fill="#333">참</text>

      <rect x="12" y="99" width="50" height="28" class="box-process" rx="2"/>
      <text x="38" y="115" text-anchor="middle" class="mono">명령 A</text>

      <!-- False Path (Right) -->
      <line x1="103" y1="67" x2="103" y2="95" class="flow-false" marker-end="url(#arr-light)"/>
      <text x="115" y="85" class="branch" fill="#888">거짓</text>

      <rect x="75" y="99" width="50" height="28" class="box-process" rx="2"/>
      <text x="98" y="115" text-anchor="middle" class="mono">명령 B</text>

      <!-- Merge -->
      <line x1="47" y1="127" x2="47" y2="145" class="flow"/>
      <line x1="103" y1="127" x2="103" y2="145" class="flow-false"/>
      <line x1="47" y1="145" x2="103" y2="145" stroke="#444" stroke-width="1.3"/>
      <circle cx="75" cy="145" r="3" fill="#444"/>
      <line x1="75" y1="148" x2="75" y2="165" class="flow" marker-end="url(#arr)"/>
    </g>

    <text x="105" y="225" text-anchor="middle" class="note">"조건에 따라 경로 분기 (if-else)"</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. ITERATION (반복) -->
  <!-- ========================================== -->
  <g transform="translate(545, 50)">
    <text x="105" y="0" text-anchor="middle" class="section-head">반복 (Iteration)</text>
    <rect x="0" y="12" width="210" height="195" class="box-section" rx="4"/>

    <g transform="translate(30, 35)">
      <!-- Entry -->
      <circle cx="75" cy="0" r="4" fill="#444"/>
      <line x1="75" y1="4" x2="75" y2="18" class="flow" marker-end="url(#arr)"/>

      <!-- Decision Diamond -->
      <polygon points="75,22 130,52 75,82 20,52" class="box-decision"/>
      <text x="75" y="57" text-anchor="middle" class="mono">조건?</text>

      <!-- True (Loop Body) -->
      <line x1="47" y1="67" x2="47" y2="95" class="flow" marker-end="url(#arr)"/>
      <text x="32" y="85" class="branch" fill="#333">참</text>

      <rect x="12" y="99" width="70" height="28" class="box-process" rx="2"/>
      <text x="47" y="118" text-anchor="middle" class="mono">본문</text>

      <!-- Loop Back Arrow -->
      <path d="M 47 127 L 47 142 L 8 142 L 8 52 L 20 52" class="flow" fill="none" marker-end="url(#arr)"/>

      <!-- False (Exit) -->
      <line x1="103" y1="67" x2="103" y2="155" class="flow-false" marker-end="url(#arr-light)"/>
      <text x="115" y="85" class="branch" fill="#888">거짓</text>
      <text x="103" y="170" text-anchor="middle" class="note">탈출</text>
    </g>

    <text x="105" y="225" text-anchor="middle" class="note">"조건이 참인 동안 반복 (while/for)"</text>
  </g>

  <!-- Bottom Insight Box -->
  <!-- <g transform="translate(45, 280)">
    <rect x="0" y="0" width="710" height="48" fill="#f8f8f8" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="0" y="0" width="4" height="48" fill="#444" rx="2"/>
    <text x="24" y="20" class="label" font-weight="bold" fill="#222">핵심 통찰</text>
    <text x="24" y="38" class="label" fill="#333">
      이 세 가지 구조의 조합만으로 <tspan font-style="italic">모든 계산 가능한 알고리즘</tspan>을 표현할 수 있다. goto 없이도 충분하다.
    </text>
  </g> -->

</svg>
