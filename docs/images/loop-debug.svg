<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 700 180">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 12px; font-weight: bold; }
      .tufte-small { font-size: 11px; fill: #666; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 10px; }
      .error-text { fill: #666; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="210" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="20" text-anchor="middle" class="tufte-text tufte-label">반복문 디버깅: 흔한 오류 3가지</text>
  <line x1="50" y1="30" x2="650" y2="30" stroke="#ccc" stroke-width="1"/>

  <!-- Error 1: 무한 루프 -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="200" height="80" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="100" y="18" text-anchor="middle" class="tufte-text tufte-label">무한 루프</text>
    <line x1="10" y1="25" x2="190" y2="25" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="42" class="tufte-code">while n &gt; 0:</text>
    <text x="10" y="55" class="tufte-code">    print(n)</text>
    <text x="10" y="68" class="tufte-code error-text">    # n -= 1 누락!</text>
    <text x="100" y="78" text-anchor="middle" class="tufte-text tufte-small" fill="#888">갱신 없음 → 종료 불가</text>
  </g>

  <!-- Error 2: Off-by-one -->
  <g transform="translate(250, 45)">
    <rect x="0" y="0" width="200" height="80" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="100" y="18" text-anchor="middle" class="tufte-text tufte-label">하나 차이 오류</text>
    <line x1="10" y1="25" x2="190" y2="25" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="42" class="tufte-code">for i in range(1, 5):</text>
    <text x="10" y="55" class="tufte-code error-text">    # 1,2,3,4 (0 누락)</text>
    <text x="10" y="68" class="tufte-code">for i in range(5):</text>
    <text x="100" y="78" text-anchor="middle" class="tufte-text tufte-small" fill="#888">경계값 &gt; vs &gt;= 혼동</text>
  </g>

  <!-- Error 3: 잘못된 누산기 -->
  <g transform="translate(470, 45)">
    <rect x="0" y="0" width="200" height="80" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="100" y="18" text-anchor="middle" class="tufte-text tufte-label">초기화 위치 오류</text>
    <line x1="10" y1="25" x2="190" y2="25" stroke="#ccc" stroke-width="1"/>
    <text x="10" y="42" class="tufte-code">for x in nums:</text>
    <text x="10" y="55" class="tufte-code error-text">    total = 0  # 루프 안!</text>
    <text x="10" y="68" class="tufte-code">    total += x</text>
    <text x="100" y="78" text-anchor="middle" class="tufte-text tufte-small" fill="#888">매 반복마다 초기화됨</text>
  </g>

  <!-- 디버깅 전략 -->
  <rect x="30" y="140" width="640" height="60" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="350" y="158" text-anchor="middle" class="tufte-text tufte-label">디버깅 전략</text>
  <line x1="50" y1="165" x2="650" y2="165" stroke="#999" stroke-width="1"/>

  <!-- 3 strategies -->
  <g transform="translate(80, 183)">
    <circle cx="0" cy="0" r="12" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" class="tufte-text" font-size="10" font-weight="bold">1</text>
    <text x="20" y="4" class="tufte-text tufte-small">작은 입력으로 테스트</text>
  </g>

  <g transform="translate(280, 183)">
    <circle cx="0" cy="0" r="12" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" class="tufte-text" font-size="10" font-weight="bold">2</text>
    <text x="20" y="4" class="tufte-text tufte-small">print()로 중간값 추적</text>
  </g>

  <g transform="translate(480, 183)">
    <circle cx="0" cy="0" r="12" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" class="tufte-text" font-size="10" font-weight="bold">3</text>
    <text x="20" y="4" class="tufte-text tufte-small">경계값/빈 입력 확인</text>
  </g>

</svg>
