<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 900 310">
  <defs>
    <style>
      .tufte-title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 20px; font-weight: bold; fill: #111; }
      .tufte-subtitle { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 15px; font-weight: bold; fill: #222; }
      .tufte-label { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 12px; font-weight: bold; fill: #333; }
      .tufte-text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 11px; fill: #444; }
      .tufte-small { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 10px; fill: #666; }

      .box-method { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .box-highlight { fill: #f5f5f5; stroke: #111; stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="450" y="35" class="tufte-title" text-anchor="middle">파인튜닝 스펙트럼: 효율과 성능의 균형</text>
  <text x="450" y="58" class="tufte-text" text-anchor="middle" font-style="italic">파라미터 업데이트 비율이 성능과 비용을 결정한다</text> -->

  <!-- Main Axis -->
  <line x1="100" y1="340" x2="800" y2="340" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="345" class="tufte-label">비용 증가 →</text>

  <!-- Tick marks -->
  <line x1="130" y1="335" x2="130" y2="345" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="365" class="tufte-small" text-anchor="middle">0%</text>

  <line x1="420" y1="335" x2="420" y2="345" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="365" class="tufte-small" text-anchor="middle">~1%</text>

  <line x1="750" y1="335" x2="750" y2="345" stroke="#333" stroke-width="1.5"/>
  <text x="750" y="365" class="tufte-small" text-anchor="middle">100%</text>

  <text x="60" y="365" class="tufte-text" text-anchor="middle" fill="#666">학습 파라미터 비율</text>

  <!-- Method 1: Prompt Engineering -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="200" height="200" class="box-method" rx="5"/>
    <text x="100" y="28" class="tufte-subtitle" text-anchor="middle">프롬프트 엔지니어링</text>
    <text x="100" y="48" class="tufte-small" text-anchor="middle" fill="#666">컨텍스트 내 학습</text>
    <line x1="20" y1="58" x2="180" y2="58" stroke="#ddd"/>

    <g transform="translate(25, 75)">
      <text x="0" y="0" class="tufte-label">특징</text>
      <text x="0" y="20" class="tufte-text">• 파라미터 수정 없음</text>
      <text x="0" y="38" class="tufte-text">• 컨텍스트 윈도우 활용</text>
    </g>

    <g transform="translate(25, 135)">
      <text x="0" y="0" class="tufte-label">비용</text>
      <text x="0" y="20" class="tufte-small">• GPU 불필요 (API)</text>
      <text x="0" y="35" class="tufte-small">• 즉시 실행</text>
    </g>

    <g transform="translate(25, 185)">
      <text x="0" y="0" class="tufte-small" fill="#666">적용: 간단한 작업</text>
    </g>
  </g>

  <!-- Method 2: P-Tuning -->
  <g transform="translate(280, 100)">
    <rect x="0" y="0" width="160" height="200" class="box-method" rx="5" stroke-dasharray="3,2"/>
    <text x="80" y="28" class="tufte-subtitle" text-anchor="middle">P-Tuning</text>
    <text x="80" y="48" class="tufte-small" text-anchor="middle" fill="#666">소프트 프롬프트</text>
    <line x1="15" y1="58" x2="145" y2="58" stroke="#ddd"/>

    <g transform="translate(20, 75)">
      <text x="0" y="0" class="tufte-label">특징</text>
      <text x="0" y="20" class="tufte-text">• 가상 토큰만 학습</text>
      <text x="0" y="38" class="tufte-text">• 가중치 고정</text>
    </g>

    <g transform="translate(20, 135)">
      <text x="0" y="0" class="tufte-label">Param: &lt;0.01%</text>
      <text x="0" y="20" class="tufte-small">• GPU 1개</text>
      <text x="0" y="35" class="tufte-small">• 수 시간</text>
    </g>

    <g transform="translate(20, 185)">
      <text x="0" y="0" class="tufte-small" fill="#666">적용: 제한적</text>
    </g>
  </g>

  <!-- Method 3: LoRA (Sweet Spot) -->
  <g transform="translate(470, 90)">
    <rect x="0" y="0" width="200" height="220" class="box-highlight" rx="5"/>
    <text x="100" y="28" class="tufte-subtitle" text-anchor="middle">LoRA (PEFT)</text>
    <text x="100" y="48" class="tufte-label" text-anchor="middle" fill="#111">★ 2024년 표준</text>
    <line x1="20" y1="58" x2="180" y2="58" stroke="#ccc"/>

    <g transform="translate(25, 75)">
      <text x="0" y="0" class="tufte-label">특징</text>
      <text x="0" y="20" class="tufte-text">• 저랭크 행렬 학습</text>
      <text x="0" y="38" class="tufte-text">• 원본 가중치 고정</text>
    </g>

    <g transform="translate(25, 135)">
      <text x="0" y="0" class="tufte-label">Param: 0.1~3%</text>
      <text x="0" y="20" class="tufte-small">• GPU 1-4개</text>
      <text x="0" y="35" class="tufte-small">• 수 시간</text>
    </g>

    <g transform="translate(25, 185)">
      <text x="0" y="0" class="tufte-text" fill="#111" font-weight="bold">전체 파인튜닝 대비 90% 성능</text>
      <text x="0" y="18" class="tufte-text" fill="#111" font-weight="bold">10% 비용</text>
    </g>
  </g>

  <!-- Method 4: Full Fine-tuning -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="170" height="200" class="box-method" rx="5"/>
    <text x="85" y="28" class="tufte-subtitle" text-anchor="middle">전체 파인튜닝</text>
    <line x1="15" y1="40" x2="155" y2="40" stroke="#ddd"/>

    <g transform="translate(20, 58)">
      <text x="0" y="0" class="tufte-label">특징</text>
      <text x="0" y="20" class="tufte-text">• 모든 파라미터</text>
      <text x="0" y="38" class="tufte-text">• 최고 성능</text>
    </g>

    <g transform="translate(20, 118)">
      <text x="0" y="0" class="tufte-label">Param: 100%</text>
      <text x="0" y="20" class="tufte-small">• GPU 수십 개</text>
      <text x="0" y="35" class="tufte-small">• 수일 소요</text>
    </g>

    <g transform="translate(20, 175)">
      <text x="0" y="0" class="tufte-small" fill="#666">적용: 대규모 프로젝트</text>
    </g>
  </g>

</svg>
