<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <defs>
    <style>
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>

  <!-- JSON structure on left -->
  <g transform="translate(30, 20)">
    <text x="120" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">중첩된 JSON 구조</text>

    <rect x="0" y="15" width="260" height="210" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>

    <text x="10" y="38" class="tufte-code">{</text>
    <text x="20" y="55" class="tufte-code">"status": "success",</text>
    <text x="20" y="72" class="tufte-code">"data": {</text>
    <text x="35" y="89" class="tufte-code">"users": [</text>
    <text x="50" y="106" class="tufte-code">{</text>
    <text x="65" y="123" class="tufte-code">"name": "Alice",</text>
    <text x="65" y="140" class="tufte-code">"scores": [85, 90]</text>
    <text x="50" y="157" class="tufte-code">},</text>
    <text x="50" y="174" class="tufte-code">{"name": "Bob", ...}</text>
    <text x="35" y="191" class="tufte-code">]</text>
    <text x="20" y="208" class="tufte-code">}</text>
    <text x="10" y="220" class="tufte-code">}</text>
  </g>

  <!-- Access paths on right -->
  <g transform="translate(350, 20)">
    <text x="160" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">접근 경로</text>

    <rect x="0" y="15" width="340" height="210" fill="#e8e8e8" stroke="#999" rx="3"/>

    <!-- Level 1 -->
    <rect x="15" y="30" width="310" height="35" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="25" y="50" class="tufte-code">data["status"]</text>
    <text x="200" y="50" class="tufte-small">→ "success"</text>

    <!-- Level 2 -->
    <rect x="15" y="75" width="310" height="35" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="25" y="95" class="tufte-code">data["data"]["users"]</text>
    <text x="200" y="95" class="tufte-small">→ [리스트]</text>

    <!-- Level 3 -->
    <rect x="15" y="120" width="310" height="35" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="25" y="140" class="tufte-code">data["data"]["users"][0]</text>
    <text x="220" y="140" class="tufte-small">→ {첫 번째 사용자}</text>

    <!-- Level 4 -->
    <rect x="15" y="165" width="310" height="50" fill="#f5f5f5" stroke="#999" rx="2"/>
    <text x="25" y="185" class="tufte-code">data["data"]["users"][0]["name"]</text>
    <text x="255" y="185" class="tufte-small">→ "Alice"</text>
    <text x="25" y="203" class="tufte-code">data["data"]["users"][0]["scores"][0]</text>
    <text x="280" y="203" class="tufte-small">→ 85</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(30, 250)">
    <rect x="0" y="0" width="660" height="60" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="330" y="18" text-anchor="middle" class="tufte-label" font-weight="bold">안전한 접근 패턴</text>
    <line x1="20" y1="26" x2="640" y2="26" stroke="#ccc"/>
    <text x="30" y="45" class="tufte-code">user = data.get("data", {}).get("users", [{}])[0]</text>
    <text x="430" y="45" class="tufte-small">키가 없으면 기본값 반환</text>
  </g>

</svg>
