<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
      .tufte-label { font-size: 13px; }
      .tufte-small { font-size: 12px; fill: #555; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="180" fill="#ffffff"/>

  <!-- Start -->
  <circle cx="40" cy="90" r="15" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="95" text-anchor="middle" class="tufte-text tufte-label">시작</text>

  <!-- Arrow to condition -->
  <path d="M 55 90 L 160 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Condition diamond -->
  <polygon points="160,90 205,60 250,90 205,120" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="205" y="95" text-anchor="middle" class="tufte-code">x % 2 == 0</text>

  <!-- True branch (Up then Right) -->
  <path d="M 205 60 L 205 40 L 300 40" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="35" text-anchor="start" class="tufte-text tufte-small">True</text>

  <!-- True Action -->
  <rect x="310" y="20" width="100" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="360" y="45" text-anchor="middle" class="tufte-code">print("짝수")</text>

  <!-- False branch (Down then Right) -->
  <path d="M 205 120 L 205 140 L 300 140" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="155" text-anchor="start" class="tufte-text tufte-small">False</text>

  <!-- False Action -->
  <rect x="310" y="120" width="100" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="360" y="145" text-anchor="middle" class="tufte-code">print("홀수")</text>

  <!-- Merge -->
  <path d="M 410 40 L 460 40 L 460 90" fill="none" stroke="#666" stroke-width="1.5"/>
  <path d="M 410 140 L 460 140 L 460 90" fill="none" stroke="#666" stroke-width="1.5"/>

  <!-- Arrow to End -->
  <path d="M 460 90 L 530 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End -->
  <circle cx="540" cy="90" r="10" fill="#333" stroke="#333" stroke-width="1.5"/>
  
  <!-- Annotation (moved to avoid overlap) -->
  <text x="460" y="25" text-anchor="middle" class="tufte-text tufte-small" fill="#888">둘 중 하나만 실행</text>

</svg>