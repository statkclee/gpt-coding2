<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 16px; fill: #333; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 14px; fill: #333; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; fill: #333; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 10px; fill: #666; }
      .tufte-code { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 10px; fill: #444; }
      .tufte-era { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #999; font-style: italic; }
      .box-problem { fill: #f8f8f8; stroke: #999; stroke-width: 1; }
      .box-solution { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .box-func { fill: #fff; stroke: #666; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #666; stroke-width: 1.5; }

      /* Spaghetti Code Styles */
      .header { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; font-weight: bold; fill: #333; }
      .code { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 9px; fill: #444; }
      .note { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 10px; fill: #666; font-style: italic; }
      .box-monolith { fill: #f5f5f5; stroke: #999; stroke-width: 1.5; }
      .box-dupe { fill: #e0e0e0; stroke: #888; stroke-width: 1; stroke-dasharray: 3,2; }
      .line-code { stroke: #ccc; stroke-width: 3; }
      .line-code-dark { stroke: #999; stroke-width: 3; }
      .line-goto { fill: none; stroke: #888; stroke-width: 1.2; stroke-dasharray: 4,2; }
      .arrow-line { fill: none; stroke: #666; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrow-goto" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#fff"/>

  <!-- ========================================== -->
  <!-- LEFT: PROBLEM - Spaghetti Code & GOTO Hell -->
  <!-- ========================================== -->
  <g transform="translate(25, 25)">
    <text x="110" y="0" text-anchor="middle" class="header">1. 혼돈 (스파게티 코드)</text>
    <text x="110" y="15" text-anchor="middle" class="tufte-era">(1960년대)</text>

    <!-- The Monolithic File -->
    <rect x="10" y="25" width="200" height="230" class="box-monolith" rx="3"/>
    <text x="110" y="40" text-anchor="middle" class="code" fill="#999">main_script_final_v2.bas</text>

    <!-- Code Lines Background -->
    <g transform="translate(25, 52)">
      <line x1="0" y1="0" x2="100" y2="0" class="line-code"/>
      <line x1="0" y1="8" x2="140" y2="8" class="line-code"/>
      <line x1="0" y1="16" x2="80" y2="16" class="line-code"/>

      <!-- Duplication 1 -->
      <rect x="-5" y="26" width="160" height="32" class="box-dupe" rx="2"/>
      <text x="5" y="40" class="code" font-weight="bold">Logic A</text>
      <line x1="5" y1="48" x2="145" y2="48" class="line-code-dark"/>

      <line x1="0" y1="68" x2="120" y2="68" class="line-code"/>
      <line x1="0" y1="76" x2="90" y2="76" class="line-code"/>

      <!-- Duplication 2 (Copy) -->
      <rect x="-5" y="86" width="160" height="32" class="box-dupe" rx="2"/>
      <text x="5" y="100" class="code" font-weight="bold">Logic A (Copy)</text>
      <line x1="5" y1="108" x2="145" y2="108" class="line-code-dark"/>

      <line x1="0" y1="128" x2="130" y2="128" class="line-code"/>

      <!-- Duplication 3 (Copy 2) -->
      <rect x="-5" y="138" width="160" height="32" class="box-dupe" rx="2"/>
      <text x="5" y="152" class="code" font-weight="bold">Logic A (Copy 2)</text>
      <line x1="5" y1="160" x2="145" y2="160" class="line-code-dark"/>

      <line x1="0" y1="180" x2="100" y2="180" class="line-code"/>
    </g>

    <!-- GOTO Arrows (Spaghetti) -->
    <path d="M 195 80 Q 225 100 195 120" class="line-goto" marker-end="url(#arrow-goto)"/>
    <path d="M 25 150 Q -5 120 25 90" class="line-goto" marker-end="url(#arrow-goto)"/>
    <path d="M 195 180 Q 230 140 195 70" class="line-goto" marker-end="url(#arrow-goto)"/>
    <text x="218" y="150" class="code" fill="#888">GOTO</text>

    <text x="110" y="270" text-anchor="middle" class="note" fill="#666">"얽힌 제어 흐름 + 무한 복붙"</text>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(250, 145)">
    <line x1="0" y1="0" x2="45" y2="0" class="arrow-line" marker-end="url(#arrowhead)"/>
    <text x="22" y="-10" text-anchor="middle" class="code">함수 추출</text>
  </g>

  <!-- ========================================== -->
  <!-- CENTER: The Solution (Procedural) -->
  <!-- ========================================== -->
  <g transform="translate(310, 25)">
    <text x="100" y="0" text-anchor="middle" class="tufte-label">2. 해결: 절차적 프로그래밍</text>
    <text x="100" y="18" text-anchor="middle" class="tufte-era">(FORTRAN, ALGOL, C)</text>

    <rect x="0" y="30" width="200" height="250" class="box-solution" rx="4"/>

    <!-- Function definition box -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="160" height="75" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>
      <text x="80" y="18" text-anchor="middle" class="tufte-label">함수 정의 (한 번)</text>
      <line x1="10" y1="25" x2="150" y2="25" stroke="#ddd"/>
      <text x="80" y="42" text-anchor="middle" class="tufte-code">def sum(data):</text>
      <text x="90" y="56" text-anchor="middle" class="tufte-code">  total = 0; ...</text>
      <text x="90" y="70" text-anchor="middle" class="tufte-code">  return total</text>
    </g>

    <!-- Function calls -->
    <g transform="translate(20, 135)">
      <text x="80" y="5" text-anchor="middle" class="tufte-small">재사용 (N번 호출)</text>
      <line x1="80" y1="8" x2="80" y2="25" stroke="#666" stroke-width="1" stroke-dasharray="3,2"/>

      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="75" height="25" class="box-func" rx="2"/>
        <text x="37" y="17" text-anchor="middle" class="tufte-code">sum(A)</text>
      </g>
      <g transform="translate(85, 30)">
        <rect x="0" y="0" width="75" height="25" class="box-func" rx="2"/>
        <text x="37" y="17" text-anchor="middle" class="tufte-code">sum(B)</text>
      </g>
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="75" height="25" class="box-func" rx="2"/>
        <text x="37" y="17" text-anchor="middle" class="tufte-code">sum(C)</text>
      </g>
      <g transform="translate(85, 60)">
        <rect x="0" y="0" width="75" height="25" class="box-func" rx="2"/>
        <text x="37" y="17" text-anchor="middle" class="tufte-code">sum(D)</text>
      </g>
    </g>

    <!-- Benefits -->
    <text x="20" y="255" class="tufte-text" font-weight="bold" fill="#333">DRY: Don't Repeat Yourself</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: Top-down Design -->
  <!-- ========================================== -->
  <g transform="translate(530, 25)">
    <text x="120" y="0" text-anchor="middle" class="tufte-label">3. 설계: 하향식 분해</text>
    <text x="120" y="18" text-anchor="middle" class="tufte-era">(Top-down Design)</text>

    <rect x="0" y="30" width="240" height="250" class="box-solution" rx="4" stroke="#666"/>

    <!-- Main function at top -->
    <g transform="translate(70, 55)">
      <rect x="0" y="0" width="100" height="30" fill="#ccc" stroke="#333" rx="3"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-code" fill="#fff">main()</text>
    </g>

    <!-- Arrows down -->
    <line x1="95" y1="85" x2="60" y2="115" stroke="#666" stroke-width="1.2"/>
    <line x1="120" y1="85" x2="120" y2="115" stroke="#666" stroke-width="1.2"/>
    <line x1="145" y1="85" x2="180" y2="115" stroke="#666" stroke-width="1.2"/>

    <!-- Sub functions -->
    <g transform="translate(15, 120)">
      <rect x="0" y="0" width="65" height="28" class="box-func" rx="2"/>
      <text x="32" y="18" text-anchor="middle" class="tufte-code" font-size="9">read()</text>
    </g>
    <g transform="translate(87, 120)">
      <rect x="0" y="0" width="65" height="28" class="box-func" rx="2"/>
      <text x="32" y="18" text-anchor="middle" class="tufte-code" font-size="9">calc()</text>
    </g>
    <g transform="translate(160, 120)">
      <rect x="0" y="0" width="65" height="28" class="box-func" rx="2"/>
      <text x="32" y="18" text-anchor="middle" class="tufte-code" font-size="9">print()</text>
    </g>

    <!-- Lower level -->
    <line x1="120" y1="148" x2="90" y2="170" stroke="#999" stroke-width="1"/>
    <line x1="120" y1="148" x2="150" y2="170" stroke="#999" stroke-width="1"/>

    <g transform="translate(55, 175)">
      <rect x="0" y="0" width="55" height="22" fill="#f5f5f5" stroke="#999" rx="2"/>
      <text x="27" y="15" text-anchor="middle" class="tufte-code" font-size="8">avg()</text>
    </g>
    <g transform="translate(130, 175)">
      <rect x="0" y="0" width="55" height="22" fill="#f5f5f5" stroke="#999" rx="2"/>
      <text x="27" y="15" text-anchor="middle" class="tufte-code" font-size="8">max()</text>
    </g>

    <!-- Key insight -->
    <g transform="translate(20, 215)">
      <text x="0" y="0" class="tufte-small">• 큰 문제 → 작은 문제로 분해</text>
      <text x="0" y="16" class="tufte-small">• 각 함수는 단일 책임</text>
      <text x="0" y="32" class="tufte-small">• 이름으로 의도 전달</text>
      <text x="0" y="52" class="tufte-text" font-weight="bold">→ 복잡성 관리 핵심</text>
    </g>
  </g>

</svg>
