<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
  <defs>
    <style>
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12px;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-highlight {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12px;
        fill: #333;
        font-weight: bold;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="180" fill="#ffffff"/>

  <!-- Step 1: Original string -->
  <text x="20" y="25" class="tufte-label">원본 문자열</text>
  <rect x="20" y="35" width="560" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="30" y="54" class="tufte-code">From stephen.marquard@uct.ac.za Sat Jan 5 09:14:16 2008</text>

  <!-- Position markers -->
  <line x1="237" y1="63" x2="237" y2="80" stroke="#333" stroke-width="1"/>
  <text x="237" y="92" text-anchor="middle" class="tufte-label">@(21)</text>

  <line x1="327" y1="63" x2="327" y2="80" stroke="#666" stroke-width="1"/>
  <text x="327" y="92" text-anchor="middle" class="tufte-label">공백(31)</text>

  <!-- Step 2: find('@') -->
  <text x="20" y="115" class="tufte-text">① find('@') → 21</text>

  <!-- Step 3: find(' ', 21) -->
  <text x="180" y="115" class="tufte-text">② find(' ', atpos) → 31</text>

  <!-- Step 4: slice -->
  <text x="380" y="115" class="tufte-text">③ data[22:31]</text>

  <!-- Result box -->
  <rect x="20" y="130" width="560" height="35" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="30" y="153" class="tufte-text">결과:</text>
  <rect x="80" y="138" width="100" height="22" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="2"/>
  <text x="130" y="154" text-anchor="middle" class="tufte-highlight">uct.ac.za</text>

</svg>
