<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 650 250">
  <defs>
    <style>
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        fill: #333;
      }
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="280" fill="#ffffff"/>

  <!-- String box (top center) -->
  <rect x="175" y="50" width="300" height="45" fill="#f5f5f5" stroke="#999" rx="3"/>
  <text x="325" y="78" text-anchor="middle" class="tufte-code">"디지털 글쓰기가 대세다"</text>
  <text x="325" y="42" text-anchor="middle" class="tufte-label">문자열 (String)</text>

  <!-- Split arrow (down) with proper arrowhead -->
  <line x1="220" y1="95" x2="220" y2="138" stroke="#666" stroke-width="2"/>
  <polygon points="220,148 213,135 227,135" fill="#666"/>
  <text x="175" y="120" text-anchor="middle" class="tufte-code">.split()</text>
  <text x="175" y="135" text-anchor="middle" class="tufte-small">공백 기준 분할</text>

  <!-- Join arrow (up) with proper arrowhead -->
  <line x1="430" y1="148" x2="430" y2="105" stroke="#666" stroke-width="2"/>
  <polygon points="430,95 423,108 437,108" fill="#666"/>
  <text x="485" y="120" text-anchor="middle" class="tufte-code">' '.join()</text>
  <text x="485" y="135" text-anchor="middle" class="tufte-small">공백으로 결합</text>

  <!-- List box (bottom center) -->
  <rect x="75" y="150" width="500" height="55" fill="#f5f5f5" stroke="#999" rx="3"/>
  <text x="325" y="147" text-anchor="middle" class="tufte-label">리스트 (List)</text>

  <!-- List elements -->
  <g transform="translate(95, 165)">
    <rect x="0" y="0" width="90" height="35" fill="#e8e8e8" stroke="#666"/>
    <text x="45" y="23" text-anchor="middle" class="tufte-code">'디지털'</text>
    <text x="45" y="-5" text-anchor="middle" class="tufte-small">[0]</text>
  </g>
  <g transform="translate(200, 165)">
    <rect x="0" y="0" width="100" height="35" fill="#e8e8e8" stroke="#666"/>
    <text x="50" y="23" text-anchor="middle" class="tufte-code">'글쓰기가'</text>
    <text x="50" y="-5" text-anchor="middle" class="tufte-small">[1]</text>
  </g>
  <g transform="translate(315, 165)">
    <rect x="0" y="0" width="80" height="35" fill="#e8e8e8" stroke="#666"/>
    <text x="40" y="23" text-anchor="middle" class="tufte-code">'대세다'</text>
    <text x="40" y="-5" text-anchor="middle" class="tufte-small">[2]</text>
  </g>

  <!-- Additional example with delimiter (two lines) -->
  <line x1="30" y1="225" x2="620" y2="225" stroke="#ccc" stroke-width="1"/>

  <text x="30" y="248" class="tufte-label">구분자 지정:</text>
  <text x="130" y="248" class="tufte-code">"a-b-c".split('-') → ['a', 'b', 'c']</text>
  <text x="400" y="248" class="tufte-code">'-'.join([...]) → "a-b-c"</text>
</svg>