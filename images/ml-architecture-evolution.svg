<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 800 370">
  <defs>
    <style>
      .tufte-title {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 18px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 12px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 11px;
        fill: #444;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .box-input {
        fill: #f9f9f9;
        stroke: #ccc;
        stroke-width: 1;
      }
      .box-arch {
        fill: #ffffff;
        stroke: #333;
        stroke-width: 1.5;
      }
      .token-box {
        fill: #fff;
        stroke: #999;
        stroke-width: 1;
      }
      .focus-token {
        fill: #333;
        stroke: #000;
        stroke-width: 1;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="400" y="40" class="tufte-title" text-anchor="middle">데이터 특성과 아키텍처의 대응</text>
  <text x="400" y="60" class="tufte-text" text-anchor="middle" font-style="italic">데이터의 본질적 특성을 효과적으로 처리하는 구조 선택</text> -->

  <!-- Columns -->
  <!-- 1. Tabular Data -> MLP -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="165" height="80" class="box-input" rx="3"/>
    <text x="82.5" y="25" class="tufte-subtitle" text-anchor="middle">정형 데이터</text>
    <text x="82.5" y="40" class="tufte-text" text-anchor="middle">(Tabular Data)</text>
    <text x="82.5" y="60" class="tufte-code" text-anchor="middle">이질적 속성</text>

    <line x1="82.5" y1="80" x2="82.5" y2="110" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82.5" y="100" class="tufte-text" text-anchor="middle" fill="#666" transform="translate(45,0)">상호작용</text>

    <rect x="0" y="110" width="165" height="220" class="box-arch" rx="3"/>
    <text x="82.5" y="140" class="tufte-subtitle" text-anchor="middle">MLP</text>
    <text x="82.5" y="155" class="tufte-text" text-anchor="middle">(Dense Network)</text>
    
    <g transform="translate(50, 180)">
        <circle cx="10" cy="10" r="4" fill="#333"/>
        <circle cx="10" cy="30" r="4" fill="#333"/>
        <circle cx="10" cy="50" r="4" fill="#333"/>
        <circle cx="55" cy="20" r="4" fill="#666"/>
        <circle cx="55" cy="40" r="4" fill="#666"/>
        <line x1="14" y1="10" x2="51" y2="20" stroke="#ccc" stroke-width="0.5"/>
        <line x1="14" y1="10" x2="51" y2="40" stroke="#ccc" stroke-width="0.5"/>
        <line x1="14" y1="30" x2="51" y2="20" stroke="#ccc" stroke-width="0.5"/>
        <line x1="14" y1="30" x2="51" y2="40" stroke="#ccc" stroke-width="0.5"/>
        <line x1="14" y1="50" x2="51" y2="20" stroke="#ccc" stroke-width="0.5"/>
        <line x1="14" y1="50" x2="51" y2="40" stroke="#ccc" stroke-width="0.5"/>
    </g>

    <text x="82.5" y="280" class="tufte-code" text-anchor="middle">특징 조합</text>
    <text x="82.5" y="300" class="tufte-text" text-anchor="middle">이질적 속성의 조합</text>
  </g>

  <!-- 2. Image Data -> CNN -->
  <g transform="translate(225, 100)">
    <rect x="0" y="0" width="165" height="80" class="box-input" rx="3"/>
    <text x="82.5" y="25" class="tufte-subtitle" text-anchor="middle">이미지</text>
    <text x="82.5" y="40" class="tufte-text" text-anchor="middle">(Image Data)</text>
    <text x="82.5" y="60" class="tufte-code" text-anchor="middle">공간 격자 구조</text>

    <line x1="82.5" y1="80" x2="82.5" y2="110" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82.5" y="100" class="tufte-text" text-anchor="middle" fill="#666" transform="translate(45,0)">지역성</text>

    <rect x="0" y="110" width="165" height="220" class="box-arch" rx="3"/>
    <text x="82.5" y="140" class="tufte-subtitle" text-anchor="middle">CNN</text>
    <text x="82.5" y="155" class="tufte-text" text-anchor="middle">(Convolution)</text>
    
    <g transform="translate(50, 180)">
        <rect x="0" y="0" width="40" height="40" fill="none" stroke="#ccc"/>
        <rect x="5" y="5" width="15" height="15" fill="#eee" stroke="#333" stroke-width="1.5"/>
        <line x1="20" y1="12" x2="50" y2="12" stroke="#666" stroke-dasharray="2,2"/>
        <rect x="50" y="5" width="15" height="15" fill="#ddd" stroke="#666"/>
    </g>

    <text x="82.5" y="280" class="tufte-code" text-anchor="middle">지역 패턴</text>
    <text x="82.5" y="300" class="tufte-text" text-anchor="middle">지역적 특징 추출</text>
  </g>

  <!-- 3. Sequence Data -> RNN -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="165" height="80" class="box-input" rx="3"/>
    <text x="82.5" y="25" class="tufte-subtitle" text-anchor="middle">시계열/순차</text>
    <text x="82.5" y="40" class="tufte-text" text-anchor="middle">(Sequence Data)</text>
    <text x="82.5" y="60" class="tufte-code" text-anchor="middle">시간 순서</text>

    <line x1="82.5" y1="80" x2="82.5" y2="110" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82.5" y="100" class="tufte-text" text-anchor="middle" fill="#666" transform="translate(45,0)">인과성</text>

    <rect x="0" y="110" width="165" height="220" class="box-arch" rx="3"/>
    <text x="82.5" y="140" class="tufte-subtitle" text-anchor="middle">RNN</text>
    <text x="82.5" y="155" class="tufte-text" text-anchor="middle">(Recurrence)</text>
    
    <g transform="translate(60, 190)">
        <circle cx="20" cy="20" r="15" fill="none" stroke="#333" stroke-width="1.5"/>
        <text x="20" y="25" class="tufte-code" text-anchor="middle">h</text>
        <path d="M20 5 Q40 -15 50 5 Q55 25 35 25" fill="none" stroke="#666" marker-end="url(#arrow)"/>
    </g>

    <text x="82.5" y="280" class="tufte-code" text-anchor="middle">순차적 상태</text>
    <text x="82.5" y="300" class="tufte-text" text-anchor="middle">과거 정보의 누적</text>
  </g>

  <!-- 4. Context/Text -> Transformer -->
  <g transform="translate(595, 100)">
    <rect x="0" y="0" width="165" height="80" class="box-input" rx="3"/>
    <text x="82.5" y="25" class="tufte-subtitle" text-anchor="middle">자연어/맥락</text>
    <text x="82.5" y="40" class="tufte-text" text-anchor="middle">(Semantic Context)</text>
    <text x="82.5" y="60" class="tufte-code" text-anchor="middle">장거리 의존성</text>

    <line x1="82.5" y1="80" x2="82.5" y2="110" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="82.5" y="100" class="tufte-text" text-anchor="middle" fill="#666" transform="translate(45,0)">어텐션</text>

    <rect x="0" y="110" width="165" height="220" class="box-arch" rx="3" stroke="#333" stroke-width="2"/>
    <text x="82.5" y="140" class="tufte-subtitle" text-anchor="middle">Transformer</text>
    <text x="82.5" y="155" class="tufte-text" text-anchor="middle">(Self-Attention)</text>
    
    <!-- Attention Visualization -->
    <g transform="translate(25, 185)">
        <rect x="0" y="20" width="20" height="20" class="token-box" rx="2"/>
        <rect x="35" y="20" width="20" height="20" class="focus-token" rx="2"/> 
        <rect x="70" y="20" width="20" height="20" class="token-box" rx="2"/>
        <rect x="105" y="20" width="20" height="20" class="token-box" rx="2"/>

        <path d="M45 20 Q22 -10 10 20" fill="none" stroke="#333" stroke-width="2"/>
        <path d="M45 20 Q62 0 80 20" fill="none" stroke="#ccc" stroke-width="0.5"/>
        <path d="M45 20 Q75 -20 115 20" fill="none" stroke="#999" stroke-width="1"/>
        
        <text x="45" y="55" class="tufte-code" font-size="8px" text-anchor="middle">동적 가중치</text>
    </g>

    <text x="82.5" y="280" class="tufte-code" text-anchor="middle">전역 맥락</text>
    <text x="82.5" y="300" class="tufte-text" text-anchor="middle">맥락 기반 가중치</text>
  </g>

  <!-- Bottom Insight -->
  <!-- <line x1="50" y1="380" x2="750" y2="380" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="405" class="tufte-text" text-anchor="middle">"모든 문제에 Transformer를 쓸 수도 있지만, 데이터의 본질적 특성(Inductive Bias)에 맞는 모델이 효율적일 수 있다."</text> -->

</svg>