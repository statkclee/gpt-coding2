<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 830 330">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #222; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #555; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-size: 11px; }
      .tufte-tiny { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="830" height="350" fill="#ffffff"/>

  <!-- 상단: 데이터 특수성 설명 -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="740" height="55" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="20" y="22" class="tufte-text" font-size="12" font-weight="bold">데이터 법적 특수성</text>
    <text x="20" y="42" class="tufte-small">데이터(사실, 측정값)는 대부분 국가에서 저작권 보호 대상이 아니지만, 데이터베이스 "구조와 배열"은 보호받을 수 있다.</text>
  </g>

  <!-- 스펙트럼 -->
  <g transform="translate(30, 115)">
    <line x1="0" y1="0" x2="740" y2="0" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="-12" text-anchor="start" class="tufte-label" font-size="10">완전 개방 (Public Domain)</text>
    <text x="740" y="-12" text-anchor="end" class="tufte-label" font-size="10">조건부 공유 (Conditional)</text>

    <!-- CC0 -->
    <g transform="translate(100, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-80" y="15" width="160" height="95" fill="#f8f8f8" stroke="#666" stroke-width="1.5" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">CC0</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">공중 도메인 헌정</text>
      <line x1="-60" y1="60" x2="60" y2="60" stroke="#ccc"/>
      <text x="0" y="75" text-anchor="middle" class="tufte-tiny">모든 권리 포기</text>
      <text x="0" y="90" text-anchor="middle" class="tufte-tiny">Dryad, Figshare 표준</text>
      <text x="0" y="102" text-anchor="middle" class="tufte-tiny" font-weight="bold">과학 데이터 권장</text>
    </g>

    <!-- PDDL -->
    <g transform="translate(300, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-80" y="15" width="160" height="95" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">PDDL</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">공중 도메인 헌정</text>
      <line x1="-60" y1="60" x2="60" y2="60" stroke="#ccc"/>
      <text x="0" y="75" text-anchor="middle" class="tufte-tiny">Open Data Commons</text>
      <text x="0" y="90" text-anchor="middle" class="tufte-tiny">CC0와 법적 효과 동일</text>
      <text x="0" y="102" text-anchor="middle" class="tufte-tiny">데이터 특화 법적 문구</text>
    </g>

    <!-- ODC-By -->
    <g transform="translate(500, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-80" y="15" width="160" height="95" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">ODC-By</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">저작자 표시</text>
      <line x1="-60" y1="60" x2="60" y2="60" stroke="#ccc"/>
      <text x="0" y="75" text-anchor="middle" class="tufte-tiny">출처 표기 의무</text>
      <text x="0" y="90" text-anchor="middle" class="tufte-tiny">데이터 버전 CC BY</text>
      <text x="0" y="102" text-anchor="middle" class="tufte-tiny">학술 인용 강제 시</text>
    </g>

    <!-- ODbL -->
    <g transform="translate(700, 0)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#666" stroke-width="2"/>
      <rect x="-80" y="15" width="160" height="95" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="4"/>
      <text x="0" y="35" text-anchor="middle" class="tufte-mono" font-size="13">ODbL</text>
      <text x="0" y="52" text-anchor="middle" class="tufte-small">동일조건변경허락</text>
      <line x1="-60" y1="60" x2="60" y2="60" stroke="#ccc"/>
      <text x="0" y="75" text-anchor="middle" class="tufte-tiny">DB 구조 보호</text>
      <text x="0" y="90" text-anchor="middle" class="tufte-tiny">파생 DB도 공개 의무</text>
      <text x="0" y="102" text-anchor="middle" class="tufte-tiny" font-weight="bold">OpenStreetMap 모델</text>
    </g>
  </g>

  <!-- 하단 비교표 -->
  <g transform="translate(30, 235)">
    <line x1="0" y1="0" x2="740" y2="0" stroke="#ccc" stroke-width="1"/>
    <text x="0" y="20" class="tufte-text" font-size="11" font-weight="bold">선택 기준</text>

    <g transform="translate(0, 38)">
      <text x="0" y="0" class="tufte-small">법적 복잡성</text>
      <text x="100" y="0" text-anchor="middle" class="tufte-tiny">최소</text>
      <text x="300" y="0" text-anchor="middle" class="tufte-tiny">최소</text>
      <text x="500" y="0" text-anchor="middle" class="tufte-tiny">중간</text>
      <text x="700" y="0" text-anchor="middle" class="tufte-tiny">높음</text>
    </g>

    <g transform="translate(0, 58)">
      <text x="0" y="0" class="tufte-small">재사용 장벽</text>
      <text x="100" y="0" text-anchor="middle" class="tufte-tiny">없음</text>
      <text x="300" y="0" text-anchor="middle" class="tufte-tiny">없음</text>
      <text x="500" y="0" text-anchor="middle" class="tufte-tiny">출처 표기</text>
      <text x="700" y="0" text-anchor="middle" class="tufte-tiny">공개 의무</text>
    </g>

    <g transform="translate(0, 78)">
      <text x="0" y="0" class="tufte-small" font-weight="bold">적합 용도</text>
      <text x="100" y="0" text-anchor="middle" class="tufte-tiny">연구 데이터</text>
      <text x="300" y="0" text-anchor="middle" class="tufte-tiny">정부 데이터</text>
      <text x="500" y="0" text-anchor="middle" class="tufte-tiny">인용 필수 데이터</text>
      <text x="700" y="0" text-anchor="middle" class="tufte-tiny">커뮤니티 DB</text>
    </g>
  </g>

  <!-- 권장 박스 -->
  <g transform="translate(30, 325)">
    <rect x="0" y="0" width="740" height="20" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
    <text x="105" y="14" class="tufte-text" font-size="10">
      <tspan font-weight="bold">★ 과학 데이터 권장:</tspan>
      <tspan dx="10">재현가능성 극대화를 위해</tspan>
      <tspan class="tufte-mono" dx="3">CC0</tspan>
      <tspan dx="3">사용 (Nature, Science 등 주요 저널 권장)</tspan>
    </text>
  </g>
</svg>
