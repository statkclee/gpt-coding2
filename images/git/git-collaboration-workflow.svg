<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 680 200">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; }
    </style>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="680" height="260" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="340" y="24" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">협업 시 권장 워크플로우</text> -->

  <!-- ========== 상단 행: pull → 파일수정 → add ========== -->

  <!-- Step 1: git pull -->
  <rect x="30" y="45" width="95" height="45" fill="#e0e0e0" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="77" y="65" text-anchor="middle" class="tufte-mono" font-size="11" fill="#333">git pull</text>
  <text x="77" y="80" text-anchor="middle" class="tufte-label" font-size="9">원격 동기화</text>

  <!-- Arrow 1: pull → 파일수정 -->
  <line x1="125" y1="67" x2="150" y2="67" stroke="#555" stroke-width="2"/>
  <polygon points="150,63 162,67 150,71" fill="#555"/>

  <!-- Step 2: 파일 수정 -->
  <rect x="165" y="45" width="95" height="45" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="212" y="65" text-anchor="middle" class="tufte-label" font-size="10">파일 수정</text>
  <text x="212" y="80" text-anchor="middle" class="tufte-label" font-size="9">(편집 작업)</text>

  <!-- Arrow 2: 파일수정 → add -->
  <line x1="260" y1="67" x2="285" y2="67" stroke="#555" stroke-width="2"/>
  <polygon points="285,63 297,67 285,71" fill="#555"/>

  <!-- Step 3: git add -->
  <rect x="300" y="45" width="95" height="45" fill="#e0e0e0" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="347" y="65" text-anchor="middle" class="tufte-mono" font-size="11" fill="#333">git add</text>
  <text x="347" y="80" text-anchor="middle" class="tufte-label" font-size="9">스테이징</text>

  <!-- Arrow 3: add → commit -->
  <line x1="395" y1="67" x2="420" y2="67" stroke="#555" stroke-width="2"/>
  <polygon points="420,63 432,67 420,71" fill="#555"/>

  <!-- Step 4: git commit -->
  <rect x="435" y="45" width="95" height="45" fill="#e0e0e0" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="482" y="65" text-anchor="middle" class="tufte-mono" font-size="11" fill="#333">git commit</text>
  <text x="482" y="80" text-anchor="middle" class="tufte-label" font-size="9">로컬 기록</text>

  <!-- Arrow 4: commit → push -->
  <line x1="530" y1="67" x2="555" y2="67" stroke="#555" stroke-width="2"/>
  <polygon points="555,63 567,67 555,71" fill="#555"/>

  <!-- Step 5: git push (강조) -->
  <rect x="570" y="45" width="95" height="45" fill="#555" stroke="#333" stroke-width="1.5" rx="4"/>
  <text x="617" y="65" text-anchor="middle" class="tufte-mono" font-size="11" fill="#fff">git push</text>
  <text x="617" y="80" text-anchor="middle" font-family="Palatino, Georgia, serif" font-size="9" fill="#ccc">원격 업로드</text>

  <!-- ========== 하단: 핵심 원칙 박스 ========== -->
  <rect x="30" y="110" width="635" height="95" fill="#f8f8f8" stroke="#ccc" stroke-width="1" rx="4"/>

  <text x="50" y="132" class="tufte-text" font-size="14" font-weight="bold">핵심 원칙</text>

  <text x="50" y="152" class="tufte-label" font-size="12">• 작업 시작 전 항상 pull로 최신 상태 동기화 — 다른 팀원의 변경사항 먼저 가져오기</text>
  <text x="50" y="170" class="tufte-label" font-size="12">• commit은 로컬 기록, push는 원격 공유 — 별개 동작이므로 커밋 없이 push 불가</text>
  <text x="50" y="188" class="tufte-label" font-size="12">• 충돌 방지 순서: pull → 작업 → add → commit → push (여러 커밋 후 한 번에 push 가능)</text>

</svg>
