<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 750 330">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="750" height="380" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="375" y="28" text-anchor="middle" class="tufte-text" font-size="16" font-weight="bold">오픈 사이언스와 워크플로우 개요</text> -->

  <!-- ========== 중앙: 오픈 사이언스 핵심 ========== -->
  <g transform="translate(275, 50)">
    <rect x="0" y="0" width="200" height="60" fill="#e8e8e8" stroke="#555" stroke-width="2" rx="5"/>
    <text x="100" y="25" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">오픈 사이언스</text>
    <text x="100" y="45" text-anchor="middle" class="tufte-label" font-size="11">공개 · 재현가능 · 협업</text>
  </g>

  <!-- 화살표들 -->
  <line x1="275" y1="80" x2="160" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="375" y1="110" x2="375" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="80" x2="590" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ========== 하위 3개 영역 ========== -->

  <!-- 1. 라이선스 -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="220" height="200" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="5"/>
    <text x="110" y="25" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">라이선스</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#ccc" stroke-width="1"/>

    <!-- 소프트웨어 -->
    <rect x="15" y="45" width="190" height="45" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="62" text-anchor="middle" class="tufte-label" font-size="11" font-weight="bold">소프트웨어</text>
    <text x="110" y="80" text-anchor="middle" class="tufte-mono" font-size="9" fill="#555">MIT · BSD · GPL · Apache</text>

    <!-- 콘텐츠 -->
    <rect x="15" y="98" width="190" height="45" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="115" text-anchor="middle" class="tufte-label" font-size="11" font-weight="bold">콘텐츠</text>
    <text x="110" y="133" text-anchor="middle" class="tufte-mono" font-size="9" fill="#555">CC-BY · CC-BY-SA · CC0</text>

    <!-- 데이터 -->
    <rect x="15" y="151" width="190" height="40" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="168" text-anchor="middle" class="tufte-label" font-size="11" font-weight="bold">데이터</text>
    <text x="110" y="183" text-anchor="middle" class="tufte-mono" font-size="9" fill="#555">CC0 · ODbL · PDDL</text>
  </g>

  <!-- 2. 호스팅 & 협업 -->
  <g transform="translate(265, 150)">
    <rect x="0" y="0" width="220" height="200" fill="#f0f0f0" stroke="#666" stroke-width="1.5" rx="5"/>
    <text x="110" y="25" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">호스팅 &amp; 협업</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#ccc" stroke-width="1"/>

    <!-- 호스팅 서비스 -->
    <rect x="15" y="45" width="190" height="55" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="62" text-anchor="middle" class="tufte-label" font-size="11" font-weight="bold">공개 호스팅</text>
    <text x="110" y="78" text-anchor="middle" class="tufte-mono" font-size="9" fill="#555">GitHub · GitLab · Bitbucket</text>
    <text x="110" y="92" text-anchor="middle" class="tufte-label" font-size="9">CI/CD · DOI 연동</text>

    <!-- Fork & PR -->
    <rect x="15" y="108" width="190" height="45" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="125" text-anchor="middle" class="tufte-label" font-size="11" font-weight="bold">Fork &amp; Pull Request</text>
    <text x="110" y="143" text-anchor="middle" class="tufte-label" font-size="9">오픈소스 기여 워크플로우</text>

    <!-- 데이터 저장소 -->
    <rect x="15" y="161" width="190" height="30" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="181" text-anchor="middle" class="tufte-mono" font-size="9" fill="#555">Zenodo · Figshare · Dryad</text>
  </g>

  <!-- 3. 도구 & 환경 -->
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="220" height="200" fill="#e8e8e8" stroke="#666" stroke-width="1.5" rx="5"/>
    <text x="110" y="25" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">도구 &amp; 환경</text>
    <line x1="15" y1="35" x2="205" y2="35" stroke="#bbb" stroke-width="1"/>

    <!-- IDE 통합 -->
    <rect x="15" y="45" width="190" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="62" text-anchor="middle" class="tufte-label" font-size="11" font-weight="bold">IDE Git 통합</text>
    <text x="110" y="78" text-anchor="middle" class="tufte-mono" font-size="9" fill="#555">RStudio · VS Code · Positron</text>
    <text x="110" y="92" text-anchor="middle" class="tufte-label" font-size="9">시각적 diff · 커밋 · 푸시</text>

    <!-- CLI -->
    <rect x="15" y="108" width="190" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="125" text-anchor="middle" class="tufte-label" font-size="11" font-weight="bold">명령줄 (CLI)</text>
    <text x="110" y="140" text-anchor="middle" class="tufte-label" font-size="9">고급 기능 · 자동화 · 서버</text>

    <!-- 버전 제어 -->
    <rect x="15" y="156" width="190" height="35" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="3"/>
    <text x="110" y="178" text-anchor="middle" class="tufte-label" font-size="10">전자 연구 노트 · 재현가능성</text>
  </g>

</svg>
