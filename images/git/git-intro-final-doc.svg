<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-title { font-size: 24px; font-weight: bold; }
      .tufte-filename { font-size: 11px; font-family: 'Courier New', monospace; fill: #333; }
      .tufte-small { font-size: 12px; fill: #666; }
      .panel-border { fill: #fafafa; stroke: #333; stroke-width: 1.2; }
      .doc-icon { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .face { fill: #f5f5f5; stroke: #333; stroke-width: 1.2; }
    </style>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="540" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="270" y="32" text-anchor="middle" class="tufte-text tufte-title">"최종".hwp</text>

  <!-- Row 1 -->
  <!-- Panel 1: 최종.hwp! - Happy -->
  <g transform="translate(15, 50)">
    <rect x="0" y="0" width="165" height="105" class="panel-border" rx="3"/>
    <!-- Happy face -->
    <circle cx="60" cy="40" r="18" class="face"/>
    <circle cx="54" cy="36" r="2" fill="#333"/>
    <circle cx="66" cy="36" r="2" fill="#333"/>
    <path d="M52,46 Q60,54 68,46" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Document -->
    <rect x="100" y="20" width="40" height="50" class="doc-icon" rx="2"/>
    <line x1="107" y1="32" x2="133" y2="32" stroke="#666" stroke-width="1"/>
    <line x1="107" y1="40" x2="133" y2="40" stroke="#666" stroke-width="1"/>
    <line x1="107" y1="48" x2="133" y2="48" stroke="#666" stroke-width="1"/>
    <text x="82" y="92" text-anchor="middle" class="tufte-filename">최종.hwp!</text>
  </g>

  <!-- Panel 2: 최종_수정2.hwp - Still okay -->
  <g transform="translate(187, 50)">
    <rect x="0" y="0" width="165" height="105" class="panel-border" rx="3"/>
    <!-- Two faces reviewing -->
    <circle cx="45" cy="40" r="15" class="face"/>
    <circle cx="40" cy="37" r="1.5" fill="#333"/>
    <circle cx="50" cy="37" r="1.5" fill="#333"/>
    <path d="M40,45 Q45,50 50,45" fill="none" stroke="#333" stroke-width="1.2"/>

    <circle cx="105" cy="40" r="15" class="face"/>
    <circle cx="100" cy="37" r="1.5" fill="#333"/>
    <circle cx="110" cy="37" r="1.5" fill="#333"/>
    <line x1="100" y1="46" x2="110" y2="46" stroke="#333" stroke-width="1.2"/>
    <!-- Document between -->
    <rect x="65" y="50" width="25" height="32" class="doc-icon" rx="2"/>
    <text x="82" y="92" text-anchor="middle" class="tufte-filename">최종_수정2.hwp</text>
  </g>

  <!-- Panel 3: 최종_수정6_코멘트.hwp - Getting worried -->
  <g transform="translate(359, 50)">
    <rect x="0" y="0" width="165" height="105" class="panel-border" rx="3"/>
    <!-- Neutral face -->
    <circle cx="45" cy="40" r="15" class="face"/>
    <circle cx="40" cy="37" r="1.5" fill="#333"/>
    <circle cx="50" cy="37" r="1.5" fill="#333"/>
    <line x1="40" y1="46" x2="50" y2="46" stroke="#333" stroke-width="1.2"/>
    <!-- Monitor -->
    <rect x="85" y="25" width="55" height="38" fill="#e8e8e8" stroke="#333" stroke-width="1" rx="2"/>
    <rect x="90" y="30" width="45" height="28" fill="#fff" stroke="#999" stroke-width="0.5"/>
    <rect x="105" y="63" width="25" height="5" fill="#ccc" stroke="#333" stroke-width="0.5"/>
    <text x="82" y="92" text-anchor="middle" class="tufte-filename" style="font-size:9px;">최종_수정6_코멘트.hwp</text>
  </g>

  <!-- Row 2 -->
  <!-- Panel 4: Getting stressed -->
  <g transform="translate(15, 162)">
    <rect x="0" y="0" width="165" height="105" class="panel-border" rx="3"/>
    <!-- Worried face -->
    <circle cx="45" cy="40" r="15" class="face"/>
    <circle cx="40" cy="36" r="1.5" fill="#333"/>
    <circle cx="50" cy="36" r="1.5" fill="#333"/>
    <path d="M40,47 Q45,43 50,47" fill="none" stroke="#333" stroke-width="1.2"/>
    <!-- Sweat drop -->
    <ellipse cx="62" cy="32" rx="2" ry="3" fill="#ccc" stroke="#999" stroke-width="0.5"/>
    <!-- Document with corrections -->
    <rect x="85" y="30" width="50" height="40" class="doc-icon" rx="2"/>
    <line x1="92" y1="42" x2="128" y2="42" stroke="#666" stroke-width="1"/>
    <line x1="92" y1="50" x2="128" y2="50" stroke="#999" stroke-width="1" stroke-dasharray="2,1"/>
    <line x1="92" y1="58" x2="128" y2="58" stroke="#999" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="82" y="92" text-anchor="middle" class="tufte-filename" style="font-size:7px;">최종_수정8_코멘트5_교정.hwp</text>
  </g>

  <!-- Panel 5: Track changes nightmare -->
  <g transform="translate(187, 162)">
    <rect x="0" y="0" width="165" height="105" class="panel-border" rx="3"/>
    <text x="45" y="18" text-anchor="middle" class="tufte-small" style="font-style:italic; font-size:10px;">변경 내용 추적...</text>
    <!-- Stressed face -->
    <circle cx="45" cy="48" r="15" class="face"/>
    <line x1="37" y1="42" x2="42" y2="45" stroke="#333" stroke-width="1.2"/>
    <line x1="48" y1="45" x2="53" y2="42" stroke="#333" stroke-width="1.2"/>
    <path d="M38,56 Q45,50 52,56" fill="none" stroke="#333" stroke-width="1.2"/>
    <!-- Monitor with mess -->
    <rect x="85" y="28" width="55" height="38" fill="#e8e8e8" stroke="#333" stroke-width="1" rx="2"/>
    <rect x="90" y="33" width="45" height="28" fill="#fff" stroke="#999" stroke-width="0.5"/>
    <line x1="93" y1="38" x2="132" y2="38" stroke="#333" stroke-width="0.8"/>
    <line x1="93" y1="43" x2="128" y2="43" stroke="#999" stroke-width="0.8" stroke-dasharray="2,1"/>
    <line x1="93" y1="48" x2="130" y2="48" stroke="#999" stroke-width="0.8" stroke-dasharray="2,1"/>
    <line x1="93" y1="53" x2="125" y2="53" stroke="#333" stroke-width="0.8"/>
    <rect x="105" y="66" width="25" height="5" fill="#ccc" stroke="#333" stroke-width="0.5"/>
    <text x="82" y="92" text-anchor="middle" class="tufte-filename" style="font-size:5.5px;">최종_수정18_코멘트7_교정9_추가30.hwp</text>
  </g>

  <!-- Panel 6: Complete despair -->
  <g transform="translate(359, 162)">
    <rect x="0" y="0" width="165" height="105" class="panel-border" rx="3"/>
    <!-- Despair face - head in hands -->
    <circle cx="45" cy="48" r="15" class="face"/>
    <line x1="38" y1="40" x2="43" y2="44" stroke="#333" stroke-width="1.5"/>
    <line x1="47" y1="44" x2="52" y2="40" stroke="#333" stroke-width="1.5"/>
    <path d="M38,56 Q45,52 52,56" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Hands on head -->
    <path d="M30,38 Q35,30 40,38" fill="none" stroke="#333" stroke-width="1.2"/>
    <path d="M50,38 Q55,30 60,38" fill="none" stroke="#333" stroke-width="1.2"/>
    <!-- Monitor -->
    <rect x="85" y="28" width="55" height="38" fill="#e8e8e8" stroke="#333" stroke-width="1" rx="2"/>
    <rect x="90" y="33" width="45" height="28" fill="#fff" stroke="#999" stroke-width="0.5"/>
    <text x="112" y="52" text-anchor="middle" style="font-size:18px; fill:#999;">?!</text>
    <rect x="105" y="66" width="25" height="5" fill="#ccc" stroke="#333" stroke-width="0.5"/>
    <text x="82" y="85" text-anchor="middle" class="tufte-filename" style="font-size:5px;">최종_수정22_코멘트49_교정10</text>
    <text x="82" y="93" text-anchor="middle" class="tufte-filename" style="font-size:5px;">.#@$%왜대학원왔나????.hwp</text>
  </g>

  <!-- Bottom section: Git solution -->
  <g transform="translate(20, 280)">
    <rect x="0" y="0" width="500" height="120" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="3"/>

    <text x="250" y="25" text-anchor="middle" class="tufte-text" style="font-size:14px; font-weight:bold;">Git을 사용하면?</text>

    <!-- Single file -->
    <g transform="translate(40, 45)">
      <rect x="0" y="0" width="70" height="50" class="doc-icon" rx="2"/>
      <text x="35" y="30" text-anchor="middle" class="tufte-filename">thesis.md</text>
    </g>

    <!-- Arrow -->
    <line x1="125" y1="70" x2="155" y2="70" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- Git commits -->
    <g transform="translate(170, 40)">
      <circle cx="0" cy="30" r="8" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <text x="0" y="55" text-anchor="middle" class="tufte-small">v1</text>

      <line x1="10" y1="30" x2="50" y2="30" stroke="#333" stroke-width="1"/>

      <circle cx="60" cy="30" r="8" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <text x="60" y="55" text-anchor="middle" class="tufte-small">v2</text>

      <line x1="70" y1="30" x2="110" y2="30" stroke="#333" stroke-width="1"/>

      <circle cx="120" cy="30" r="8" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <text x="120" y="55" text-anchor="middle" class="tufte-small">v3</text>

      <line x1="130" y1="30" x2="170" y2="30" stroke="#333" stroke-width="1"/>

      <circle cx="180" cy="30" r="10" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
      <text x="180" y="55" text-anchor="middle" class="tufte-small" style="font-weight:bold;">최종</text>
      <!-- Happy smile on final -->
      <path d="M175,33 Q180,37 185,33" fill="none" stroke="#333" stroke-width="1"/>
    </g>

    <!-- Benefit text -->
    <text x="420" y="60" text-anchor="middle" class="tufte-text" style="font-size:12px;">모든 이력이</text>
    <text x="420" y="78" text-anchor="middle" class="tufte-text" style="font-size:12px;">깔끔하게 관리됨</text>
  </g>

  <!-- Credit -->
  <!-- <text x="270" y="412" text-anchor="middle" class="tufte-small" style="font-size:9px; fill:#999;">원본: Jorge Cham, PhD Comics (2012)</text> -->

</svg>
