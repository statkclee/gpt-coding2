    <path fill="#ffffff" stroke="#333" stroke-miterlimit="10" d="M587.021,72.601c0,0,0,34.736,0,35.739c0,1.002,0.354,3.12,0.354,3.12c0,9.268-22.76,16.78-50.4,16.78c-27.64,0-50.399-7.513-50.399-16.78c0,0,0.353-1.923,0.353-3.132s0-35.728,0-35.728c0,9.268,22.407,16.78,50.047,16.78C564.614,89.381,587.021,81.869,587.021,72.601z"/>

    <!-- First (top) white section -->
    <path fill="#ffffff" stroke="#333" stroke-miterlimit="10" d="M587.021,33.628c0,0,0,34.737,0,35.739s0.354,3.12,0.354,3.12c0,9.269-22.76,16.781-50.4,16.781c-27.64,0-50.399-7.513-50.399-16.781c0,0,0.353-1.922,0.353-3.131s0-35.728,0-35.728c0,9.268,22.407,16.78,50.047,16.78C564.614,50.409,587.021,42.896,587.021,33.628z"/>

    <!-- File on top of repository -->
    <polygon fill="#ffffff" stroke="#333" stroke-miterlimit="10" points="573.216,26.381 513.908,26.381 500.732,40.875 560.039,40.875"/>
    <line fill="none" stroke="#666" stroke-width="2" x1="513.908" y1="32.311" x2="562.662" y2="32.311"/>
  </g>

  <!-- Working Directory (File) -->
  <g>
    <rect x="24" y="45" fill="#dcdee0" width="100" height="128"/>
    <rect x="24" y="45" fill="none" stroke="#666" stroke-width="2" width="100" height="128"/>
    <line fill="none" stroke="#333" stroke-width="2" x1="37" y1="65" x2="111" y2="65"/>
    <line fill="none" stroke="#333" stroke-width="2" x1="37" y1="71" x2="111" y2="71"/>
    <line fill="none" stroke="#333" stroke-width="2" x1="37" y1="77" x2="111" y2="77"/>
    <line fill="none" stroke="#999" stroke-width="2" x1="37" y1="89" x2="111" y2="89"/>
  </g>

  <!-- Arrow 1: git add (grayscale) -->
  <g>
    <rect x="150.871" y="96.768" fill="#888" width="45.956" height="30.604"/>
    <polygon fill="#888" points="193.467,81.571 193.467,141.696 234.02,111.163"/>
  </g>
  <text x="164" y="114.35" class="tufte-mono" font-size="12" fill="#fff">git add</text>

  <!-- Arrow 2: git commit (grayscale) -->
  <g>
    <rect x="381.251" y="96.768" fill="#888" width="45.956" height="30.604"/>
    <polygon fill="#888" points="423.847,81.571 423.847,141.696 464.399,111.163"/>
  </g>
  <text x="386.76" y="114.35" class="tufte-mono" font-size="12" fill="#fff">git commit</text>

  <!-- Labels -->
  <text x="269.48" y="174.63" class="tufte-text" font-size="12">스테이징 영역</text>
  <text x="511.94" y="187.63" class="tufte-text" font-size="12">저장소</text>
</svg>
