<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 700 280">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: Consolas, 'Courier New', monospace; fill: #333; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-size: 11px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="350" y="30" text-anchor="middle" class="tufte-text" font-size="18" font-weight="bold">Git 히스토리와 파일 관리</text> -->

  <!-- Section 1: History Navigation -->
  <rect x="30" y="55" width="200" height="110" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="130" y="75" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">이력 탐색</text>

  <!-- Commit chain -->
  <circle cx="60" cy="115" r="15" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="60" y="119" text-anchor="middle" class="tufte-mono" font-size="10">C1</text>

  <line x1="75" y1="115" x2="95" y2="115" stroke="#666" stroke-width="1.5"/>

  <circle cx="110" cy="115" r="15" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="110" y="119" text-anchor="middle" class="tufte-mono" font-size="10">C2</text>

  <line x1="125" y1="115" x2="145" y2="115" stroke="#666" stroke-width="1.5"/>

  <circle cx="160" cy="115" r="15" fill="#ccc" stroke="#333" stroke-width="2"/>
  <text x="160" y="119" text-anchor="middle" class="tufte-mono" font-size="10">C3</text>

  <text x="160" y="95" text-anchor="middle" class="tufte-mono" font-size="11" fill="#333">HEAD</text>
  <line x1="160" y1="97" x2="160" y2="100" stroke="#333" stroke-width="1"/>

  <text x="110" y="145" text-anchor="middle" class="tufte-label">HEAD~1</text>
  <text x="60" y="145" text-anchor="middle" class="tufte-label">HEAD~2</text>

  <!-- Section 2: File Restoration -->
  <rect x="250" y="55" width="200" height="110" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="350" y="75" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">파일 복원</text>

  <!-- Repository to Working Dir -->
  <rect x="270" y="95" width="70" height="35" fill="#e8e8e8" stroke="#666" stroke-width="1" rx="3"/>
  <text x="305" y="117" text-anchor="middle" class="tufte-label">저장소</text>

  <rect x="360" y="95" width="70" height="35" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="395" y="117" text-anchor="middle" class="tufte-label">작업 디렉터리</text>

  <line x1="340" y1="112" x2="358" y2="112" stroke="#666" stroke-width="1.0" marker-end="url(#arrowhead)"/>

  <text x="350" y="150" text-anchor="middle" class="tufte-mono" font-size="11">git checkout</text>

  <!-- Section 3: Tracking Exclusion -->
  <rect x="470" y="55" width="200" height="110" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="570" y="75" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">추적 제외</text>

  <!-- .gitignore concept -->
  <rect x="490" y="95" width="70" height="30" fill="#fff" stroke="#666" stroke-width="1" rx="3"/>
  <text x="525" y="114" text-anchor="middle" class="tufte-mono" font-size="10">.gitignore</text>

  <line x1="560" y1="110" x2="580" y2="100" stroke="#999" stroke-width="1"/>
  <line x1="560" y1="110" x2="580" y2="110" stroke="#999" stroke-width="1"/>
  <line x1="560" y1="110" x2="580" y2="120" stroke="#999" stroke-width="1"/>

  <text x="590" y="100" class="tufte-mono" font-size="9" fill="#999">*.pyc</text>
  <text x="590" y="112" class="tufte-mono" font-size="9" fill="#999">*.log</text>
  <text x="590" y="124" class="tufte-mono" font-size="9" fill="#999">results/</text>

  <text x="570" y="150" text-anchor="middle" class="tufte-label">무시 패턴 설정</text>

  <!-- Bottom: Command Summary -->
  <rect x="30" y="185" width="640" height="120" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
  <text x="350" y="205" text-anchor="middle" class="tufte-text" font-size="13" fill="#666">주요 명령어</text>

  <!-- Commands grid -->
  <text x="80" y="235" class="tufte-mono" font-size="11">git diff HEAD~n</text>
  <text x="80" y="255" class="tufte-label">변경 비교</text>

  <text x="230" y="235" class="tufte-mono" font-size="11">git log --patch</text>
  <text x="230" y="255" class="tufte-label">이력 상세 조회</text>

  <text x="380" y="235" class="tufte-mono" font-size="11">git checkout</text>
  <text x="380" y="255" class="tufte-label">파일 복원</text>

  <text x="520" y="235" class="tufte-mono" font-size="11">git reset</text>
  <text x="520" y="255" class="tufte-label">스테이징 취소</text>

  <text x="80" y="285" class="tufte-mono" font-size="11">git revert</text>
  <text x="80" y="300" class="tufte-label">커밋 되돌리기</text>

  <text x="230" y="285" class="tufte-mono" font-size="11">git show</text>
  <text x="230" y="300" class="tufte-label">커밋 상세 보기</text>

  <text x="380" y="285" class="tufte-mono" font-size="11">.gitignore</text>
  <text x="380" y="300" class="tufte-label">추적 제외 설정</text>

  <text x="520" y="285" class="tufte-mono" font-size="11">git status --ignored</text>
  <text x="520" y="300" class="tufte-label">무시 파일 확인</text>
</svg>