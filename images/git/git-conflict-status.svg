<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 750 400">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="750" height="420" fill="#ffffff"/>

  <!-- ========== 타임라인 레이블 ========== -->
  <text x="30" y="60" class="tufte-text" font-size="13" fill="#555">① 공통 시작점</text>
  <text x="30" y="175" class="tufte-text" font-size="13" fill="#555">② 각자 작업 (서로 모름)</text>
  <text x="30" y="350" class="tufte-text" font-size="13" fill="#555">③ 충돌 인지 시점</text>

  <!-- ========== 상단: 원본 파일 (공통 시작점) ========== -->
  <g transform="translate(275, 45)">
    <rect x="0" y="0" width="200" height="75" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="4"/>
    <text x="100" y="22" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">원본 mars.txt</text>
    <text x="100" y="42" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">Cold and dry...</text>
    <text x="100" y="56" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">The two moons...</text>
    <text x="100" y="70" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">But the Mummy...</text>
  </g>

  <!-- 분기 화살표 -->
  <line x1="325" y1="120" x2="200" y2="175" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="120" x2="550" y2="175" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ========== 왼쪽: 소유자 로컬 ========== -->
  <g transform="translate(70, 185)">
    <rect x="0" y="0" width="260" height="110" fill="#f0f0f0" stroke="#555" stroke-width="1.5" rx="4"/>
    <text x="130" y="24" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">소유자 로컬</text>
    <text x="130" y="46" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">Cold and dry...</text>
    <text x="130" y="60" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">The two moons...</text>
    <text x="130" y="74" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">But the Mummy...</text>
    <rect x="15" y="80" width="230" height="20" fill="#e0e0e0" stroke="#888" stroke-width="1" rx="2"/>
    <text x="130" y="95" text-anchor="middle" class="tufte-mono" font-size="11" fill="#333" font-weight="bold">We added a different line...</text>
  </g>
  <text x="200" y="310" text-anchor="middle" class="tufte-label" font-size="12">git commit 완료</text>

  <!-- ========== 오른쪽: GitHub 원격 (협력자 push 완료) ========== -->
  <g transform="translate(420, 185)">
    <rect x="0" y="0" width="260" height="110" fill="#e8e8e8" stroke="#555" stroke-width="1.5" rx="4"/>
    <text x="130" y="24" text-anchor="middle" class="tufte-text" font-size="14" font-weight="bold">GitHub 원격</text>
    <text x="130" y="46" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">Cold and dry...</text>
    <text x="130" y="60" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">The two moons...</text>
    <text x="130" y="74" text-anchor="middle" class="tufte-mono" font-size="11" fill="#555">But the Mummy...</text>
    <rect x="15" y="80" width="230" height="20" fill="#d0d0d0" stroke="#888" stroke-width="1" rx="2"/>
    <text x="130" y="95" text-anchor="middle" class="tufte-mono" font-size="11" fill="#333" font-weight="bold">This line added to Wolfman's copy</text>
  </g>
  <text x="550" y="310" text-anchor="middle" class="tufte-label" font-size="12">협력자 push 완료</text>

  <!-- ========== 중앙 하단: push 시도 및 거부 ========== -->

  <!-- push 시도 화살표 (소유자 → GitHub) -->
	<g transform="translate(-30, -10)">
		<line x1="270" y1="330" x2="360" y2="370" stroke="#555" stroke-width="2" marker-end="url(#arrowhead-red)" stroke-dasharray="6,3"/>
		<text x="305" y="335" class="tufte-mono" font-size="12" fill="#555">git push</text>
	</g>

  <!-- 거부 표시 -->
  <g transform="translate(335, 360)">
    <rect x="0" y="0" width="80" height="30" fill="#e0e0e0" stroke="#555" stroke-width="2" rx="4"/>
    <text x="40" y="20" text-anchor="middle" class="tufte-mono" font-size="13" fill="#333" font-weight="bold">rejected!</text>
  </g>

  <!-- 충돌 인지 설명 박스 -->
  <g transform="translate(440, 345)">
    <rect x="0" y="0" width="280" height="60" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="4"/>
    <text x="140" y="20" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold" fill="#333">충돌 인지 시점</text>
    <text x="140" y="38" text-anchor="middle" class="tufte-label" font-size="12">소유자가 push 시도할 때 비로소</text>
    <text x="140" y="54" text-anchor="middle" class="tufte-label" font-size="12">원격에 다른 변경이 있음을 알게 됨</text>
  </g>

</svg>
