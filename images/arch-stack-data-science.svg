<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 140">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 13px; fill: #333; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #333; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 9px; fill: #666; }
      .box { fill: #f5f5f5; stroke: #666; stroke-width: 1; }
      .arrow { stroke: #999; stroke-width: 1; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="750" height="140" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="22" class="tufte-title">데이터 과학 스택</text>

  <!-- Data Processing Chain -->
  <text x="20" y="50" class="tufte-small" fill="#666">데이터 처리</text>

  <rect x="90" y="38" width="70" height="28" rx="3" class="box"/>
  <text x="125" y="55" text-anchor="middle" class="tufte-label">NumPy</text>
  <text x="125" y="64" text-anchor="middle" class="tufte-small">배열 연산</text>

  <path d="M 160 52 L 180 52" class="arrow"/>

  <rect x="185" y="38" width="75" height="28" rx="3" class="box"/>
  <text x="222" y="55" text-anchor="middle" class="tufte-label">pandas</text>
  <text x="222" y="64" text-anchor="middle" class="tufte-small">데이터프레임</text>

  <path d="M 260 52 L 280 52" class="arrow"/>

  <rect x="285" y="38" width="85" height="28" rx="3" class="box"/>
  <text x="327" y="55" text-anchor="middle" class="tufte-label">scikit-learn</text>
  <text x="327" y="64" text-anchor="middle" class="tufte-small">머신러닝</text>

  <path d="M 370 52 L 390 52" class="arrow"/>

  <rect x="395" y="38" width="75" height="28" rx="3" class="box"/>
  <text x="432" y="55" text-anchor="middle" class="tufte-label">XGBoost</text>
  <text x="432" y="64" text-anchor="middle" class="tufte-small">부스팅</text>

  <rect x="480" y="38" width="80" height="28" rx="3" class="box"/>
  <text x="520" y="55" text-anchor="middle" class="tufte-label">LightGBM</text>
  <text x="520" y="64" text-anchor="middle" class="tufte-small">경량 부스팅</text>

  <!-- Visualization Chain -->
  <text x="20" y="100" class="tufte-small" fill="#666">시각화</text>

  <rect x="90" y="88" width="85" height="28" rx="3" class="box"/>
  <text x="132" y="105" text-anchor="middle" class="tufte-label">matplotlib</text>
  <text x="132" y="114" text-anchor="middle" class="tufte-small">정적 시각화</text>

  <path d="M 175 102 L 195 102" class="arrow"/>

  <rect x="200" y="88" width="75" height="28" rx="3" class="box"/>
  <text x="237" y="105" text-anchor="middle" class="tufte-label">seaborn</text>
  <text x="237" y="114" text-anchor="middle" class="tufte-small">통계 시각화</text>

  <path d="M 275 102 L 295 102" class="arrow"/>

  <rect x="300" y="88" width="70" height="28" rx="3" class="box"/>
  <text x="335" y="105" text-anchor="middle" class="tufte-label">plotly</text>
  <text x="335" y="114" text-anchor="middle" class="tufte-small">인터랙티브</text>

  <!-- Notebook -->
  <rect x="600" y="60" width="130" height="35" rx="3" class="box" stroke-dasharray="3,2"/>
  <text x="665" y="80" text-anchor="middle" class="tufte-label">Jupyter Notebook</text>
  <text x="665" y="91" text-anchor="middle" class="tufte-small">통합 개발 환경</text>
</svg>
