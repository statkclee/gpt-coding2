<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 800 350">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 18px; fill: #333; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 13px; fill: #333; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; fill: #333; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #666; }
      .tufte-code { font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 12px; fill: #666; }
      .tufte-era { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 12px; fill: #999; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
    <marker id="arrowhead-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#fff" />

  <!-- Main Title -->
  <!-- <text x="400" y="30" text-anchor="middle" class="tufte-title">컴파일러: "무엇(What)"과 "어떻게(How)"의 분리</text> -->

  <!-- ========================================== -->
  <!-- SECTION 1: BEFORE (The Manual Era) -->
  <!-- ========================================== -->
  <g transform="translate(40, 60)">
    <!-- Background Area -->
    <rect x="0" y="0" width="720" height="140" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" stroke-dasharray="4,2"/>

    <text x="20" y="28" class="tufte-label">Before: 모든 것을 인간이 감당</text>
    <text x="220" y="28" class="tufte-era">(1940-50s)</text>
    <line x1="15" y1="38" x2="705" y2="38" stroke="#ddd"/>

    <!-- Human Logic -->
    <g transform="translate(60, 55)">
      <circle cx="30" cy="28" r="25" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
      <text x="30" y="33" text-anchor="middle" font-size="18">😰</text>
      <text x="30" y="68" text-anchor="middle" class="tufte-small">인간</text>
    </g>

    <!-- The Gap/Burden -->
    <g transform="translate(150, 70)">
      <text x="100" y="0" text-anchor="middle" class="tufte-small">번역 + 최적화 + 실행 (모두 수동)</text>
      <line x1="10" y1="15" x2="190" y2="15" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="4,3"/>
    </g>

    <!-- Machine Code -->
    <g transform="translate(380, 55)">
      <rect x="0" y="0" width="140" height="55" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="4"/>
      <text x="70" y="25" text-anchor="middle" class="tufte-code">01101010 11010011</text>
      <text x="70" y="43" text-anchor="middle" class="tufte-code">11100010 00010101</text>
      <text x="70" y="70" text-anchor="middle" class="tufte-small">기계어 (Hardware)</text>
    </g>

    <!-- Insight Box Right -->
    <g transform="translate(555, 50)">
      <rect x="0" y="0" width="150" height="75" fill="#fff" stroke="#999" stroke-dasharray="4,2" rx="4"/>
      <text x="75" y="18" text-anchor="middle" class="tufte-label" font-size="11">문제점</text>
      <line x1="10" y1="25" x2="140" y2="25" stroke="#ddd"/>
      <text x="15" y="42" class="tufte-small">- 하드웨어 종속적</text>
      <text x="15" y="55" class="tufte-small">- 낮은 생산성 (1x)</text>
      <text x="15" y="68" class="tufte-small">- 오류 발생 시 치명적</text>
    </g>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(400, 210)">
    <line x1="-350" y1="0" x2="350" y2="0" stroke="#ccc" stroke-dasharray="6,4"/>
    <text x="0" y="18" text-anchor="middle" class="tufte-era">패러다임 전환 (1957, FORTRAN)</text>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 2: AFTER (The Compiler Era) -->
  <!-- ========================================== -->
  <g transform="translate(40, 240)">
    <!-- Background Area -->
    <rect x="0" y="0" width="720" height="140" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>

    <text x="20" y="28" class="tufte-label">After: 역할의 분리와 자동화</text>
    <line x1="15" y1="38" x2="705" y2="38" stroke="#ddd"/>

    <!-- Human Logic -->
    <g transform="translate(50, 50)">
      <circle cx="30" cy="28" r="25" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <text x="30" y="33" text-anchor="middle" font-size="18">😎</text>
      <text x="30" y="68" text-anchor="middle" class="tufte-small">인간</text>
      <text x="30" y="82" text-anchor="middle" class="tufte-small" font-weight="bold">"의도"</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="115" y1="78" x2="155" y2="78" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-dark)"/>

    <!-- The COMPILER (Hero) -->
    <g transform="translate(165, 48)">
      <rect x="0" y="0" width="150" height="70" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
      <text x="75" y="22" text-anchor="middle" class="tufte-label">컴파일러</text>
      <line x1="15" y1="30" x2="135" y2="30" stroke="#ddd"/>
      <text x="75" y="48" text-anchor="middle" class="tufte-text">자동 번역</text>
      <text x="75" y="62" text-anchor="middle" class="tufte-text">최적화</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="325" y1="78" x2="365" y2="78" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-dark)"/>

    <!-- Machine -->
    <g transform="translate(375, 50)">
      <rect x="0" y="0" width="130" height="60" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="4"/>
      <text x="65" y="25" text-anchor="middle" class="tufte-code">기계어 실행</text>
      <text x="65" y="45" text-anchor="middle" class="tufte-small">하드웨어</text>
    </g>

    <!-- Insight Box Right -->
    <g transform="translate(530, 45)">
      <rect x="0" y="0" width="170" height="80" fill="#fff" stroke="#666" stroke-width="1" rx="4"/>
      <text x="85" y="18" text-anchor="middle" class="tufte-label" font-size="11">분업의 효과</text>
      <line x1="10" y1="25" x2="160" y2="25" stroke="#ddd"/>
      <text x="15" y="42" class="tufte-small">- 인간: 논리에만 집중</text>
      <text x="15" y="55" class="tufte-small">- 생산성 100배 향상</text>
      <text x="15" y="68" class="tufte-small">- 이식성 (Portability)</text>
    </g>
  </g>

  <!-- Bottom Insight -->
  <!-- <g transform="translate(40, 395)">
    <rect x="0" y="-12" width="720" height="28" fill="#f5f5f5" stroke="#999" rx="4"/>
    <text x="360" y="6" text-anchor="middle" class="tufte-text">
      핵심 통찰: 역할 분리가 생산성을 폭발시킨다. 인간은 "의도"에, 기계는 "번역과 실행"에 집중한다.
    </text>
  </g> -->

</svg>
