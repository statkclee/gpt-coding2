<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 13px; fill: #333; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #333; font-weight: bold; }
      .tufte-desc { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 9px; fill: #666; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 8px; fill: #999; }
      .box { fill: #f5f5f5; stroke: #666; stroke-width: 1; }
      .box-highlight { fill: #e8e8e8; stroke: #333; stroke-width: 1.5; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 4,2; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="750" height="200" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="22" class="tufte-title">데이터 과학 아키텍처: ML 파이프라인</text>

  <!-- Pipeline stages -->
  <!-- Data Collection -->
  <rect x="20" y="45" width="100" height="50" rx="3" class="box"/>
  <text x="70" y="65" text-anchor="middle" class="tufte-label">데이터 수집</text>
  <text x="70" y="80" text-anchor="middle" class="tufte-desc">API, DB, 파일</text>

  <path d="M 120 70 L 140 70" class="arrow"/>

  <!-- Preprocessing -->
  <rect x="145" y="45" width="100" height="50" rx="3" class="box"/>
  <text x="195" y="65" text-anchor="middle" class="tufte-label">전처리</text>
  <text x="195" y="80" text-anchor="middle" class="tufte-desc">정제, 변환</text>

  <path d="M 245 70 L 265 70" class="arrow"/>

  <!-- Feature Engineering -->
  <rect x="270" y="45" width="100" height="50" rx="3" class="box-highlight"/>
  <text x="320" y="65" text-anchor="middle" class="tufte-label">피처 엔지니어링</text>
  <text x="320" y="80" text-anchor="middle" class="tufte-desc">Feature Store</text>

  <path d="M 370 70 L 390 70" class="arrow"/>

  <!-- Training -->
  <rect x="395" y="45" width="100" height="50" rx="3" class="box"/>
  <text x="445" y="65" text-anchor="middle" class="tufte-label">모델 학습</text>
  <text x="445" y="80" text-anchor="middle" class="tufte-desc">학습, 검증</text>

  <path d="M 495 70 L 515 70" class="arrow"/>

  <!-- Evaluation -->
  <rect x="520" y="45" width="100" height="50" rx="3" class="box"/>
  <text x="570" y="65" text-anchor="middle" class="tufte-label">평가</text>
  <text x="570" y="80" text-anchor="middle" class="tufte-desc">메트릭 검증</text>

  <path d="M 620 70 L 640 70" class="arrow"/>

  <!-- Deployment -->
  <rect x="645" y="45" width="85" height="50" rx="3" class="box-highlight"/>
  <text x="687" y="65" text-anchor="middle" class="tufte-label">배포</text>
  <text x="687" y="80" text-anchor="middle" class="tufte-desc">서빙</text>

  <!-- Supporting Components -->
  <text x="20" y="125" class="tufte-small" fill="#666">지원 컴포넌트</text>

  <!-- Model Registry -->
  <rect x="145" y="135" width="130" height="45" rx="3" class="box"/>
  <text x="210" y="155" text-anchor="middle" class="tufte-label">Model Registry</text>
  <text x="210" y="168" text-anchor="middle" class="tufte-desc">모델 버전 관리</text>

  <!-- Experiment Tracking -->
  <rect x="295" y="135" width="130" height="45" rx="3" class="box"/>
  <text x="360" y="155" text-anchor="middle" class="tufte-label">Experiment Tracking</text>
  <text x="360" y="168" text-anchor="middle" class="tufte-desc">실험 기록, 비교</text>

  <!-- Monitoring -->
  <rect x="445" y="135" width="130" height="45" rx="3" class="box"/>
  <text x="510" y="155" text-anchor="middle" class="tufte-label">Monitoring</text>
  <text x="510" y="168" text-anchor="middle" class="tufte-desc">드리프트 감지</text>

  <!-- Dashed lines connecting to pipeline -->
  <path d="M 210 135 L 210 95" class="arrow dashed" style="marker-end: none"/>
  <path d="M 360 135 L 360 95" class="arrow dashed" style="marker-end: none"/>
  <path d="M 510 135 L 570 95" class="arrow dashed" style="marker-end: none"/>

  <!-- vs Web comparison note -->
  <text x="20" y="195" class="tufte-small">vs 웹 아키텍처: 요청-응답(Request-Response) → 파이프라인(Pipeline) 중심</text>
</svg>
