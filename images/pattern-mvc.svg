<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" class="tufte-title" text-anchor="middle">MVC 패턴</text>

  <!-- User -->
  <rect x="40" y="100" width="80" height="60" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="3"/>
  <text x="80" y="125" class="tufte-label" text-anchor="middle">User</text>
  <text x="80" y="145" class="tufte-small" text-anchor="middle">사용자</text>

  <!-- Arrow: User → Controller -->
  <line x1="120" y1="115" x2="178" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="149" y="105" class="tufte-small">요청</text>

  <!-- Controller -->
  <rect x="190" y="70" width="160" height="120" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="270" y="95" class="tufte-label" text-anchor="middle">Controller</text>
  <line x1="205" y1="105" x2="335" y2="105" stroke="#ccc" stroke-width="1"/>
  <text x="270" y="125" class="tufte-desc" text-anchor="middle">입력 처리</text>
  <text x="270" y="145" class="tufte-code" text-anchor="middle">요청 파싱</text>
  <text x="270" y="160" class="tufte-code" text-anchor="middle">Model 호출</text>
  <text x="270" y="175" class="tufte-code" text-anchor="middle">View 선택</text>

  <!-- Arrow: Controller → Model -->
  <line x1="350" y1="100" x2="428" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="389" y="90" class="tufte-small">데이터 요청</text>

  <!-- Model -->
  <rect x="440" y="70" width="160" height="120" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="520" y="95" class="tufte-label" text-anchor="middle">Model</text>
  <line x1="455" y1="105" x2="585" y2="105" stroke="#ccc" stroke-width="1"/>
  <text x="520" y="125" class="tufte-desc" text-anchor="middle">비즈니스 로직</text>
  <text x="520" y="145" class="tufte-code" text-anchor="middle">데이터 관리</text>
  <text x="520" y="160" class="tufte-code" text-anchor="middle">유효성 검사</text>
  <text x="520" y="175" class="tufte-code" text-anchor="middle">상태 변경</text>

  <!-- Arrow: Model → Controller (return) -->
  <line x1="440" y1="160" x2="352" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="175" class="tufte-small">결과</text>

  <!-- Arrow: Controller → View -->
  <line x1="270" y1="190" x2="270" y2="228" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="285" y="210" class="tufte-small">데이터 전달</text>

  <!-- View -->
  <rect x="190" y="240" width="160" height="60" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="270" y="265" class="tufte-label" text-anchor="middle">View</text>
  <text x="270" y="285" class="tufte-desc" text-anchor="middle">UI 렌더링 (HTML, JSON)</text>

  <!-- Arrow: View → User -->
  <line x1="190" y1="270" x2="122" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="220" class="tufte-small">응답</text>

  <!-- Optional: Model → View (direct) -->
  <line x1="520" y1="190" x2="350" y2="255" stroke="#999" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="450" y="235" class="tufte-small" fill="#999">옵저버 (선택)</text>

  <!-- Variants box -->
  <rect x="620" y="70" width="160" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="700" y="95" class="tufte-label" text-anchor="middle">변형</text>
  <line x1="635" y1="105" x2="765" y2="105" stroke="#ccc" stroke-width="1"/>
  <text x="700" y="125" class="tufte-code" text-anchor="middle">MVP (Presenter)</text>
  <text x="700" y="145" class="tufte-small" text-anchor="middle">View 완전 수동</text>
  <text x="700" y="165" class="tufte-code" text-anchor="middle">MVVM (ViewModel)</text>
  <text x="700" y="185" class="tufte-small" text-anchor="middle">데이터 바인딩</text>

  <!-- Bottom note -->
  <text x="400" y="310" class="tufte-small" text-anchor="middle">1979년 Smalltalk-80에서 시작, 현재 웹 프레임워크의 기본 구조</text>
</svg>
