<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 9px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 9px;
        fill: #999;
      }
      .tufte-number {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #fff;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="28" class="tufte-title" text-anchor="middle">ATAM: 아키텍처 트레이드오프 분석 방법</text>
  <text x="400" y="46" class="tufte-desc" text-anchor="middle">Architecture Tradeoff Analysis Method (SEI/CMU)</text>

  <!-- Phase 1 -->
  <circle cx="100" cy="95" r="16" fill="#333"/>
  <text x="100" y="100" class="tufte-number" text-anchor="middle">1</text>
  <rect x="40" y="120" width="120" height="65" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="100" y="142" class="tufte-label" text-anchor="middle">비즈니스 드라이버</text>
  <line x1="50" y1="150" x2="150" y2="150" stroke="#ccc" stroke-width="1"/>
  <text x="100" y="165" class="tufte-desc" text-anchor="middle">목표, 제약조건</text>
  <text x="100" y="178" class="tufte-code" text-anchor="middle">시장 출시 시간</text>

  <!-- Arrow 1→2 -->
  <line x1="160" y1="150" x2="198" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2 -->
  <circle cx="270" cy="95" r="16" fill="#333"/>
  <text x="270" y="100" class="tufte-number" text-anchor="middle">2</text>
  <rect x="210" y="120" width="120" height="65" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="270" y="142" class="tufte-label" text-anchor="middle">품질 속성 유틸리티</text>
  <line x1="220" y1="150" x2="320" y2="150" stroke="#ccc" stroke-width="1"/>
  <text x="270" y="165" class="tufte-desc" text-anchor="middle">품질 요구사항 정의</text>
  <text x="270" y="178" class="tufte-code" text-anchor="middle">시나리오 작성</text>

  <!-- Arrow 2→3 -->
  <line x1="330" y1="150" x2="368" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3 -->
  <circle cx="440" cy="95" r="16" fill="#333"/>
  <text x="440" y="100" class="tufte-number" text-anchor="middle">3</text>
  <rect x="380" y="120" width="120" height="65" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="440" y="142" class="tufte-label" text-anchor="middle">아키텍처 분석</text>
  <line x1="390" y1="150" x2="490" y2="150" stroke="#ccc" stroke-width="1"/>
  <text x="440" y="165" class="tufte-desc" text-anchor="middle">아키텍처 접근법</text>
  <text x="440" y="178" class="tufte-code" text-anchor="middle">패턴, 전술 식별</text>

  <!-- Arrow 3→4 -->
  <line x1="500" y1="150" x2="538" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 4 -->
  <circle cx="610" cy="95" r="16" fill="#333"/>
  <text x="610" y="100" class="tufte-number" text-anchor="middle">4</text>
  <rect x="550" y="120" width="120" height="65" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="610" y="142" class="tufte-label" text-anchor="middle">트레이드오프 분석</text>
  <line x1="560" y1="150" x2="660" y2="150" stroke="#ccc" stroke-width="1"/>
  <text x="610" y="165" class="tufte-desc" text-anchor="middle">민감점, 위험점</text>
  <text x="610" y="178" class="tufte-code" text-anchor="middle">결정 문서화</text>

  <!-- Arrow 4→5 -->
  <line x1="670" y1="150" x2="708" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 5 (Output) -->
  <circle cx="760" cy="95" r="16" fill="#666"/>
  <text x="760" y="100" class="tufte-number" text-anchor="middle">5</text>
  <rect x="700" y="120" width="85" height="65" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="742" y="145" class="tufte-label" text-anchor="middle">결과물</text>
  <text x="742" y="162" class="tufte-code" text-anchor="middle">위험 목록</text>
  <text x="742" y="175" class="tufte-code" text-anchor="middle">결정 근거</text>

  <!-- Quality Attribute Scenario Template -->
  <rect x="40" y="210" width="720" height="100" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="400" y="232" class="tufte-subtitle" text-anchor="middle">품질 속성 시나리오 템플릿</text>
  <line x1="55" y1="242" x2="745" y2="242" stroke="#ccc" stroke-width="1"/>

  <!-- Scenario components -->
  <rect x="55" y="255" width="100" height="45" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="105" y="275" class="tufte-label" text-anchor="middle">자극원</text>
  <text x="105" y="292" class="tufte-code" text-anchor="middle">사용자, 시스템</text>

  <text x="170" y="280" class="tufte-desc">→</text>

  <rect x="185" y="255" width="100" height="45" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="235" y="275" class="tufte-label" text-anchor="middle">자극</text>
  <text x="235" y="292" class="tufte-code" text-anchor="middle">요청, 장애</text>

  <text x="300" y="280" class="tufte-desc">→</text>

  <rect x="315" y="255" width="100" height="45" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="365" y="275" class="tufte-label" text-anchor="middle">환경</text>
  <text x="365" y="292" class="tufte-code" text-anchor="middle">정상, 과부하</text>

  <text x="430" y="280" class="tufte-desc">→</text>

  <rect x="445" y="255" width="100" height="45" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="495" y="275" class="tufte-label" text-anchor="middle">아티팩트</text>
  <text x="495" y="292" class="tufte-code" text-anchor="middle">시스템, 컴포넌트</text>

  <text x="560" y="280" class="tufte-desc">→</text>

  <rect x="575" y="255" width="100" height="45" fill="#fff" stroke="#333" stroke-width="1.5" rx="2"/>
  <text x="625" y="275" class="tufte-label" text-anchor="middle">응답 측정</text>
  <text x="625" y="292" class="tufte-code" text-anchor="middle">지연시간 &lt;100ms</text>

  <!-- Example scenario -->
  <rect x="40" y="325" width="720" height="80" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="400" y="348" class="tufte-subtitle" text-anchor="middle">시나리오 예시: 성능</text>
  <line x1="55" y1="358" x2="745" y2="358" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="378" class="tufte-desc" text-anchor="middle">"[사용자]가 [검색 요청]을 보내면, [정상 운영] 상태에서 [검색 서비스]가</text>
  <text x="400" y="395" class="tufte-desc" text-anchor="middle">[평균 200ms 이내]에 결과를 반환해야 한다."</text>
</svg>
