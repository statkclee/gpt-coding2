<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="30" class="tufte-title" text-anchor="middle">Singleton 패턴</text>

  <!-- Multiple requests -->
  <rect x="40" y="70" width="100" height="40" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="3"/>
  <text x="90" y="95" class="tufte-label" text-anchor="middle">Client A</text>

  <rect x="40" y="130" width="100" height="40" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="3"/>
  <text x="90" y="155" class="tufte-label" text-anchor="middle">Client B</text>

  <rect x="40" y="190" width="100" height="40" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="3"/>
  <text x="90" y="215" class="tufte-label" text-anchor="middle">Client C</text>

  <!-- Arrows to Singleton -->
  <line x1="140" y1="90" x2="230" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="150" x2="230" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="210" x2="230" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Singleton class -->
  <rect x="240" y="80" width="200" height="140" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
  <text x="340" y="105" class="tufte-label" text-anchor="middle">Configuration</text>
  <text x="340" y="120" class="tufte-small" text-anchor="middle">@singleton</text>
  <line x1="255" y1="130" x2="425" y2="130" stroke="#ccc" stroke-width="1"/>
  <text x="340" y="150" class="tufte-code" text-anchor="middle">_instance: Configuration</text>
  <line x1="255" y1="160" x2="425" y2="160" stroke="#ccc" stroke-width="1"/>
  <text x="340" y="180" class="tufte-code" text-anchor="middle">get(key) → value</text>
  <text x="340" y="195" class="tufte-code" text-anchor="middle">set(key, value)</text>

  <!-- Single instance -->
  <line x1="440" y1="150" x2="510" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="100" width="150" height="100" fill="#fff" stroke="#666" stroke-width="2" rx="3"/>
  <text x="595" y="125" class="tufte-label" text-anchor="middle">유일한 인스턴스</text>
  <line x1="535" y1="135" x2="655" y2="135" stroke="#ccc" stroke-width="1"/>
  <text x="595" y="155" class="tufte-code" text-anchor="middle">settings = {</text>
  <text x="595" y="170" class="tufte-code" text-anchor="middle">  "debug": True,</text>
  <text x="595" y="185" class="tufte-code" text-anchor="middle">}</text>

  <!-- Note -->
  <rect x="150" y="250" width="400" height="50" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="350" y="270" class="tufte-desc" text-anchor="middle">모든 클라이언트가 같은 인스턴스를 공유</text>
  <text x="350" y="287" class="tufte-small" text-anchor="middle">config1 is config2 → True</text>
</svg>
