<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="750" height="280" fill="#ffffff"/>

  <!-- Title -->
  <text x="375" y="30" class="tufte-title" text-anchor="middle">Adapter 패턴</text>

  <!-- Client -->
  <rect x="40" y="90" width="120" height="70" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="3"/>
  <text x="100" y="115" class="tufte-label" text-anchor="middle">Client</text>
  <line x1="55" y1="125" x2="145" y2="125" stroke="#ccc" stroke-width="1"/>
  <text x="100" y="145" class="tufte-code" text-anchor="middle">printer.output()</text>

  <!-- Arrow: Client -> Target -->
  <line x1="160" y1="125" x2="218" y2="125" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="189" y="115" class="tufte-small">호출</text>

  <!-- Target Interface -->
  <rect x="230" y="60" width="140" height="70" fill="#fff" stroke="#666" stroke-width="1" stroke-dasharray="4" rx="3"/>
  <text x="300" y="85" class="tufte-small" text-anchor="middle">«interface»</text>
  <text x="300" y="100" class="tufte-label" text-anchor="middle">Target</text>
  <line x1="245" y1="108" x2="355" y2="108" stroke="#ccc" stroke-width="1"/>
  <text x="300" y="125" class="tufte-code" text-anchor="middle">output(content)</text>

  <!-- Adapter -->
  <rect x="230" y="150" width="140" height="80" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
  <text x="300" y="175" class="tufte-label" text-anchor="middle">Adapter</text>
  <line x1="245" y1="185" x2="355" y2="185" stroke="#ccc" stroke-width="1"/>
  <text x="300" y="205" class="tufte-code" text-anchor="middle">output(content)</text>
  <text x="300" y="220" class="tufte-code" text-anchor="middle" fill="#999">→ adaptee.print_document()</text>

  <!-- Implements arrow -->
  <line x1="300" y1="150" x2="300" y2="130" stroke="#999" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Arrow: Adapter -> Adaptee -->
  <line x1="370" y1="190" x2="448" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="409" y="180" class="tufte-small">위임</text>

  <!-- Adaptee -->
  <rect x="460" y="150" width="160" height="80" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="540" y="175" class="tufte-label" text-anchor="middle">Adaptee (Legacy)</text>
  <line x1="475" y1="185" x2="605" y2="185" stroke="#ccc" stroke-width="1"/>
  <text x="540" y="205" class="tufte-code" text-anchor="middle">print_document(text)</text>
  <text x="540" y="220" class="tufte-small" text-anchor="middle" fill="#999">기존 인터페이스</text>

  <!-- Note -->
  <rect x="460" y="60" width="160" height="55" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="540" y="80" class="tufte-small" text-anchor="middle">클라이언트가 기대하는</text>
  <text x="540" y="95" class="tufte-small" text-anchor="middle">output()을 호출하면</text>
  <text x="540" y="110" class="tufte-small" text-anchor="middle">Adapter가 변환</text>

  <!-- Bottom note -->
  <text x="375" y="260" class="tufte-small" text-anchor="middle">Adapter는 Target 인터페이스를 구현하고, 내부에서 Adaptee의 메서드를 호출</text>
</svg>
