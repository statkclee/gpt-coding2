<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #555; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-size: 10px; }
      .entity-box { fill: #fff; stroke: #333; stroke-width: 2; }
      .concept-box { fill: #f5f5f5; stroke: #999; stroke-width: 1.5; }
      .highlight { fill: #e8e8e8; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#333" />
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#999" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>

  <!-- ========================================== -->
  <!-- 상단: 모델링의 본질 - 실세계 → 테이블 -->
  <!-- ========================================== -->

  <!-- 실세계 (왼쪽) -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="180" height="110" class="concept-box" rx="8"/>
    <text x="90" y="22" text-anchor="middle" class="tufte-title" font-size="12">실세계</text>
    <line x1="15" y1="32" x2="165" y2="32" stroke="#ccc" stroke-width="1"/>

    <!-- 실세계 개체들 -->
    <text x="90" y="55" text-anchor="middle" class="tufte-text" font-size="11">아티스트가 앨범을 만든다</text>
    <text x="90" y="75" text-anchor="middle" class="tufte-text" font-size="11">앨범에 트랙이 담긴다</text>
    <text x="90" y="95" text-anchor="middle" class="tufte-text" font-size="11">학생이 강좌를 수강한다</text>
  </g>

  <!-- 화살표 1 -->
  <g transform="translate(220, 75)">
    <path d="M 0,0 L 50,0" stroke="#666" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <text x="25" y="-8" text-anchor="middle" class="tufte-small">추상화</text>
  </g>

  <!-- 개념 모델 (중앙) -->
  <g transform="translate(280, 30)">
    <rect x="0" y="0" width="200" height="110" class="concept-box" rx="8"/>
    <text x="100" y="22" text-anchor="middle" class="tufte-title" font-size="12">개념 모델</text>
    <line x1="15" y1="32" x2="185" y2="32" stroke="#ccc" stroke-width="1"/>

    <!-- 개체와 관계 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="50" height="22" fill="#e8e8e8" stroke="#666" stroke-width="1" rx="3"/>
      <text x="25" y="15" text-anchor="middle" class="tufte-mono" font-size="9">개체</text>
    </g>
    <g transform="translate(130, 50)">
      <rect x="0" y="0" width="50" height="22" fill="#e8e8e8" stroke="#666" stroke-width="1" rx="3"/>
      <text x="25" y="15" text-anchor="middle" class="tufte-mono" font-size="9">개체</text>
    </g>
    <!-- 관계 다이아몬드 -->
    <g transform="translate(100, 61)">
      <polygon points="0,-12 15,0 0,12 -15,0" fill="#fff" stroke="#666" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" class="tufte-mono" font-size="7">관계</text>
    </g>
    <line x1="70" y1="61" x2="85" y2="61" stroke="#666" stroke-width="1"/>
    <line x1="115" y1="61" x2="130" y2="61" stroke="#666" stroke-width="1"/>

    <text x="100" y="100" text-anchor="middle" class="tufte-label" font-size="10">"누가 무엇과 어떤 관계?"</text>
  </g>

  <!-- 화살표 2 -->
  <g transform="translate(490, 75)">
    <path d="M 0,0 L 50,0" stroke="#666" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <text x="25" y="-8" text-anchor="middle" class="tufte-small">구현</text>
  </g>

  <!-- 테이블 구조 (오른쪽) -->
  <g transform="translate(550, 30)">
    <rect x="0" y="0" width="220" height="110" class="concept-box" rx="8"/>
    <text x="110" y="22" text-anchor="middle" class="tufte-title" font-size="12">테이블 구조</text>
    <line x1="15" y1="32" x2="205" y2="32" stroke="#ccc" stroke-width="1"/>

    <!-- 미니 테이블들 -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="60" height="45" fill="#fff" stroke="#333" stroke-width="1.5" rx="2"/>
      <rect x="0" y="0" width="60" height="14" fill="#c8c8c8" stroke="#333" stroke-width="1.5" rx="2"/>
      <text x="30" y="11" text-anchor="middle" class="tufte-mono" font-size="8">Artist</text>
      <text x="12" y="28" text-anchor="middle" class="tufte-mono" font-size="7">id</text>
      <text x="42" y="28" text-anchor="middle" class="tufte-mono" font-size="7">name</text>
      <line x1="24" y1="15" x2="24" y2="45" stroke="#999" stroke-width="0.5"/>
    </g>
    <g transform="translate(140, 45)">
      <rect x="0" y="0" width="60" height="45" fill="#fff" stroke="#333" stroke-width="1.5" rx="2"/>
      <rect x="0" y="0" width="60" height="14" fill="#c8c8c8" stroke="#333" stroke-width="1.5" rx="2"/>
      <text x="30" y="11" text-anchor="middle" class="tufte-mono" font-size="8">Track</text>
      <text x="15" y="28" text-anchor="middle" class="tufte-mono" font-size="7">title</text>
      <text x="45" y="28" text-anchor="middle" class="tufte-mono" font-size="7">artist_id</text>
      <line x1="30" y1="15" x2="30" y2="45" stroke="#999" stroke-width="0.5"/>
    </g>
    <!-- 연결선 -->
    <path d="M 80,68 L 140,68" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="110" y="62" text-anchor="middle" class="tufte-small">FK</text>

    <text x="110" y="105" text-anchor="middle" class="tufte-label" font-size="10">"키로 관계를 표현"</text>
  </g>

  <!-- ========================================== -->
  <!-- 하단: 세 가지 관계 유형 -->
  <!-- ========================================== -->
  <g transform="translate(30, 160)">
    <text x="385" y="0" text-anchor="middle" class="tufte-title" font-size="13">관계의 세 가지 유형</text>
    <line x1="0" y1="10" x2="740" y2="10" stroke="#ddd" stroke-width="1"/>

    <!-- 1:1 관계 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="230" height="95" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6"/>
      <text x="115" y="20" text-anchor="middle" class="tufte-title" font-size="11">1:1 (일대일)</text>

      <g transform="translate(30, 35)">
        <rect x="0" y="0" width="55" height="35" class="entity-box" rx="3"/>
        <text x="27" y="22" text-anchor="middle" class="tufte-mono" font-size="10">사람</text>
      </g>
      <g transform="translate(145, 35)">
        <rect x="0" y="0" width="55" height="35" class="entity-box" rx="3"/>
        <text x="27" y="22" text-anchor="middle" class="tufte-mono" font-size="10">여권</text>
      </g>
      <line x1="85" y1="52" x2="145" y2="52" stroke="#333" stroke-width="1.5"/>
      <text x="115" y="47" text-anchor="middle" class="tufte-mono" font-size="9">1 — 1</text>

      <text x="115" y="88" text-anchor="middle" class="tufte-small">한 사람 = 하나의 여권</text>
    </g>

    <!-- 1:N 관계 -->
    <g transform="translate(255, 30)">
      <rect x="0" y="0" width="230" height="95" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6"/>
      <text x="115" y="20" text-anchor="middle" class="tufte-title" font-size="11">1:N (일대다)</text>

      <g transform="translate(30, 35)">
        <rect x="0" y="0" width="55" height="35" class="entity-box" rx="3"/>
        <text x="27" y="22" text-anchor="middle" class="tufte-mono" font-size="10">Artist</text>
      </g>
      <g transform="translate(145, 35)">
        <rect x="0" y="0" width="55" height="35" class="entity-box" rx="3"/>
        <text x="27" y="22" text-anchor="middle" class="tufte-mono" font-size="10">Track</text>
      </g>
      <line x1="85" y1="52" x2="145" y2="52" stroke="#333" stroke-width="1.5"/>
      <text x="115" y="47" text-anchor="middle" class="tufte-mono" font-size="9">1 — N</text>
      <!-- 까마귀 발 -->
      <line x1="140" y1="47" x2="145" y2="52" stroke="#333" stroke-width="1.5"/>
      <line x1="140" y1="57" x2="145" y2="52" stroke="#333" stroke-width="1.5"/>

      <text x="115" y="88" text-anchor="middle" class="tufte-small">한 아티스트 = 여러 트랙</text>
    </g>

    <!-- N:M 관계 -->
    <g transform="translate(510, 30)">
      <rect x="0" y="0" width="230" height="95" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6"/>
      <text x="115" y="20" text-anchor="middle" class="tufte-title" font-size="11">N:M (다대다)</text>

      <g transform="translate(15, 35)">
        <rect x="0" y="0" width="50" height="35" class="entity-box" rx="3"/>
        <text x="25" y="22" text-anchor="middle" class="tufte-mono" font-size="10">학생</text>
      </g>
      <g transform="translate(90, 35)">
        <rect x="0" y="0" width="50" height="35" fill="#e8e8e8" stroke="#666" stroke-width="1.5" rx="3"/>
        <text x="25" y="22" text-anchor="middle" class="tufte-mono" font-size="9">등록</text>
      </g>
      <g transform="translate(165, 35)">
        <rect x="0" y="0" width="50" height="35" class="entity-box" rx="3"/>
        <text x="25" y="22" text-anchor="middle" class="tufte-mono" font-size="10">강좌</text>
      </g>
      <line x1="65" y1="52" x2="90" y2="52" stroke="#333" stroke-width="1.5"/>
      <line x1="140" y1="52" x2="165" y2="52" stroke="#333" stroke-width="1.5"/>
      <!-- 까마귀 발 양쪽: 학생→수강(N), 강좌→수강(N) -->
      <line x1="86" y1="47" x2="90" y2="52" stroke="#333" stroke-width="1.5"/>
      <line x1="86" y1="57" x2="90" y2="52" stroke="#333" stroke-width="1.5"/>
      <line x1="144" y1="47" x2="140" y2="52" stroke="#333" stroke-width="1.5"/>
      <line x1="144" y1="57" x2="140" y2="52" stroke="#333" stroke-width="1.5"/>

      <text x="115" y="88" text-anchor="middle" class="tufte-small">학생 N ↔ N 강좌</text>
    </g>
  </g>

</svg>
