<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">
  <defs>
    <style>
      .tufte-title { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 16px; font-weight: bold; fill: #222; }
      .tufte-label { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 13px; font-weight: bold; fill: #333; }
      .tufte-text { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #444; }
      .tufte-small { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #666; }
      .tufte-code { font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 10px; fill: #333; }

      .box-main { fill: #f8f9fa; stroke: #333; stroke-width: 1.5; }
      .box-secondary { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .box-highlight { fill: #e9ecef; stroke: #495057; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 중앙: 문제 상황 -->
  <rect x="250" y="20" width="200" height="50" rx="5" class="box-highlight"/>
  <text x="350" y="40" class="tufte-label" text-anchor="middle">Makefile 문제 발생</text>
  <text x="350" y="57" class="tufte-small" text-anchor="middle">"왜 빌드가 안 되지?"</text>

  <!-- 화살표들 -->
  <path d="M280,70 L150,110" class="arrow"/>
  <path d="M350,70 L350,110" class="arrow"/>
  <path d="M420,70 L550,110" class="arrow"/>

  <!-- 왼쪽: 드라이 런 -->
  <rect x="30" y="115" width="200" height="100" rx="5" class="box-main"/>
  <text x="130" y="140" class="tufte-label" text-anchor="middle">드라이 런</text>
  <text x="40" y="165" class="tufte-code">$ make -n 타겟</text>
  <text x="40" y="182" class="tufte-small">실행 없이 명령 확인</text>
  <text x="40" y="200" class="tufte-small">-B 옵션: 강제 전체 재빌드</text>

  <!-- 중앙: 의존성 추적 -->
  <rect x="250" y="115" width="200" height="100" rx="5" class="box-main"/>
  <text x="350" y="140" class="tufte-label" text-anchor="middle">의존성 추적</text>
  <text x="260" y="165" class="tufte-code">$ make -d 타겟</text>
  <text x="260" y="182" class="tufte-small">Make의 판단 과정 출력</text>
  <text x="260" y="200" class="tufte-small">왜 최신/오래됨 판단했는지</text>

  <!-- 오른쪽: 타임스탬프 -->
  <rect x="470" y="115" width="200" height="100" rx="5" class="box-main"/>
  <text x="570" y="140" class="tufte-label" text-anchor="middle">타임스탬프 확인</text>
  <text x="480" y="165" class="tufte-code">$ ls -la 파일들</text>
  <text x="480" y="182" class="tufte-small">파일 수정 시간 비교</text>
  <text x="480" y="200" class="tufte-small">의존성보다 타겟이 오래됐나?</text>

  <!-- 하단: 흔한 실수들 -->
  <line x1="30" y1="240" x2="670" y2="240" stroke="#dee2e6" stroke-width="1"/>
  <text x="350" y="260" class="tufte-label" text-anchor="middle">흔한 실수</text>

  <rect x="30" y="275" width="195" height="55" rx="4" class="box-secondary"/>
  <text x="127" y="295" class="tufte-text" text-anchor="middle" style="font-weight:bold;">탭 vs 스페이스</text>
  <text x="127" y="315" class="tufte-small" text-anchor="middle">액션은 반드시 TAB으로 시작</text>

  <rect x="252" y="275" width="195" height="55" rx="4" class="box-secondary"/>
  <text x="350" y="295" class="tufte-text" text-anchor="middle" style="font-weight:bold;">의존성 누락</text>
  <text x="350" y="315" class="tufte-small" text-anchor="middle">스크립트도 의존성에 포함</text>

  <rect x="475" y="275" width="195" height="55" rx="4" class="box-secondary"/>
  <text x="572" y="295" class="tufte-text" text-anchor="middle" style="font-weight:bold;">순환 의존성</text>
  <text x="572" y="315" class="tufte-small" text-anchor="middle">A→B→A 불가 (DAG 필수)</text>
</svg>
