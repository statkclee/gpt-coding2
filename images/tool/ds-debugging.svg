<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 800 280">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .layer-box { fill: #f8f8f8; stroke: #333; stroke-width: 1.5; }
      .step-box { fill: #fff; stroke: #666; stroke-width: 1; }
      .flow-line { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- 왼쪽: 세 가지 오류 층 -->
  <g transform="translate(40, 55)">
    <!-- Layer 1: 문법 오류 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="70" class="layer-box" rx="4"/>
      <text x="110" y="20" text-anchor="middle" class="tufte-title" font-size="11">1. R 문법 오류</text>
      <line x1="10" y1="28" x2="210" y2="28" stroke="#ddd" stroke-width="1"/>
      <text x="110" y="45" text-anchor="middle" class="tufte-mono" font-size="9">unexpected symbol / ')'</text>
      <text x="110" y="60" text-anchor="middle" class="tufte-small">괄호, 쉼표, 파이프 누락</text>
    </g>

    <!-- Layer 2: 패키지/함수 오류 -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="220" height="70" class="layer-box" rx="4"/>
      <text x="110" y="20" text-anchor="middle" class="tufte-title" font-size="11">2. 패키지/함수 오류</text>
      <line x1="10" y1="28" x2="210" y2="28" stroke="#ddd" stroke-width="1"/>
      <text x="110" y="45" text-anchor="middle" class="tufte-mono" font-size="9">could not find function</text>
      <text x="110" y="60" text-anchor="middle" class="tufte-small">library() 누락, 오타</text>
    </g>

    <!-- Layer 3: 데이터 오류 -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="220" height="70" class="layer-box" rx="4"/>
      <text x="110" y="20" text-anchor="middle" class="tufte-title" font-size="11">3. 데이터/타입 오류</text>
      <line x1="10" y1="28" x2="210" y2="28" stroke="#ddd" stroke-width="1"/>
      <text x="110" y="45" text-anchor="middle" class="tufte-mono" font-size="9">object not found / NA</text>
      <text x="110" y="60" text-anchor="middle" class="tufte-small">열 이름 오류, 결측치</text>
    </g>
  </g>

  <!-- 화살표 -->
  <path d="M 280,145 L 320,145" class="flow-line" marker-end="url(#arrow)"/>

  <!-- 오른쪽: 디버깅 전략 -->
  <g transform="translate(340, 55)">
    <rect x="0" y="0" width="410" height="250" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="6"/>
    <text x="205" y="22" text-anchor="middle" class="tufte-title" font-size="12">R 디버깅 3단계 전략</text>
    <line x1="15" y1="32" x2="395" y2="32" stroke="#ddd" stroke-width="1"/>

    <!-- 전략 1: 단계별 실행 -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="380" height="55" class="step-box" rx="4"/>
      <text x="10" y="18" text-anchor="start" class="tufte-title" font-size="11">① 파이프 끊어서 실행</text>
      <text x="10" y="35" text-anchor="start" class="tufte-text" font-size="10">긴 파이프라인을 한 단계씩 실행하며 중간 결과 확인</text>
      <text x="10" y="50" text-anchor="start" class="tufte-label" font-size="9">→ 어느 동사에서 문제가 생기는지 범위 좁히기</text>
    </g>

    <!-- 전략 2: 데이터 구조 확인 -->
    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="380" height="55" class="step-box" rx="4"/>
      <text x="10" y="18" text-anchor="start" class="tufte-title" font-size="11">② glimpse()로 구조 확인</text>
      <text x="10" y="35" text-anchor="start" class="tufte-text" font-size="10">glimpse(df), names(df), class(df$col)로 데이터 점검</text>
      <text x="10" y="50" text-anchor="start" class="tufte-label" font-size="9">→ 열 이름, 타입, 결측치 유무 즉시 파악</text>
    </g>

    <!-- 전략 3: 에러 메시지 해석 -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="380" height="55" class="step-box" rx="4"/>
      <text x="10" y="18" text-anchor="start" class="tufte-title" font-size="11">③ 에러 메시지 읽기</text>
      <text x="10" y="35" text-anchor="start" class="tufte-text" font-size="10">rlang 에러는 문제 위치와 원인을 친절히 안내</text>
      <text x="10" y="50" text-anchor="start" class="tufte-label" font-size="9">→ "Did you mean X?" 제안을 먼저 확인</text>
    </g>
  </g>

</svg>
