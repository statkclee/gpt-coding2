<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 800 250">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .verb-box { fill: #f8f8f8; stroke: #333; stroke-width: 1.5; }
      .data-box { fill: #e8e8e8; stroke: #666; stroke-width: 1; }
      .flow-line { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="280" fill="#ffffff"/>

  <!-- 상단 제목 -->
  <!-- <text x="400" y="25" text-anchor="middle" class="tufte-title" font-size="13">dplyr 핵심 동사: 데이터 조작의 다섯 가지 행동</text>
  <line x1="100" y1="35" x2="700" y2="35" stroke="#ddd" stroke-width="1"/> -->

  <!-- 행 조작 (filter, arrange) -->
  <g transform="translate(30, 55)">
    <text x="85" y="0" text-anchor="middle" class="tufte-label" font-size="11">행(Row) 조작</text>

    <!-- filter -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="170" height="85" class="verb-box" rx="4"/>
      <text x="85" y="20" text-anchor="middle" class="tufte-title" font-size="11">filter()</text>
      <line x1="10" y1="28" x2="160" y2="28" stroke="#ddd" stroke-width="1"/>

      <!-- 미니 테이블 before -->
      <rect x="15" y="35" width="40" height="35" class="data-box" rx="2"/>
      <line x1="15" y1="50" x2="55" y2="50" stroke="#999" stroke-width="0.5"/>
      <line x1="15" y1="58" x2="55" y2="58" stroke="#999" stroke-width="0.5"/>
      <rect x="15" y="50" width="40" height="8" fill="#c8c8c8" stroke="none"/>

      <text x="85" y="55" text-anchor="middle" class="tufte-mono" font-size="10">→</text>

      <!-- 미니 테이블 after -->
      <rect x="115" y="42" width="40" height="20" class="data-box" rx="2"/>
      <rect x="115" y="42" width="40" height="10" fill="#c8c8c8" stroke="none"/>

      <text x="85" y="82" text-anchor="middle" class="tufte-small">조건에 맞는 행 선택</text>
    </g>
  </g>

  <!-- 열 조작 (select, mutate) -->
  <g transform="translate(220, 55)">
    <text x="85" y="0" text-anchor="middle" class="tufte-label" font-size="11">열(Column) 조작</text>

    <!-- select -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="170" height="85" class="verb-box" rx="4"/>
      <text x="85" y="20" text-anchor="middle" class="tufte-title" font-size="11">select()</text>
      <line x1="10" y1="28" x2="160" y2="28" stroke="#ddd" stroke-width="1"/>

      <!-- 미니 테이블 before (3열) -->
      <rect x="10" y="35" width="50" height="30" class="data-box" rx="2"/>
      <line x1="27" y1="35" x2="27" y2="65" stroke="#999" stroke-width="0.5"/>
      <line x1="44" y1="35" x2="44" y2="65" stroke="#999" stroke-width="0.5"/>
      <rect x="27" y="35" width="17" height="30" fill="#c8c8c8" stroke="none"/>

      <text x="85" y="52" text-anchor="middle" class="tufte-mono" font-size="10">→</text>

      <!-- 미니 테이블 after (1열) -->
      <rect x="120" y="40" width="25" height="20" fill="#c8c8c8" stroke="#666" stroke-width="1" rx="2"/>

      <text x="85" y="78" text-anchor="middle" class="tufte-small">원하는 열만 선택</text>
    </g>
  </g>

  <!-- mutate -->
  <g transform="translate(410, 55)">
    <text x="85" y="0" text-anchor="middle" class="tufte-label" font-size="11">열 생성/변환</text>

    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="170" height="85" class="verb-box" rx="4"/>
      <text x="85" y="20" text-anchor="middle" class="tufte-title" font-size="11">mutate()</text>
      <line x1="10" y1="28" x2="160" y2="28" stroke="#ddd" stroke-width="1"/>

      <!-- 미니 테이블 before (2열) -->
      <rect x="15" y="38" width="40" height="25" class="data-box" rx="2"/>
      <line x1="35" y1="38" x2="35" y2="63" stroke="#999" stroke-width="0.5"/>

      <text x="85" y="52" text-anchor="middle" class="tufte-mono" font-size="10">→</text>

      <!-- 미니 테이블 after (3열, 새 열 강조) -->
      <rect x="110" y="38" width="50" height="25" class="data-box" rx="2"/>
      <line x1="127" y1="38" x2="127" y2="63" stroke="#999" stroke-width="0.5"/>
      <line x1="143" y1="38" x2="143" y2="63" stroke="#999" stroke-width="0.5"/>
      <rect x="143" y="38" width="17" height="25" fill="#c8c8c8" stroke="none"/>

      <text x="85" y="78" text-anchor="middle" class="tufte-small">새 열 추가/수정</text>
    </g>
  </g>

  <!-- 집계 (summarize, group_by) -->
  <g transform="translate(600, 55)">
    <text x="85" y="0" text-anchor="middle" class="tufte-label" font-size="11">집계/요약</text>

    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="170" height="85" class="verb-box" rx="4"/>
      <text x="85" y="20" text-anchor="middle" class="tufte-title" font-size="11">summarize()</text>
      <line x1="10" y1="28" x2="160" y2="28" stroke="#ddd" stroke-width="1"/>

      <!-- 미니 테이블 before (여러 행) -->
      <rect x="15" y="35" width="40" height="30" class="data-box" rx="2"/>
      <line x1="15" y1="45" x2="55" y2="45" stroke="#999" stroke-width="0.5"/>
      <line x1="15" y1="52" x2="55" y2="52" stroke="#999" stroke-width="0.5"/>
      <line x1="15" y1="59" x2="55" y2="59" stroke="#999" stroke-width="0.5"/>

      <text x="85" y="52" text-anchor="middle" class="tufte-mono" font-size="10">→</text>

      <!-- 결과 (1행) -->
      <rect x="115" y="45" width="40" height="15" fill="#c8c8c8" stroke="#666" stroke-width="1" rx="2"/>
      <text x="135" y="56" text-anchor="middle" class="tufte-mono" font-size="8">n=42</text>

      <text x="85" y="78" text-anchor="middle" class="tufte-small">통계량 계산</text>
    </g>
  </g>

  <!-- 하단: 파이프 연결 예시 -->
  <g transform="translate(30, 165)">
    <rect x="0" y="0" width="740" height="100" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="6"/>
    <text x="370" y="22" text-anchor="middle" class="tufte-title" font-size="12">파이프(|>)로 연결: 왼쪽에서 오른쪽으로 읽는 코드</text>
    <line x1="20" y1="32" x2="720" y2="32" stroke="#ddd" stroke-width="1"/>

    <!-- 코드 예시 -->
    <text x="30" y="55" text-anchor="start" class="tufte-mono" font-size="10">penguins |> filter(species == "Adelie") |> select(bill_length_mm) |> summarize(mean_bill = mean(bill_length_mm))</text>

    <!-- 흐름 설명 -->
    <g transform='translate(-30,0)'>
      <text x="100" y="78" text-anchor="middle" class="tufte-label" font-size="9">데이터</text>
      <path d="M 140,75 L 180,75" class="flow-line" marker-end="url(#arrow)"/>
      <text x="235" y="78" text-anchor="middle" class="tufte-label" font-size="9">행 필터</text>
      <path d="M 290,75 L 330,75" class="flow-line" marker-end="url(#arrow)"/>
      <text x="390" y="78" text-anchor="middle" class="tufte-label" font-size="9">열 선택</text>
      <path d="M 450,75 L 490,75" class="flow-line" marker-end="url(#arrow)"/>
      <text x="560" y="78" text-anchor="middle" class="tufte-label" font-size="9">집계</text>
      <path d="M 600,75 L 640,75" class="flow-line" marker-end="url(#arrow)"/>
      <text x="690" y="78" text-anchor="middle" class="tufte-label" font-size="9">결과</text>
    </g>

  </g>

</svg>
