<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .table-box { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .header-box { fill: #f0f0f0; stroke: #333; stroke-width: 1.5; }
      .junction-box { fill: #f8f8f8; stroke: #333; stroke-width: 2; }
      .flow-line { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="310" fill="#ffffff"/>

  <!-- User 테이블 (왼쪽) -->
  <g transform="translate(50, 50)">
    <text x="75" y="-10" text-anchor="middle" class="tufte-title" font-size="12">User</text>

    <rect x="0" y="0" width="150" height="25" class="header-box" rx="4"/>
    <text x="35" y="17" text-anchor="middle" class="tufte-title" font-size="10">id</text>
    <line x1="70" y1="0" x2="70" y2="25" stroke="#333" stroke-width="1"/>
    <text x="110" y="17" text-anchor="middle" class="tufte-title" font-size="10">name</text>

    <rect x="0" y="25" width="70" height="22" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
    <rect x="70" y="25" width="80" height="22" fill="#fff" stroke="#666" stroke-width="1"/>
    <text x="35" y="40" text-anchor="middle" class="tufte-mono" font-size="9">1</text>
    <text x="110" y="40" text-anchor="middle" class="tufte-mono" font-size="9">김철수</text>

    <rect x="0" y="47" width="70" height="22" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
    <rect x="70" y="47" width="80" height="22" fill="#fff" stroke="#666" stroke-width="1"/>
    <text x="35" y="62" text-anchor="middle" class="tufte-mono" font-size="9">2</text>
    <text x="110" y="62" text-anchor="middle" class="tufte-mono" font-size="9">이영희</text>

    <rect x="0" y="69" width="70" height="22" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
    <rect x="70" y="69" width="80" height="22" fill="#fff" stroke="#666" stroke-width="1"/>
    <text x="35" y="84" text-anchor="middle" class="tufte-mono" font-size="9">3</text>
    <text x="110" y="84" text-anchor="middle" class="tufte-mono" font-size="9">박민수</text>
  </g>

  <!-- Member 연결 테이블 (중앙) -->
  <g transform="translate(300, 50)">
    <text x="100" y="-10" text-anchor="middle" class="tufte-title" font-size="12">Member (연결 테이블)</text>

    <rect x="0" y="0" width="200" height="25" class="junction-box" rx="4"/>
    <text x="50" y="17" text-anchor="middle" class="tufte-title" font-size="10">user_id</text>
    <line x1="100" y1="0" x2="100" y2="25" stroke="#333" stroke-width="1"/>
    <text x="150" y="17" text-anchor="middle" class="tufte-title" font-size="10">course_id</text>

    <rect x="0" y="25" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <rect x="100" y="25" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <text x="50" y="39" text-anchor="middle" class="tufte-mono" font-size="9">1</text>
    <text x="150" y="39" text-anchor="middle" class="tufte-mono" font-size="9">1</text>

    <rect x="0" y="45" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <rect x="100" y="45" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <text x="50" y="59" text-anchor="middle" class="tufte-mono" font-size="9">1</text>
    <text x="150" y="59" text-anchor="middle" class="tufte-mono" font-size="9">2</text>

    <rect x="0" y="65" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <rect x="100" y="65" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <text x="50" y="79" text-anchor="middle" class="tufte-mono" font-size="9">2</text>
    <text x="150" y="79" text-anchor="middle" class="tufte-mono" font-size="9">1</text>

    <rect x="0" y="85" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <rect x="100" y="85" width="100" height="20" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <text x="50" y="99" text-anchor="middle" class="tufte-mono" font-size="9">3</text>
    <text x="150" y="99" text-anchor="middle" class="tufte-mono" font-size="9">2</text>
  </g>

  <!-- Course 테이블 (오른쪽) -->
  <g transform="translate(600, 50)">
    <text x="75" y="-10" text-anchor="middle" class="tufte-title" font-size="12">Course</text>

    <rect x="0" y="0" width="150" height="25" class="header-box" rx="4"/>
    <text x="35" y="17" text-anchor="middle" class="tufte-title" font-size="10">id</text>
    <line x1="70" y1="0" x2="70" y2="25" stroke="#333" stroke-width="1"/>
    <text x="110" y="17" text-anchor="middle" class="tufte-title" font-size="10">title</text>

    <rect x="0" y="25" width="70" height="22" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
    <rect x="70" y="25" width="80" height="22" fill="#fff" stroke="#666" stroke-width="1"/>
    <text x="35" y="40" text-anchor="middle" class="tufte-mono" font-size="9">1</text>
    <text x="110" y="40" text-anchor="middle" class="tufte-mono" font-size="9">Python</text>

    <rect x="0" y="47" width="70" height="22" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
    <rect x="70" y="47" width="80" height="22" fill="#fff" stroke="#666" stroke-width="1"/>
    <text x="35" y="62" text-anchor="middle" class="tufte-mono" font-size="9">2</text>
    <text x="110" y="62" text-anchor="middle" class="tufte-mono" font-size="9">SQL</text>
  </g>

  <!-- 관계선 -->
  <path d="M 200,80 L 300,80" class="flow-line"/>
  <text x="250" y="70" text-anchor="middle" class="tufte-label" font-size="9">1:N</text>

  <path d="M 500,80 L 600,80" class="flow-line"/>
  <text x="550" y="70" text-anchor="middle" class="tufte-label" font-size="9">N:1</text>

  <!-- 하단: 데이터 해석 패널 (1x2 수평 레이아웃) -->
  <g transform="translate(50, 185)">
    <rect x="0" y="0" width="700" height="115" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="6"/>

    <text x="350" y="22" text-anchor="middle" class="tufte-title" font-size="12">연결 테이블이 말하는 것</text>
    <line x1="20" y1="32" x2="680" y2="32" stroke="#ddd" stroke-width="1"/>

    <!-- 해석 예시 1: 김철수 (왼쪽) -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="130" height="45" fill="#e8e8e8" stroke="#666" stroke-width="1" rx="4"/>
      <text x="65" y="18" text-anchor="middle" class="tufte-mono" font-size="9">user_id=1, course_id=1</text>
      <text x="65" y="35" text-anchor="middle" class="tufte-mono" font-size="9">user_id=1, course_id=2</text>
    </g>
    <text x="160" y="68" text-anchor="middle" class="tufte-title" font-size="12">→</text>
    <text x="260" y="60" text-anchor="middle" class="tufte-text" font-size="10">김철수(1)는 Python(1)과</text>
    <text x="260" y="78" text-anchor="middle" class="tufte-text" font-size="10">SQL(2)을 모두 수강</text>

    <!-- 구분선 -->
    <line x1="350" y1="40" x2="350" y2="105" stroke="#ddd" stroke-width="1"/>

    <!-- 해석 예시 2: Python 수강생 (오른쪽) -->
    <g transform="translate(365, 45)">
      <rect x="0" y="0" width="130" height="45" fill="#e8e8e8" stroke="#666" stroke-width="1" rx="4"/>
      <text x="65" y="18" text-anchor="middle" class="tufte-mono" font-size="9">user_id=1, course_id=1</text>
      <text x="65" y="35" text-anchor="middle" class="tufte-mono" font-size="9">user_id=2, course_id=1</text>
    </g>
    <text x="510" y="68" text-anchor="middle" class="tufte-title" font-size="12">→</text>
    <text x="610" y="60" text-anchor="middle" class="tufte-text" font-size="10">Python(1)에는 김철수(1)와</text>
    <text x="610" y="78" text-anchor="middle" class="tufte-text" font-size="10">이영희(2)가 등록</text>
  </g>

</svg>
