<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 840 330">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #555; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-size: 10px; }
      .decision-box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; }
      .tool-box { fill: #fff; stroke: #333; stroke-width: 2; }
      .flow-line { fill: none; stroke: #555; stroke-width: 1.5; }
      .yes-label { fill: #333; font-weight: bold; }
      .no-label { fill: #666; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="-20" y="-10" width="840" height="330" fill="#ffffff"/>

  <!-- 시작점 -->
  <g transform="translate(350, 0)">
    <ellipse cx="50" cy="18" rx="45" ry="16" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
    <text x="50" y="22" text-anchor="middle" class="tufte-text" font-size="11">시작</text>
  </g>

  <!-- 첫 번째 질문: HTML 파싱? -->
  <path d="M 400,33 L 400,50" class="flow-line" marker-end="url(#arrow)"/>

  <g transform="translate(300, 55)">
    <polygon points="100,0 200,30 100,60 0,30" class="decision-box"/>
    <text x="100" y="28" text-anchor="middle" class="tufte-text" font-size="11">HTML에서</text>
    <text x="100" y="42" text-anchor="middle" class="tufte-text" font-size="11">데이터 추출?</text>
  </g>

  <!-- Yes → BeautifulSoup -->
  <path d="M 500,85 L 580,85 L 580,125" class="flow-line" marker-end="url(#arrow)"/>
  <text x="535" y="78" class="tufte-label yes-label" font-size="10">예</text>

  <g transform="translate(520, 130)">
    <rect x="0" y="0" width="120" height="55" class="tool-box" rx="4"/>
    <text x="60" y="20" text-anchor="middle" class="tufte-mono" font-size="13" font-weight="bold">BeautifulSoup</text>
    <text x="60" y="36" text-anchor="middle" class="tufte-small">HTML/XML 파싱</text>
    <text x="60" y="48" text-anchor="middle" class="tufte-small">망가진 HTML 처리</text>
  </g>

  <!-- No → 두 번째 질문: 외부 패키지 설치 가능? -->
  <path d="M 300,85 L 220,85 L 220,125" class="flow-line" marker-end="url(#arrow)"/>
  <text x="255" y="78" class="tufte-label no-label" font-size="10">아니오</text>

  <g transform="translate(120, 130)">
    <polygon points="100,0 200,30 100,60 0,30" class="decision-box"/>
    <text x="100" y="28" text-anchor="middle" class="tufte-text" font-size="11">외부 패키지</text>
    <text x="100" y="42" text-anchor="middle" class="tufte-text" font-size="11">설치 가능?</text>
  </g>

  <!-- No → urllib -->
  <path d="M 120,160 L 60,160 L 60,205" class="flow-line" marker-end="url(#arrow)"/>
  <text x="85" y="153" class="tufte-label no-label" font-size="10">아니오</text>

  <g transform="translate(0, 210)">
    <rect x="0" y="0" width="120" height="55" class="tool-box" rx="4"/>
    <text x="60" y="20" text-anchor="middle" class="tufte-mono" font-size="13" font-weight="bold">urllib</text>
    <text x="60" y="36" text-anchor="middle" class="tufte-small">표준 라이브러리</text>
    <text x="60" y="48" text-anchor="middle" class="tufte-small">설치 없이 사용</text>
  </g>

  <!-- Yes → 세 번째 질문: 복잡한 HTTP? -->
  <path d="M 320,160 L 380,160 L 380,200" class="flow-line" marker-end="url(#arrow)"/>
  <text x="345" y="153" class="tufte-label yes-label" font-size="10">예</text>

  <g transform="translate(280, 205)">
    <polygon points="100,0 200,30 100,60 0,30" class="decision-box"/>
    <text x="100" y="22" text-anchor="middle" class="tufte-text" font-size="11">세션/인증/JSON</text>
    <text x="100" y="36" text-anchor="middle" class="tufte-text" font-size="11">API 필요?</text>
  </g>

  <!-- Yes → requests -->
  <path d="M 480,235 L 540,235 L 540,270" class="flow-line" marker-end="url(#arrow)"/>
  <text x="505" y="228" class="tufte-label yes-label" font-size="10">예</text>

  <g transform="translate(480, 250)">
    <rect x="0" y="0" width="120" height="55" class="tool-box" rx="4" stroke-width="2.5"/>
    <text x="60" y="20" text-anchor="middle" class="tufte-mono" font-size="13" font-weight="bold">requests</text>
    <text x="60" y="36" text-anchor="middle" class="tufte-small">실무 표준</text>
    <text x="60" y="48" text-anchor="middle" class="tufte-small">직관적 API</text>
  </g>

  <!-- No → 네 번째 질문: 저수준 제어? -->
  <path d="M 280,235 L 220,235 L 220,270" class="flow-line" marker-end="url(#arrow)"/>
  <text x="245" y="228" class="tufte-label no-label" font-size="10">아니오</text>

  <g transform="translate(120, 250)">
    <polygon points="100,0 180,25 100,50 20,25" class="decision-box"/>
    <text x="100" y="22" text-anchor="middle" class="tufte-text" font-size="11">저수준 제어</text>
    <text x="100" y="36" text-anchor="middle" class="tufte-text" font-size="11">필요?</text>
  </g>

  <!-- Yes → socket -->
  <path d="M 140,275 L 80,275 L 80,285" class="flow-line"/>
  <text x="105" y="288" class="tufte-label yes-label" font-size="10">예</text>

  <!-- socket 결과 (왼쪽 하단) -->
  <g transform="translate(20, 0)">
    <text x="60" y="300" text-anchor="middle" class="tufte-mono" font-size="11" font-weight="bold">socket</text>
    <text x="60" y="312" text-anchor="middle" class="tufte-small">TCP 직접 제어</text>
  </g>

  <!-- No → requests (기본 선택) -->
  <path d="M 300,275 L 380,275 L 380,285 L 480,285" class="flow-line" marker-end="url(#arrow)"/>
  <text x="335" y="288" class="tufte-label no-label" font-size="10">아니오</text>

  <!-- 오른쪽: 도구별 핵심 특징 -->
  <g transform="translate(650, 55)">
    <rect x="0" y="0" width="150" height="250" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="75" y="20" text-anchor="middle" class="tufte-title" font-size="11">도구별 핵심</text>

    <line x1="10" y1="30" x2="140" y2="30" stroke="#ddd" stroke-width="1"/>

    <text x="15" y="50" class="tufte-mono" font-size="10" font-weight="bold">socket</text>
    <text x="15" y="64" class="tufte-small">프로토콜 학습/특수 통신</text>

    <line x1="10" y1="75" x2="140" y2="75" stroke="#eee" stroke-width="1"/>

    <text x="15" y="95" class="tufte-mono" font-size="10" font-weight="bold">urllib</text>
    <text x="15" y="109" class="tufte-small">표준 라이브러리 제약 환경</text>

    <line x1="10" y1="120" x2="140" y2="120" stroke="#eee" stroke-width="1"/>

    <text x="15" y="140" class="tufte-mono" font-size="10" font-weight="bold">requests</text>
    <text x="15" y="154" class="tufte-small">실무 90% 이상 사용</text>
    <text x="15" y="168" class="tufte-small">JSON/세션/인증 지원</text>

    <line x1="10" y1="180" x2="140" y2="180" stroke="#eee" stroke-width="1"/>

    <text x="15" y="200" class="tufte-mono" font-size="10" font-weight="bold">BeautifulSoup</text>
    <text x="15" y="214" class="tufte-small">HTML 데이터 추출</text>
    <text x="15" y="228" class="tufte-small">requests와 함께 사용</text>
  </g>
</svg>
