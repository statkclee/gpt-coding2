<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 800 270">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; font-size: 11px; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .match-box { fill: #e8e8e8; stroke: #333; stroke-width: 1.5; }
      .no-match { fill: #fff; stroke: #ccc; stroke-width: 1; }
      .highlight { fill: #d0d0d0; }
      .section-bg { fill: #fafafa; stroke: #ddd; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- 제목 -->
  <!-- <text x="400" y="30" text-anchor="middle" class="tufte-title" font-size="16">탐욕적 매칭 vs 비탐욕적 매칭</text> -->
  <text x="400" y="55" text-anchor="middle" class="tufte-label">입력 문자열: From: user@a.com to admin@b.org</text>

  <!-- 탐욕적 매칭 섹션 -->
  <rect x="30" y="70" width="355" height="220" class="section-bg" rx="4"/>
  <text x="207" y="95" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">탐욕적 (Greedy): .+@</text>
  <text x="207" y="115" text-anchor="middle" class="tufte-label">"가능한 많이" 매칭</text>

  <!-- 탐욕적: 입력 문자열 시각화 -->
  <g transform="translate(50, 135)">
    <text x="0" y="0" class="tufte-small">입력:</text>
    <rect x="50" y="-15" width="280" height="22" class="no-match" rx="2"/>
    <text x="55" y="0" class="tufte-mono" font-size="11">From: user@a.com to admin@b.org</text>
  </g>

  <!-- 탐욕적: 매칭 결과 -->
  <g transform="translate(50, 175)">
    <text x="0" y="0" class="tufte-small">매칭:</text>
    <rect x="50" y="-15" width="230" height="22" class="match-box" rx="2"/>
    <rect x="50" y="-15" width="230" height="22" class="highlight" rx="2"/>
    <text x="55" y="0" class="tufte-mono" font-size="11">From: user@a.com to admin@</text>
    <text x="285" y="0" class="tufte-mono" font-size="11">b.org</text>
  </g>

  <!-- 탐욕적: 설명 -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" class="tufte-small">결과:</text>
    <text x="50" y="0" class="tufte-mono" font-size="11">"From: user@a.com to admin@"</text>
  </g>

  <g transform="translate(50, 250)">
    <text x="0" y="0" class="tufte-text" font-size="11">✗ 마지막 @까지 확장</text>
    <text x="0" y="18" class="tufte-text" font-size="11">✗ 첫 번째 이메일 손실</text>
  </g>

  <!-- 비탐욕적 매칭 섹션 -->
  <rect x="415" y="70" width="355" height="220" class="section-bg" rx="4"/>
  <text x="592" y="95" text-anchor="middle" class="tufte-text" font-size="13" font-weight="bold">비탐욕적 (Lazy): .+?@</text>
  <text x="592" y="115" text-anchor="middle" class="tufte-label">"최소한으로" 매칭</text>

  <!-- 비탐욕적: 입력 문자열 시각화 -->
  <g transform="translate(435, 135)">
    <text x="0" y="0" class="tufte-small">입력:</text>
    <rect x="50" y="-15" width="280" height="22" class="no-match" rx="2"/>
    <text x="55" y="0" class="tufte-mono" font-size="11">From: user@a.com to admin@b.org</text>
  </g>

  <!-- 비탐욕적: 매칭 결과 -->
  <g transform="translate(435, 175)">
    <text x="0" y="0" class="tufte-small">매칭:</text>
    <rect x="50" y="-15" width="82" height="22" class="match-box" rx="2"/>
    <rect x="50" y="-15" width="82" height="22" class="highlight" rx="2"/>
    <text x="55" y="0" class="tufte-mono" font-size="11">From: user@</text>
    <text x="137" y="0" class="tufte-mono" font-size="11">a.com to admin@b.org</text>
  </g>

  <!-- 비탐욕적: 설명 -->
  <g transform="translate(435, 220)">
    <text x="0" y="0" class="tufte-small">결과:</text>
    <text x="50" y="0" class="tufte-mono" font-size="11">"From: user@"</text>
  </g>

  <g transform="translate(435, 250)">
    <text x="0" y="0" class="tufte-text" font-size="11">✓ 첫 번째 @에서 멈춤</text>
    <text x="0" y="18" class="tufte-text" font-size="11">✓ 정확한 위치 매칭</text>
  </g>

  <!-- 하단 요약 -->
  <!-- <line x1="50" y1="300" x2="750" y2="300" stroke="#ccc" stroke-width="1"/> -->
  <text x="645" y="285" text-anchor="middle" class="tufte-label" font-size="11">팁: +, * 뒤에 ?를 붙이면 비탐욕적 매칭 (예: .*? , .+?)</text>
</svg>
