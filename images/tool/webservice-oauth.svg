<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 800 300">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .main-box { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .danger-box { fill: #fff; stroke: #666; stroke-width: 1; stroke-dasharray: 4,2; }
      .safe-box { fill: #f8f8f8; stroke: #333; stroke-width: 2; }
      .flow-line { fill: none; stroke: #555; stroke-width: 1.5; }
      .danger-line { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 4,2; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
    <marker id="arrow-danger" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#888" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>

  <!-- 상단: 핵심 질문 -->
  <!-- <text x="400" y="28" text-anchor="middle" class="tufte-title" font-size="15">OAuth: 비밀번호 없이 권한을 위임하다</text> -->

  <!-- 좌측: 위험한 방식 (비밀번호 공유) -->
  <g transform="translate(30, 50)">
    <text x="150" y="15" text-anchor="middle" class="tufte-label" font-size="12">❌ 위험한 방식</text>

    <!-- 사용자 -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="80" height="50" class="danger-box" rx="4"/>
      <text x="40" y="22" text-anchor="middle" class="tufte-text" font-size="11">사용자</text>
      <text x="40" y="38" text-anchor="middle" class="tufte-small">(나)</text>
    </g>

    <!-- 비밀번호 전달 -->
    <path d="M 105,60 L 175,60" class="danger-line" marker-end="url(#arrow-danger)"/>
    <text x="140" y="52" text-anchor="middle" class="tufte-mono" font-size="9">비밀번호</text>

    <!-- 제3자 앱 -->
    <g transform="translate(180, 35)">
      <rect x="0" y="0" width="80" height="50" class="danger-box" rx="4"/>
      <text x="40" y="22" text-anchor="middle" class="tufte-text" font-size="11">제3자 앱</text>
      <text x="40" y="38" text-anchor="middle" class="tufte-small">(캘린더 앱)</text>
    </g>

    <!-- 결과 -->
    <g transform="translate(40, 105)">
      <text x="0" y="0" class="tufte-text" font-size="10">→ 앱이 내 비밀번호를 안다</text>
      <text x="0" y="18" class="tufte-text" font-size="10">→ 모든 권한 접근 가능</text>
      <text x="0" y="36" class="tufte-text" font-size="10">→ 취소하려면 비밀번호 변경</text>
    </g>
  </g>

  <!-- 우측: 안전한 방식 (OAuth) -->
  <g transform="translate(400, 30)">
    <text x="170" y="15" text-anchor="middle" class="tufte-label" font-size="12">✓ OAuth 방식</text>

    <!-- 3자 관계 다이어그램 -->
    <!-- 사용자 -->
    <g transform="translate(130, 30)">
      <rect x="0" y="0" width="80" height="45" class="safe-box" rx="4"/>
      <text x="40" y="20" text-anchor="middle" class="tufte-text" font-size="11">사용자</text>
      <text x="40" y="35" text-anchor="middle" class="tufte-small">(나)</text>
    </g>

    <!-- 제3자 앱 (왼쪽 아래) -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="100" height="45" class="main-box" rx="4"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-text" font-size="11">제3자 앱</text>
      <text x="50" y="35" text-anchor="middle" class="tufte-small">(캘린더 앱)</text>
    </g>

    <!-- 서비스 제공자 (오른쪽 아래) -->
    <g transform="translate(220, 110)">
      <rect x="0" y="0" width="100" height="45" class="safe-box" rx="4"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-text" font-size="11">구글</text>
      <text x="50" y="35" text-anchor="middle" class="tufte-small">(내 데이터 보관)</text>
    </g>

    <!-- 흐름 1: 사용자 → 구글 (로그인) -->
    <path d="M 200,75 L 260,110" class="flow-line" marker-end="url(#arrow)"/>
    <text x="255" y="88" text-anchor="middle" class="tufte-mono" font-size="8">① 직접 로그인</text>

    <!-- 흐름 2: 구글 → 사용자 (승인 요청) -->
    <path d="M 250,110 L 190,75" class="flow-line" marker-end="url(#arrow)"/>
    <text x="195" y="100" text-anchor="middle" class="tufte-mono" font-size="8">② 허용할까요?</text>

    <!-- 흐름 3: 구글 → 앱 (토큰 발급) -->
    <path d="M 220,132 L 125,132" class="flow-line" marker-end="url(#arrow)"/>
    <text x="172" y="145" text-anchor="middle" class="tufte-mono" font-size="8">③ 토큰 발급</text>

    <!-- 결과 -->
    <g transform="translate(50, 175)">
      <text x="0" y="0" class="tufte-text" font-size="10">→ 앱은 비밀번호를 모른다</text>
      <text x="0" y="18" class="tufte-text" font-size="10">→ 허용한 권한만 접근</text>
      <text x="0" y="36" class="tufte-text" font-size="10">→ 언제든 토큰만 취소</text>
    </g>
  </g>

  <!-- 하단: 핵심 비유 -->
  <g transform="translate(30, 250)">
    <rect x="0" y="0" width="740" height="65" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="6"/>

    <text x="370" y="22" text-anchor="middle" class="tufte-title" font-size="12">OAuth = 발렛 키 <tspan class="tufte-label" font-size="10">(일부 고급차 기능)</tspan></text>

    <line x1="20" y1="32" x2="720" y2="32" stroke="#ddd" stroke-width="1"/>

    <text x="30" y="52" class="tufte-text" font-size="11">발렛 파킹용 별도 키는 <tspan font-weight="bold">시동과 주행</tspan>만 가능하고, 트렁크나 글로브박스는 열 수 없다.</text>
    <text x="545" y="52" class="tufte-label" font-size="11">OAuth 토큰도 마찬가지.</text>
  </g>
</svg>
