<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 800 260">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .node-box { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .code-box { fill: #f8f8f8; stroke: #999; stroke-width: 1; }
      .data-box { fill: #fafafa; stroke: #666; stroke-width: 1; }
      .flow-line { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- 상단: 제목 -->
  <!-- <text x="400" y="25" text-anchor="middle" class="tufte-title" font-size="14">공공 API 데이터 변환 흐름</text> -->

  <!-- 1단계: API 서버 -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="140" height="100" class="node-box" rx="6"/>
    <text x="70" y="22" text-anchor="middle" class="tufte-title" font-size="12">API 서버</text>
    <text x="70" y="40" text-anchor="middle" class="tufte-mono" font-size="7">jsonplaceholder.typicode.com</text>

    <!-- 데이터베이스 아이콘 -->
    <path d="M 45,55 L 45,80 A 25,8 0 0,0 95,80 L 95,55" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <ellipse cx="70" cy="55" rx="25" ry="8" fill="#f5f5f5" stroke="#666" stroke-width="1"/>
    <text x="70" y="74" text-anchor="middle" class="tufte-small">데이터</text>
    <text x="70" y="85" text-anchor="middle" class="tufte-small">저장소</text>
  </g>

  <!-- 화살표 1: 서버 → 네트워크 -->
  <path d="M 175,85 L 215,85" class="flow-line" marker-end="url(#arrow)"/>
  <text x="195" y="75" text-anchor="middle" class="tufte-small">HTTP 응답</text>

  <!-- 2단계: 네트워크 전송 (JSON 문자열) -->
  <g transform="translate(220, 35)">
    <rect x="0" y="0" width="160" height="100" class="data-box" rx="4"/>
    <text x="80" y="20" text-anchor="middle" class="tufte-title" font-size="11">JSON 문자열</text>
    <text x="80" y="36" text-anchor="middle" class="tufte-label" font-size="10">네트워크 전송 형태</text>

    <rect x="10" y="45" width="140" height="48" class="code-box" rx="3"/>
    <text x="20" y="62" class="tufte-mono" font-size="9">{"name": "Kim",</text>
    <text x="20" y="76" class="tufte-mono" font-size="9"> "email": "kim@..."}</text>
    <text x="80" y="90" text-anchor="middle" class="tufte-small">텍스트 (bytes)</text>
  </g>

  <!-- 화살표 2: JSON → 파싱 -->
  <path d="M 385,85 L 425,85" class="flow-line" marker-end="url(#arrow)"/>
  <text x="405" y="75" text-anchor="middle" class="tufte-mono" font-size="9">.json()</text>

  <!-- 3단계: 파이썬 객체 -->
  <g transform="translate(430, 35)">
    <rect x="0" y="0" width="160" height="100" class="node-box" rx="4"/>
    <text x="80" y="20" text-anchor="middle" class="tufte-title" font-size="11">파이썬 객체</text>
    <text x="80" y="36" text-anchor="middle" class="tufte-label" font-size="10">dict / list</text>

    <rect x="10" y="45" width="140" height="48" class="code-box" rx="3"/>
    <text x="20" y="62" class="tufte-mono" font-size="9">{'name': 'Kim',</text>
    <text x="20" y="76" class="tufte-mono" font-size="9"> 'email': 'kim@...'}</text>
    <text x="80" y="90" text-anchor="middle" class="tufte-small">메모리 (객체)</text>
  </g>

  <!-- 화살표 3: 객체 → 활용 -->
  <path d="M 595,85 L 635,85" class="flow-line" marker-end="url(#arrow)"/>
  <text x="615" y="75" text-anchor="middle" class="tufte-mono" font-size="9">[ ]</text>

  <!-- 4단계: 데이터 활용 -->
  <g transform="translate(640, 35)">
    <rect x="0" y="0" width="130" height="100" class="node-box" rx="6"/>
    <text x="65" y="22" text-anchor="middle" class="tufte-title" font-size="11">데이터 활용</text>

    <text x="15" y="48" class="tufte-mono" font-size="9">data['name']</text>
    <text x="15" y="64" class="tufte-mono" font-size="9">for user in users:</text>
    <text x="15" y="80" class="tufte-mono" font-size="9">  print(user)</text>
    <text x="65" y="95" text-anchor="middle" class="tufte-small">일반 파이썬 문법</text>
  </g>

  <!-- 하단: 전체 코드 흐름 -->
  <g transform="translate(30, 155)">
    <rect x="0" y="0" width="740" height="110" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="6"/>
    <text x="370" y="22" text-anchor="middle" class="tufte-title" font-size="12">.json() 한 줄로 네트워크 데이터가 파이썬 자료구조가 된다</text>

    <line x1="20" y1="32" x2="720" y2="32" stroke="#ddd" stroke-width="1"/>

    <!-- 코드 라인 1 -->
    <text x="30" y="52" class="tufte-mono" font-size="10">response = requests.get('https://...com/users')</text>
    <text x="450" y="52" class="tufte-label" font-size="10">→ HTTP 요청, Response 객체 반환</text>

    <!-- 코드 라인 2 -->
    <text x="30" y="74" class="tufte-mono" font-size="10">users = response.json()</text>
    <text x="450" y="74" class="tufte-label" font-size="10">→ JSON 문자열 → 파이썬 리스트 변환</text>

    <!-- 코드 라인 3 -->
    <text x="30" y="96" class="tufte-mono" font-size="10">print(users[0]['name'])</text>
    <text x="450" y="96" class="tufte-label" font-size="10">→ 딕셔너리 접근, 첫 번째 사용자 이름 출력</text>

  </g>
</svg>
