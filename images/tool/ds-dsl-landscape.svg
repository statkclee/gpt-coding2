<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 280">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .domain-box { fill: #f8f8f8; stroke: #333; stroke-width: 1.5; }
      .python-box { fill: #e8e8e8; stroke: #333; stroke-width: 2; }
      .r-box { fill: #d0d0d0; stroke: #333; stroke-width: 2; }
      .flow-line { fill: none; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>

  <!-- 상단 제목 -->
  <!-- <text x="400" y="28" text-anchor="middle" class="tufte-title" font-size="14">분야별 코딩의 DSL 지형도</text>
  <line x1="100" y1="40" x2="700" y2="40" stroke="#ddd" stroke-width="1"/> -->

  <!-- 왼쪽: Python 호스트 언어 -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="320" height="240" class="python-box" rx="6"/>
    <text x="160" y="25" text-anchor="middle" class="tufte-title" font-size="12">파이썬: 범용 언어</text>
    <line x1="20" y1="35" x2="300" y2="35" stroke="#999" stroke-width="1"/>

    <!-- 정규표현식 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="130" height="55" class="domain-box" rx="4"/>
      <text x="65" y="18" text-anchor="middle" class="tufte-title" font-size="10">정규표현식</text>
      <line x1="10" y1="25" x2="120" y2="25" stroke="#ddd" stroke-width="1"/>
      <text x="65" y="40" text-anchor="middle" class="tufte-mono" font-size="8">re.search()</text>
      <text x="65" y="52" text-anchor="middle" class="tufte-small">텍스트 패턴</text>
    </g>

    <!-- 네트워크 -->
    <g transform="translate(165, 50)">
      <rect x="0" y="0" width="130" height="55" class="domain-box" rx="4"/>
      <text x="65" y="18" text-anchor="middle" class="tufte-title" font-size="10">소켓/HTTP</text>
      <line x1="10" y1="25" x2="120" y2="25" stroke="#ddd" stroke-width="1"/>
      <text x="65" y="40" text-anchor="middle" class="tufte-mono" font-size="8">urllib, requests</text>
      <text x="65" y="52" text-anchor="middle" class="tufte-small">네트워크 통신</text>
    </g>

    <!-- SQL -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="130" height="55" class="domain-box" rx="4"/>
      <text x="65" y="18" text-anchor="middle" class="tufte-title" font-size="10">SQL</text>
      <line x1="10" y1="25" x2="120" y2="25" stroke="#ddd" stroke-width="1"/>
      <text x="65" y="40" text-anchor="middle" class="tufte-mono" font-size="8">sqlite3, sqlalchemy</text>
      <text x="65" y="52" text-anchor="middle" class="tufte-small">관계형 데이터</text>
    </g>

    <!-- pandas/matplotlib -->
    <g transform="translate(165, 115)">
      <rect x="0" y="0" width="130" height="55" class="domain-box" rx="4"/>
      <text x="65" y="18" text-anchor="middle" class="tufte-title" font-size="10">pandas/matplotlib</text>
      <line x1="10" y1="25" x2="120" y2="25" stroke="#ddd" stroke-width="1"/>
      <text x="65" y="40" text-anchor="middle" class="tufte-mono" font-size="8">df[], .plot()</text>
      <text x="65" y="52" text-anchor="middle" class="tufte-small">데이터 분석</text>
    </g>

    <!-- 하단 설명 -->
    <text x="160" y="195" text-anchor="middle" class="tufte-label" font-size="9">각 라이브러리가 독립적으로 존재</text>
    <text x="160" y="210" text-anchor="middle" class="tufte-label" font-size="9">일관된 문법 체계 없음</text>
    <text x="160" y="225" text-anchor="middle" class="tufte-small">범용성 ↑ / 특화성 ↓</text>
  </g>

  <!-- 중앙 화살표 -->
  <g transform="translate(390, 180)">
    <text x="0" y="-20" text-anchor="middle" class="tufte-label" font-size="9">데이터 과학</text>
    <text x="0" y="-5" text-anchor="middle" class="tufte-label" font-size="9">전문화</text>
    <path d="M -10,5 L 20,5" class="flow-line" marker-end="url(#arrow)"/>
  </g>

  <!-- 오른쪽: R 데이터 과학 DSL -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="340" height="240" class="r-box" rx="6"/>
    <text x="170" y="25" text-anchor="middle" class="tufte-title" font-size="12">R tidyverse: 데이터 과학 DSL</text>
    <line x1="20" y1="35" x2="320" y2="35" stroke="#999" stroke-width="1"/>

    <!-- 통합된 파이프라인 -->
    <g transform="translate(20, 50)">
      <!-- dplyr -->
      <rect x="0" y="0" width="90" height="50" fill="#e0e0e0" stroke="#666" stroke-width="1.5" rx="4"/>
      <text x="45" y="20" text-anchor="middle" class="tufte-title" font-size="10">dplyr</text>
      <text x="45" y="35" text-anchor="middle" class="tufte-mono" font-size="8">데이터 문법</text>
      <text x="45" y="45" text-anchor="middle" class="tufte-small">조작</text>
    </g>

    <text x="120" y="80" text-anchor="middle" class="tufte-mono" font-size="14">|></text>

    <g transform="translate(130, 50)">
      <!-- ggplot2 -->
      <rect x="0" y="0" width="90" height="50" fill="#e0e0e0" stroke="#666" stroke-width="1.5" rx="4"/>
      <text x="45" y="20" text-anchor="middle" class="tufte-title" font-size="10">ggplot2</text>
      <text x="45" y="35" text-anchor="middle" class="tufte-mono" font-size="8">그래프 문법</text>
      <text x="45" y="45" text-anchor="middle" class="tufte-small">시각화</text>
    </g>

    <text x="230" y="80" text-anchor="middle" class="tufte-mono" font-size="14">|></text>

    <g transform="translate(240, 50)">
      <!-- gt -->
      <rect x="0" y="0" width="80" height="50" fill="#e0e0e0" stroke="#666" stroke-width="1.5" rx="4"/>
      <text x="40" y="20" text-anchor="middle" class="tufte-title" font-size="10">gt</text>
      <text x="40" y="35" text-anchor="middle" class="tufte-mono" font-size="8">표 문법</text>
      <text x="40" y="45" text-anchor="middle" class="tufte-small">보고</text>
    </g>

    <!-- 공통 문법 원칙 -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="300" height="60" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
      <text x="150" y="18" text-anchor="middle" class="tufte-title" font-size="10">공통 문법 원칙</text>
      <line x1="20" y1="25" x2="280" y2="25" stroke="#ddd" stroke-width="1"/>
      <text x="75" y="42" text-anchor="middle" class="tufte-mono" font-size="8">파이프 |></text>
      <text x="175" y="42" text-anchor="middle" class="tufte-mono" font-size="8">동사(verb)</text>
      <text x="260" y="42" text-anchor="middle" class="tufte-mono" font-size="8">tidy data</text>
      <text x="75" y="54" text-anchor="middle" class="tufte-small">흐름</text>
      <text x="175" y="54" text-anchor="middle" class="tufte-small">행동</text>
      <text x="260" y="54" text-anchor="middle" class="tufte-small">구조</text>
    </g>

    <!-- 하단 설명 -->
    <text x="170" y="195" text-anchor="middle" class="tufte-label" font-size="9">모든 패키지가 일관된 문법 공유</text>
    <text x="170" y="210" text-anchor="middle" class="tufte-label" font-size="9">데이터 → 분석 → 결과의 단일 흐름</text>
    <text x="170" y="225" text-anchor="middle" class="tufte-small">범용성 ↓ / 특화성 ↑</text>
  </g>

</svg>
