<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 800 310">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #111; font-weight: bold; }
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-mono { font-family: 'SF Mono', Consolas, monospace; fill: #444; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #666; font-style: italic; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #777; font-size: 10px; }
      .main-box { fill: #f8f8f8; stroke: #333; stroke-width: 2; }
      .cmd-box { fill: #fff; stroke: #666; stroke-width: 1.5; }
      .pipe-line { fill: none; stroke: #555; stroke-width: 2; }
      .data-flow { fill: #e8e8e8; stroke: #999; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>

  <!-- 제목 -->
  <!-- <text x="400" y="28" text-anchor="middle" class="tufte-title" font-size="15">유닉스 파이프라인: 작은 도구들의 조합</text> -->

  <!-- 상단: 유닉스 쉘 파이프라인 -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="740" height="100" class="main-box" rx="6"/>
    <text x="20" y="25" class="tufte-text" font-size="12" font-weight="bold">쉘 파이프라인</text>

    <!-- 명령어 체인 -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="100" height="45" class="cmd-box" rx="4"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-mono" font-size="11">cat data.txt</text>
      <text x="50" y="35" text-anchor="middle" class="tufte-small">파일 읽기</text>
    </g>

    <path d="M 130,62 L 165,62" class="pipe-line" marker-end="url(#arrow)"/>
    <text x="147" y="55" text-anchor="middle" class="tufte-mono" font-size="14">|</text>

    <g transform="translate(175, 40)">
      <rect x="0" y="0" width="100" height="45" class="cmd-box" rx="4"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-mono" font-size="11">grep error</text>
      <text x="50" y="35" text-anchor="middle" class="tufte-small">필터링</text>
    </g>

    <path d="M 285,62 L 320,62" class="pipe-line" marker-end="url(#arrow)"/>
    <text x="302" y="55" text-anchor="middle" class="tufte-mono" font-size="14">|</text>

    <g transform="translate(330, 40)">
      <rect x="0" y="0" width="100" height="45" class="cmd-box" rx="4"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-mono" font-size="11">sort</text>
      <text x="50" y="35" text-anchor="middle" class="tufte-small">정렬</text>
    </g>

    <path d="M 440,62 L 475,62" class="pipe-line" marker-end="url(#arrow)"/>
    <text x="457" y="55" text-anchor="middle" class="tufte-mono" font-size="14">|</text>

    <g transform="translate(485, 40)">
      <rect x="0" y="0" width="100" height="45" class="cmd-box" rx="4"/>
      <text x="50" y="20" text-anchor="middle" class="tufte-mono" font-size="11">uniq -c</text>
      <text x="50" y="35" text-anchor="middle" class="tufte-small">중복 제거</text>
    </g>

    <path d="M 595,62 L 630,62" class="pipe-line" marker-end="url(#arrow)"/>
    <text x="612" y="55" text-anchor="middle" class="tufte-mono" font-size="14">&gt;</text>

    <g transform="translate(640, 40)">
      <rect x="0" y="0" width="80" height="45" class="cmd-box" rx="4"/>
      <text x="40" y="20" text-anchor="middle" class="tufte-mono" font-size="11">result.txt</text>
      <text x="40" y="35" text-anchor="middle" class="tufte-small">출력</text>
    </g>
  </g>

  <!-- 하단: 파이썬에서의 두 가지 접근 -->
  <g transform="translate(30, 170)">
    <!-- 왼쪽: subprocess -->
    <rect x="0" y="0" width="350" height="140" class="main-box" rx="6"/>
    <text x="175" y="25" text-anchor="middle" class="tufte-text" font-size="12" font-weight="bold">subprocess: 쉘 명령 호출</text>
    <line x1="15" y1="35" x2="335" y2="35" stroke="#ccc" stroke-width="1"/>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="320" height="80" class="data-flow" rx="4"/>
      <text x="10" y="18" class="tufte-mono" font-size="9">subprocess.run(</text>
      <text x="20" y="32" class="tufte-mono" font-size="9">"grep error data.txt | sort",</text>
      <text x="20" y="46" class="tufte-mono" font-size="9">shell=True, capture_output=True</text>
      <text x="10" y="60" class="tufte-mono" font-size="9">)</text>
      <text x="160" y="75" text-anchor="middle" class="tufte-small">기존 쉘 도구 재사용</text>
    </g>
  </g>

  <!-- 오른쪽: 순수 파이썬 -->
  <g transform="translate(420, 170)">
    <rect x="0" y="0" width="350" height="140" class="main-box" rx="6"/>
    <text x="175" y="25" text-anchor="middle" class="tufte-text" font-size="12" font-weight="bold">순수 파이썬: 직접 구현</text>
    <line x1="15" y1="35" x2="335" y2="35" stroke="#ccc" stroke-width="1"/>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="320" height="80" class="data-flow" rx="4"/>
      <text x="10" y="18" class="tufte-mono" font-size="9">with open("data.txt") as f:</text>
      <text x="20" y="32" class="tufte-mono" font-size="9">lines = [l for l in f if "error" in l]</text>
      <text x="10" y="46" class="tufte-mono" font-size="9">sorted_lines = sorted(lines)</text>
      <text x="10" y="60" class="tufte-mono" font-size="9">unique = Counter(sorted_lines)</text>
      <text x="160" y="75" text-anchor="middle" class="tufte-small">크로스 플랫폼, 세밀한 제어</text>
    </g>
  </g>

  <!-- 하단 메시지 -->
  <text x="400" y="330" text-anchor="middle" class="tufte-label" font-size="12">"작은 도구를 파이프로 연결하라" — 유닉스 철학 핵심</text>

</svg>
