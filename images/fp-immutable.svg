<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 850 360">
  <defs>
    <style>
      /* Tufte Grayscale Style */
      .label-head { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
      .label-body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #333; }
      .label-note { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #555; font-style: italic; }
      .label-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 10px; fill: #444; }

      .box-mutable { fill: #fcfcfc; stroke: #999; stroke-width: 1; stroke-dasharray: 4 2; rx: 4; }
      .box-immutable { fill: #fff; stroke: #333; stroke-width: 2; rx: 4; }
      .box-data { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 3; }
      .box-destroyed { fill: #eee; stroke: #ccc; stroke-width: 1; stroke-dasharray: 2 2; rx: 3; }

      .line-flow { stroke: #666; stroke-width: 1.5; fill: none; }
      .line-destroy { stroke: #555; stroke-width: 1.5; stroke-dasharray: 2 1; fill: none; }
      .line-sep { stroke: #ddd; stroke-width: 1; }
      
      .arrow-head { fill: #666; }
      .arrow-head-alert { fill: #555; }
      
      .strike { stroke: #555; stroke-width: 1; opacity: 0.3; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" class="arrow-head" />
    </marker>
    <marker id="arrow-alert" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" class="arrow-head-alert" />
    </marker>
  </defs>

  <rect width="850" height="400" fill="#fff" />

  <!-- Title -->
  <!-- <text x="425" y="35" text-anchor="middle" class="label-head" font-size="16">불변성: 데이터 이력 보존의 핵심</text> -->

  <!-- ========================================== -->
  <!-- LEFT: Mutable (Destructive Update) -->
  <!-- ========================================== -->
  <g transform="translate(40, 60)">
    <text x="155" y="0" text-anchor="middle" class="label-head" fill="#555">가변 방식 (파괴적 수정)</text>
    <rect x="0" y="15" width="310" height="295" class="box-mutable"/>

    <text x="155" y="38" text-anchor="middle" class="label-note">기존 메모리 공간을 직접 덮어씀</text>

    <!-- t=0 -->
    <g transform="translate(20, 55)">
      <text x="0" y="0" class="label-mono" font-weight="bold">t=0 (초기 상태)</text>
      <rect x="0" y="8" width="270" height="28" class="box-destroyed"/>
      <text x="135" y="26" text-anchor="middle" class="label-mono" fill="#999">[10, 20, 30, 40, 50]</text>
      <line x1="10" y1="22" x2="260" y2="22" class="strike"/>
    </g>

    <!-- Action 1 -->
    <g transform="translate(130, 95)">
      <path d="M 25 0 L 25 20" class="line-destroy" marker-end="url(#arrow-alert)"/>
      <text x="50" y="14" class="label-mono" fill="#555">append(60)</text>
    </g>

    <!-- t=1 -->
    <g transform="translate(20, 120)">
      <text x="0" y="0" class="label-mono" font-weight="bold">t=1 (수정 발생)</text>
      <rect x="0" y="8" width="270" height="28" class="box-destroyed"/>
      <text x="135" y="26" text-anchor="middle" class="label-mono" fill="#999">[10, 20, 30, ..., 60]</text>
      <line x1="10" y1="22" x2="260" y2="22" class="strike"/>
    </g>

    <!-- Action 2 -->
    <g transform="translate(130, 160)">
      <path d="M 25 0 L 25 20" class="line-destroy" marker-end="url(#arrow-alert)"/>
      <text x="50" y="14" class="label-mono" fill="#555">data[0] = 999</text>
    </g>

    <!-- t=2 (Final) -->
    <g transform="translate(20, 185)">
      <text x="0" y="0" class="label-mono" font-weight="bold">t=2 (현재 상태)</text>
      <rect x="0" y="8" width="270" height="28" class="box-data"/>
      <text x="135" y="26" text-anchor="middle" class="label-mono">[999, 20, 30, 40, 50, 60]</text>
    </g>

    <!-- Issues -->
    <g transform="translate(20, 250)">
      <text x="0" y="0" class="label-body" font-weight="bold" fill="#555">문제점:</text>
      <line x1="0" y1="8" x2="270" y2="8" class="line-sep"/>
      <text x="0" y="22" class="label-body" font-size="10" fill="#555">✗ 이전 상태 소멸 (되돌리기 불가)</text>
      <text x="0" y="35" class="label-body" font-size="10" fill="#555">✗ 스레드 불안전 (경쟁 조건 발생)</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: Immutable (Preserving) -->
  <!-- ========================================== -->
  <g transform="translate(380, 60)">
    <text x="215" y="0" text-anchor="middle" class="label-head">불변 방식 (이력 보존)</text>
    <rect x="0" y="15" width="430" height="295" class="box-immutable"/>

    <text x="215" y="38" text-anchor="middle" class="label-note">매 연산마다 새 복사본 생성, 과거 보존</text>

    <!-- Flow Diagram -->
    <g transform="translate(20, 60)">
        
      <!-- Step 1: Original -->
      <g>
        <text x="0" y="0" class="label-mono" font-weight="bold">original</text>
        <rect x="0" y="10" width="140" height="35" class="box-data"/>
        <text x="70" y="32" text-anchor="middle" class="label-mono">(10, 20, ... 50)</text>
        <text x="70" y="58" text-anchor="middle" class="label-body" font-size="10" fill="#555">✓ 안전</text>
      </g>

      <!-- Arrow -->
      <path d="M 145 27 L 175 27" class="line-flow" marker-end="url(#arrow)"/>
      <text x="165" y="15" text-anchor="middle" class="label-mono" font-size="9" fill="#222">+ (60,)</text>

      <!-- Step 2: with_60 -->
      <g transform="translate(190, 0)">
        <text x="0" y="0" class="label-mono" font-weight="bold">with_60</text>
        <rect x="0" y="10" width="150" height="35" class="box-data"/>
        <text x="75" y="32" text-anchor="middle" class="label-mono">(10, 20, ... 50, 60)</text>
        <text x="75" y="58" text-anchor="middle" class="label-body" font-size="10" fill="#555">✓ 안전</text>
      </g>
      
      <!-- Arrow -->
      <g transform="translate(5, 5)">
        <path d="M 255 60 L 255 90 L 140 90" class="line-flow" marker-end="url(#arrow)"/>
        <text x="200" y="105" text-anchor="middle" class="label-mono" font-size="9" fill="#222">(999,) + [1:]</text>
      </g>

      <!-- Step 3: modified -->
      <g transform="translate(30, 70)">
        <text x="0" y="5" class="label-mono" font-weight="bold">modified</text>
        <rect x="0" y="13" width="100" height="30" class="box-data"/>
        <text x="50" y="32" text-anchor="middle" class="label-mono">(999, ...)</text>
        <text x="50" y="58" text-anchor="middle" class="label-body" font-size="10" fill="#555">✓ 안전</text>
      </g>
    </g>

    <!-- Time Travel Box -->
    <g transform="translate(20, 195)">
        <rect x="0" y="0" width="390" height="45" fill="#f5f5f5" stroke="#ccc" rx="3"/>
        <text x="195" y="20" text-anchor="middle" class="label-head" font-size="12">시간 여행 디버깅 (Time-Travel)</text>
        <text x="195" y="38" text-anchor="middle" class="label-body" font-size="10">과거 변수(`original`, `with_60` 등)에 언제든 접근 가능!</text>
    </g>

    <!-- Benefits -->
    <g transform="translate(20, 255)">
      <text x="0" y="0" class="label-head" font-size="12">장점:</text>
      <line x1="0" y1="8" x2="390" y2="8" class="line-sep"/>
      <text x="0" y="25" class="label-body" font-size="10">✓ 스레드 안전 (잠금이 필요 없음)</text>
      <text x="0" y="40" class="label-body" font-size="10">✓ 실행 취소(Undo) 및 디버깅 용이</text>
    </g>
  </g>

  <!-- Bottom Insight -->
  <g transform="translate(40, 370)">
      <text x="235" y="-10" text-anchor="middle" class="label-note" fill="#555">데이터를 덮어씀 (이력 소멸)</text>
      <text x="675" y="-10" text-anchor="middle" class="label-note" font-weight="bold" fill="#333">데이터를 쌓아둠 (이력 유지)</text>
  </g>

</svg>