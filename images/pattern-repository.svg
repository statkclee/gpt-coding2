<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" class="tufte-title" text-anchor="middle">Repository 패턴</text>

  <!-- Business Logic / Service -->
  <rect x="40" y="70" width="180" height="100" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
  <text x="130" y="95" class="tufte-label" text-anchor="middle">Business Logic</text>
  <line x1="55" y1="105" x2="205" y2="105" stroke="#ccc" stroke-width="1"/>
  <text x="130" y="125" class="tufte-code" text-anchor="middle">UserService</text>
  <text x="130" y="145" class="tufte-code" text-anchor="middle">OrderService</text>
  <text x="130" y="160" class="tufte-small" text-anchor="middle">도메인 로직에 집중</text>

  <!-- Arrow -->
  <line x1="220" y1="120" x2="278" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="249" y="110" class="tufte-small">인터페이스</text>

  <!-- Repository Interface -->
  <rect x="290" y="60" width="200" height="120" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
  <text x="390" y="85" class="tufte-label" text-anchor="middle">Repository Interface</text>
  <line x1="305" y1="95" x2="475" y2="95" stroke="#ccc" stroke-width="1"/>
  <text x="390" y="115" class="tufte-code" text-anchor="middle">get(id) → Entity</text>
  <text x="390" y="130" class="tufte-code" text-anchor="middle">find_by(...) → list</text>
  <text x="390" y="145" class="tufte-code" text-anchor="middle">add(entity) → Entity</text>
  <text x="390" y="160" class="tufte-code" text-anchor="middle">delete(id) → bool</text>

  <!-- Arrow to implementations -->
  <line x1="490" y1="100" x2="548" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="140" x2="548" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="519" y="115" class="tufte-small">구현</text>

  <!-- Concrete implementations -->
  <rect x="560" y="50" width="200" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="660" y="75" class="tufte-label" text-anchor="middle">SQLRepository</text>
  <text x="660" y="95" class="tufte-code" text-anchor="middle">PostgreSQL, MySQL</text>

  <rect x="560" y="130" width="200" height="60" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="660" y="155" class="tufte-label" text-anchor="middle">InMemoryRepository</text>
  <text x="660" y="175" class="tufte-code" text-anchor="middle">테스트용 메모리 저장소</text>

  <!-- Benefits -->
  <rect x="40" y="200" width="350" height="70" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="215" y="225" class="tufte-label" text-anchor="middle">Repository 패턴의 이점</text>
  <line x1="55" y1="235" x2="375" y2="235" stroke="#ccc" stroke-width="1"/>
  <text x="215" y="255" class="tufte-small" text-anchor="middle">• DB 변경 시 비즈니스 로직 수정 불필요</text>

  <rect x="410" y="200" width="350" height="70" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="585" y="225" class="tufte-label" text-anchor="middle">테스트 용이성</text>
  <line x1="425" y1="235" x2="745" y2="235" stroke="#ccc" stroke-width="1"/>
  <text x="585" y="255" class="tufte-small" text-anchor="middle">• InMemoryRepository로 실제 DB 없이 테스트</text>

  <!-- Bottom note -->
  <text x="400" y="290" class="tufte-small" text-anchor="middle">비즈니스 로직은 인터페이스에만 의존 → 구현체 교체 자유로움</text>
</svg>
