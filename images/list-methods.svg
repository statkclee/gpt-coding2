<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 700 290">
  <defs>
    <style>
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        fill: #333;
      }
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="350" y="25" text-anchor="middle" class="tufte-title">리스트 메서드: append(), sort(), pop()</text> -->

  <!-- Section 1: append() -->
  <text x="30" y="60" class="tufte-label" font-weight="bold">append()</text>
  <text x="30" y="78" class="tufte-small">끝에 요소 추가</text>

  <!-- Before append -->
  <text x="30" y="105" class="tufte-code">t = ['a', 'b', 'c']</text>
  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="40" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="80" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <text x="20" y="20" text-anchor="middle" class="tufte-code">'a'</text>
    <text x="60" y="20" text-anchor="middle" class="tufte-code">'b'</text>
    <text x="100" y="20" text-anchor="middle" class="tufte-code">'c'</text>
  </g>

  <!-- Arrow -->
  <line x1="175" y1="130" x2="205" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="190" y="120" text-anchor="middle" class="tufte-small">append('d')</text>

  <!-- After append -->
  <g transform="translate(220, 115)">
    <rect x="0" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="40" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="80" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="120" y="0" width="40" height="30" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
    <text x="20" y="20" text-anchor="middle" class="tufte-code">'a'</text>
    <text x="60" y="20" text-anchor="middle" class="tufte-code">'b'</text>
    <text x="100" y="20" text-anchor="middle" class="tufte-code">'c'</text>
    <text x="140" y="20" text-anchor="middle" class="tufte-code">'d'</text>
  </g>
  <text x="220" y="165" class="tufte-small">반환값: None (원본 변경)</text>

  <!-- Section 2: sort() -->
  <text x="30" y="195" class="tufte-label" font-weight="bold">sort()</text>
  <text x="30" y="213" class="tufte-small">오름차순 정렬</text>

  <!-- Before sort -->
  <text x="30" y="240" class="tufte-code">t = ['d', 'b', 'a', 'c']</text>
  <g transform="translate(30, 250)">
    <rect x="0" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="40" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="80" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="120" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <text x="20" y="20" text-anchor="middle" class="tufte-code">'d'</text>
    <text x="60" y="20" text-anchor="middle" class="tufte-code">'b'</text>
    <text x="100" y="20" text-anchor="middle" class="tufte-code">'a'</text>
    <text x="140" y="20" text-anchor="middle" class="tufte-code">'c'</text>
  </g>

  <!-- Arrow -->
  <line x1="215" y1="265" x2="245" y2="265" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="230" y="255" text-anchor="middle" class="tufte-small">sort()</text>

  <!-- After sort -->
  <g transform="translate(260, 250)">
    <rect x="0" y="0" width="40" height="30" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
    <rect x="40" y="0" width="40" height="30" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
    <rect x="80" y="0" width="40" height="30" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
    <rect x="120" y="0" width="40" height="30" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
    <text x="20" y="20" text-anchor="middle" class="tufte-code">'a'</text>
    <text x="60" y="20" text-anchor="middle" class="tufte-code">'b'</text>
    <text x="100" y="20" text-anchor="middle" class="tufte-code">'c'</text>
    <text x="140" y="20" text-anchor="middle" class="tufte-code">'d'</text>
  </g>
  <text x="260" y="300" class="tufte-small">반환값: None (원본 변경)</text>

  <!-- Section 3: pop() -->
  <text x="450" y="60" class="tufte-label" font-weight="bold">pop()</text>
  <text x="450" y="78" class="tufte-small">요소 제거 후 반환</text>

  <!-- Before pop -->
  <text x="450" y="95" class="tufte-code">t = ['a', 'b', 'c']</text>
  <g transform="translate(450, 115)">
    <rect x="0" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="40" y="0" width="40" height="30" fill="#ccc" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="80" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <text x="20" y="20" text-anchor="middle" class="tufte-code">'a'</text>
    <text x="60" y="20" text-anchor="middle" class="tufte-code">'b'</text>
    <text x="100" y="20" text-anchor="middle" class="tufte-code">'c'</text>
    <text x="60" y="-5" text-anchor="middle" class="tufte-small">인덱스 1</text>
  </g>

  <!-- Arrow down -->
  <line x1="510" y1="150" x2="510" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="545" y="165" class="tufte-small">pop(1)</text>

  <!-- After pop -->
  <g transform="translate(450, 185)">
    <rect x="0" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <rect x="40" y="0" width="40" height="30" fill="#f5f5f5" stroke="#999"/>
    <text x="20" y="20" text-anchor="middle" class="tufte-code">'a'</text>
    <text x="60" y="20" text-anchor="middle" class="tufte-code">'c'</text>
  </g>

  <!-- Returned value -->
  <rect x="560" y="185" width="70" height="30" fill="#e8e8e8" stroke="#666" stroke-width="2"/>
  <text x="595" y="205" text-anchor="middle" class="tufte-code">'b'</text>
  <text x="595" y="230" text-anchor="middle" class="tufte-small">반환값</text>

  <!-- Warning note -->
  <rect x="450" y="255" width="220" height="50" fill="#f5f5f5" stroke="#999" rx="3"/>
  <text x="560" y="275" text-anchor="middle" class="tufte-small" font-style="italic">주의: t = t.sort()는 None을 반환</text>
  <text x="560" y="293" text-anchor="middle" class="tufte-small" font-style="italic">t.sort()만 호출해야 정렬됨</text>
</svg>