<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 700 220">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 14px; font-weight: bold; }
      .tufte-small { font-size: 12px; fill: #666; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="260" fill="#ffffff"/>

  <!-- while 루프 (왼쪽) -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="200" height="180" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="100" y="25" text-anchor="middle" class="tufte-text tufte-label">while 루프</text>
    <line x1="10" y1="35" x2="190" y2="35" stroke="#ccc" stroke-width="1"/>

    <text x="20" y="60" class="tufte-code">n = 5</text>
    <text x="20" y="80" class="tufte-code">while n > 0:</text>
    <text x="35" y="100" class="tufte-code">print(n)</text>
    <text x="35" y="120" class="tufte-code">n = n - 1</text>

    <text x="100" y="150" text-anchor="middle" class="tufte-text tufte-small" fill="#888">조건이 참인 동안 반복</text>
    <text x="100" y="170" text-anchor="middle" class="tufte-text tufte-small" fill="#888">횟수 미정</text>
  </g>

  <!-- for 루프 (가운데) -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="200" height="180" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="100" y="25" text-anchor="middle" class="tufte-text tufte-label">for 루프</text>
    <line x1="10" y1="35" x2="190" y2="35" stroke="#999" stroke-width="1"/>

    <text x="20" y="60" class="tufte-code">names = ["철수", "영희"]</text>
    <text x="20" y="80" class="tufte-code">for name in names:</text>
    <text x="35" y="100" class="tufte-code">print(name)</text>

    <text x="100" y="150" text-anchor="middle" class="tufte-text tufte-small" fill="#888">컬렉션 순회</text>
    <text x="100" y="170" text-anchor="middle" class="tufte-text tufte-small" fill="#888">횟수 확정</text>
  </g>

  <!-- 루프 제어 (오른쪽) -->
  <g transform="translate(470, 60)">
    <rect x="0" y="0" width="200" height="180" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="100" y="25" text-anchor="middle" class="tufte-text tufte-label">루프 제어</text>
    <line x1="10" y1="35" x2="190" y2="35" stroke="#ccc" stroke-width="1"/>

    <text x="20" y="60" class="tufte-code">break</text>
    <text x="80" y="60" class="tufte-text tufte-small">루프 즉시 종료</text>

    <text x="20" y="90" class="tufte-code">continue</text>
    <text x="80" y="90" class="tufte-text tufte-small">다음 반복으로</text>

    <text x="100" y="150" text-anchor="middle" class="tufte-text tufte-small" fill="#888">반복 흐름을</text>
    <text x="100" y="170" text-anchor="middle" class="tufte-text tufte-small" fill="#888">세밀하게 제어</text>
  </g>

  <!-- 하단 설명 -->
  <text x="350" y="255" text-anchor="middle" class="tufte-text tufte-small" fill="#888">반복문은 동일한 작업을 여러 번 수행할 때 사용한다</text>

</svg>
