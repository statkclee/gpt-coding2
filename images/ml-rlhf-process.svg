<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 900 410">
  <defs>
    <style>
      /* Tufte Typography for Korean */
      .tufte-title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 24px; font-weight: bold; fill: #111; }
      .tufte-subtitle { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif; font-size: 16px; font-weight: bold; fill: #222; }
      .tufte-label { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 11px; font-weight: bold; fill: #333; }
      .tufte-text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", serif; font-size: 12px; fill: #444; }
      .tufte-small { font-family: "Malgun Gothic", "Apple SD Gothic Neo", serif; font-size: 11px; fill: #666; font-style: italic; }
      .tufte-code { font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 10px; fill: #333; }

      /* Grayscale Elements */
      .panel { fill: #fff; stroke: #ccc; stroke-width: 1; rx: 5; }
      .box-entity { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 3; }
      .box-light { fill: #f9f9f9; stroke: #999; stroke-width: 1; rx: 3; }
      .box-human { fill: #fff; stroke: #333; stroke-width: 1; stroke-dasharray: 2,1; rx: 3; } /* Dashed for human */
      .box-frozen { fill: #f0f0f0; stroke: #999; stroke-width: 1; rx: 3; }

      /* Arrows */
      .arrow { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #777; stroke-width: 1; fill: none; stroke-dasharray: 3,3; marker-end: url(#arrowhead-gray); }
      .arrow-loop { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead); }

      /* Icons */
      .icon-stroke { stroke: #333; stroke-width: 1.5; fill: none; }
      .icon-fill { fill: #333; stroke: none; }
    </style>
    
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#777" />
    </marker>

    <!-- Human Icon -->
    <g id="icon-human">
      <circle cx="15" cy="10" r="5" class="icon-stroke" />
      <path d="M5,25 Q15,15 25,25" class="icon-stroke" />
    </g>
    <!-- Bot Icon -->
    <g id="icon-bot">
       <rect x="5" y="8" width="20" height="14" rx="2" class="icon-stroke" />
       <circle cx="10" cy="13" r="1.5" class="icon-fill"/>
       <circle cx="20" cy="13" r="1.5" class="icon-fill"/>
       <line x1="15" y1="5" x2="15" y2="8" class="icon-stroke" />
       <circle cx="15" cy="4" r="1" class="icon-fill"/>
    </g>
    <!-- Doc Icon -->
    <g id="icon-doc">
       <path d="M5,2 L18,2 L22,6 L22,25 L5,25 Z" fill="#fff" stroke="#666" stroke-width="1"/>
       <line x1="9" y1="8" x2="18" y2="8" stroke="#ccc" stroke-width="1"/>
       <line x1="9" y1="12" x2="18" y2="12" stroke="#ccc" stroke-width="1"/>
       <line x1="9" y1="16" x2="15" y2="16" stroke="#ccc" stroke-width="1"/>
    </g>
  </defs>

  <rect width="900" height="500" fill="#fff" />

  <!-- Main Title -->
  <!-- <text x="450" y="40" class="tufte-title" text-anchor="middle">RLHF: 인간 가치 정렬의 3단계</text>
  <text x="450" y="65" class="tufte-text" text-anchor="middle">모방에서 선호도 학습으로, 마침내 자기 개선으로.</text> -->

  <!-- Step 1: SFT -->
  <g transform="translate(30, 90)">
    <rect x="0" y="0" width="260" height="370" class="panel" />
    <text x="130" y="30" class="tufte-subtitle" text-anchor="middle">1. 지도 미세조정 (SFT)</text>
    <text x="130" y="48" class="tufte-small" text-anchor="middle">(행동 모방)</text>

    <!-- Content -->
    <g transform="translate(30, 70)">
      <!-- Prompt -->
      <g transform="translate(80, 0)">
         <use href="#icon-doc" />
         <text x="30" y="15" class="tufte-label">질문</text>
      </g>
      <path d="M100,28 L100,50" class="arrow" />

      <!-- Human -->
      <g transform="translate(70, 50)">
         <rect x="0" y="0" width="60" height="50" class="box-human" />
         <use href="#icon-human" x="15" y="5" />
         <text x="30" y="40" class="tufte-label" text-anchor="middle" font-size="10">전문가</text>
      </g>
      <path d="M100,100 L100,120" class="arrow" />

      <!-- Demo Answer -->
      <g transform="translate(50, 120)">
         <rect x="0" y="0" width="100" height="40" class="box-light" />
         <text x="50" y="18" class="tufte-label" text-anchor="middle">모범 답안</text>
         <text x="50" y="32" class="tufte-code" text-anchor="middle">"코드 작성..."</text>
      </g>
      <path d="M100,160 L100,190" class="arrow" />

      <!-- Training -->
      <g transform="translate(50, 190)">
         <rect x="0" y="0" width="100" height="50" class="box-entity" />
         <use href="#icon-bot" x="10" y="10" />
         <text x="60" y="20" class="tufte-label" text-anchor="middle">SFT 모델</text>
         <text x="60" y="35" class="tufte-small" text-anchor="middle">미세조정됨</text>
      </g>
    </g>
    
    <text x="130" y="360" class="tufte-text" text-anchor="middle">
        <tspan x="130" dy="-30">인간의</tspan>
        <tspan x="130" dy="15" font-weight="bold">(질문, 답변)</tspan>
        <tspan x="130" dy="15">예시로부터 학습</tspan>
    </text>
  </g>

  <!-- Step 2: RM -->
  <g transform="translate(320, 90)">
    <rect x="0" y="0" width="260" height="370" class="panel" />
    <text x="130" y="30" class="tufte-subtitle" text-anchor="middle">2. 보상 모델링 (RM)</text>
    <text x="130" y="48" class="tufte-small" text-anchor="middle">(선호도 학습)</text>

    <!-- Content -->
    <g transform="translate(30, 70)">
      <!-- SFT Model -->
      <g transform="translate(70, 0)">
         <rect x="0" y="0" width="60" height="35" class="box-entity" />
         <text x="30" y="22" class="tufte-code" text-anchor="middle">SFT 모델</text>
      </g>
      
      <!-- Arrows split -->
      <path d="M90,35 L60,60" class="arrow-dashed" />
      <path d="M110,35 L140,60" class="arrow-dashed" />

      <!-- Samples -->
      <g transform="translate(20, 60)">
         <rect x="0" y="0" width="70" height="40" class="box-light" />
         <text x="35" y="25" class="tufte-code" text-anchor="middle">답변 A</text>
      </g>
      <g transform="translate(110, 60)">
         <rect x="0" y="0" width="70" height="40" class="box-light" />
         <text x="35" y="25" class="tufte-code" text-anchor="middle">답변 B</text>
      </g>

      <!-- Arrows join -->
      <path d="M55,100 L85,130" class="arrow" />
      <path d="M145,100 L115,130" class="arrow" />

      <!-- Human Ranker -->
      <g transform="translate(70, 130)">
         <rect x="0" y="0" width="60" height="50" class="box-human" />
         <use href="#icon-human" x="15" y="5" />
         <text x="30" y="40" class="tufte-label" text-anchor="middle" font-size="10">평가자</text>
      </g>
      
      <text x="100" y="200" class="tufte-label" text-anchor="middle">"A > B"</text>
      <path d="M100,205 L100,230" class="arrow" />

      <!-- RM Train -->
      <g transform="translate(40, 230)">
         <rect x="0" y="0" width="120" height="35" class="box-entity" />
         <text x="60" y="15" class="tufte-label" text-anchor="middle">보상 모델</text>
         <text x="60" y="30" class="tufte-small" text-anchor="middle">점수 예측</text>
      </g>
    </g>

    <text x="130" y="360" class="tufte-text" text-anchor="middle">
        <tspan x="130" dy="-10">순위를 통해</tspan>
        <tspan x="100" dy="15" font-weight="bold">더 좋은 답변</tspan>
        <tspan x="180" dy="0">을 구별하는 법 학습</tspan>
    </text>
  </g>

  <!-- Step 3: PPO -->
  <g transform="translate(610, 90)">
    <rect x="0" y="0" width="260" height="370" class="panel" />
    <text x="130" y="30" class="tufte-subtitle" text-anchor="middle">3. 강화학습 (PPO)</text>
    <text x="130" y="48" class="tufte-small" text-anchor="middle">(최적화)</text>

    <!-- Content -->
    <g transform="translate(20, 70)">
      
      <!-- Policy Model -->
      <g transform="translate(0, 50)">
         <rect x="0" y="0" width="70" height="50" class="box-entity" />
         <use href="#icon-bot" x="20" y="5" />
         <text x="35" y="40" class="tufte-label" text-anchor="middle" font-size="10">정책(Policy)</text>
      </g>

      <!-- Generate Arrow -->
      <path d="M70,75 L90,75" class="arrow" />

      <!-- Answer -->
      <g transform="translate(90, 60)">
         <rect x="0" y="0" width="50" height="30" class="box-light" />
         <text x="25" y="19" class="tufte-code" text-anchor="middle">생성</text>
      </g>

      <!-- Arrow to RM -->
      <path d="M140,75 L160,75" class="arrow" />

      <!-- RM (Frozen) -->
      <g transform="translate(160, 50)">
         <rect x="0" y="0" width="60" height="50" class="box-frozen" />
         <text x="30" y="20" class="tufte-label" text-anchor="middle" font-size="10">보상모델</text>
         <text x="30" y="35" class="tufte-small" text-anchor="middle">(고정됨)</text>
      </g>
      
      <!-- Score Arrow -->
      <path d="M190,100 L190,120" class="arrow" />

      <!-- Score -->
      <g transform="translate(140, 115)">
         <text x="35" y="20" class="tufte-label" font-size="14">점수 ↑</text>
      </g>
      
      <!-- PPO Update Loop -->
      <path d="M155,130 L35,130 L35,100" class="arrow-loop" />
      <g transform="translate(30, 0)">
        <rect x="20" y="150" width="90" height="25" fill="#fff" stroke="#333" rx="3" />
        <text x="65" y="166" class="tufte-label" text-anchor="middle" font-size="10">업데이트</text>
      </g>

      <!-- Result -->
      <g transform="translate(40, 210)">
         <rect x="0" y="0" width="140" height="40" class="box-entity" stroke-width="2" />
         <text x="70" y="25" class="tufte-label" text-anchor="middle">정렬된 모델</text>
      </g>
    </g>

    <text x="130" y="360" class="tufte-text" text-anchor="middle">
        <tspan x="130" dy="-20">자기 업데이트를 통해</tspan>
        <tspan x="100" dy="15" font-weight="bold">보상 점수</tspan>
        <tspan x="150" dy="0">를 최대화</tspan>
    </text>
  </g>

</svg>