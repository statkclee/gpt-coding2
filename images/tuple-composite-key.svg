<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 720 300">
  <defs>
    <style>
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        fill: #333;
      }
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 11px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="360" y="25" text-anchor="middle" class="tufte-title">튜플을 딕셔너리 키로 활용: 복합 키</text> -->

  <!-- Problem: Why can't list be a key? -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="200" height="100" fill="#e8e8e8" stroke="#999" rx="3"/>
    <text x="100" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">리스트는 키로 불가</text>
    <line x1="10" y1="30" x2="190" y2="30" stroke="#ccc"/>
    <text x="15" y="50" class="tufte-code">d = {}</text>
    <text x="15" y="65" class="tufte-code">d[[37, 127]] = '서울'</text>
    <text x="15" y="80" class="tufte-code" fill="#666">→ TypeError!</text>
    <text x="15" y="95" class="tufte-small">가변 객체는 해시 불가</text>
  </g>

  <!-- Arrow -->
  <line x1="245" y1="95" x2="285" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="265" y="85" text-anchor="middle" class="tufte-small">해결</text>

  <!-- Solution: Tuple as key -->
  <g transform="translate(300, 45)">
    <rect x="0" y="0" width="200" height="100" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
    <text x="100" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">튜플은 키로 가능</text>
    <line x1="10" y1="30" x2="190" y2="30" stroke="#ccc"/>
    <text x="15" y="50" class="tufte-code">d = {}</text>
    <text x="15" y="65" class="tufte-code">d[(37, 127)] = '서울'</text>
    <text x="15" y="80" class="tufte-code" font-weight="bold">→ OK!</text>
    <text x="15" y="95" class="tufte-small">불변 객체는 해시 가능</text>
  </g>

  <!-- Why: Hash explanation -->
  <g transform="translate(520, 45)">
    <rect x="0" y="0" width="170" height="100" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="85" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">해시(Hash)란?</text>
    <line x1="10" y1="30" x2="160" y2="30" stroke="#ccc"/>
    <text x="10" y="48" class="tufte-small">객체를 고유 정수로 변환</text>
    <text x="10" y="62" class="tufte-small">딕셔너리 키 검색에 사용</text>
    <text x="10" y="78" class="tufte-small">값이 변하면 해시도 변함</text>
    <text x="10" y="92" class="tufte-small">→ 불변 객체만 키로 사용</text>
  </g>

  <!-- Use cases -->
  <text x="360" y="175" text-anchor="middle" class="tufte-label" font-weight="bold">복합 키 활용 예시</text>

  <!-- Example 1: Coordinates -->
  <g transform="translate(30, 190)">
    <rect x="0" y="0" width="210" height="120" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="105" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">좌표 → 지역</text>
    <line x1="10" y1="30" x2="200" y2="30" stroke="#ccc"/>
    <text x="15" y="48" class="tufte-code">locations = {</text>
    <text x="15" y="63" class="tufte-code">  (37.5, 126.9): '서울',</text>
    <text x="15" y="78" class="tufte-code">  (35.1, 129.0): '부산',</text>
    <text x="15" y="93" class="tufte-code">}</text>
    <text x="15" y="112" class="tufte-small">(위도, 경도) 튜플이 키</text>
  </g>

  <!-- Example 2: Date -->
  <g transform="translate(255, 190)">
    <rect x="0" y="0" width="210" height="120" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="105" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">날짜 → 이벤트</text>
    <line x1="10" y1="30" x2="200" y2="30" stroke="#ccc"/>
    <text x="15" y="48" class="tufte-code">events = {</text>
    <text x="15" y="63" class="tufte-code">  (2024, 1, 1): '신정',</text>
    <text x="15" y="78" class="tufte-code">  (2024, 5, 5): '어린이날',</text>
    <text x="15" y="93" class="tufte-code">}</text>
    <text x="15" y="112" class="tufte-small">(년, 월, 일) 튜플이 키</text>
  </g>

  <!-- Example 3: Multi-dimensional index -->
  <g transform="translate(480, 190)">
    <rect x="0" y="0" width="210" height="120" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="105" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">행렬 인덱스 → 값</text>
    <line x1="10" y1="30" x2="200" y2="30" stroke="#ccc"/>
    <text x="15" y="48" class="tufte-code">sparse = {</text>
    <text x="15" y="63" class="tufte-code">  (0, 0): 1,</text>
    <text x="15" y="78" class="tufte-code">  (2, 3): 5,</text>
    <text x="15" y="93" class="tufte-code">}</text>
    <text x="15" y="112" class="tufte-small">(행, 열) 튜플이 키</text>
  </g>
</svg>
