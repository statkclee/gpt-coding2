<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
  <defs>
    <style>
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" class="tufte-label" font-weight="bold">그래프 표현 방법</text>

  <!-- Sample Graph -->
  <g transform="translate(30, 45)">
    <text x="70" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">원본 그래프</text>
    <rect x="0" y="10" width="140" height="100" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>

    <!-- Nodes -->
    <circle cx="40" cy="40" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="40" y="44" text-anchor="middle" class="tufte-code">A</text>

    <circle cx="100" cy="40" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="100" y="44" text-anchor="middle" class="tufte-code">B</text>

    <circle cx="40" cy="90" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="40" y="94" text-anchor="middle" class="tufte-code">C</text>

    <circle cx="100" cy="90" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="100" y="94" text-anchor="middle" class="tufte-code">D</text>

    <!-- Edges -->
    <line x1="55" y1="40" x2="85" y2="40" stroke="#666" stroke-width="2"/>
    <line x1="40" y1="55" x2="40" y2="75" stroke="#666" stroke-width="2"/>
    <line x1="55" y1="90" x2="85" y2="90" stroke="#666" stroke-width="2"/>
  </g>

  <!-- Adjacency List -->
  <g transform="translate(200, 45)">
    <text x="110" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">인접 리스트 (Adjacency List)</text>
    <rect x="0" y="10" width="220" height="100" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>

    <!-- List representation -->
    <text x="15" y="35" class="tufte-code">A: [B, C]</text>
    <text x="15" y="52" class="tufte-code">B: [A, D]</text>
    <text x="15" y="69" class="tufte-code">C: [A, D]</text>
    <text x="15" y="86" class="tufte-code">D: [B, C]</text>

    <!-- Visual arrows -->
    <text x="120" y="35" class="tufte-small">→ B, C에 연결</text>
    <text x="120" y="52" class="tufte-small">→ A, D에 연결</text>

    <text x="110" y="130" text-anchor="middle" class="tufte-small">메모리: O(V + E)</text>
    <text x="110" y="145" text-anchor="middle" class="tufte-small">희소 그래프에 적합</text>
  </g>

  <!-- Adjacency Matrix -->
  <g transform="translate(450, 45)">
    <text x="120" y="0" text-anchor="middle" class="tufte-label" font-weight="bold">인접 행렬 (Adjacency Matrix)</text>
    <rect x="0" y="10" width="240" height="100" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>

    <!-- Matrix header -->
    <text x="75" y="30" class="tufte-code">A</text>
    <text x="105" y="30" class="tufte-code">B</text>
    <text x="135" y="30" class="tufte-code">C</text>
    <text x="165" y="30" class="tufte-code">D</text>

    <!-- Matrix rows -->
    <text x="45" y="48" class="tufte-code">A</text>
    <text x="75" y="48" class="tufte-code">0</text>
    <text x="105" y="48" class="tufte-code">1</text>
    <text x="135" y="48" class="tufte-code">1</text>
    <text x="165" y="48" class="tufte-code">0</text>

    <text x="45" y="65" class="tufte-code">B</text>
    <text x="75" y="65" class="tufte-code">1</text>
    <text x="105" y="65" class="tufte-code">0</text>
    <text x="135" y="65" class="tufte-code">0</text>
    <text x="165" y="65" class="tufte-code">1</text>

    <text x="45" y="82" class="tufte-code">C</text>
    <text x="75" y="82" class="tufte-code">1</text>
    <text x="105" y="82" class="tufte-code">0</text>
    <text x="135" y="82" class="tufte-code">0</text>
    <text x="165" y="82" class="tufte-code">1</text>

    <text x="45" y="99" class="tufte-code">D</text>
    <text x="75" y="99" class="tufte-code">0</text>
    <text x="105" y="99" class="tufte-code">1</text>
    <text x="135" y="99" class="tufte-code">1</text>
    <text x="165" y="99" class="tufte-code">0</text>

    <!-- Grid lines -->
    <line x1="65" y1="35" x2="65" y2="103" stroke="#ccc"/>
    <line x1="95" y1="35" x2="95" y2="103" stroke="#ccc"/>
    <line x1="125" y1="35" x2="125" y2="103" stroke="#ccc"/>
    <line x1="155" y1="35" x2="155" y2="103" stroke="#ccc"/>
    <line x1="185" y1="35" x2="185" y2="103" stroke="#ccc"/>

    <text x="200" y="60" class="tufte-small">1=연결</text>
    <text x="200" y="75" class="tufte-small">0=미연결</text>

    <text x="120" y="130" text-anchor="middle" class="tufte-small">메모리: O(V²)</text>
    <text x="120" y="145" text-anchor="middle" class="tufte-small">밀집 그래프, 행렬 연산에 적합</text>
  </g>

  <!-- Comparison -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="660" height="105" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="330" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">비교</text>
    <line x1="20" y1="28" x2="640" y2="28" stroke="#ccc"/>

    <!-- Headers -->
    <text x="60" y="48" text-anchor="middle" class="tufte-small" font-weight="bold">연산</text>
    <text x="200" y="48" text-anchor="middle" class="tufte-small" font-weight="bold">인접 리스트</text>
    <text x="400" y="48" text-anchor="middle" class="tufte-small" font-weight="bold">인접 행렬</text>
    <text x="580" y="48" text-anchor="middle" class="tufte-small" font-weight="bold">NetworkX</text>

    <line x1="20" y1="55" x2="640" y2="55" stroke="#eee"/>

    <!-- Row 1 -->
    <text x="60" y="70" text-anchor="middle" class="tufte-small">엣지 확인</text>
    <text x="200" y="70" text-anchor="middle" class="tufte-code">O(degree)</text>
    <text x="400" y="70" text-anchor="middle" class="tufte-code">O(1)</text>
    <text x="580" y="70" text-anchor="middle" class="tufte-code">G.has_edge()</text>

    <!-- Row 2 -->
    <text x="60" y="88" text-anchor="middle" class="tufte-small">이웃 탐색</text>
    <text x="200" y="88" text-anchor="middle" class="tufte-code">O(degree)</text>
    <text x="400" y="88" text-anchor="middle" class="tufte-code">O(V)</text>
    <text x="580" y="88" text-anchor="middle" class="tufte-code">G.neighbors()</text>
  </g>

</svg>
