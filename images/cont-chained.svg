<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-label { font-size: 10px; font-weight: bold; } /* Changed from 14px to 13px for consistency */
      .tufte-small { font-size: 11px; fill: #555; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="200" fill="#ffffff"/>

  <!-- Main flow path segments -->
  <path d="M 70 100 L 150 100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <path d="M 190 100 L 300 100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="95" text-anchor="start" class="tufte-text tufte-small">False</text>

  <path d="M 340 100 L 430 100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="95" text-anchor="start" class="tufte-text tufte-small">False</text>

  <!-- Merge point line coming from else block -->
  <path d="M 530 100 L 650 100" fill="none" stroke="#666" stroke-width="1.5"/>

  <!-- Arrow to end circle -->
  <path d="M 650 100 L 730 100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Start Circle -->
  <circle cx="50" cy="100" r="20" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="50" y="105" text-anchor="middle" class="tufte-text tufte-label">시작</text>

  <!-- Condition 1: x < y -->
  <polygon points="150,100 190,70 230,100 190,130" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="105" text-anchor="middle" class="tufte-code">x &lt; y</text>
  <text x="190" y="145" text-anchor="middle" class="tufte-text tufte-small" fill="#888">if</text>

  <!-- Condition 2: x > y (elif) -->
  <polygon points="300,100 340,70 380,100 340,130" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="105" text-anchor="middle" class="tufte-code">x &gt; y</text>
  <text x="340" y="145" text-anchor="middle" class="tufte-text tufte-small" fill="#888">elif</text>

  <!-- Else block -->
  <rect x="430" y="80" width="130" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="495" y="105" text-anchor="middle" class="tufte-code">print("x와 y는 같다")</text> <!-- Removed font-size override -->
  <text x="480" y="135" text-anchor="middle" class="tufte-text tufte-small" fill="#888">else</text>

  <!-- End Circle -->
  <circle cx="750" cy="100" r="20" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
  <text x="750" y="105" text-anchor="middle" class="tufte-text tufte-label">종료</text>

  <!-- Action 1 (if True): x < y -->
  <path d="M 190 70 L 190 30 L 240 30" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="50" text-anchor="start" class="tufte-text tufte-small">True</text>

  <rect x="250" y="10" width="140" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="320" y="35" text-anchor="middle" class="tufte-code">print("x는 y보다 작다")</text> <!-- Removed font-size override -->

  <!-- Path from Action 1 to common merge line -->
  <path d="M 390 30 L 650 30 L 650 100" fill="none" stroke="#666" stroke-width="1.5"/>

  <!-- Action 2 (elif True): x > y -->
  <path d="M 340 70 L 340 55 L 400 55" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="68" text-anchor="start" class="tufte-text tufte-small">True</text>

  <rect x="400" y="35" width="150" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
  <text x="480" y="60" text-anchor="middle" class="tufte-code">print("x는 y보다 크다")</text> <!-- Removed font-size override -->

  <!-- Path from Action 2 to common merge line -->
  <path d="M 550 55 L 650 55 L 650 100" fill="none" stroke="#666" stroke-width="1.5"/>
  
  <!-- Annotation (re-added) -->
  <text x="400" y="180" text-anchor="middle" class="tufte-text tufte-small" fill="#888">순차적 조건 검사 (if-elif-else) 및 실행 흐름</text>

</svg>