<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 800 390">
  <defs>
    <style>
      .tufte-title {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 18px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 12px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", Palatino, serif;
        font-size: 11px;
        fill: #444;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .box-raw { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .box-train { fill: #f0f4f8; stroke: #333; stroke-width: 1.5; }
      .box-test { fill: #fff; stroke: #666; stroke-width: 1.5; stroke-dasharray: 4,2; }
      .icon-box { fill: #fff; stroke: #666; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="400" y="40" class="tufte-title" text-anchor="middle">데이터 최적화 전략: 일반화(Generalization)의 열쇠</text>
  <text x="400" y="60" class="tufte-text" text-anchor="middle" font-style="italic">데이터 누수(Data Leakage)를 방지하고 강건한 모델을 만드는 파이프라인</text> -->

  <!-- Step 1: Raw Data & Split (Left) -->
  <g transform="translate(30, 100)">
    <text x="75" y="25" class="tufte-subtitle" text-anchor="middle">1. 분할 (Split)</text>
    <text x="75" y="45" class="tufte-text" text-anchor="middle" fill="#c00">"최적화 전 분할 필수!"</text>
    
    <!-- Raw Data Block -->
    <rect x="25" y="60" width="100" height="90" class="box-raw" rx="3"/>
    <text x="75" y="80" class="tufte-label" text-anchor="middle">전체 데이터</text>
    <rect x="35" y="90" width="60" height="10" fill="#999"/>
    <rect x="35" y="105" width="20" height="10" fill="#999"/>
    <text x="75" y="135" class="tufte-code" text-anchor="middle" fill="#c00">불균형 (Imbalance)</text>

    <!-- Split Arrows -->
    <path d="M75 150 L75 165" stroke="#666" stroke-width="1.5"/>
    <path d="M75 165 L40 185" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M75 165 L120 185" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="30" y="205" class="tufte-label" text-anchor="middle">학습 (Train)</text>
    <text x="30" y="220" class="tufte-code" text-anchor="middle">80%</text>
    
    <g transform='translate(-20,0)'>
      <text x="140" y="205" class="tufte-label" text-anchor="middle">테스트 (Test)</text>
      <text x="140" y="220" class="tufte-code" text-anchor="middle">20%</text>
      <text x="140" y="235" class="tufte-text" text-anchor="middle" font-size="9px">봉인 (Lock)</text>
    </g>
  </g>

  <!-- Step 2: Optimization Zone (Middle) -->
  <g transform="translate(200, 100)">
    <text x="150" y="25" class="tufte-subtitle" text-anchor="middle">2. 학습 데이터 최적화 (Optimization)</text>
    
    <!-- Optimization Container -->
    <rect x="0" y="50" width="300" height="310" class="box-train" rx="5"/>
    <text x="150" y="70" class="tufte-label" text-anchor="middle">오직 학습 데이터(Train Set)만 변형</text>
    <line x1="20" y1="80" x2="280" y2="80" stroke="#ddd" stroke-width="1"/>

    <!-- Tech 1: Balancing -->
    <g transform="translate(20, 95)">
        <rect x="0" y="0" width="120" height="80" class="icon-box" rx="3"/>
        <text x="60" y="20" class="tufte-label" text-anchor="middle">균형 (Balancing)</text>
        <!-- Before -->
        <rect x="20" y="35" width="5" height="20" fill="#999"/>
        <rect x="30" y="50" width="5" height="5" fill="#999"/>
        <text x="45" y="48" font-size="10px">→</text>
        <!-- After -->
        <rect x="60" y="35" width="5" height="20" fill="#333"/> 
        <rect x="70" y="35" width="5" height="20" fill="#333"/>
        <text x="60" y="70" class="tufte-code" text-anchor="middle" font-size="8px">Oversampling</text>
    </g>

    <!-- Tech 2: Augmentation -->
    <g transform="translate(160, 95)">
        <rect x="0" y="0" width="120" height="80" class="icon-box" rx="3"/>
        <text x="60" y="20" class="tufte-label" text-anchor="middle">증강 (Augmentation)</text>
        <circle cx="30" cy="45" r="8" fill="none" stroke="#333" stroke-width="2"/>
        <text x="50" y="48" font-size="10px">→</text>
        <circle cx="70" cy="45" r="8" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="2,2"/>
        <circle cx="90" cy="45" r="8" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="2,2"/>
        <text x="60" y="70" class="tufte-code" text-anchor="middle" font-size="8px">Rotate/Flip/Noise</text>
    </g>

    <!-- Tech 3: Scaling -->
    <g transform="translate(90, 195)">
        <rect x="0" y="0" width="120" height="80" class="icon-box" rx="3"/>
        <text x="60" y="20" class="tufte-label" text-anchor="middle">스케일링 (Scaling)</text>
        <path d="M20 50 Q30 30 40 50" fill="none" stroke="#999"/>
        <text x="50" y="48" font-size="10px">→</text>
        <path d="M70 50 Q85 20 100 50" fill="none" stroke="#333" stroke-width="1.5"/>
        <text x="60" y="70" class="tufte-code" text-anchor="middle" font-size="8px">Standardization</text>
    </g>

    <!-- Label for Flow -->
    <text x="150" y="335" class="tufte-text" text-anchor="middle">결과: 풍부하고 균형 잡힌 학습 데이터 확보</text>
  </g>

  <!-- Arrow Connecting -->
  <line x1="500" y1="190" x2="570" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Evaluation (Right) -->
  <g transform="translate(540, 100)">
    <text x="120" y="25" class="tufte-subtitle" text-anchor="middle">3. 일반화 평가 (Generalization)</text>

    <!-- Model Training -->
    <rect x="30" y="60" width="180" height="60" fill="#fff" stroke="#333" stroke-width="2" rx="3"/>
    <text x="120" y="85" class="tufte-label" text-anchor="middle">모델 학습 (Fit)</text>
    <text x="120" y="105" class="tufte-code" text-anchor="middle">Loss Minimize</text>

    <!-- Arrow Down -->
    <line x1="120" y1="120" x2="120" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Test Evaluation -->
    <rect x="30" y="150" width="180" height="120" class="box-test" rx="3"/>
    <text x="120" y="175" class="tufte-label" text-anchor="middle">최종 평가 (Evaluate)</text>

    <!-- Test Set Incoming Arrow - Smooth parabolic curve from bottom -->
    <path d="M-390 240 Q-250 340 25 240"
          stroke="#000" stroke-width="2" stroke-dasharray="5,3"
          fill="none" marker-end="url(#arrow)"/>

    <!-- "Test Set (Pure)" Label -->
    <text x="-200" y="310" class="tufte-text" fill="#c00" text-anchor="middle" font-size="10px" font-weight="bold">Test Set (봉인 해제)</text>

    <!-- Generalization Chart -->
    <g transform="translate(70, 195)">
        <!-- Axes -->
        <line x1="0" y1="40" x2="100" y2="40" stroke="#ccc"/>
        <line x1="0" y1="0" x2="0" y2="40" stroke="#ccc"/>
        
        <!-- Train Curve (Low Loss) -->
        <path d="M0 5 Q50 35 100 38" fill="none" stroke="#999" stroke-width="1"/>
        <!-- Test Curve (Converging) -->
        <path d="M0 10 Q50 32 100 35" fill="none" stroke="#333" stroke-width="1.5"/>
        
        <text x="50" y="55" class="tufte-code" font-size="8px" text-anchor="middle">Good Generalization</text>
    </g>
  </g>

  <!-- Bottom Insight -->
  <!-- <line x1="50" y1="420" x2="750" y2="420" stroke="#ddd" stroke-width="1"/> -->
  <!-- <text x="400" y="440" class="tufte-text" text-anchor="middle">"일반화란 보지 못한 데이터(Test Set)에서도 잘 동작하는 능력이다. 이를 위해 Test Set을 학습 과정에서 철저히 격리해야 한다."</text> -->

</svg>