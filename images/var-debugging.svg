<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 650 240">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-title { font-size: 14px; font-weight: bold; }
      .tufte-label { font-size: 13px; }
      .tufte-small { font-size: 12px; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="300" fill="#ffffff"/>

  <!-- Title area -->
  <!-- <text x="325" y="45" text-anchor="middle" class="tufte-text tufte-title">오류 유형과 발견 시점</text> -->

  <!-- Timeline arrow -->
  <path d="M 50 80 L 600 80" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="50" y="72" class="tufte-text tufte-small" fill="#666">코드 작성</text>
  <text x="600" y="72" text-anchor="end" class="tufte-text tufte-small" fill="#666">실행 완료</text>

  <!-- Syntax Error -->
  <g transform="translate(100, 0)">
    <circle cx="0" cy="80" r="6" fill="#333"/>
    <line x1="0" y1="86" x2="0" y2="110" stroke="#333" stroke-width="1.5"/>
    <rect x="-70" y="115" width="140" height="75" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="4"/>
    <text x="0" y="138" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">구문 오류</text>
    <text x="0" y="155" text-anchor="middle" class="tufte-text tufte-small">(Syntax Error)</text>
    <text x="0" y="175" text-anchor="middle" class="tufte-text tufte-code" fill="#666">bad name = 5</text>
    <text x="0" y="205" text-anchor="middle" class="tufte-text tufte-small" fill="#666">실행 전 발견</text>
  </g>

  <!-- Name Error -->
  <g transform="translate(325, 0)">
    <circle cx="0" cy="80" r="6" fill="#666"/>
    <line x1="0" y1="86" x2="0" y2="110" stroke="#666" stroke-width="1.5"/>
    <rect x="-70" y="115" width="140" height="75" fill="#f0f0f0" stroke="#333" stroke-width="1.5" rx="4"/>
    <text x="0" y="138" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">이름 오류</text>
    <text x="0" y="155" text-anchor="middle" class="tufte-text tufte-small">(Name Error)</text>
    <text x="0" y="175" text-anchor="middle" class="tufte-text tufte-code" fill="#666">print(prce)</text>
    <text x="0" y="205" text-anchor="middle" class="tufte-text tufte-small" fill="#666">실행 중 발견</text>
  </g>

  <!-- Semantic Error -->
  <g transform="translate(550, 0)">
    <circle cx="0" cy="80" r="6" fill="#999"/>
    <line x1="0" y1="86" x2="0" y2="110" stroke="#999" stroke-width="1.5"/>
    <rect x="-70" y="115" width="140" height="75" fill="#f8f8f8" stroke="#333" stroke-width="1.5" rx="4"/>
    <text x="0" y="138" text-anchor="middle" class="tufte-text tufte-label" font-weight="bold">의미론적 오류</text>
    <text x="0" y="155" text-anchor="middle" class="tufte-text tufte-small">(Semantic Error)</text>
    <text x="0" y="175" text-anchor="middle" class="tufte-text tufte-code" fill="#666">1/2*pi ≠ 1/(2π)</text>
    <text x="0" y="205" text-anchor="middle" class="tufte-text tufte-small" fill="#666">실행 후 발견</text>
  </g>

  <!-- Difficulty gradient -->
  <text x="100" y="245" text-anchor="middle" class="tufte-text tufte-small" fill="#333">쉬움</text>
  <rect x="150" y="238" width="350" height="12" fill="url(#gradient)" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="550" y="245" text-anchor="middle" class="tufte-text tufte-small" fill="#333">어려움</text>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#999;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bottom annotation -->
  <text x="325" y="275" text-anchor="middle" class="tufte-text tufte-small" fill="#666">발견 시점이 늦을수록 원인 파악이 어려워진다</text>
</svg>
