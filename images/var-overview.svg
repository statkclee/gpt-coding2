<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 700 290">
  <defs>
    <style>
      .tufte-text { font-family: Palatino, 'Book Antiqua', Georgia, serif; fill: #333; }
      .tufte-title { font-size: 16px; font-weight: bold; }
      .tufte-label { font-size: 13px; }
      .tufte-small { font-size: 11px; }
      .tufte-code { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="330" fill="#ffffff"/>

  <!-- Title -->
  <!-- <text x="350" y="30" text-anchor="middle" class="tufte-text tufte-title">변수, 표현식, 문장의 관계</text> -->

  <!-- Value Box -->
  <rect x="50" y="60" width="140" height="80" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="120" y="90" text-anchor="middle" class="tufte-text tufte-label">값 (Value)</text>
  <text x="120" y="115" text-anchor="middle" class="tufte-text tufte-code">42, "hello", 3.14</text>
  <text x="120" y="135" text-anchor="middle" class="tufte-text tufte-small">자료형을 가진 데이터</text>

  <!-- Variable Box -->
  <rect x="280" y="60" width="140" height="80" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="350" y="90" text-anchor="middle" class="tufte-text tufte-label">변수 (Variable)</text>
  <text x="350" y="115" text-anchor="middle" class="tufte-text tufte-code">name = "Alice"</text>
  <text x="350" y="135" text-anchor="middle" class="tufte-text tufte-small">값을 담는 이름</text>

  <!-- Operator Box -->
  <rect x="510" y="60" width="140" height="80" fill="#f5f5f5" stroke="#666" stroke-width="1.5" rx="4"/>
  <text x="580" y="90" text-anchor="middle" class="tufte-text tufte-label">연산자 (Operator)</text>
  <text x="580" y="115" text-anchor="middle" class="tufte-text tufte-code">+ - * / % **</text>
  <text x="580" y="135" text-anchor="middle" class="tufte-text tufte-small">계산을 표현하는 기호</text>

  <!-- Arrows to Expression -->
  <path d="M 120 140 L 120 170 L 255 185" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 350 140 L 350 185" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 580 140 L 580 170 L 445 185" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Expression Box -->
  <rect x="230" y="190" width="240" height="50" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/>
  <text x="350" y="215" text-anchor="middle" class="tufte-text tufte-label">표현식 (Expression)</text>
  <text x="350" y="232" text-anchor="middle" class="tufte-text tufte-code">price * quantity + tax</text>

  <!-- Arrow to Statement -->
  <path d="M 350 240 L 350 265" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="380" y="258" class="tufte-text tufte-small">평가</text>

  <!-- Statement Box -->
  <rect x="180" y="265" width="340" height="47" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
  <text x="350" y="290" text-anchor="middle" class="tufte-text tufte-label" fill="#fff">문장 (Statement)</text>
  <text x="350" y="305" text-anchor="middle" class="tufte-text tufte-code" fill="#eee">total = price * quantity + tax</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>