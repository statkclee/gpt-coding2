<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 800 300">
  <defs>
    <style>
      /* Tufte Grayscale Style */
      .label-title { font-family: Palatino, serif; font-size: 16px; font-weight: bold; fill: #111; }
      .label-head { font-family: Palatino, serif; font-size: 14px; font-weight: bold; fill: #222; }
      .label-body { font-family: Palatino, serif; font-size: 12px; fill: #333; }
      .label-note { font-family: Palatino, serif; font-size: 11px; fill: #555; font-style: italic; }
      .label-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 10px; fill: #444; }

      .box-intent { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 4; }
      .box-engine { fill: #f9f9f9; stroke: #666; stroke-width: 1.5; rx: 4; }
      .box-result { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 4; }
      .box-code { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; rx: 2; }

      .line-flow { stroke: #333; stroke-width: 1.5; fill: none; }
      .line-sep { stroke: #ddd; stroke-width: 1; }

      .arrow-head { fill: #333; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#fff" />

  <!-- Title -->
  <!-- <text x="400" y="30" text-anchor="middle" class="label-title">선언형 프로그래밍: "무엇(What)"을 정의하다</text> -->

  <!-- ========================================== -->
  <!-- MAIN FLOW: Intent -> Engine -> Result -->
  <!-- ========================================== -->
  <g transform="translate(50, 70)">

    <!-- 1. Intent (User Code) -->
    <g transform="translate(0, 0)">
      <text x="90" y="-10" text-anchor="middle" class="label-head">1. 의도</text>
      <rect x="0" y="0" width="180" height="240" class="box-intent"/>

      <!-- Example 1: SQL -->
      <g transform="translate(15, 15)">
        <text x="0" y="0" class="label-mono" font-weight="bold">SQL</text>
        <rect x="0" y="5" width="150" height="35" class="box-code"/>
        <text x="10" y="20" class="label-mono">SELECT * FROM Users</text>
        <text x="10" y="32" class="label-mono">WHERE age > 20</text>
      </g>

      <!-- Example 2: Regex -->
      <g transform="translate(15, 70)">
        <text x="0" y="0" class="label-mono" font-weight="bold">정규표현식</text>
        <rect x="0" y="5" width="150" height="25" class="box-code"/>
        <text x="10" y="20" class="label-mono">^\d{3}-\d{4}$</text>
      </g>

      <!-- Example 3: LaTeX -->
      <g transform="translate(15, 120)">
        <text x="0" y="0" class="label-mono" font-weight="bold">LaTeX</text>
        <rect x="0" y="5" width="150" height="35" class="box-code"/>
        <text x="10" y="20" class="label-mono">\frac{-b \pm</text>
        <text x="10" y="32" class="label-mono">\sqrt{b^2-4ac}}{2a}</text>
      </g>

      <!-- Example 4: HTML/UI -->
      <g transform="translate(15, 180)">
        <text x="0" y="0" class="label-mono" font-weight="bold">HTML</text>
        <rect x="0" y="5" width="150" height="35" class="box-code"/>
        <text x="2.5" y="20" class="label-mono">&lt;button class="primary"&gt;</text>
        <text x="20" y="32" class="label-mono">  제출</text>
      </g>
    </g>

    <!-- Arrow -->
    <g transform="translate(180, 130)">
        <path d="M 0 0 L 40 0" class="line-flow" marker-end="url(#arrow)"/>
        <text x="20" y="-10" text-anchor="middle" class="label-note">위임</text>
    </g>

    <!-- 2. Engine (Black Box) -->
    <g transform="translate(240, 0)">
      <text x="90" y="-10" text-anchor="middle" class="label-head">2. 엔진</text>
      <rect x="0" y="0" width="180" height="240" class="box-engine"/>

      <text x="90" y="115" text-anchor="middle" class="label-body" font-weight="bold">"어떻게"는 숨겨짐</text>
      <text x="90" y="135" text-anchor="middle" class="label-note">쿼리 옵티마이저, 정규식 매처</text>
      <text x="90" y="150" text-anchor="middle" class="label-note">TeX 조판 엔진, 브라우저...</text>

      <!-- Gears icon representation -->
      <g transform="translate(75, 55)">
         <circle cx="15" cy="15" r="12" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="4 2"/>
         <circle cx="15" cy="15" r="4" fill="#ccc"/>
      </g>
    </g>

    <!-- Arrow -->
    <g transform="translate(420, 130)">
        <path d="M 0 0 L 40 0" class="line-flow" marker-end="url(#arrow)"/>
        <text x="20" y="-10" text-anchor="middle" class="label-note">실행</text>
    </g>

    <!-- 3. Result -->
    <g transform="translate(480, 0)">
      <text x="90" y="-10" text-anchor="middle" class="label-head">3. 결과</text>
      <rect x="0" y="0" width="180" height="240" class="box-result"/>

      <!-- Result 1: SQL Table -->
      <g transform="translate(15, 15)">
        <text x="0" y="0" class="label-mono">쿼리 결과</text>
        <!-- Table header -->
        <rect x="0" y="5" width="150" height="14" fill="#f0f0f0" stroke="#ccc"/>
        <text x="30" y="14" class="label-mono" font-size="8">name</text>
        <text x="100" y="14" class="label-mono" font-size="8">age</text>
        <!-- Row 1 -->
        <rect x="0" y="19" width="150" height="12" fill="#fff" stroke="#ccc"/>
        <text x="10" y="28" class="label-mono" font-size="8" fill="#555">김철수</text>
        <text x="105" y="28" class="label-mono" font-size="8" fill="#555">25</text>
        <!-- Row 2 -->
        <rect x="0" y="31" width="150" height="12" fill="#fafafa" stroke="#ccc"/>
        <text x="10" y="40" class="label-mono" font-size="8" fill="#555">이영희</text>
        <text x="105" y="40" class="label-mono" font-size="8" fill="#555">32</text>
      </g>

      <!-- Result 2: Regex -->
      <g transform="translate(15, 75)">
        <text x="0" y="0" class="label-mono">패턴 매칭</text>
        <rect x="0" y="5" width="150" height="22" stroke="#ccc" fill="#fff"/>
        <text x="10" y="18" class="label-mono" fill="#333">"010-1234" ✓</text>
      </g>

      <!-- Result 3: LaTeX -->
      <g transform="translate(15, 125)">
        <text x="0" y="0" class="label-mono">조판된 수식</text>
        <rect x="0" y="5" width="150" height="35" stroke="#ccc" fill="#fff"/>
        <!-- Stylized quadratic formula representation -->
        <text x="75" y="18" text-anchor="middle" class="label-body" font-style="italic">−b ± √(b²−4ac)</text>
        <line x1="30" y1="23" x2="120" y2="23" stroke="#444" stroke-width="1"/>
        <text x="75" y="33" text-anchor="middle" class="label-body" font-style="italic">2a</text>
      </g>

      <!-- Result 4: HTML -->
      <g transform="translate(15, 190)">
        <text x="0" y="0" class="label-mono">렌더링된 버튼</text>
        <rect x="0" y="5" width="80" height="25" rx="3" fill="#666"/>
        <text x="40" y="20" text-anchor="middle" class="label-mono" fill="#fff">제출</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- INSIGHT BOX -->
  <!-- ========================================== -->
  <!-- <g transform="translate(50, 300)">
      <rect x="0" y="0" width="700" height="50" fill="#fcfcfc" stroke="#eee" rx="4"/>
      <rect x="0" y="0" width="5" height="50" fill="#333"/>

      <text x="20" y="20" class="label-head" font-size="12">핵심 통찰:</text>
      <text x="20" y="38" class="label-body">선언형 프로그래밍은 <tspan font-style="italic">"제어 흐름"</tspan>을 추상화하여, 개발자가 <tspan font-weight="bold">"원하는 결과"</tspan>에만 집중하게 한다.</text>
  </g> -->

</svg>
