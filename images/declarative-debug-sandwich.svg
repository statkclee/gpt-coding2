<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 800 290">
  <defs>
    <style>
      /* Tufte Grayscale Style */
      .label-title { font-family: Palatino, serif; font-size: 16px; font-weight: bold; fill: #111; }
      .label-head { font-family: Palatino, serif; font-size: 13px; font-weight: bold; fill: #222; }
      .label-body { font-family: Palatino, serif; font-size: 11px; fill: #333; }
      .label-note { font-family: Palatino, serif; font-size: 10px; fill: #555; font-style: italic; }
      .label-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 9px; fill: #444; }

      .box-layer { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 4; }
      .box-debug { fill: #f5f5f5; stroke: #666; stroke-width: 1; stroke-dasharray: 3 2; rx: 3; }
      .box-checkpoint { fill: #fff; stroke: #333; stroke-width: 2; rx: 12; }

      .line-flow { stroke: #333; stroke-width: 1.5; fill: none; }
      .line-debug { stroke: #888; stroke-width: 1; stroke-dasharray: 4 2; fill: none; }

      .arrow-head { fill: #333; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" class="arrow-head" />
    </marker>
  </defs>

  <rect width="800" height="400" fill="#fff" />

  <!-- ========================================== -->
  <!-- Layer 1: SQL (Declarative) -->
  <!-- ========================================== -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="160" height="120" class="box-layer"/>
    <text x="80" y="20" text-anchor="middle" class="label-head">1. SQL</text>
    <text x="80" y="35" text-anchor="middle" class="label-note">(선언형)</text>

    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="130" height="55" class="box-debug"/>
      <text x="65" y="18" text-anchor="middle" class="label-mono" font-weight="bold">디버깅 도구</text>
      <text x="10" y="35" class="label-mono">• EXPLAIN ANALYZE</text>
      <text x="10" y="48" class="label-mono">• 쿼리 로그</text>
    </g>
  </g>

  <!-- Checkpoint 1 -->
  <g transform="translate(230, 100)">
    <ellipse cx="25" cy="20" rx="25" ry="18" class="box-checkpoint"/>
    <text x="25" y="25" text-anchor="middle" class="label-mono" font-weight="bold">①</text>
  </g>
  <path d="M 210 120 L 230 120" class="line-flow" marker-end="url(#arrow)"/>
  <path d="M 280 120 L 300 120" class="line-flow" marker-end="url(#arrow)"/>

  <!-- Debug annotation 1 -->
  <g transform="translate(210, 190)">
    <path d="M 45 -50 L 45 -10" class="line-debug"/>
    <rect x="0" y="0" width="100" height="45" class="box-debug"/>
    <text x="50" y="15" text-anchor="middle" class="label-mono" font-weight="bold">검증 포인트</text>
    <text x="50" y="30" text-anchor="middle" class="label-mono">행 수, 컬럼 타입</text>
    <text x="50" y="42" text-anchor="middle" class="label-mono">NULL 값 확인</text>
  </g>

  <!-- ========================================== -->
  <!-- Layer 2: Python (Imperative) -->
  <!-- ========================================== -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="160" height="120" class="box-layer" fill="#fafafa" stroke-dasharray="4 2"/>
    <text x="80" y="20" text-anchor="middle" class="label-head" fill="#555">2. Python</text>
    <text x="80" y="35" text-anchor="middle" class="label-note" fill="#666">(명령형)</text>

    <g transform="translate(15, 50)">
      <rect x="-5" y="0" width="140" height="55" class="box-debug"/>
      <text x="60" y="18" text-anchor="middle" class="label-mono" font-weight="bold">디버깅 도구</text>
      <text x="5" y="35" class="label-mono">• print(), breakpoint()</text>
      <text x="5" y="48" class="label-mono">• pdb, IDE 디버거</text>
    </g>
  </g>

  <!-- Checkpoint 2 -->
  <g transform="translate(500, 100)">
    <ellipse cx="25" cy="20" rx="25" ry="18" class="box-checkpoint"/>
    <text x="25" y="25" text-anchor="middle" class="label-mono" font-weight="bold">②</text>
  </g>
  <path d="M 480 120 L 500 120" class="line-flow" marker-end="url(#arrow)"/>
  <path d="M 550 120 L 570 120" class="line-flow" marker-end="url(#arrow)"/>

  <!-- Debug annotation 2 -->
  <g transform="translate(480, 190)">
    <path d="M 45 -50 L 45 -10" class="line-debug"/>
    <rect x="0" y="0" width="100" height="45" class="box-debug"/>
    <text x="50" y="15" text-anchor="middle" class="label-mono" font-weight="bold">검증 포인트</text>
    <text x="50" y="30" text-anchor="middle" class="label-mono">변환 결과 샘플</text>
    <text x="50" y="42" text-anchor="middle" class="label-mono">예외 케이스</text>
  </g>

  <!-- ========================================== -->
  <!-- Layer 3: Output (Declarative) -->
  <!-- ========================================== -->
  <g transform="translate(590, 60)">
    <rect x="0" y="0" width="160" height="120" class="box-layer"/>
    <text x="80" y="20" text-anchor="middle" class="label-head">3. 출력</text>
    <text x="80" y="35" text-anchor="middle" class="label-note">(선언형)</text>

    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="130" height="55" class="box-debug"/>
      <text x="65" y="18" text-anchor="middle" class="label-mono" font-weight="bold">디버깅 도구</text>
      <text x="10" y="35" class="label-mono">• 결과 비교 (expected)</text>
      <text x="10" y="48" class="label-mono">• 브라우저 DevTools</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Bottom: Debug Strategy -->
  <!-- ========================================== -->
  <g transform="translate(50, 270)">
    <text x="0" y="0" class="label-head">디버깅 전략: 계층 간 경계에서 데이터 검증</text>
    <line x1="0" y1="10" x2="700" y2="10" stroke="#ddd"/>

    <g transform="translate(0, 25)">
      <text x="0" y="0" class="label-body">① SQL → Python:</text>
      <text x="120" y="0" class="label-mono">rows = cursor.fetchall(); print(f"행 수: {len(rows)}, 첫 행: {rows[0]}")</text>
    </g>

    <g transform="translate(0, 45)">
      <text x="0" y="0" class="label-body">② Python → 출력:</text>
      <text x="120" y="0" class="label-mono">assert all('discounted' in r for r in results), "필드 누락"</text>
    </g>
  </g>

</svg>
