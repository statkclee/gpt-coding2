<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 15px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        fill: #333;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="280" fill="#ffffff"/>

  <!-- 왼쪽: 지금까지 배운 것 (휘발성) -->
  <rect x="20" y="20" width="280" height="235" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
  <text x="160" y="45" text-anchor="middle" class="tufte-title">지금까지 배운 것</text>
  <text x="160" y="62" text-anchor="middle" class="tufte-small">전원 OFF → 모두 사라짐</text>
  <line x1="35" y1="72" x2="285" y2="72" stroke="#ccc" stroke-width="1"/>

  <!-- CPU -->
  <rect x="45" y="90" width="110" height="70" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="100" y="115" text-anchor="middle" class="tufte-subtitle">CPU</text>
  <text x="100" y="132" text-anchor="middle" class="tufte-small">중앙처리장치</text>
  <text x="100" y="148" text-anchor="middle" class="tufte-small">연산 · 실행</text>

  <!-- 주기억장치 -->
  <rect x="170" y="90" width="110" height="70" fill="#e8e8e8" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="225" y="115" text-anchor="middle" class="tufte-subtitle">RAM</text>
  <text x="225" y="132" text-anchor="middle" class="tufte-small">주기억장치</text>
  <text x="225" y="148" text-anchor="middle" class="tufte-small">변수 · 자료구조</text>

  <!-- CPU-RAM 연결 -->
  <line x1="155" y1="125" x2="170" y2="125" stroke="#666" stroke-width="1.5"/>

  <!-- 배운 내용 -->
  <text x="45" y="185" class="tufte-label">• 조건문, 함수, 반복</text>
  <text x="45" y="203" class="tufte-label">• 문자열 처리</text>
  <text x="45" y="221" class="tufte-label">• 프로그램 실행</text>
  <text x="160" y="243" text-anchor="middle" class="tufte-small" style="fill:#999">일시적 연습</text>

  <!-- 화살표: 왼쪽 → 오른쪽 -->
  <line x1="310" y1="137" x2="340" y2="137" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="125" text-anchor="middle" class="tufte-small">이번 장</text>

  <!-- 오른쪽: 이번 장에서 배울 것 (영속성) -->
  <rect x="350" y="20" width="280" height="235" fill="#ffffff" stroke="#333" stroke-width="2" rx="4"/>
  <text x="490" y="45" text-anchor="middle" class="tufte-title">이번 장에서 배울 것</text>
  <text x="490" y="62" text-anchor="middle" class="tufte-small">전원 OFF → 데이터 유지</text>
  <line x1="365" y1="72" x2="615" y2="72" stroke="#ccc" stroke-width="1"/>

  <!-- 보조기억장치 -->
  <rect x="400" y="90" width="180" height="70" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="3"/>
  <text x="490" y="115" text-anchor="middle" class="tufte-subtitle">보조기억장치</text>
  <text x="490" y="132" text-anchor="middle" class="tufte-small">하드디스크 · SSD · USB</text>
  <text x="490" y="148" text-anchor="middle" class="tufte-small">파일 저장</text>

  <!-- 배울 내용 -->
  <text x="375" y="185" class="tufte-label">• 파일 열기 / 닫기</text>
  <text x="375" y="203" class="tufte-label">• 파일 읽기 / 쓰기</text>
  <text x="375" y="221" class="tufte-label">• 예외 처리 (try-except)</text>
  <text x="490" y="243" text-anchor="middle" class="tufte-subtitle" style="fill:#333">영속성 확보</text>

  <!-- 하단 핵심 메시지 -->
  <!-- <text x="325" y="270" text-anchor="middle" class="tufte-label">파일을 통해 프로그램 결과를 영구 저장하고 재사용할 수 있다</text> -->

</svg>
