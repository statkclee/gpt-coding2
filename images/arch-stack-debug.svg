<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 120">
  <defs>
    <style>
      .tufte-title { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 13px; fill: #333; font-weight: bold; }
      .tufte-label { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 11px; fill: #333; font-weight: bold; }
      .tufte-desc { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 9px; fill: #666; }
      .tufte-small { font-family: Palatino, 'Book Antiqua', Georgia, serif; font-size: 8px; fill: #999; }
      .box { fill: #f5f5f5; stroke: #666; stroke-width: 1; }
      .box-warn { fill: #fff5f5; stroke: #999; stroke-width: 1; }
      .arrow { stroke: #999; stroke-width: 1; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="750" height="120" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="22" class="tufte-title">소프트웨어 스택 디버깅: 환경 불일치 문제</text>

  <!-- Problem 1 -->
  <rect x="20" y="38" width="220" height="70" rx="3" class="box-warn"/>
  <text x="130" y="55" text-anchor="middle" class="tufte-label">"내 컴퓨터에서는 되는데..."</text>
  <text x="130" y="70" text-anchor="middle" class="tufte-desc">파이썬 버전, 패키지 버전, OS 차이</text>
  <line x1="40" y1="78" x2="220" y2="78" stroke="#ccc" stroke-width="0.5"/>
  <text x="130" y="92" text-anchor="middle" class="tufte-small">해결: requirements.txt 버전 고정</text>
  <text x="130" y="102" text-anchor="middle" class="tufte-small">또는 Docker로 환경 통일</text>

  <!-- Problem 2 -->
  <rect x="260" y="38" width="220" height="70" rx="3" class="box-warn"/>
  <text x="370" y="55" text-anchor="middle" class="tufte-label">ImportError: No module</text>
  <text x="370" y="70" text-anchor="middle" class="tufte-desc">가상환경 미활성화, 패키지 미설치</text>
  <line x1="280" y1="78" x2="460" y2="78" stroke="#ccc" stroke-width="0.5"/>
  <text x="370" y="92" text-anchor="middle" class="tufte-small">해결: which python으로 경로 확인</text>
  <text x="370" y="102" text-anchor="middle" class="tufte-small">source venv/bin/activate</text>

  <!-- Problem 3 -->
  <rect x="500" y="38" width="230" height="70" rx="3" class="box-warn"/>
  <text x="615" y="55" text-anchor="middle" class="tufte-label">Library vs Framework 혼동</text>
  <text x="615" y="70" text-anchor="middle" class="tufte-desc">제어권 오해로 인한 동작 오류</text>
  <line x1="520" y1="78" x2="710" y2="78" stroke="#ccc" stroke-width="0.5"/>
  <text x="615" y="92" text-anchor="middle" class="tufte-small">해결: 프레임워크는 app.run() 필수</text>
  <text x="615" y="102" text-anchor="middle" class="tufte-small">"나를 부른다" 원칙 기억</text>
</svg>
