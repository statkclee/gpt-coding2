<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
  <defs>
    <style>
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        fill: #333;
      }
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-code {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 11px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <!-- Top: Core Question -->
  <rect x="200" y="20" width="320" height="40" fill="#e8e8e8" stroke="#666" rx="3"/>
  <text x="360" y="45" text-anchor="middle" class="tufte-title">리스트와 딕셔너리가 있는데 왜 튜플이 필요한가?</text>

  <!-- Arrow down to answer -->
  <line x1="360" y1="60" x2="360" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Central Answer: Immutability -->
  <rect x="250" y="90" width="220" height="35" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
  <text x="360" y="113" text-anchor="middle" class="tufte-title">핵심: 불변성(Immutability)</text>

  <!-- Three branches -->
  <line x1="280" y1="125" x2="130" y2="165" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="125" x2="360" y2="165" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="125" x2="590" y2="165" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Benefit 1: Dictionary Key -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="210" height="95" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="105" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">1. 딕셔너리 키로 사용</text>
    <line x1="15" y1="30" x2="195" y2="30" stroke="#ccc"/>
    <text x="15" y="48" class="tufte-code">locations = {}</text>
    <text x="15" y="63" class="tufte-code">(37, 127): '서울'  ✓</text>
    <text x="15" y="78" class="tufte-code">[37, 127]: '서울'  ✗</text>
    <text x="15" y="93" class="tufte-small">해시 가능 → 키로 사용 가능</text>
  </g>

  <!-- Benefit 2: Data Integrity -->
  <g transform="translate(255, 170)">
    <rect x="0" y="0" width="210" height="95" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="105" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">2. 데이터 무결성 보장</text>
    <line x1="15" y1="30" x2="195" y2="30" stroke="#ccc"/>
    <text x="15" y="48" class="tufte-code">point = (10, 20)</text>
    <text x="15" y="63" class="tufte-code">point[0] = 15</text>
    <text x="15" y="78" class="tufte-code">→ TypeError!</text>
    <text x="15" y="93" class="tufte-small">실수로 변경하는 것을 방지</text>
  </g>

  <!-- Benefit 3: Sorting -->
  <g transform="translate(490, 170)">
    <rect x="0" y="0" width="210" height="95" fill="#f5f5f5" stroke="#999" rx="3"/>
    <text x="105" y="20" text-anchor="middle" class="tufte-label" font-weight="bold">3. 정렬용 복합 키</text>
    <line x1="15" y1="30" x2="195" y2="30" stroke="#ccc"/>
    <text x="15" y="48" class="tufte-code">(45, 'the')</text>
    <text x="15" y="63" class="tufte-code">(32, 'and')</text>
    <text x="15" y="78" class="tufte-code">(28, 'to')</text>
    <text x="15" y="93" class="tufte-small">첫 요소부터 비교 → DSU 패턴</text>
  </g>

  <!-- Bottom comparison: List vs Tuple -->
  <text x="360" y="295" text-anchor="middle" class="tufte-label" font-weight="bold">리스트 vs 튜플: 선언적 의미</text>

  <!-- List box -->
  <g transform="translate(80, 305)">
    <rect x="0" y="0" width="240" height="55" fill="#e8e8e8" stroke="#999" rx="3"/>
    <text x="120" y="20" text-anchor="middle" class="tufte-code">[1, 2, 3]</text>
    <text x="120" y="38" text-anchor="middle" class="tufte-label">"이 데이터는 바뀔 수 있다"</text>
    <text x="120" y="52" text-anchor="middle" class="tufte-small">가변(mutable)</text>
  </g>

  <!-- vs -->
  <text x="360" y="335" text-anchor="middle" class="tufte-label">vs</text>

  <!-- Tuple box -->
  <g transform="translate(400, 305)">
    <rect x="0" y="0" width="240" height="55" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
    <text x="120" y="20" text-anchor="middle" class="tufte-code">(1, 2, 3)</text>
    <text x="120" y="38" text-anchor="middle" class="tufte-label">"이 데이터는 바뀌지 않는다"</text>
    <text x="120" y="52" text-anchor="middle" class="tufte-small">불변(immutable)</text>
  </g>
</svg>
