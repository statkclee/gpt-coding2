<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 850 470">
  <defs>
    <style>
      /* Tufte Grayscale Style */
      .label-title { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 16px; font-weight: bold; fill: #111; }
      .label-group { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 14px; font-weight: bold; fill: #555; }
      .label-head { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 13px; font-weight: bold; fill: #222; }
      .label-body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #333; }
      .label-note { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 10px; fill: #666; font-style: italic; }
      .label-mono { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 10px; fill: #444; }

      .box-concept { fill: #fff; stroke: #666; stroke-width: 1.5; rx: 4; }
      .box-mycode { fill: #fff; stroke: #333; stroke-width: 2.5; rx: 6; }
      .box-others { fill: #f9f9f9; stroke: #777; stroke-width: 1.5; rx: 6; }
      .box-inner { fill: #fff; stroke: #999; stroke-width: 1; rx: 3; }
      .box-env { fill: #eee; stroke: #888; stroke-width: 1.5; rx: 4; }
      
      .group-rect { fill: none; stroke: #ccc; stroke-width: 1.5; stroke-dasharray: 6 3; rx: 8; }
      
      .line-flow { stroke: #333; stroke-width: 1.5; fill: none; }
      .arrow-head { fill: #333; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" class="arrow-head" />
    </marker>
  </defs>

  <rect width="850" height="500" fill="#fff" />

  <!-- Title -->
  <!-- <text x="425" y="30" text-anchor="middle" class="label-title">소프트웨어 개발의 3단계 계층 구조</text> -->

  <!-- ========================================== -->
  <!-- GROUP 1: Abstract Concepts (Thinking) -->
  <!-- ========================================== -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="750" height="90" class="group-rect"/>
    <text x="20" y="-10" class="label-group">1. 추상 개념</text>
    <text x="110" y="-10" class="label-note">"소프트웨어 설계를 위한 사고 체계"</text>

    <g transform="translate(0, -15)">
      <!-- Concepts Row -->
      <g transform="translate(30, 30)">
        <rect x="0" y="0" width="180" height="60" class="box-concept"/>
        <text x="90" y="25" text-anchor="middle" class="label-head">패러다임</text>
        <text x="90" y="45" text-anchor="middle" class="label-mono">OOP, FP</text>
      </g>

      <path d="M 210 60 L 250 60" class="line-flow" marker-end="url(#arrow)"/>

      <g transform="translate(250, 30)">
        <rect x="0" y="0" width="180" height="60" class="box-concept"/>
        <text x="90" y="25" text-anchor="middle" class="label-head">패턴</text>
        <text x="90" y="45" text-anchor="middle" class="label-mono">Singleton</text>
      </g>

      <path d="M 430 60 L 470 60" class="line-flow" marker-end="url(#arrow)"/>

      <g transform="translate(470, 30)">
        <rect x="0" y="0" width="180" height="60" class="box-concept"/>
        <text x="90" y="25" text-anchor="middle" class="label-head">아키텍처</text>
        <text x="90" y="45" text-anchor="middle" class="label-mono">MVC, MSA</text>
      </g>
    </g>
  </g>

  <!-- Vertical Arrow: Thinking -> Implementation -->
  <path d="M 425 150 L 425 175" class="line-flow" marker-end="url(#arrow)"/>
  <text x="445" y="168" class="label-note">구현</text>


  <!-- ========================================== -->
  <!-- GROUP 2: Implementation (Code Composition) -->
  <!-- ========================================== -->
  <g transform="translate(50, 185)">
    <rect x="0" y="0" width="750" height="160" class="group-rect"/>
    <text x="20" y="-10" class="label-group">2. 구현</text>
    <text x="90" y="-10" class="label-note">"추상 개념을 실제 코드로 구체화"</text>

    <!-- CENTER: Application Code (emphasized) -->
    <g transform="translate(240, 25)">
      <rect x="0" y="0" width="270" height="90" class="box-mycode"/>
      <text x="135" y="25" text-anchor="middle" class="label-head" font-size="14">애플리케이션 코드</text>
      <text x="135" y="42" text-anchor="middle" class="label-note">Application Source Code</text>
      <text x="135" y="70" text-anchor="middle" class="label-mono" font-size="12">main.py, App.js, index.ts</text>
    </g>

    <!-- LEFT: Framework -->
    <g transform="translate(30, 35)">
      <rect x="0" y="0" width="160" height="70" class="box-others"/>
      <text x="80" y="22" text-anchor="middle" class="label-head">프레임워크</text>
      <text x="80" y="38" text-anchor="middle" class="label-note">Framework</text>
      <text x="80" y="58" text-anchor="middle" class="label-mono">Django, React</text>
    </g>

    <!-- RIGHT: Library -->
    <g transform="translate(560, 35)">
      <rect x="0" y="0" width="160" height="70" class="box-others"/>
      <text x="80" y="22" text-anchor="middle" class="label-head">라이브러리</text>
      <text x="80" y="38" text-anchor="middle" class="label-note">Library</text>
      <text x="80" y="58" text-anchor="middle" class="label-mono">pandas, lodash</text>
    </g>

    <!-- Arrow: Framework → App (IoC) -->
    <path d="M 190 70 L 240 70" class="line-flow" marker-end="url(#arrow)"/>
    <text x="215" y="62" text-anchor="middle" class="label-mono" font-size="9">IoC</text>

    <!-- Arrow: App → Library (Call) -->
    <path d="M 510 70 L 560 70" class="line-flow" marker-end="url(#arrow)"/>
    <text x="535" y="62" text-anchor="middle" class="label-mono" font-size="9">Call</text>

    <!-- SDK bracket below -->
    <path d="M 30 115 L 30 125 L 720 125 L 720 115" stroke="#999" stroke-width="1" fill="none"/>
    <text x="280" y="145" text-anchor="middle" class="label-head" fill="#666">SDK</text>
    <text x="375" y="144" text-anchor="middle" class="label-note" fill="#666"> = 프레임워크 + 라이브러리 + 빌드 도구</text>

  </g>

  <!-- Vertical Arrow (Implementation -> Execution) -->
  <path d="M 425 345 L 425 370" class="line-flow" marker-end="url(#arrow)"/>
  <text x="435" y="363" class="label-note">실행</text>


  <!-- ========================================== -->
  <!-- GROUP 3: Execution Environment -->
  <!-- ========================================== -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="750" height="90" class="group-rect"/>
    <text x="20" y="-10" class="label-group">3. 실행 환경</text>
    <text x="110" y="-10" class="label-note">"컴파일된 코드가 동작하는 인프라 계층"</text>

    <g transform="translate(0, -15)">
      <!-- LEFT: Runtime -->
      <g transform="translate(30, 30)">
        <rect x="0" y="0" width="300" height="60" class="box-env"/>
        <text x="150" y="22" text-anchor="middle" class="label-head">런타임</text>
        <text x="150" y="38" text-anchor="middle" class="label-note">Runtime Environment</text>
        <text x="150" y="52" text-anchor="middle" class="label-mono">JVM, Node.js, CPython</text>
      </g>

      <!-- Arrow: Platform → Runtime (플랫폼이 런타임 제공) -->
      <path d="M 380 60 L 330 60" class="line-flow" marker-end="url(#arrow)"/>
      <text x="355" y="52" text-anchor="middle" class="label-mono" font-size="9">제공</text>

      <!-- RIGHT: Platform -->
      <g transform="translate(380, 30)">
        <rect x="0" y="0" width="340" height="60" class="box-env" fill="#e8e8e8"/>
        <text x="170" y="22" text-anchor="middle" class="label-head">플랫폼</text>
        <text x="170" y="38" text-anchor="middle" class="label-note">Platform (OS / Cloud)</text>
        <text x="170" y="52" text-anchor="middle" class="label-mono">Linux, Windows, AWS, Docker</text>
      </g>
    </g>
  </g>

</svg>