<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        fill: #333;
      }
      .good {
        fill: #2d5016;
      }
      .warning {
        fill: #8b4513;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="650" height="280" fill="#ffffff"/>

  <!-- Method 1: for loop (streaming) -->
  <rect x="20" y="20" width="295" height="130" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="167" y="42" text-anchor="middle" class="tufte-subtitle">for 루프 (한 줄씩)</text>
  <line x1="30" y1="50" x2="305" y2="50" stroke="#ccc" stroke-width="1"/>

  <text x="35" y="72" class="tufte-code">for line in fhand:</text>
  <text x="35" y="89" class="tufte-code">    process(line)</text>

  <text x="35" y="115" class="tufte-small good">✓ 대용량 파일에 적합</text>
  <text x="35" y="130" class="tufte-small good">✓ 메모리 효율적 (한 줄만 유지)</text>
  <text x="35" y="145" class="tufte-small">  스트리밍 처리</text>

  <!-- Method 2: read() -->
  <rect x="335" y="20" width="295" height="130" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="482" y="42" text-anchor="middle" class="tufte-subtitle">read() (전체 읽기)</text>
  <line x1="345" y1="50" x2="620" y2="50" stroke="#ccc" stroke-width="1"/>

  <text x="350" y="72" class="tufte-code">content = fhand.read()</text>
  <text x="350" y="89" class="tufte-code"># 전체가 하나의 문자열</text>

  <text x="350" y="115" class="tufte-small warning">⚠ 작은 파일에만 사용</text>
  <text x="350" y="130" class="tufte-small warning">⚠ 대용량 시 메모리 부족</text>
  <text x="350" y="145" class="tufte-small">  슬라이싱으로 접근</text>

  <!-- Visual comparison -->
  <rect x="20" y="165" width="295" height="100" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
  <text x="167" y="185" text-anchor="middle" class="tufte-text">메모리 사용</text>

  <!-- Streaming visualization -->
  <rect x="40" y="200" width="40" height="15" fill="#666"/>
  <rect x="85" y="200" width="40" height="15" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
  <rect x="130" y="200" width="40" height="15" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
  <rect x="175" y="200" width="40" height="15" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
  <rect x="220" y="200" width="40" height="15" fill="#e8e8e8" stroke="#999" stroke-width="0.5"/>
  <text x="167" y="240" text-anchor="middle" class="tufte-small">현재 줄만 메모리에</text>
  <text x="167" y="255" text-anchor="middle" class="tufte-small">(상수 메모리)</text>

  <rect x="335" y="165" width="295" height="100" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
  <text x="482" y="185" text-anchor="middle" class="tufte-text">메모리 사용</text>

  <!-- Full load visualization -->
  <rect x="355" y="200" width="40" height="15" fill="#666"/>
  <rect x="400" y="200" width="40" height="15" fill="#666"/>
  <rect x="445" y="200" width="40" height="15" fill="#666"/>
  <rect x="490" y="200" width="40" height="15" fill="#666"/>
  <rect x="535" y="200" width="40" height="15" fill="#666"/>
  <text x="482" y="240" text-anchor="middle" class="tufte-small">전체 파일이 메모리에</text>
  <text x="482" y="255" text-anchor="middle" class="tufte-small">(파일 크기 비례)</text>

</svg>
