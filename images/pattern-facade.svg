<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" class="tufte-title" text-anchor="middle">Facade 패턴</text>

  <!-- Client -->
  <rect x="40" y="120" width="120" height="70" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="3"/>
  <text x="100" y="145" class="tufte-label" text-anchor="middle">Client</text>
  <line x1="55" y1="155" x2="145" y2="155" stroke="#ccc" stroke-width="1"/>
  <text x="100" y="175" class="tufte-code" text-anchor="middle">pipeline.process()</text>

  <!-- Arrow to Facade -->
  <line x1="160" y1="155" x2="228" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="145" class="tufte-small">단순 호출</text>

  <!-- Facade -->
  <rect x="240" y="80" width="180" height="150" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/>
  <text x="330" y="105" class="tufte-label" text-anchor="middle">DataPipelineFacade</text>
  <line x1="255" y1="115" x2="405" y2="115" stroke="#ccc" stroke-width="1"/>
  <text x="330" y="135" class="tufte-code" text-anchor="middle">process(input, output)</text>
  <line x1="255" y1="145" x2="405" y2="145" stroke="#ccc" stroke-width="1"/>
  <text x="330" y="165" class="tufte-small" text-anchor="middle">내부에서 조율:</text>
  <text x="330" y="180" class="tufte-code" text-anchor="middle">1. read → 2. parse</text>
  <text x="330" y="195" class="tufte-code" text-anchor="middle">3. validate → 4. transform</text>
  <text x="330" y="210" class="tufte-code" text-anchor="middle">5. write</text>

  <!-- Arrow to Subsystem -->
  <line x1="420" y1="155" x2="488" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="454" y="145" class="tufte-small">조율</text>

  <!-- Subsystem box -->
  <rect x="500" y="50" width="260" height="230" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  <text x="630" y="75" class="tufte-label" text-anchor="middle">복잡한 서브시스템</text>
  <line x1="515" y1="85" x2="745" y2="85" stroke="#ccc" stroke-width="1"/>

  <!-- Subsystem components -->
  <rect x="520" y="100" width="100" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="2"/>
  <text x="570" y="122" class="tufte-code" text-anchor="middle">FileReader</text>

  <rect x="640" y="100" width="100" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="2"/>
  <text x="690" y="122" class="tufte-code" text-anchor="middle">DataParser</text>

  <rect x="520" y="150" width="100" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="2"/>
  <text x="570" y="172" class="tufte-code" text-anchor="middle">DataValidator</text>

  <rect x="640" y="150" width="100" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="2"/>
  <text x="690" y="172" class="tufte-code" text-anchor="middle">Transformer</text>

  <rect x="580" y="200" width="100" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="2"/>
  <text x="630" y="222" class="tufte-code" text-anchor="middle">DataWriter</text>

  <!-- Connections within subsystem -->
  <line x1="620" y1="117" x2="640" y2="117" stroke="#ccc" stroke-width="1"/>
  <line x1="570" y1="135" x2="570" y2="150" stroke="#ccc" stroke-width="1"/>
  <line x1="690" y1="135" x2="690" y2="150" stroke="#ccc" stroke-width="1"/>
  <line x1="570" y1="185" x2="570" y2="217" stroke="#ccc" stroke-width="1"/>
  <line x1="570" y1="217" x2="580" y2="217" stroke="#ccc" stroke-width="1"/>
  <line x1="690" y1="185" x2="690" y2="217" stroke="#ccc" stroke-width="1"/>
  <line x1="690" y1="217" x2="680" y2="217" stroke="#ccc" stroke-width="1"/>

  <!-- Bottom note -->
  <text x="400" y="310" class="tufte-small" text-anchor="middle">클라이언트는 Facade의 단순한 인터페이스만 사용, 서브시스템의 복잡성은 숨겨짐</text>
</svg>
