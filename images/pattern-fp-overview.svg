<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 14px;
        fill: #666;
      }
      .tufte-label {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-desc {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 11px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'SF Mono', Menlo, Monaco, monospace;
        font-size: 10px;
        fill: #666;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #999;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="35" class="tufte-title" text-anchor="middle">함수형 패턴</text>
  <text x="400" y="55" class="tufte-subtitle" text-anchor="middle">데이터 흐름 중심의 선언적 프로그래밍</text>

  <!-- Central concept: Function Composition -->
  <rect x="300" y="80" width="200" height="60" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="5"/>
  <text x="400" y="105" class="tufte-label" text-anchor="middle">함수 합성</text>
  <text x="400" y="125" class="tufte-code" text-anchor="middle">f ∘ g ∘ h = f(g(h(x)))</text>

  <!-- Three patterns -->
  <!-- Pipeline -->
  <rect x="40" y="180" width="220" height="150" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="150" y="205" class="tufte-label" text-anchor="middle">Pipeline</text>
  <line x1="55" y1="215" x2="245" y2="215" stroke="#ccc" stroke-width="1"/>
  <text x="150" y="235" class="tufte-desc" text-anchor="middle">데이터 변환 흐름</text>
  <text x="60" y="260" class="tufte-code">data</text>
  <line x1="85" y1="257" x2="105" y2="257" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="115" y="260" class="tufte-code">f1</text>
  <line x1="130" y1="257" x2="150" y2="257" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="160" y="260" class="tufte-code">f2</text>
  <line x1="175" y1="257" x2="195" y2="257" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="205" y="260" class="tufte-code">result</text>
  <text x="150" y="290" class="tufte-small" text-anchor="middle">순차적 함수 적용</text>
  <text x="150" y="305" class="tufte-small" text-anchor="middle">가독성 향상</text>
  <text x="150" y="320" class="tufte-small" text-anchor="middle">단계별 테스트 용이</text>

  <!-- Currying/Partial -->
  <rect x="290" y="180" width="220" height="150" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="400" y="205" class="tufte-label" text-anchor="middle">Currying / Partial</text>
  <line x1="305" y1="215" x2="495" y2="215" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="235" class="tufte-desc" text-anchor="middle">함수 특화</text>
  <text x="400" y="260" class="tufte-code" text-anchor="middle">f(a, b, c)</text>
  <line x1="400" y1="268" x2="400" y2="280" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="400" y="295" class="tufte-code" text-anchor="middle">g = f(a, _) → g(b, c)</text>
  <text x="400" y="320" class="tufte-small" text-anchor="middle">인자 고정으로 재사용성 증가</text>

  <!-- Maybe/Result -->
  <rect x="540" y="180" width="220" height="150" fill="#fff" stroke="#666" stroke-width="1.5" rx="3"/>
  <text x="650" y="205" class="tufte-label" text-anchor="middle">Maybe / Result</text>
  <line x1="555" y1="215" x2="745" y2="215" stroke="#ccc" stroke-width="1"/>
  <text x="650" y="235" class="tufte-desc" text-anchor="middle">안전한 값 처리</text>
  <rect x="570" y="250" width="70" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="2"/>
  <text x="605" y="270" class="tufte-code" text-anchor="middle">Some(v)</text>
  <rect x="660" y="250" width="70" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="2"/>
  <text x="695" y="270" class="tufte-code" text-anchor="middle">None</text>
  <text x="650" y="305" class="tufte-small" text-anchor="middle">None/예외 전파 없이</text>
  <text x="650" y="320" class="tufte-small" text-anchor="middle">안전한 체이닝</text>

  <!-- Connections from center -->
  <line x1="300" y1="130" x2="150" y2="180" stroke="#999" stroke-width="1"/>
  <line x1="400" y1="140" x2="400" y2="180" stroke="#999" stroke-width="1"/>
  <line x1="500" y1="130" x2="650" y2="180" stroke="#999" stroke-width="1"/>

  <!-- Bottom note -->
  <text x="400" y="360" class="tufte-small" text-anchor="middle">GoF 패턴의 함수형 대안: 상태 없이 데이터 흐름만으로 문제 해결</text>
</svg>
