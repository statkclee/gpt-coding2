<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">
  <defs>
    <style>
      .tufte-title {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 16px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-subtitle {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 13px;
        font-weight: bold;
        fill: #333;
      }
      .tufte-text {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 12px;
        fill: #333;
      }
      .tufte-small {
        font-family: Palatino, 'Book Antiqua', Georgia, serif;
        font-size: 10px;
        fill: #666;
      }
      .tufte-code {
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        fill: #333;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="340" fill="#ffffff"/>

  <!-- Central concept: 파일 = 라인의 시퀀스 -->
  <rect x="250" y="20" width="200" height="55" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/>
  <text x="350" y="42" text-anchor="middle" class="tufte-subtitle">파일 = 라인의 시퀀스</text>
  <text x="350" y="60" text-anchor="middle" class="tufte-code">for line in file:</text>

  <!-- Four main operations -->
  <!-- 1. 열기 (Open) -->
  <rect x="30" y="110" width="145" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="102" y="130" text-anchor="middle" class="tufte-subtitle">1. 열기</text>
  <line x1="40" y1="138" x2="165" y2="138" stroke="#ccc" stroke-width="1"/>
  <text x="102" y="158" text-anchor="middle" class="tufte-code">open(fname)</text>
  <text x="102" y="178" text-anchor="middle" class="tufte-small">파일 핸들 반환</text>
  <text x="102" y="192" text-anchor="middle" class="tufte-small">운영체제와 통신</text>

  <!-- 2. 읽기 (Read) -->
  <rect x="195" y="110" width="145" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="267" y="130" text-anchor="middle" class="tufte-subtitle">2. 읽기</text>
  <line x1="205" y1="138" x2="330" y2="138" stroke="#ccc" stroke-width="1"/>
  <text x="267" y="158" text-anchor="middle" class="tufte-code">read() / for</text>
  <text x="267" y="178" text-anchor="middle" class="tufte-small">전체 vs 한 줄씩</text>
  <text x="267" y="192" text-anchor="middle" class="tufte-small">메모리 고려</text>

  <!-- 3. 쓰기 (Write) -->
  <rect x="360" y="110" width="145" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="432" y="130" text-anchor="middle" class="tufte-subtitle">3. 쓰기</text>
  <line x1="370" y1="138" x2="495" y2="138" stroke="#ccc" stroke-width="1"/>
  <text x="432" y="158" text-anchor="middle" class="tufte-code">write(str)</text>
  <text x="432" y="178" text-anchor="middle" class="tufte-small">'w' 모드로 열기</text>
  <text x="432" y="192" text-anchor="middle" class="tufte-small">\n 직접 추가</text>

  <!-- 4. 닫기 (Close) -->
  <rect x="525" y="110" width="145" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="597" y="130" text-anchor="middle" class="tufte-subtitle">4. 닫기</text>
  <line x1="535" y1="138" x2="660" y2="138" stroke="#ccc" stroke-width="1"/>
  <text x="597" y="158" text-anchor="middle" class="tufte-code">close()</text>
  <text x="597" y="178" text-anchor="middle" class="tufte-small">버퍼 플러시</text>
  <text x="597" y="192" text-anchor="middle" class="tufte-small">리소스 해제</text>

  <!-- Arrows from center to operations -->
  <line x1="280" y1="75" x2="140" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="75" x2="267" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="75" x2="432" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="75" x2="560" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Bottom section: Key patterns -->
  <rect x="30" y="225" width="310" height="100" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="185" y="245" text-anchor="middle" class="tufte-subtitle">검색 패턴</text>
  <line x1="40" y1="253" x2="330" y2="253" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="273" class="tufte-code">for line in fhand:</text>
  <text x="50" y="290" class="tufte-code">    if not line.startswith('...'):</text>
  <text x="50" y="307" class="tufte-code">        continue</text>
  <text x="50" y="324" class="tufte-small">관심 없는 라인 건너뛰기</text>

  <!-- Exception handling -->
  <rect x="360" y="225" width="310" height="100" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="515" y="245" text-anchor="middle" class="tufte-subtitle">예외 처리 (try-except)</text>
  <line x1="370" y1="253" x2="660" y2="253" stroke="#ccc" stroke-width="1"/>
  <text x="380" y="273" class="tufte-code">try:</text>
  <text x="380" y="290" class="tufte-code">    fhand = open(fname)</text>
  <text x="380" y="307" class="tufte-code">except:</text>
  <text x="380" y="324" class="tufte-small">파일 없음, 권한 오류 대비</text>

</svg>
